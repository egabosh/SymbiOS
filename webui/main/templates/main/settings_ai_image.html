{% extends "main/base.html" %}
{% load static %}
{% block content %}
{% include "main/_page_header.html" %}

<div class="row">
  <!-- Main form -->
  <div class="col-md-8">
    <div class="card">
      <div class="card-body">
        <form method="post" data-exec="true">
          {% csrf_token %}

          <h6 class="fw-semibold mt-1 mb-3">Image generation (ComfyUI)</h6>

          <!-- ComfyUI URL -->
          <div class="mb-3">
            <label class="form-label fw-semibold">ComfyUI server URL</label>
            <input type="url" class="form-control" name="ai_image_url" id="ai_image_url"
                   placeholder="e.g. https://comfyui.example.com"
                   value="{% if vars.ai_image_url %}{{ vars.ai_image_url }}{% endif %}">
            <div class="form-text">Base URL of the ComfyUI server. Empty keeps the built-in default.</div>
          </div>

          <!-- Generation model -->
          <div class="mb-3">
            <label class="form-label fw-semibold">Generation checkpoint</label>
            <input type="text" class="form-control" name="ai_image_model" id="ai_image_model"
                   placeholder="e.g. sd15.safetensors"
                   value="{% if vars.ai_image_model %}{{ vars.ai_image_model }}{% endif %}">
          </div>

          <h6 class="fw-semibold mt-4 mb-3">Image edit (ComfyUI)</h6>

          <!-- Edit URL -->
          <div class="mb-3">
            <label class="form-label fw-semibold">Edit server URL (optional)</label>
            <input type="url" class="form-control" name="ai_image_edit_url" id="ai_image_edit_url"
                   placeholder="Leave empty to reuse the generation URL"
                   value="{% if vars.ai_image_edit_url %}{{ vars.ai_image_edit_url }}{% endif %}">
            <div class="form-text">Falls back to the generation URL when empty.</div>
          </div>

          <!-- Edit model -->
          <div class="mb-4">
            <label class="form-label fw-semibold">Edit checkpoint (optional)</label>
            <input type="text" class="form-control" name="ai_image_edit_model" id="ai_image_edit_model"
                   placeholder="Leave empty to reuse the generation checkpoint"
                   value="{% if vars.ai_image_edit_model %}{{ vars.ai_image_edit_model }}{% endif %}">
          </div>

          <div class="d-flex align-items-center gap-2">
            <button type="submit" class="btn btn-primary"><i class="bi bi-save"></i> Save</button>
            <button type="button" class="btn btn-outline-secondary" id="btn_ai_image_test"
                    onclick="testAiImageConnection()">
              <i class="bi bi-plug"></i> Test connection
            </button>
          </div>

          <!-- Test result -->
          <div id="ai_test_result" class="mt-3"></div>
        </form>
      </div>
    </div>
  </div>
</div>

<script>
  // Optional connection check against the (possibly unsaved) ComfyUI URLs.
  function testAiImageConnection() {
    const resultEl = document.getElementById('ai_test_result');
    const btn = document.getElementById('btn_ai_image_test');

    resultEl.innerHTML = '<div class="text-muted"><i class="bi bi-hourglass-split me-1"></i>Testing connection...</div>';
    btn.disabled = true;

    const data = new URLSearchParams();
    for (const id of ['ai_image_url', 'ai_image_edit_url']) {
      data.set(id, document.getElementById(id).value.trim());
    }

    fetch('{% url "settings_ai_image_test" %}', {
      method: 'POST',
      credentials: 'same-origin',
      headers: { 'X-CSRFToken': getCsrfToken() },
      body: data
    })
    .then(r => r.json())
    .then(resp => {
      if (resp.valid) {
        resultEl.innerHTML = '<div class="alert alert-success py-2 mb-0"><i class="bi bi-check-circle-fill me-1"></i>' + resp.message + '</div>';
      } else {
        resultEl.innerHTML = '<div class="alert alert-danger py-2 mb-0"><i class="bi bi-exclamation-triangle-fill me-1"></i>' + resp.error + '</div>';
      }
    })
    .catch(() => {
      resultEl.innerHTML = '<div class="alert alert-danger py-2 mb-0"><i class="bi bi-exclamation-triangle-fill me-1"></i>Request failed.</div>';
    })
    .finally(() => {
      btn.disabled = false;
    });
  }
</script>
{% endblock %}
