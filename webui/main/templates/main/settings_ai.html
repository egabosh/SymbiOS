{% extends "main/base.html" %}
{% load static %}
{% block content %}
{% include "main/_page_header.html" %}

<div class="row">
  <!-- Main form -->
  <div class="col-md-8">
    <div class="card">
      <div class="card-body">
        <form method="post" data-exec="true">
          {% csrf_token %}

          <!-- Server URL -->
          <div class="mb-4">
            <label class="form-label fw-semibold">OpenAI-compatible server URL</label>
            <input type="url" class="form-control" name="ai_server" id="ai_server"
                   placeholder="e.g. https://api.openai.com/v1"
                   value="{% if vars.ai_server %}{{ vars.ai_server }}{% endif %}">
            <div class="form-text">Base URL of an OpenAI-compatible API endpoint.</div>
          </div>

          <!-- API key -->
          <div class="mb-4">
            <label class="form-label fw-semibold">API key (optional)</label>
            <div class="input-group">
              <input type="password" class="form-control" name="ai_apikey" id="ai_apikey"
                     placeholder="Leave empty if the endpoint needs no authentication"
                     value="{% if vars.ai_apikey %}{{ vars.ai_apikey }}{% endif %}"
                     autocomplete="off" spellcheck="false">
              <button type="button" class="btn btn-outline-secondary" tabindex="-1"
                      onclick="toggleFieldVisibility('ai_apikey', this)" title="Show/hide API key">
                <i class="bi bi-eye"></i>
              </button>
            </div>
            <div class="form-text">To remove the stored key, clear this field and save.</div>
          </div>

          <div class="d-flex align-items-center gap-2">
            <button type="submit" class="btn btn-primary"><i class="bi bi-save"></i> Save</button>
            <button type="button" class="btn btn-outline-secondary" id="btn_ai_test"
                    onclick="testAiConnection()">
              <i class="bi bi-plug"></i> Test connection
            </button>
          </div>

          <!-- Test result -->
          <div id="ai_test_result" class="mt-3"></div>
        </form>
      </div>
    </div>
  </div>
</div>

<script>
  // Toggle password field visibility.
  function toggleFieldVisibility(fieldId, btn) {
    const field = document.getElementById(fieldId);
    const icon = btn.querySelector('i');
    if (field.type === 'password') {
      field.type = 'text';
      icon.className = 'bi bi-eye-slash';
    } else {
      field.type = 'password';
      icon.className = 'bi bi-eye';
    }
  }

  // Optional connection check against the (possibly unsaved) AI server URL.
  function testAiConnection() {
    const server = document.getElementById('ai_server').value.trim();
    const apikey = document.getElementById('ai_apikey').value.trim();
    const resultEl = document.getElementById('ai_test_result');
    const btn = document.getElementById('btn_ai_test');

    if (!server) {
      resultEl.innerHTML = '<div class="alert alert-warning py-2 mb-0"><i class="bi bi-exclamation-triangle-fill me-1"></i>Enter an AI server URL first.</div>';
      return;
    }

    resultEl.innerHTML = '<div class="text-muted"><i class="bi bi-hourglass-split me-1"></i>Testing connection...</div>';
    btn.disabled = true;

    const data = new URLSearchParams();
    data.set('ai_server', server);
    data.set('ai_apikey', apikey);

    fetch('{% url "settings_ai_test" %}', {
      method: 'POST',
      credentials: 'same-origin',
      headers: { 'X-CSRFToken': getCsrfToken() },
      body: data
    })
    .then(r => r.json())
    .then(resp => {
      if (resp.valid) {
        resultEl.innerHTML = '<div class="alert alert-success py-2 mb-0"><i class="bi bi-check-circle-fill me-1"></i>' + resp.message + '</div>';
      } else {
        resultEl.innerHTML = '<div class="alert alert-danger py-2 mb-0"><i class="bi bi-exclamation-triangle-fill me-1"></i>' + resp.error + '</div>';
      }
    })
    .catch(() => {
      resultEl.innerHTML = '<div class="alert alert-danger py-2 mb-0"><i class="bi bi-exclamation-triangle-fill me-1"></i>Request failed.</div>';
    })
    .finally(() => {
      btn.disabled = false;
    });
  }
</script>
{% endblock %}
