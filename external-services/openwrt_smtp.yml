# docs:
#   name: "OpenWrt - SMTP relay"
#   short_description: "OpenWrt - SMTP relay"
#   description: "msmtp relay for system mail. Values default to the SymbiOS inventory when available."
#   category: "Services"
#   type: OpenWrt
#   icon: "bi-envelope"
#   params:
#     - name: "mailserver"
#       label: "Mail server"
#       type: "text"
#       required: true
#     - name: "mailserver_port"
#       label: "Port"
#       type: "text"
#       default: "587"
#     - name: "username"
#       label: "User name"
#       type: "text"
#       required: true
#     - name: "password"
#       label: "Password"
#       type: "password"
#       required: true
#   requires:
#     - playbook: "openwrt_basics.yml"
#       reason: "Base system setup"
#   actions:
#     __playbook__: Install/Update
#
---
- name: SMTP Config for sending Mails
  hosts: all
  gather_facts: no

  vars:
    # Defaults keep the playbook runnable standalone; the WebUI passes
    # the same names as extra vars (which take precedence).
    mailserver_port: "587"
    managed_id: "openwrt_smtp.yml"
    managed_playbook: "openwrt_smtp.yml"
    managed_ref: "mailserver={{ mailserver }} mailserver_port={{ mailserver_port }} username={{ username }}"
    managed_resource_type: "smtp"
    openwrt_packages:
      - msmtp
      - msmtp-mta
 
  pre_tasks:
    - name: Check required parameters
      ansible.builtin.assert:
        that:
          - mailserver is defined
          - password is defined
          - username is defined
        fail_msg: "Missing required parameter(s). Pass them with -e <name>=<value>."
        quiet: true

  tasks:

    - name: update opkg db
      raw: opkg update
      changed_when: false

    - name: check installed packages
      raw: opkg list-installed
      register: installed_packages
      changed_when: false

    - name: install packages if needed
      raw: opkg install {{ item }}
      loop: "{{ openwrt_packages }}"
      when: item not in installed_packages.stdout

    - name: write /etc/msmtprc
      raw: |
        cat << 'EOF' > /etc/msmtprc
        defaults
        tls on
        tls_trust_file /etc/ssl/certs/ca-certificates.crt
        syslog LOG_MAIL

        account mail
          host {{ mailserver }}
          port {{ mailserver_port }}
          auth on
          user {{ username }}
          password {{ password }}
          from {{ username }}

        account default : mail
        EOF
        chmod 644 /etc/msmtprc
        chown root:root /etc/msmtprc
      changed_when: false

    # Record this playbook's resources in /etc/symbios/managed.json.
    - name: Record managed state
      ansible.builtin.include_tasks: _managed-state.yml
