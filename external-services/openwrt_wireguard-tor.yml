#       placeholder: "172.23.0.222,10.0.0.0/8"
#       help: "IPv4 addresses/networks the clients reach through the tunnel, comma separated. Empty = keep the stored value (first run: the LAN network)."
#     - name: "internet"
#       label: "Internet via Tor"
#       type: "text"
#       required: false
#       placeholder: "no"
#       help: "yes = all client IPv4 traffic including DNS goes through the Tor proxy. Empty = keep the stored value."
#   requires:
#     - playbook: "openwrt_tor.yml"
#       reason: "Tor segment and transparent proxy"
#   inventory:
#     title: "Access policy of the tunnel"
#     description: "Read live from the target. Clients pick the policy up when their own playbook runs again."
#     command: |
#       allowed=$(sed -n 's/^allowed_networks=//p' /etc/wg_tor/access.conf 2>/dev/null)
#       internet=$(sed -n 's/^internet=//p' /etc/wg_tor/access.conf 2>/dev/null)
#       printf '%s\t%s\n' "${allowed:-not set}" "${internet:-no}"
#     columns:
#       - key: "allowed_networks"
#         label: "Allowed networks"
#       - key: "internet"
#         label: "Internet via Tor"
#   actions:
#     __playbook__: Install/Update
