---
- name: wireguard server for br-lan
  hosts: all
  gather_facts: no

  vars:
    # Defaults keep the playbook runnable standalone; the WebUI passes
    # the same names as extra vars (which take precedence).
    managed_id: "openwrt_wireguard-lan.yml"
    managed_playbook: "openwrt_wireguard-lan.yml"
    managed_ref: ""
    managed_resource_type: "wireguard_lan"
    openwrt_packages:
      - luci-proto-wireguard
      - kmod-wireguard

    # Access policy of the tunnel (WebUI params). Empty = keep the value
    # stored on the target in /etc/wg_lan/access.conf; the client playbooks
    # read that file when they generate their .conf.
    allowed_networks: ""
    internet: ""
    # Resolved policy, see the tasks below.
    access_networks_resolved: ""
    access_internet_resolved: ""

    uci_vars:
      # Interface wg_lan
      - { key: "network.wg_lan", value: "interface" }
      - { key: "network.wg_lan.proto", value: "wireguard" }
      - { key: "network.wg_lan.listen_port", value: "59666" }
      - { key: "network.wg_lan.mtu", value: "1450" }
      - { key: "network.wg_lan.addresses", value: "fdaa:a192:b168:cd44::1/64" }
      - { key: "network.wg_lan.addresses", value: "192.168.44.1/24" }
      - { key: "network.wg_lan.ip6assign", value: "64" }
      - { key: "network.wg_lan.ipv6", value: "1" }

      # allow connections from internet
      - { key: "firewall.wireguard_allow_lan", value: "rule" }
      - { key: "firewall.wireguard_allow_lan.name", value: "ansible_allow_wireguard_lan" }
      - { key: "firewall.wireguard_allow_lan.src", value: "wan" }
      - { key: "firewall.wireguard_allow_lan.proto", value: "udp" }
      - { key: "firewall.wireguard_allow_lan.dest_port", value: "59666" }
      - { key: "firewall.wireguard_allow_lan.target", value: "ACCEPT" }

      # add to zone lan and allow intra zone forward
      - { key: "firewall.zone_lan.network", value: "wg_lan" }
      - { key: "firewall.zone_lan.forward", value: "ACCEPT" }

    # Only applied while the tunnel has internet mode on. The rule covers the
    # tunnel segment only, so the LAN itself stays closed towards the internet.
    internet_uci_vars:
      - { key: "firewall.wg_lan_internet", value: "rule" }
      - { key: "firewall.wg_lan_internet.name", value: "ansible_wg_lan_internet" }
      - { key: "firewall.wg_lan_internet.src", value: "lan" }
      - { key: "firewall.wg_lan_internet.src_ip", value: "192.168.44.0/24" }
      - { key: "firewall.wg_lan_internet.dest", value: "wan" }
      - { key: "firewall.wg_lan_internet.proto", value: "all" }
      - { key: "firewall.wg_lan_internet.target", value: "ACCEPT" }
  
  tasks:
    - name: update apk db
      raw: apk update
      changed_when: false

    - name: check installed packages
      raw: apk info
      register: installed_packages
      changed_when: false

    - name: install packages if needed
      raw: apk add {{ item }}
      loop: "{{ openwrt_packages }}"
      when: item not in installed_packages.stdout

    # --- access policy of the tunnel ----------------------------------------
    - name: Read the stored access policy
      ansible.builtin.raw: cat /etc/wg_lan/access.conf 2>/dev/null || true
      register: access_conf
      changed_when: false

    - name: Validate the given access policy
      ansible.builtin.assert:
        that:
          - allowed_networks is match('^[0-9./, ]*$')
          - internet | lower in ['', 'yes', 'no']
        fail_msg: "allowed_networks takes IPv4 addresses/networks separated by commas; internet takes yes or no (empty keeps the stored value)."
        quiet: true

    # Fallback for the first run: by default the clients reach the LAN that
    # this router serves, which keeps an existing setup working unchanged.
    - name: Read the LAN network of the router
      ansible.builtin.raw: |
        eval "$(ipcalc.sh "$(uci -q get network.lan.ipaddr)" "$(uci -q get network.lan.netmask)")"
        echo "$NETWORK/$PREFIX"
      register: lan_network
      changed_when: false

    - name: Resolve the access policy
      ansible.builtin.set_fact:
        access_networks_resolved: >-
          {{ (allowed_networks | replace(' ', '') | trim)
             or (access_conf.stdout | regex_findall('(?m)^allowed_networks=(.*)$') | first | default('') | replace(' ', '') | trim)
             or (lan_network.stdout | trim) }}
        access_internet_resolved: >-
          {{ (internet | lower | trim)
             or ((access_conf.stdout | regex_findall('(?m)^internet=(.*)$') | first | default('')) | lower | trim)
             or 'no' }}

    - name: Validate the resolved access policy
      ansible.builtin.assert:
        that:
          - access_networks_resolved is match('^[0-9]{1,3}(\.[0-9]{1,3}){3}(/[0-9]{1,2})?(,[0-9]{1,3}(\.[0-9]{1,3}){3}(/[0-9]{1,2})?)*$')
          - access_internet_resolved in ['yes', 'no']
        fail_msg: "The access policy is invalid: allowed_networks must be a comma separated list of IPv4 addresses/networks, internet must be yes or no."
        quiet: true

    - name: Write the access policy
      ansible.builtin.raw: |
        f=/etc/wg_lan/access.conf
        mkdir -p /etc/wg_lan
        {
          printf '%s\n' '# SymbiOS access policy of this WireGuard tunnel.'
          printf '%s\n' '# Clients route these IPv4 networks through the tunnel (comma separated).'
          printf 'allowed_networks=%s\n' "{{ access_networks_resolved }}"
          printf '%s\n' '# yes = all client IPv4 traffic (including DNS) goes through the tunnel.'
          printf 'internet=%s\n' "{{ access_internet_resolved }}"
        } > "$f.tmp"
        if [ -f "$f" ] && cmp -s "$f.tmp" "$f"
        then
          rm -f "$f.tmp"
          echo unchanged
        else
          mv "$f.tmp" "$f"
          echo changed
        fi
      register: access_policy_result
      changed_when: "access_policy_result.stdout | trim == 'changed'"

    # The lan zone forwards within itself, but not to other zones. Every
    # allowed network gets its own rule so a narrowed list also works for
    # networks outside the lan zone.
    - name: Grant the tunnel clients access to the allowed networks
      ansible.builtin.raw: |
        changed=0
        i=0
        for net in {{ access_networks_resolved | replace(',', ' ') }}
        do
          i=$((i + 1))
          case "$net" in
            */*) ;;
            *) net="$net/32" ;;
          esac
          s="firewall.wg_lan_access_$i"
          if [ "$(uci -q get "$s.dest_ip")" != "$net" ]
          then
            uci -q set "$s=rule"
            uci -q set "$s.name=ansible_wg_lan_access_$i"
            uci -q set "$s.src=lan"
            uci -q set "$s.src_ip=192.168.44.0/24"
            uci -q set "$s.dest=*"
            uci -q set "$s.dest_ip=$net"
            uci -q set "$s.proto=all"
            uci -q set "$s.target=ACCEPT"
            changed=1
          fi
        done
        # Drop the rules left over from a previously longer list.
        for s in $(uci -q show firewall | sed -n 's/^firewall\.\(wg_lan_access_[0-9][0-9]*\)=rule$/\1/p')
        do
          if [ "${s#wg_lan_access_}" -gt "$i" ]
          then
            uci -q delete "firewall.$s"
            changed=1
          fi
        done
        if [ "$changed" = 1 ]
        then
          echo changed
        else
          echo unchanged
        fi
      register: access_rules_result
      changed_when: "access_rules_result.stdout | trim == 'changed'"

    - name: set uci values if needed
      raw: |
        current=$(uci get {{ item.key }} 2>/dev/null || echo "NOT_SET")
        desired="{{ item.value }}"

        # gen server keypair if not exist
        if [[ {{ item.key }} = network.wg_lan.proto ]]
        then
          if ! uci get network.wg_lan.private_key
          then
            mkdir -p /etc/wg_lan
            cd /etc/wg_lan
            wg genkey | tee server_privatekey | wg pubkey > server_publickey
            uci set network.wg_lan.private_key="$(cat server_privatekey)"
          fi
        fi

        if ! echo "$current" | grep "$desired"
        then
          if echo "{{ item.key }}" | egrep -q "listen_address|\.addresses|\.allowed_ips|firewall\..+\.network"
          then
            uci add_list {{ item.key }}="{{ item.value }}"
          else
            uci set {{ item.key }}="{{ item.value }}"
          fi
          echo "changed"
        else
          echo "unchanged"
        fi
      loop: "{{ uci_vars + (internet_uci_vars if access_internet_resolved == 'yes' else []) }}"
      register: uci_set_result
      # A changed_when sees no register of its own loop, so the loop is
      # neutral and the aggregate decides whether a reload is needed.
      changed_when: false

    - name: Remember whether any uci value changed
      ansible.builtin.set_fact:
        uci_changed: "{{ uci_set_result.results | map(attribute='stdout') | map('trim') | select('equalto', 'changed') | list | length > 0 }}"

    - name: Remove the internet access rule
      ansible.builtin.raw: |
        if uci -q show firewall.wg_lan_internet > /dev/null 2>&1
        then
          uci -q delete firewall.wg_lan_internet
          echo changed
        else
          echo unchanged
        fi
      register: internet_remove_result
      changed_when: "internet_remove_result.stdout | trim == 'changed'"
      when: access_internet_resolved != 'yes'

    - name: apply changes
      block:
        - name: commit enable and restart
          raw: "{{ item }}"
          loop:
            - "uci commit"
            - "/etc/init.d/network reload"
            - "/etc/init.d/firewall reload"
#            - "/etc/init.d/dnsmasq restart"
#            - "/etc/init.d/odhcpd restart"
          when: >-
            (uci_changed | default(false) | bool)
            or (access_rules_result is changed)
            or (internet_remove_result is changed)

    # Record this playbook's resources in /etc/symbios/managed.json.
    - name: Record managed state
      ansible.builtin.include_tasks: _managed-state.yml
