# docs:
#   name: "OpenWrt - Basics"
#   short_description: "OpenWrt - Basics"
#   description: "Foundation for every other OpenWrt playbook: base packages, system (timezone/NTP/hostname), LAN addressing, Dropbear SSH, DHCP/DNS, mDNS and the base firewall (zones + default rules). Run this first on every target."
#   category: "System"
#   type: OpenWrt
#   icon: "bi-gear"
#   params:
#     - name: "ip"
#       label: "LAN IP address"
#       type: "text"
#       required: true
#       placeholder: "192.168.1.1"
#     - name: "mask"
#       label: "LAN netmask"
#       type: "text"
#       default: "255.255.255.0"
#     - name: "ip6"
#       label: "LAN IPv6 address"
#       type: "text"
#       placeholder: "fd00:1::1"
#     - name: "ipv6_ula_prefix"
#       label: "IPv6 ULA prefix"
#       type: "text"
#       placeholder: "fd00:1::/64"
#     - name: "timezone"
#       label: "Timezone"
#       type: "text"
#       default: "CET-1CEST,M3.5.0,M10.5.0/3"
#     - name: "ntp_server"
#       label: "NTP server"
#       type: "text"
#       default: "0.openwrt.pool.ntp.org"
#     - name: "upstream_dns"
#       label: "Upstream DNS server"
#       type: "text"
#       required: true
#       placeholder: "9.9.9.9 or 2a01:4f8:251:554::2"
#     - name: "ssh_trust_master"
#       label: "SSH key of this master (optional)"
#       type: "text"
#       placeholder: "172.23.0.220"
#     - name: "bridges"
#       label: "Avahi interfaces (comma separated)"
#       type: "text"
#       default: "br-lan"
#     - name: "dhcp_ip_start"
#       label: "DHCP pool start"
#       type: "text"
#       default: "100"
#     - name: "dhcp_ip_limit"
#       label: "DHCP pool size"
#       type: "text"
#       default: "150"
#   actions:
#     __playbook__: Install/Update
#
---
- name: OpenWrt basics - foundation for all other playbooks
  hosts: all
  gather_facts: no

  vars:
    # Defaults keep the playbook runnable standalone; the WebUI passes
    # the same names as extra vars (which take precedence).
    mask: "255.255.255.0"
    timezone: "CET-1CEST,M3.5.0,M10.5.0/3"
    ntp_server: "0.openwrt.pool.ntp.org"
    bridges: "br-lan"
    dhcp_ip_start: "100"
    dhcp_ip_limit: "150"
    # UDP port of the netconsole receiver on the log server (1514 sits next
    # to the syslog port 514). Must match the rsyslog input on SymbiOS.
    netconsole_port: "1514"
    managed_id: "openwrt_basics.yml"
    managed_playbook: "openwrt_basics.yml"
    managed_resource_type: "basics"
    managed_ref: ""

    # Host (usually the OpenVPN master) whose SSH key may log in here. Empty
    # means "do not touch /etc/dropbear/authorized_keys".
    ssh_trust_master: ""

    # Union of the per-source package lists (basics + avahi).
    openwrt_packages:
      - strace
      - rsync
      - tmux
      - htop
      - diffutils
      - bash
      - fdisk
      - usbutils
      - bind-host
      - whois
      - coreutils-date
      - openssh-client
      - vim
      - procps-ng-watch
      - coreutils-nice
      - curl
      - coreutils-df
      - tcpdump
      - nfs-utils
      - block-mount
      - kmod-usb-storage
      - kmod-fs-ext4
      - e2fsprogs
      - irqbalance
      - luci-app-irqbalance
      - telnet-bsd
      - coreutils-base64
      - nano-full
      - less
      - blkid
      - luci-mod-rpc
      - avahi-dbus-daemon
      - avahi-utils
      - kmod-netconsole

    # Default UCI sections that are replaced explicitly below.
    uci_default_vars:
      - 'dhcp.@dnsmasq'
      - 'firewall.@defaults'
      - 'firewall.@zone'
      - 'firewall.@forwarding'

    uci_vars:
      ## System (timezone, hostname, NTP, irqbalance)
      - { key: "system.@system[0].timezone", value: "{{ timezone }}" }
      - { key: "system.@system[0].hostname", value: "{{ inventory_hostname }}" }
      - { key: "system.ntp.enable_server", value: "1" }
      - { key: "system.ntp.server", value: "{{ ntp_server }}" }
      - { key: "irqbalance.irqbalance.enabled", value: "1" }

      ## LAN addressing (static IPv4 + IPv6/ULA)
      - { key: "network.lan.proto", value: "static" }
      - { key: "network.lan.ipaddr", value: "{{ ip }}" }
      - { key: "network.lan.netmask", value: "{{ mask }}" }
      - { key: "network.lan.ula_prefix", value: "{{ ipv6_ula_prefix }}" }
      - { key: "network.lan.ip6addr", value: "{{ ip6 }}" }
      - { key: "network.lan.ip6assign", value: "64" }

      ## USB stick mount
      - { key: "fstab.@global[0].anon_mount", value: "0" }
      - { key: "fstab.@global[0].anon_swap", value: "0" }
      - { key: "fstab.@global[0].auto_swap", value: "1" }
      - { key: "fstab.@global[0].auto_mount", value: "1" }
      - { key: "fstab.@global[0].from_fstab", value: "1" }
      - { key: "fstab.openwrtstick", value: "mount" }
      - { key: "fstab.openwrtstick.target", value: "/srv" }
      - { key: "fstab.openwrtstick.label", value: "OPENWRTSTICK" }
      - { key: "fstab.openwrtstick.fstype", value: "ext4" }
      - { key: "fstab.openwrtstick.enabled", value: "1" }
      - { key: "fstab.openwrtstick.options", value: "rw,sync" }

      ## Dropbear SSH (lan 22, internet 44, keys only)
      - { key: "dropbear.main.Port", value: "22" }
      - { key: "dropbear.main.Interface", value: "lan" }
      - { key: "dropbear.main.PasswordAuth", value: "off" }
      - { key: "dropbear.main.RootPasswordAuth", value: "off" }
      - { key: "dropbear.global", value: "dropbear" }
      - { key: "dropbear.global.Port", value: "44" }
      - { key: "dropbear.global.PasswordAuth", value: "off" }
      - { key: "dropbear.global.RootPasswordAuth", value: "off" }
      - { key: "firewall.rule_allow_ssh_global", value: "rule" }
      - { key: "firewall.rule_allow_ssh_global.name", value: "ansible_allow_ssh_global" }
      - { key: "firewall.rule_allow_ssh_global.src", value: "wan" }
      - { key: "firewall.rule_allow_ssh_global.proto", value: "tcp" }
      - { key: "firewall.rule_allow_ssh_global.dest_port", value: "44" }
      - { key: "firewall.rule_allow_ssh_global.target", value: "ACCEPT" }

      ## DHCP / dnsmasq (LAN)
      - { key: "dhcp.lan", value: "dhcp" }
      - { key: "dhcp.lan.interface", value: "lan" }
      - { key: "dhcp.lan.start", value: "{{ dhcp_ip_start }}" }
      - { key: "dhcp.lan.limit", value: "{{ dhcp_ip_limit }}" }
      - { key: "dhcp.lan.leasetime", value: "1h" }
      - { key: "dhcp.lan.rebind_protection", value: "1" }
      - { key: "dhcp.lan.dhcpv4", value: "server" }
      - { key: "dhcp.lan.dhcpv6", value: "server" }
      - { key: "dhcp.lan.ra", value: "server" }
      - { key: "dhcp.lan.ra_management", value: "1" }
      - { key: "dhcp.lan.ra_default", value: "1" }
      - { key: "dhcp.lan.ra_lifetime", value: "1800" }
      - { key: "dhcp.lan.force", value: "1" }
      - { key: "dhcp.lan.dns", value: "$(uci get network.lan.ip6addr | cut -d/ -f1)" }
      - { key: "dhcp.lan_dnsmasq", value: "dnsmasq" }
      - { key: "dhcp.lan_dnsmasq.domain", value: "lan" }
      - { key: "dhcp.lan_dnsmasq.listen_address", value: "127.0.0.1" }
      - { key: "dhcp.lan_dnsmasq.listen_address", value: "$(uci get network.lan.ipaddr)" }
      - { key: "dhcp.lan_dnsmasq.listen_address", value: "$(uci get network.lan.ip6addr | cut -d/ -f1)" }
      - { key: "dhcp.lan_dnsmasq.logqueries", value: "1" }
      - { key: "dhcp.lan_dnsmasq.authoritative", value: "1" }
      - { key: "dhcp.lan_dnsmasq.sequential_ip", value: "1" }
      - { key: "dhcp.lan_dnsmasq.readethers", value: "1" }
      - { key: "dhcp.lan.dhcp_option", value: "119,lan,iot,tor,wan" }
      - { key: "dhcp.lan.dhcp_option", value: "6,$(uci get network.lan.ipaddr)" }

      ## Firewall defaults + LAN zone
      - { key: "firewall.defaults", value: "defaults" }
      - { key: "firewall.defaults.input", value: "DROP" }
      - { key: "firewall.defaults.output", value: "ACCEPT" }
      - { key: "firewall.defaults.forward", value: "DROP" }
      - { key: "firewall.defaults.synflood_protect", value: "1" }
      - { key: "firewall.defaults.drop_invalid", value: "1" }
      - { key: "firewall.defaults.flow_offloading", value: "1" }
      - { key: "firewall.zone_lan", value: "zone" }
      - { key: "firewall.zone_lan.name", value: "lan" }
      - { key: "firewall.zone_lan.network", value: "lan" }
      - { key: "firewall.zone_lan.input", value: "ACCEPT" }
      - { key: "firewall.zone_lan.output", value: "ACCEPT" }
      - { key: "firewall.zone_lan.forward", value: "ACCEPT" }
      - { key: "firewall.zone_lan.log", value: "1" }
      - { key: "firewall.zone_lan.masq", value: "0" }
      - { key: "firewall.zone_lan.mtu_fix", value: "0" }

      ## WAN zone + default internet rules (DHCP, ping, IGMP/MLD, IPv6, VPN)
      - { key: "firewall.zone_wan", value: "zone" }
      - { key: "firewall.zone_wan.name", value: "wan" }
      - { key: "firewall.zone_wan.network", value: "wan" }
      - { key: "firewall.zone_wan.input", value: "DROP" }
      - { key: "firewall.zone_wan.output", value: "ACCEPT" }
      - { key: "firewall.zone_wan.forward", value: "DROP" }
      - { key: "firewall.zone_wan.log", value: "1" }
      - { key: "firewall.zone_wan.masq", value: "1" }
      - { key: "firewall.zone_wan.mtu_fix", value: "1" }
      - { key: "firewall.rule_dhcp_renew", value: "rule" }
      - { key: "firewall.rule_dhcp_renew.name", value: "ansible_default_dhcp_renew" }
      - { key: "firewall.rule_dhcp_renew.src", value: "*" }
      - { key: "firewall.rule_dhcp_renew.proto", value: "udp" }
      - { key: "firewall.rule_dhcp_renew.dest_port", value: "68" }
      - { key: "firewall.rule_dhcp_renew.target", value: "ACCEPT" }
      - { key: "firewall.rule_dhcp_renew.family", value: "ipv4" }
      - { key: "firewall.rule_ping", value: "rule" }
      - { key: "firewall.rule_ping.name", value: "ansible_default_ping" }
      - { key: "firewall.rule_ping.src", value: "wan" }
      - { key: "firewall.rule_ping.proto", value: "icmp" }
      - { key: "firewall.rule_ping.family", value: "ipv4" }
      - { key: "firewall.rule_ping.target", value: "DROP" }
      - { key: "firewall.rule_ping_forward_out", value: "rule" }
      - { key: "firewall.rule_ping_forward_out.src", value: "lan" }
      - { key: "firewall.rule_ping_forward_out.dest", value: "wan" }
      - { key: "firewall.rule_ping_forward_out.target", value: "ACCEPT" }
      - { key: "firewall.rule_ping_forward_out.proto", value: "icmp" }
      - { key: "firewall.rule_ping_forward_out.icmp_type", value: "echo-request" }
      - { key: "firewall.rule_ping_forward_out.name", value: "ansible_ping_forward_out" }
      - { key: "firewall.rule_igmp", value: "rule" }
      - { key: "firewall.rule_igmp.name", value: "ansible_default_igmp" }
      - { key: "firewall.rule_igmp.src", value: "*" }
      - { key: "firewall.rule_igmp.proto", value: "igmp" }
      - { key: "firewall.rule_igmp.family", value: "ipv4" }
      - { key: "firewall.rule_igmp.target", value: "ACCEPT" }
      - { key: "firewall.rule_dhcpv6", value: "rule" }
      - { key: "firewall.rule_dhcpv6.name", value: "ansible_default_dhcpv6" }
      - { key: "firewall.rule_dhcpv6.src", value: "*" }
      - { key: "firewall.rule_dhcpv6.proto", value: "udp" }
      - { key: "firewall.rule_dhcpv6.dest_port", value: "546" }
      - { key: "firewall.rule_dhcpv6.family", value: "ipv6" }
      - { key: "firewall.rule_dhcpv6.target", value: "ACCEPT" }
      - { key: "firewall.rule_mld", value: "rule" }
      - { key: "firewall.rule_mld.name", value: "ansible_default_mld" }
      - { key: "firewall.rule_mld.src", value: "*" }
      - { key: "firewall.rule_mld.proto", value: "icmp" }
      - { key: "firewall.rule_mld.src_ip", value: "fe80::/10" }
      - { key: "firewall.rule_mld.icmp_type", value: "130/0 131/0 132/0 143/0" }
      - { key: "firewall.rule_mld.family", value: "ipv6" }
      - { key: "firewall.rule_mld.target", value: "ACCEPT" }
      - { key: "firewall.rule_icmpv6_input", value: "rule" }
      - { key: "firewall.rule_icmpv6_input.name", value: "ansible_default_icmpv6_input" }
      - { key: "firewall.rule_icmpv6_input.src", value: "wan" }
      - { key: "firewall.rule_icmpv6_input.proto", value: "icmp" }
      - { key: "firewall.rule_icmpv6_input.icmp_type", value: "echo-request echo-reply destination-unreachable packet-too-big time-exceeded bad-header unknown-header-type router-solicitation neighbour-solicitation router-advertisement neighbour-advertisement" }
      - { key: "firewall.rule_icmpv6_input.limit", value: "1000/sec" }
      - { key: "firewall.rule_icmpv6_input.family", value: "ipv6" }
      - { key: "firewall.rule_icmpv6_input.target", value: "DROP" }
      - { key: "firewall.rule_icmpv6_forward", value: "rule" }
      - { key: "firewall.rule_icmpv6_forward.name", value: "ansible_default_icmpv6_forward" }
      - { key: "firewall.rule_icmpv6_forward.src", value: "wan" }
      - { key: "firewall.rule_icmpv6_forward.dest", value: "*" }
      - { key: "firewall.rule_icmpv6_forward.proto", value: "icmp" }
      - { key: "firewall.rule_icmpv6_forward.icmp_type", value: "echo-request echo-reply destination-unreachable packet-too-big time-exceeded bad-header unknown-header-type" }
      - { key: "firewall.rule_icmpv6_forward.limit", value: "1000/sec" }
      - { key: "firewall.rule_icmpv6_forward.family", value: "ipv6" }
      - { key: "firewall.rule_icmpv6_forward.target", value: "DROP" }
      - { key: "firewall.rule_ipsec_esp", value: "rule" }
      - { key: "firewall.rule_ipsec_esp.name", value: "ansible_default_ipsec_esp" }
      - { key: "firewall.rule_ipsec_esp.src", value: "wan" }
      - { key: "firewall.rule_ipsec_esp.dest", value: "lan" }
      - { key: "firewall.rule_ipsec_esp.proto", value: "esp" }
      - { key: "firewall.rule_ipsec_esp.target", value: "ACCEPT" }
      - { key: "firewall.rule_isakmp", value: "rule" }
      - { key: "firewall.rule_isakmp.name", value: "ansible_default_isakmp" }
      - { key: "firewall.rule_isakmp.src", value: "wan" }
      - { key: "firewall.rule_isakmp.dest", value: "lan" }
      - { key: "firewall.rule_isakmp.dest_port", value: "500" }
      - { key: "firewall.rule_isakmp.proto", value: "udp" }
      - { key: "firewall.rule_isakmp.target", value: "ACCEPT" }
      - { key: "firewall.rule_allow_all_from_lan", value: "rule" }
      - { key: "firewall.rule_allow_all_from_lan.proto", value: "all" }
      - { key: "firewall.rule_allow_all_from_lan.src", value: "lan" }
      - { key: "firewall.rule_allow_all_from_lan.dest", value: "wan" }
      - { key: "firewall.rule_allow_all_from_lan.target", value: "ACCEPT" }
      - { key: "firewall.rule_allow_all_from_lan.name", value: "ansible_allow_all_from_lan" }
      - { key: "firewall.rule_allow_all_from_lan.enabled", value: "0" }

      ## Avahi mDNS (printers, Chromecast)
      - { key: "firewall.rule_allow_mdns_avahi", value: "rule" }
      - { key: "firewall.rule_allow_mdns_avahi.target", value: "ACCEPT" }
      - { key: "firewall.rule_allow_mdns_avahi.name", value: "ansible_allow_mdns_avahi" }
      - { key: "firewall.rule_allow_mdns_avahi.proto", value: "udp" }
      - { key: "firewall.rule_allow_mdns_avahi.src", value: "*" }
      - { key: "firewall.rule_allow_mdns_avahi.dest_port", value: "5353" }
      - { key: "firewall.rule_allow_mdns_avahi.dest_ip", value: "224.0.0.251" }
      - { key: "firewall.rule_allow_mdns_avahi.family", value: "ipv4" }
      - { key: "firewall.rule_allow_mdns_avahi_v6", value: "rule" }
      - { key: "firewall.rule_allow_mdns_avahi_v6.target", value: "ACCEPT" }
      - { key: "firewall.rule_allow_mdns_avahi_v6.name", value: "ansible_allow_mdns_avahi_v6" }
      - { key: "firewall.rule_allow_mdns_avahi_v6.proto", value: "udp" }
      - { key: "firewall.rule_allow_mdns_avahi_v6.src", value: "*" }
      - { key: "firewall.rule_allow_mdns_avahi_v6.dest_port", value: "5353" }
      - { key: "firewall.rule_allow_mdns_avahi_v6.dest_ip", value: "ff02::fb" }
      - { key: "firewall.rule_allow_mdns_avahi_v6.family", value: "ipv6" }

      ## Attended sysupgrade: only check for upgrades when logged in
      - { key: "attendedsysupgrade.client.login_check_for_upgrades", value: "1" }

  pre_tasks:
    - name: Check required parameters
      ansible.builtin.assert:
        that:
          - ip is defined
          - ip6 is defined
          - ipv6_ula_prefix is defined
          - upstream_dns is defined
        fail_msg: "Missing required parameter(s). Pass them with -e <name>=<value>."
        quiet: true

  tasks:
    # --- role detection ----------------------------------------------------
    # A router with an enabled dnsmasq is the resolver of its segment (the
    # master); a slave access point runs neither dnsmasq nor odhcpd.
    - name: detect the resolver role
      raw: |
        if [ -n "$(ls /etc/rc.d/S*dnsmasq 2>/dev/null)" ]
        then
          echo resolver
        else
          echo plain
        fi
      register: resolver_role
      changed_when: false

    # --- packages ----------------------------------------------------------
    - name: update apk db
      raw: apk update
      changed_when: false

    - name: upgrade packages
      raw: apk upgrade
      changed_when: false

    - name: check installed packages
      raw: apk info
      register: installed_packages
      changed_when: false

    - name: install packages if needed
      raw: apk add {{ item }}
      loop: "{{ openwrt_packages }}"
      when: item not in installed_packages.stdout

    # --- static files and keys ---------------------------------------------
    - name: generate ssh-keys if not exist
      raw: |
        mkdir -p /root/.ssh
        chmod 700 /root/.ssh
        [ -s /root/.ssh/id_ed25519 ] || ssh-keygen -t ed25519 -f /root/.ssh/id_ed25519 -N '' -q -C "root@$(uci get system.@system[0].hostname)"
        chmod 600 /root/.ssh/id_ed25519
      changed_when: false

    # The public key of the master is read on the ansible controller: the
    # master can only push to this host once this key is trusted here.
    - name: read the master ssh public key
      ansible.builtin.command:
        argv:
          - ssh
          - -o
          - BatchMode=yes
          - -o
          - ConnectTimeout=5
          - -o
          - StrictHostKeyChecking=accept-new
          - "root@{{ ssh_trust_master }}"
          - cat
          - /root/.ssh/id_ed25519.pub
      delegate_to: localhost
      register: master_ssh_pubkey
      changed_when: false
      failed_when: false
      when: ssh_trust_master | length > 0

    - name: check the master ssh public key
      ansible.builtin.assert:
        that:
          - master_ssh_pubkey.rc == 0
          - master_ssh_pubkey.stdout is match('ssh-')
        fail_msg: "Cannot read /root/.ssh/id_ed25519.pub from {{ ssh_trust_master }} - run openwrt_basics.yml on the master first."
        quiet: true
      when: ssh_trust_master | length > 0

    - name: trust the master ssh key
      raw: |
        keyline="{{ master_ssh_pubkey.stdout | trim }}"
        mkdir -p /etc/dropbear
        touch /etc/dropbear/authorized_keys
        if grep -qxF "$keyline" /etc/dropbear/authorized_keys
        then
          echo unchanged
        else
          printf '%s\n' "$keyline" >> /etc/dropbear/authorized_keys
          echo changed
        fi
        chmod 600 /etc/dropbear/authorized_keys
      register: ssh_trust_result
      changed_when: "ssh_trust_result.stdout | trim == 'changed'"
      when: ssh_trust_master | length > 0

    - name: verify the master ssh key
      raw: |
        blob=$(printf '%s\n' "{{ master_ssh_pubkey.stdout | trim }}" | cut -d' ' -f2)
        if ! grep -qF "$blob" /etc/dropbear/authorized_keys
        then
          echo "master key missing in /etc/dropbear/authorized_keys"
          exit 1
        fi
        echo ok
      changed_when: false
      when: ssh_trust_master | length > 0

    - name: write /root/.vimrc
      raw: |
        cat << 'EOF' > /root/.vimrc
        set mouse=
        set paste
        EOF
      changed_when: false

    - name: use local upstream dns
      raw: |
        cat << 'EOF' > /etc/resolv.dnsmasq.lan
        nameserver {{ upstream_dns }}
        EOF
      changed_when: false

    - name: write /etc/avahi/avahi-daemon.conf
      raw: |
        cat << 'EOF' > /etc/avahi/avahi-daemon.conf
        [server]
        allow-interfaces={{ bridges }}

        [reflector]
        enable-reflector=yes
        EOF
      changed_when: false

    - name: write /etc/sysupgrade.conf
      raw: |
        cat << 'EOF' > /etc/sysupgrade.conf
        ## This file contains files and directories that should
        ## be preserved during an upgrade.
        /etc/wg_lan/
        /etc/wg_tor/
        /etc/openvpn/
        /etc/scripts/
        /etc/dnscrypt-proxy2/
        /etc/asterisk/
        /etc/ips-*
        /etc/key.pem
        /etc/tor_*
        /etc/resolv*
        /root/.ssh/
        EOF
      changed_when: false

    - name: write firewall port-forward helper script
      raw: |
        mkdir -p /etc/scripts
        cat << 'EOF' > /etc/scripts/firewall_port_forwards_from_wan_to_newzone.sh
        #!/bin/sh

        # Duplicate all port forwards from zone 'wan' to new zone given by $1
        newzone="$1"

        if [[ -z "$newzone" ]]
        then
          echo "no new zone specified"
          exit 1
        fi

        changed=0
        while read -r name
        do

          src=$(uci get firewall."$name".src 2>/dev/null)
          [ "$src" != "wan" ] && continue

          newname="$(echo "$name" | sed 's/^redirect_//')_${newzone}"

          # Skip if already exists
          uci get firewall."$newname" >/dev/null 2>&1 && continue

          uci set firewall."$newname"=rule
          uci set firewall."$newname".src="$newzone"
          uci set firewall."$newname".name="$newname"
          uci set firewall."$newname".target="ACCEPT"

          for param in proto dest dest_ip dest_port
          do
             val=$(uci get firewall."$name"."$param" 2>/dev/null)
             if [ -n "$val" ]
             then
               uci set firewall."$newname"."$param"="$val"
             fi
          done

          changed=1

        done <<EOI
        $(uci show firewall | grep -E "^firewall\.[a-zA-Z0-9_]+=redirect$" | cut -d. -f2 | cut -d= -f1)
        EOI

        if [ "$changed" = "1" ]
        then
          uci commit firewall
          /etc/init.d/firewall reload
        fi
        EOF

        chmod 700 /etc/scripts/firewall_port_forwards_from_wan_to_newzone.sh
      changed_when: false

    - name: write netconsole init script
      raw: |
        cat << 'EOF' > /etc/init.d/netconsole
        #!/bin/sh /etc/rc.common
        # Forward kernel printk (oops and panic included) to the SymbiOS log
        # server. netconsole transmits via netpoll, so it still works after
        # panic() has frozen userspace - unlike logd, which loses the tail of
        # an oops report. Target is the log server configured by
        # openwrt_logserver.yml, source is the LAN address of this router.

        START=99

        start() {
          local ip target mac mod

          # no LAN address or no log server configured -> nothing to do
          ip=$(uci -q get network.lan.ipaddr)
          target=$(uci -q get system.@system[0].log_ip)
          [ -n "$ip" ] && [ -n "$target" ] || return 0

          mod=$(find /lib/modules/$(uname -r) -name 'netconsole.ko*' | head -n 1)
          [ -n "$mod" ] || return 0

          # Always reload: the kmod package pulls the module in at boot via
          # /etc/modules.d/netconsole without a target, and modprobe on
          # OpenWrt (kmodloader) silently drops module parameters - so the
          # configuration has to go through insmod.
          rmmod netconsole 2>/dev/null

          # unicast when the log server MAC is known, otherwise the MAC is
          # left empty and netconsole falls back to broadcast
          mac=$(ip -4 neigh show "$target" | grep -o 'lladdr [0-9a-f:]*' | cut -d' ' -f2)
          insmod "$mod" "netconsole=@${ip}/br-lan,{{ netconsole_port }}@${target}/${mac}"
        }

        stop() {
          rmmod netconsole 2>/dev/null
        }
        EOF
        chmod 755 /etc/init.d/netconsole
      changed_when: false

    - name: enable netconsole
      raw: |
        [ -e /etc/rc.d/S99netconsole ] || { /etc/init.d/netconsole enable && echo changed; }
      register: netconsole_enable_result
      changed_when: "'changed' in netconsole_enable_result.stdout"

    - name: start netconsole
      raw: /etc/init.d/netconsole start
      changed_when: false

    # --- UCI ---------------------------------------------------------------
    - name: delete config defaults
      raw: |
        # detele default config indices
        while uci show | grep -q "^{{ item }}"
        do
          echo "changed"
          uci delete {{ item }}[0]
        done
      loop: "{{ uci_default_vars }}"
      register: uci_delete_result
      changed_when: "'changed' in uci_delete_result.stdout"

    - name: set uci values if needed
      raw: |
        current=$(uci get {{ item.key }} 2>/dev/null || echo "NOT_SET")
        desired="{{ item.value }}"

        # List-valued UCI options (zone networks, dnsmasq listen_address /
        # dhcp_option) must be appended, not overwritten.
        if ! echo "$current" | grep -qF -- "$desired"
        then
          if echo "{{ item.key }}" | egrep -q "firewall\..+\.network|dhcp\.[a-z0-9_]+_dnsmasq\.(listen_address|server)|dhcp\.[a-z0-9_]+\.dhcp_option"
          then
            uci add_list {{ item.key }}="{{ item.value }}"
          else
            uci set {{ item.key }}="{{ item.value }}"
          fi
          echo "changed"
        else
          echo "unchanged"
        fi
      loop: "{{ uci_vars }}"
      register: uci_set_result
      changed_when: "not 'unchanged' in uci_set_result.stdout"

    - name: apply changes
      block:
        - name: commit enable and restart
          raw: "{{ item }}"
          loop:
            - "uci commit"
            - "/etc/init.d/irqbalance start"
            - "/etc/init.d/irqbalance enable"
            - "/etc/init.d/fstab enable"
            - "/etc/init.d/fstab restart"
            - "/etc/init.d/dropbear restart"
            - "/etc/init.d/avahi-daemon enable"
            - "/etc/init.d/avahi-daemon restart"
            - "/etc/init.d/firewall reload"
          when: uci_set_result.changed

    # Only a router that already ran a resolver keeps one: a slave access
    # point must not start a second DHCP/DNS server on the same segment.
    - name: enable and restart the local resolver
      raw: "{{ item }}"
      loop:
        - "/etc/init.d/dnsmasq enable"
        - "/etc/init.d/dnsmasq restart"
        - "/etc/init.d/odhcpd enable"
        - "/etc/init.d/odhcpd restart"
      when:
        - uci_set_result.changed
        - resolver_role.stdout | trim == 'resolver'

    # /etc/resolv.conf is a symlink to /tmp/resolv.conf, which netifd replaces
    # on every interface event (per-interface DNS, no search order). Write a
    # static file instead: it is overlay backed and in /etc/sysupgrade.conf.
    - name: write a static /etc/resolv.conf
      raw: |
        # only a resolver host points at itself, slaves ask the master
        if [ "{{ resolver_role.stdout | trim }}" = "resolver" ]
        then
          ns=127.0.0.1
        else
          ns=$(uci -q get network.lan.dns)
        fi
        printf 'nameserver %s\nsearch lan iot tor\n' "$ns" > /tmp/resolv.conf.new
        if cmp -s /tmp/resolv.conf.new /etc/resolv.conf
        then
          echo unchanged
        else
          rm -f /etc/resolv.conf
          mv /tmp/resolv.conf.new /etc/resolv.conf
          chmod 644 /etc/resolv.conf
          echo changed
        fi
        rm -f /tmp/resolv.conf.new
      register: resolv_result
      changed_when: "resolv_result.stdout | trim == 'changed'"

    # Record this playbook's resources in /etc/symbios/managed.json.
    - name: Record managed state
      ansible.builtin.include_tasks: _managed-state.yml
