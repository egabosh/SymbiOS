---
- ansible.builtin.import_playbook: tasks/openwrt/openwrt_firewall_hijack_connections.yml
  when: profile | default('ipv4') == 'hijack'
- ansible.builtin.import_playbook: tasks/openwrt/openwrt_firewall_ipv4_server_portforwardings.yml
  when: profile | default('ipv4') == 'ipv4'
- ansible.builtin.import_playbook: tasks/openwrt/openwrt_firewall_ipv6_server_forward.yml
  when: profile | default('ipv4') == 'ipv6'
