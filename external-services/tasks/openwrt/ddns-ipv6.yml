# docs:
#   name: "OpenWrt - DDNS IPv6"
#   short_description: "OpenWrt - DDNS IPv6"
#   description: "deSEC DynDNS updater for the IPv6 prefix."
#   category: "Network"
#   type: OpenWrt
#   icon: "bi-cloud-arrow-up"
#   params:
#     - name: "domainname"
#       label: "Domain"
#       type: "text"
#       required: true
#     - name: "apikey"
#       label: "deSEC API key"
#       type: "password"
#       required: true
#   requires:
#     - playbook: "openwrt_basics.yml"
#       reason: "Base system setup"
#   actions:
#     __playbook__: Install/Update
#
---
- name: ddns ipv6 desec.io
  hosts: all
  gather_facts: no

  vars:
    # Defaults keep the playbook runnable standalone; the WebUI passes
    # the same names as extra vars (which take precedence).
    managed_id: "openwrt_ddns-ipv6.yml"
    managed_playbook: "openwrt_ddns-ipv6.yml"
    managed_ref: "domainname={{ domainname }}"
    managed_resource_type: "ddns_ipv6"
    openwrt_packages:
      - ddns-scripts
      - luci-app-ddns

    uci_delete_vars:
      - ddns.myddns_ipv4
      - ddns.myddns_ipv6 

    uci_vars:
      - { key: "ddns.dedyn_ipv6_openwrt", value: "service" }
      - { key: "ddns.dedyn_ipv6_openwrt.service_name", value: "desec.io" }
      - { key: "ddns.dedyn_ipv6_openwrt.use_ipv6", value: "1" }
      - { key: "ddns.dedyn_ipv6_openwrt.enabled", value: "1" }
      - { key: "ddns.dedyn_ipv6_openwrt.lookup_host", value: "{{ domainname }}" }
      - { key: "ddns.dedyn_ipv6_openwrt.domain", value: "{{ domainname }}" }
      - { key: "ddns.dedyn_ipv6_openwrt.username", value: "{{ domainname }}" }
      - { key: "ddns.dedyn_ipv6_openwrt.password", value: "{{ apikey }}" }
      - { key: "ddns.dedyn_ipv6_openwrt.use_https", value: "1" }
      - { key: "ddns.dedyn_ipv6_openwrt.cacert", value: "/etc/ssl/certs" }
      - { key: "ddns.dedyn_ipv6_openwrt.ip_source", value: "interface" }
      - { key: "ddns.dedyn_ipv6_openwrt.interface", value: "wan" }
      - { key: "ddns.dedyn_ipv6_openwrt.use_syslog", value: "1" }

  pre_tasks:
    - name: Check required parameters
      ansible.builtin.assert:
        that:
          - apikey is defined and (apikey | string | length) > 0
          - domainname is defined and (domainname | string | length) > 0
        fail_msg: "Missing required parameter(s). Pass them with -e <name>=<value>."
        quiet: true

  tasks:

    - name: install ddns packages
      ansible.builtin.include_tasks: packages.yml

    - name: Set UCI values (shell-safe)
      ansible.builtin.include_tasks: uci-set.yml
      vars:
        uci_secret: true
    - name: apply changes
      block:
        - name: commit enable and restart
          raw: "{{ item }}"
          loop:
            - "uci commit"
            - "/etc/init.d/ddns restart"
          when: uci_changed | default(false) | bool

    # Record this playbook's resources in /etc/symbios/managed.json.
    - name: Record managed state
      ansible.builtin.include_tasks: ../../_managed-state.yml
