# docs:
#   name: "OpenWrt - Telekom VDSL"
#   short_description: "OpenWrt - Telekom VDSL"
#   description: "PPPoE WAN configuration for a Telekom VDSL line without VLAN 7."
#   category: "Network"
#   type: OpenWrt
#   icon: "bi-ethernet"
#   params:
#     - name: "pppoe_user"
#       label: "PPPoE user"
#       type: "text"
#       required: true
#     - name: "pppoe_pw"
#       label: "PPPoE password"
#       type: "password"
#       required: true
#   requires:
#     - playbook: "openwrt_master.yml"
#       reason: "Base system setup"
#   actions:
#     __playbook__: Install/Update
#
---
- name: Configure Telekom VDSL PPPoE
  hosts: all
  gather_facts: no

  vars:
    # Keep the legacy id: it keys managed.json and saved playbook vars.
    managed_id: "openwrt_internet_telekom_vdsl.yml"
    managed_playbook: "openwrt_internet_telekom_vdsl.yml"
    managed_ref: "pppoe_user={{ pppoe_user }}"
    managed_resource_type: "internet_telekom_vdsl"

    wan_uci_vars:
      - { key: "network.wan", value: "interface" }
      - { key: "network.wan.proto", value: "pppoe" }
      - { key: "network.wan.device", value: "wan" }
      - { key: "network.wan.username", value: "{{ pppoe_user }}" }
      - { key: "network.wan.password", value: "{{ pppoe_pw }}" }
      - { key: "network.wan.ipv6", value: "auto" }
      - { key: "network.wan.peerdns", value: "1" }

  pre_tasks:
    - name: Check required parameters
      ansible.builtin.assert:
        that:
          - pppoe_pw is defined and (pppoe_pw | string | length) > 0
          - pppoe_user is defined and (pppoe_user | string | length) > 0
        fail_msg: "Missing required parameter(s). Pass them with -e <name>=<value>."
        quiet: true

  tasks:
    - name: Configure Telekom VDSL WAN
      ansible.builtin.include_tasks: wan-pppoe.yml

    # Record this playbook's resources in /etc/symbios/managed.json.
    - name: Record managed state
      ansible.builtin.include_tasks: ../../_managed-state.yml
