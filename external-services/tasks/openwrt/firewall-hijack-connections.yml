# docs:
#   name: "OpenWrt - Firewall hijack connections"
#   short_description: "OpenWrt - Firewall hijack connections"
#   description: "Redirect/force traffic to a local service (e.g. DNS hijack)."
#   category: "Security"
#   type: OpenWrt
#   icon: "bi-arrow-left-right"
#   params:
#     - name: "redirect_name"
#       label: "Redirect name"
#       type: "text"
#       required: true
#     - name: "src"
#       label: "Source zone"
#       type: "text"
#       required: true
#     - name: "proto"
#       label: "Protocol"
#       type: "text"
#       default: "tcp"
#     - name: "from_port"
#       label: "From port"
#       type: "text"
#       required: true
#     - name: "to_port"
#       label: "To port"
#       type: "text"
#       required: true
#     - name: "target"
#       label: "Redirect target"
#       type: "text"
#       default: "DST"
#   requires:
#     - playbook: "openwrt_basics.yml"
#       reason: "Firewall zones"
#   actions:
#     __playbook__: Install/Update
#
---
- name: Hijack outgoing internet connections
  hosts: all
  gather_facts: no

  vars:
    # Defaults keep the playbook runnable standalone; the WebUI passes
    # the same names as extra vars (which take precedence).
    managed_id: "openwrt_firewall_hijack_connections.yml/{{ redirect_name }}"
    managed_playbook: "openwrt_firewall_hijack_connections.yml"
    managed_ref: "redirect_name={{ redirect_name }} src={{ src }} proto={{ proto }} from_port={{ from_port }} to_port={{ to_port }} target={{ target }}"
    managed_resource_type: "firewall_hijack_connections"
    state: "present"
    proto: "tcp"
    target: "DST"
    uci_vars:
      - { key: "firewall.redirect_hijack_{{ src }}_{{ redirect_name }}",           value: "redirect" }
      - { key: "firewall.redirect_hijack_{{ src }}_{{ redirect_name }}.target",    value: "DNAT" }
      - { key: "firewall.redirect_hijack_{{ src }}_{{ redirect_name }}.name",      value: "ansible_hijack_{{ src }}_{{ redirect_name }}" }
      - { key: "firewall.redirect_hijack_{{ src }}_{{ redirect_name }}.proto",     value: "{{ proto }}" }
      - { key: "firewall.redirect_hijack_{{ src }}_{{ redirect_name }}.src",       value: "{{ src }}" }
      - { key: "firewall.redirect_hijack_{{ src }}_{{ redirect_name }}.dest",      value: "wan" }
      - { key: "firewall.redirect_hijack_{{ src }}_{{ redirect_name }}.src_dport", value: "{{ from_port }}" }
      - { key: "firewall.redirect_hijack_{{ src }}_{{ redirect_name }}.dest_ip",   value: "{{ target }}" }
      - { key: "firewall.redirect_hijack_{{ src }}_{{ redirect_name }}.dest_port", value: "{{ to_port }}" }

  pre_tasks:
    - name: Check required parameters
      ansible.builtin.assert:
        that:
          - state in ['present', 'absent']
          - redirect_name is defined and (redirect_name | string | length > 0)
          - state == 'absent' or (from_port is defined and src is defined and to_port is defined)
          - redirect_name is match('^[A-Za-z0-9._-]+$')
        fail_msg: "state must be present or absent; redirect_name, src, from_port and to_port are required for present."
        quiet: true

  tasks:
    # --- absent: remove the redirect ----------------------------------------
    - name: Remove the connection hijack
      when: state == 'absent'
      block:
        - name: Delete the redirect section
          ansible.builtin.raw: |
            changed=0
            for s in $(uci -q show firewall | sed -n 's/^firewall\.\(redirect_hijack_[^.=]*\)=.*/\1/p')
            do
              n=$(uci -q get "firewall.$s.name" 2>/dev/null)
              case "$n" in
                ansible_hijack_*_{{ redirect_name }})
                  uci delete "firewall.$s"
                  changed=1
                  ;;
              esac
            done
            if [ "$changed" = 1 ]
            then
              uci commit firewall
              echo changed
            else
              echo unchanged
            fi
          register: delete_result
          changed_when: "delete_result.stdout | trim == 'changed'"

        - name: Reload the firewall
          ansible.builtin.raw: /etc/init.d/firewall reload
          when: delete_result is changed

        - name: Record managed state
          ansible.builtin.include_tasks: ../../_managed-state.yml
          vars:
            managed_id: ""
            managed_remove_ids:
              - "openwrt_firewall_hijack_connections.yml/{{ redirect_name }}"

    # --- present: create or update the redirect ------------------------------
    - name: Configure the connection hijack
      when: state != 'absent'
      block:
        - name: set uci values if needed
          ansible.builtin.raw: |
            current=$(uci get {{ item.key }} 2>/dev/null || echo "NOT_SET")
            desired="{{ item.value }}"
            if [ "$current" != "$desired" ]
            then
              uci set {{ item.key }}="{{ item.value }}"
              echo "changed"
            else
              echo "unchanged"
            fi
          loop: "{{ uci_vars }}"
          register: uci_set_result
          changed_when: false

        - name: Remember whether any uci value changed
          ansible.builtin.set_fact:
            uci_changed: "{{ uci_set_result.results | map(attribute='stdout') | map('trim') | select('equalto', 'changed') | list | length > 0 }}"

        - name: apply changes
          block:
            - name: commit enable and restart
              ansible.builtin.raw: "{{ item }}"
              loop:
                - "uci commit"
                - "/etc/init.d/firewall reload"
              when: uci_changed

        # Record this playbook's resources in /etc/symbios/managed.json.
        - name: Record managed state
          ansible.builtin.include_tasks: ../../_managed-state.yml
