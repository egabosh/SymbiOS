# docs:
#   name: "OpenWrt - FRITZ!Box IPv6"
#   short_description: "OpenWrt - FRITZ!Box IPv6"
#   description: "IPv6 prefix delegation helpers for a FRITZ!Box uplink."
#   category: "Network"
#   type: OpenWrt
#   icon: "bi-router"
#   requires:
#     - playbook: "openwrt_basics.yml"
#       reason: "Base system setup"
#   actions:
#     __playbook__: Install/Update
#
---
- name: FRITZ!Box IPv6 - ULA off, allow fritzbox LAN, prefix hotplug
  hosts: all
  gather_facts: no

  vars:
    # Defaults keep the playbook runnable standalone; the WebUI passes
    # the same names as extra vars (which take precedence).
    # Keep the legacy id: it keys managed.json and saved playbook vars.
    managed_id: "openwrt_fritzbox-ipv6.yml"
    managed_playbook: "openwrt_fritzbox-ipv6.yml"
    managed_ref: ""
    managed_resource_type: "fritzbox_ipv6"
    uci_vars:
      ## network: do not auto-derive ULA subnets, explicit ip6addr lists are used
      #- { key: "network.globals.ula_prefix", value: "" }

      ## network: static route to the FRITZ!Box internal LAN (IPv4). The v6
      # side is covered dynamically by 30-fritz-prefix; without this route,
      # LAN traffic for 192.168.188.x falls through to the WAN default.
      # target/netmask (not ipaddr/CIDR): netifd 2026.x parses only that
      # form into a usable route on this router.
      - { key: "network.fritzbox_lan",        value: "route" }
      - { key: "network.fritzbox_lan.name",   value: "fritzbox-lan" }
      - { key: "network.fritzbox_lan.interface", value: "lan" }
      - { key: "network.fritzbox_lan.target", value: "192.168.188.0" }
      - { key: "network.fritzbox_lan.netmask", value: "255.255.255.0" }
      - { key: "network.fritzbox_lan.gateway", value: "172.23.0.228" }

      ## network/dhcp: reserve a /60 LAN pool for downstream DHCPv6-PD and
      ## hand the FRITZ!Box the first free /62 from it. Repeated here (basics.yml
      ## sets the same values) so this tile works as a standalone WebUI action.
      - { key: "network.lan.ip6assign", value: "60" }
      - { key: "network.lan.ip6hint", value: "0" }
      - { key: "dhcp.lan.dhcpv6_pd", value: "1" }
      - { key: "dhcp.lan.dhcpv6_pd_min_len", value: "62" }

      ## firewall: allow the delegated FRITZ!Box prefix into the LAN
      # dest_ip is maintained by /etc/hotplug.d/iface/30-fritz-prefix
      - { key: "firewall.fritzbox_ipv6",           value: "rule" }
      - { key: "firewall.fritzbox_ipv6.name",      value: "Allow-IPv6-fritzbox-LAN" }
      - { key: "firewall.fritzbox_ipv6.src",       value: "wan" }
      - { key: "firewall.fritzbox_ipv6.dest",      value: "lan" }
      - { key: "firewall.fritzbox_ipv6.family",    value: "ipv6" }
      - { key: "firewall.fritzbox_ipv6.target",    value: "ACCEPT" }

      ## firewall: bypass doh/tor ipset blocks for FRITZ/VM devices
      # Enables the VM behind FRITZ to run its own dnscrypt+Tor stack
      # (mirror of the router architecture) without being blocked by
      # the doh_ipv4/tor_ipv4 REJECT rules in the main forward chain.
      #
      # MUST use src='*' (not src='lan') so fw4 places these rules
      # in the main forward chain BEFORE the doh/tor REJECT blocks.
      # src_ip restricts to FRITZ WAN IP only (172.23.0.228).
      #
      # TCP bypass
      - { key: "firewall.fritz_lan_bypass_tcp",         value: "rule" }
      - { key: "firewall.fritz_lan_bypass_tcp.name",    value: "ansible_fritz_lan_dns_bypass_tcp" }
      - { key: "firewall.fritz_lan_bypass_tcp.src",     value: "*" }
      - { key: "firewall.fritz_lan_bypass_tcp.src_ip",  value: "172.23.0.228" }
      - { key: "firewall.fritz_lan_bypass_tcp.dest",    value: "wan" }
      - { key: "firewall.fritz_lan_bypass_tcp.proto",   value: "tcp" }
      - { key: "firewall.fritz_lan_bypass_tcp.target",  value: "ACCEPT" }
      # UDP bypass
      - { key: "firewall.fritz_lan_bypass_udp",         value: "rule" }
      - { key: "firewall.fritz_lan_bypass_udp.name",    value: "ansible_fritz_lan_dns_bypass_udp" }
      - { key: "firewall.fritz_lan_bypass_udp.src",     value: "*" }
      - { key: "firewall.fritz_lan_bypass_udp.src_ip",  value: "172.23.0.228" }
      - { key: "firewall.fritz_lan_bypass_udp.dest",    value: "wan" }
      - { key: "firewall.fritz_lan_bypass_udp.proto",   value: "udp" }
      - { key: "firewall.fritz_lan_bypass_udp.target",  value: "ACCEPT" }

  tasks:
    - name: Set UCI values (shell-safe)
      ansible.builtin.include_tasks: uci-set.yml
    - name: Clear stale FRITZ!Box prefix from firewall rule
      raw: uci -q delete firewall.fritzbox_ipv6.dest_ip
      changed_when: false

    # netifd can leave a /64 address on br-lan when ip6assign was raised from
    # 64 to 60 in place. odhcpd derives its PD pool from the shortest global
    # address mask, so a stale /64 makes every downstream IA_PD fail with
    # NoPrefixAvail. Keep a /60 anchor address for the assigned LAN prefix;
    # it survives network reloads because netifd does not manage it.
    - name: Ensure LAN has a global address with the assigned mask
      raw: |
        assign=$(uci get network.lan.ip6assign 2>/dev/null)
        prefix=$(ifstatus lan 2>/dev/null | jsonfilter -e '@["ipv6-prefix-assignment"][0].address' 2>/dev/null)
        [ -n "$assign" ] && [ -n "$prefix" ] || exit 0
        changed=0
        have=0
        for spec in $(ip -6 addr show dev br-lan scope global 2>/dev/null | awk '/inet6 / {print $2}')
        do
          addr=${spec%/*}
          mask=${spec##*/}
          case "$addr" in
            [23]*) ;;
            *) continue ;;
          esac
          case "$addr" in
            "$prefix"*)
              if [ "$mask" = "$assign" ]
              then
                have=1
              else
                ip -6 addr del "$spec" dev br-lan
                changed=1
              fi
              ;;
            *)
              ip -6 addr del "$spec" dev br-lan
              changed=1
              ;;
          esac
        done
        if [ "$have" -eq 0 ]
        then
          ip -6 addr add "${prefix}2/$assign" dev br-lan 2>/dev/null || true
          changed=1
        fi
        [ "$changed" -eq 1 ] && echo "repaired" || echo "unchanged"
      register: lan_addr_result
      changed_when: "'repaired' in lan_addr_result.stdout"

    - name: deploy hotplug script 30-fritz-prefix
      raw: |
        cat << 'EOF' > /etc/hotplug.d/iface/30-fritz-prefix
        #!/bin/sh
        # /etc/hotplug.d/iface/30-fritz-prefix
        # Keep firewall.fritzbox_ipv6.dest_ip on the FRITZ!Box delegated prefix.
        # Runs on WAN/LAN ifup, ifupdate and ifadd. On an ISP prefix change netifd
        # emits ifupdate before the FRITZ!Box renewed its lease, so first allow the
        # new LAN pool, then narrow to the concrete delegated /62.

        section=fritzbox_ipv6

        [ "$INTERFACE" = "wan6" ] || [ "$INTERFACE" = "wan" ] || [ "$INTERFACE" = "lan" ] || exit 0
        case "$ACTION" in
          ifup|ifupdate|ifadd) ;;
          *) exit 0 ;;
        esac

        f_update() {
          uci set "firewall.$section.dest_ip=$1"
          uci commit firewall
          fw4 reload
          logger -t fritz-prefix "dest_ip set to $1"
        }

        # Prefix assigned to br-lan from the ISP delegation.
        f_lan_prefix() {
          local f_addr f_mask
          f_addr=$(ifstatus lan 2>/dev/null | jsonfilter -e '@["ipv6-prefix-assignment"][0].address' 2>/dev/null)
          f_mask=$(ifstatus lan 2>/dev/null | jsonfilter -e '@["ipv6-prefix-assignment"][0].mask' 2>/dev/null)
          [ -n "$f_addr" ] && [ -n "$f_mask" ] || return 1
          printf '%s/%s\n' "$f_addr" "$f_mask"
        }

        # First global via-route on br-lan: the delegated prefix of the
        # downstream router. ULA routes and on-link-only routes are ignored.
        f_get_valid() {
          ip -6 route show dev br-lan 2>/dev/null | awk '$2 == "via" && $1 ~ /^[23]/ {print $1; exit}'
        }

        f_sync() {
          local f_prefix f_current
          f_prefix=$(f_get_valid) || return 1
          [ -n "$f_prefix" ] || return 1
          f_current=$(uci get "firewall.$section.dest_ip" 2>/dev/null)
          [ "$f_prefix" = "$f_current" ] && return 0
          f_update "$f_prefix"
        }

        # Narrow immediately if the FRITZ!Box route is already present.
        f_sync && exit 0

        # Otherwise allow the new LAN pool right away, so inbound traffic is
        # not dropped while the FRITZ!Box renews its DHCPv6-PD lease.
        f_lan=$(f_lan_prefix)
        if [ -n "$f_lan" ]; then
          f_current=$(uci get "firewall.$section.dest_ip" 2>/dev/null)
          [ "$f_current" = "$f_lan" ] || f_update "$f_lan"
        fi

        # Bounded background poll for the concrete delegated route.
        [ -f /var/run/fritz-prefix.pid ] && kill -0 "$(cat /var/run/fritz-prefix.pid)" 2>/dev/null && exit 0
        (
          echo $$ > /var/run/fritz-prefix.pid
          i=0
          while [ "$i" -lt 90 ]; do
            i=$((i + 1))
            sleep 2
            f_sync && { rm -f /var/run/fritz-prefix.pid; exit 0; }
          done
          rm -f /var/run/fritz-prefix.pid
          logger -t fritz-prefix "no delegated prefix within 180s"
        ) &
        exit 0
        EOF
        chmod +x /etc/hotplug.d/iface/30-fritz-prefix
      changed_when: false

    - name: sync firewall dest_ip to LAN pool immediately
      raw: INTERFACE=lan ACTION=ifupdate /etc/hotplug.d/iface/30-fritz-prefix
      changed_when: false

    - name: ensure bypass rules precede doh/tor blocks
      raw: |
        f=/etc/config/firewall
        blk=$(grep -n "^config rule 'doh_ipv4_rule'" "$f" | head -1 | cut -d: -f1)
        tcp=$(grep -n "^config rule 'fritz_lan_bypass_tcp'" "$f" | head -1 | cut -d: -f1)
        if [ -n "$blk" ] && [ -n "$tcp" ] && [ "$tcp" -lt "$blk" ] 2>/dev/null; then
          echo "unchanged"
        else
          doh_pos=$(head -n "$blk" "$f" | grep -c "^config ")
          uci reorder firewall.fritz_lan_bypass_tcp=$doh_pos
          uci reorder firewall.fritz_lan_bypass_udp=$((doh_pos+1))
          echo "reorder"
        fi
      register: reorder_result
      changed_when: "'reorder' in reorder_result.stdout"

    - name: apply changes
      block:
        - name: commit and reload
          raw: "{{ item }}"
          loop:
            - "uci commit"
            - "/etc/init.d/firewall reload"
            - "/etc/init.d/network reload"
            - "/etc/init.d/odhcpd restart"
          when: uci_changed or reorder_result.changed or lan_addr_result.changed

    # Record this playbook's resources in /etc/symbios/managed.json.
    - name: Record managed state
      ansible.builtin.include_tasks: ../../_managed-state.yml
