---
- name: create WLAN over tor
  hosts: all
  gather_facts: no

  vars:
    # Defaults keep the playbook runnable standalone; the WebUI passes
    # the same names as extra vars (which take precedence).
    managed_id: "openwrt_wireless-tor.yml"
    managed_playbook: "openwrt_wireless-tor.yml"
    managed_ref: "tor_wlandev={{ tor_wlandev }} tor_wlan_ssid={{ tor_wlan_ssid }}"
    managed_resource_type: "wireless_tor"
    tor_wlandev: "radio0"
    # A WiFi SSID needs no extra package; the former OpenVPN list was a
    # copy/paste error and installed unrelated packages on every run.
    openwrt_packages: []

    uci_vars:

      # Wireless AP  (joins br-tor via network=tor)
      - { key: "wireless.wifinet0", value: "wifi-iface" }
      - { key: "wireless.wifinet0.device", value: "{{ tor_wlandev }}" }
      - { key: "wireless.wifinet0.mode", value: "ap" }
      - { key: "wireless.wifinet0.key", value: "{{ tor_wlan_key }}" }
      - { key: "wireless.wifinet0.isolate", value: "1" }
      - { key: "wireless.wifinet0.ssid", value: "{{ tor_wlan_ssid }}" }
      - { key: "wireless.wifinet0.network", value: "tor" }
      - { key: "wireless.wifinet0.encryption", value: "sae-mixed" }

  pre_tasks:
    - name: Check required parameters
      ansible.builtin.assert:
        that:
          - tor_wlan_key is defined
          - tor_wlan_ssid is defined
        fail_msg: "Missing required parameter(s). Pass them with -e <name>=<value>."
        quiet: true

  tasks:

    - name: install wireless packages
      ansible.builtin.include_tasks: packages.yml

    - name: Set UCI values (shell-safe)
      ansible.builtin.include_tasks: uci-set.yml
    - name: apply changes
      block:
        - name: commit enable and restart
          raw: "{{ item }}"
          loop:
            - "uci commit"
            - "wifi reload"
            - "/etc/init.d/firewall restart"
          when: uci_changed

    # Record this playbook's resources in /etc/symbios/managed.json.
    - name: Record managed state
      ansible.builtin.include_tasks: ../../_managed-state.yml
