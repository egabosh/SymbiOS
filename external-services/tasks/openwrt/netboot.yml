# docs:
#   name: "OpenWrt - Netboot"
#   short_description: "OpenWrt - Netboot"
#   description: "TFTP/DHCP netboot environment for PXE clients."
#   category: "Services"
#   type: OpenWrt
#   icon: "bi-hdd-network"
#   requires:
#     - playbook: "openwrt_basics.yml"
#       reason: "DHCP/DNS configuration"
#   actions:
#     __playbook__: Install/Update
#
---
- name: netboot via ipxe and netboot.xyz
  hosts: all
  gather_facts: no

  pre_tasks:
    - name: resolve LAN IPv4 for the PXE DHCP option
      ansible.builtin.include_tasks: resolve-lan-ip.yml

  vars:
    # Defaults keep the playbook runnable standalone; the WebUI passes
    # the same names as extra vars (which take precedence).
    # Keep the legacy id: it keys managed.json and saved playbook vars.
    managed_id: "openwrt_netboot.yml"
    managed_playbook: "openwrt_netboot.yml"
    managed_ref: ""
    managed_resource_type: "netboot"
    uci_vars:
      - { key: "dhcp.lan_dnsmasq.tftp_root", value: "/srv/tftp" }
      - { key: "dhcp.lan_dnsmasq.enable_tftp", value: "1" }
      - { key: "dhcp.lan.dhcp_option", value: "66,{{ resolved_lan_ip }}" }
      - { key: "dhcp.lan.dhcp_option", value: "67,netboot.xyz.efi" }
      - { key: "dhcp.lan.dhcp_option", value: "67,netboot.xyz-arm64.efi" }
      - { key: "dhcp.lan.dhcp_option", value: "67,netboot.xyz.kpxe" }

  tasks:

    - name: use local upstream dns
      raw: |
        cat << 'EOF' > /etc/scripts/netboot.sh
        #!/bin/sh
        mkdir -p /srv/tftp
        cd /srv/tftp
        wget -O netboot.xyz.efi  https://boot.netboot.xyz/ipxe/netboot.xyz.efi
        wget -O netboot.xyz.kpxe https://boot.netboot.xyz/ipxe/netboot.xyz.kpxe
        wget -O netboot.xyz-arm64.efi https://boot.netboot.xyz/ipxe/netboot.xyz-arm64.efi
        EOF
        chmod 700 /etc/scripts/netboot.sh
        [ -s /srv/tftp/netboot.xyz-arm64.efi ] || /etc/scripts/netboot.sh
        cronjob="15 4 * * *   /etc/scripts/netboot.sh"
        grep -Fq "$cronjob" /etc/crontabs/root || echo "$cronjob" >>/etc/crontabs/root
      changed_when: false

    - name: Validate UCI keys and values
      ansible.builtin.include_tasks: uci-validate.yml

    - name: set uci values if needed
      raw: |
        k={{ item.key | quote }}
        current=$(uci get "$k" 2>/dev/null || echo "NOT_SET")
        desired={{ item.value | quote }}

        #if [ "$current" != "$desired" ]
        if ! echo "$current" | grep -qF -- "$desired"
        then
          if echo "$k" | grep -q ".dhcp_option"
          then
            uci add_list "$k=$desired"
          else
            uci set "$k=$desired"
          fi
          echo "changed"
        else
          echo "unchanged"
        fi
      loop: "{{ uci_vars }}"
      register: uci_set_result
      changed_when: "not 'unchanged' in uci_set_result.stdout"


    - name: apply changes
      block:
        - name: commit enable and restart
          raw: "{{ item }}"
          loop:
            - "uci commit"
            - "/etc/init.d/dnsmasq restart"
          when: uci_set_result.changed

    # Record this playbook's resources in /etc/symbios/managed.json.
    - name: Record managed state
      ansible.builtin.include_tasks: ../../_managed-state.yml
