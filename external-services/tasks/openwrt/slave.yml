#   name: "OpenWrt - Basics (slave)"
#   short_description: "OpenWrt - Basics (slave)"
#   description: "Minimal setup for a secondary (dumb) access point: static address and default gateway."
#   category: "System"
#   type: OpenWrt
#   icon: "bi-diagram-3"
#   params:
#     - name: "ip"
#       label: "LAN IP address"
#       type: "text"
#       required: true
#     - name: "gw"
#       label: "Default gateway"
#       type: "text"
#       required: true
#     - name: "dns"
#       label: "DNS server"
#       type: "text"
#       required: true
#   requires:
#     - playbook: "openwrt_basics.yml"
#       reason: "Base system setup"
#   actions:
#     __playbook__: Install/Update
#
---
- name: basic OpenWRT config for slave - no own internet - use master
  hosts: all
  gather_facts: no

  vars:
    # Defaults keep the playbook runnable standalone; the WebUI passes
    # the same names as extra vars (which take precedence).
    managed_id: "openwrt_basics-slave.yml"
    managed_playbook: "openwrt_basics-slave.yml"
    managed_ref: "ip={{ effective_ip }} gw={{ gw }} dns={{ dns }}"
    managed_resource_type: "basics_slave"

    # The LAN address is owned by the foundation play; accept the namespaced
    # saved key as well so a target saved for the generic bundles works.
    effective_ip: "{{ ip if ip is defined and (ip | string | length) > 0 else lan_ip | default('') }}"

    uci_delete_vars:
      - 'network.wan'
      - 'network.wan6'
      - 'dhcp.wan'

    uci_vars:
      ## Basics
      - { key: "network.lan.gateway", value: "{{ gw }}" }
      - { key: "network.lan.dns", value: "{{ dns }}" }

  pre_tasks:
    - name: Check required parameters
      ansible.builtin.assert:
        that:
          - dns is defined and (dns | string | length) > 0
          - gw is defined and (gw | string | length) > 0
          - effective_ip | length > 0
        fail_msg: "Missing required parameter(s). Pass them with -e <name>=<value>."
        quiet: true

  tasks:

    - name: Set UCI values (shell-safe)
      ansible.builtin.include_tasks: uci-set.yml
    - name: apply changes
      block:
        - name: commit and reload network
          raw: "{{ item }}"
          loop:
            - "uci commit"
            - "/etc/init.d/network reload"
          when: uci_changed or uci_delete_result.changed

        # A slave access point runs no DHCP/RA server at all; run on every
        # pass so the state is guaranteed even if something started the
        # services in between.
        # OpenWrt's multi-instance init script tears named instances down
        # asynchronously after a network reload. Give procd time to settle,
        # then stop again so the first pass already leaves no resolver behind.
        - name: stop and disable dnsmasq and odhcpd
          raw: "{{ item }}"
          loop:
            - "/etc/init.d/dnsmasq stop"
            - "/etc/init.d/dnsmasq disable"
            - "/etc/init.d/odhcpd stop"
            - "/etc/init.d/odhcpd disable"
            - "sleep 5"
            - "/etc/init.d/dnsmasq stop"
            - "/etc/init.d/odhcpd stop"
          changed_when: false

    # Record this playbook's resources in /etc/symbios/managed.json.
    - name: Record managed state
      ansible.builtin.include_tasks: ../../_managed-state.yml
