# docs:
#   name: "OpenWrt - DDNS IPv6 host"
#   short_description: "OpenWrt - DDNS IPv6 host"
#   description: "deSEC DynDNS updater for a single host record."
#   category: "Network"
#   type: OpenWrt
#   icon: "bi-cloud-arrow-up"
#   params:
#     - name: "domainname"
#       label: "Domain"
#       type: "text"
#       required: true
#     - name: "localhostname"
#       label: "Local host name"
#       type: "text"
#       required: true
#     - name: "apikey"
#       label: "deSEC API key"
#       type: "password"
#       required: true
#   requires:
#     - playbook: "openwrt_basics.yml"
#       reason: "Base system setup"
#   actions:
#     __playbook__: Install/Update
#
---
- name: ddns ipv6 desec.io fpr separate host
  hosts: all
  gather_facts: no

  vars:
    # Defaults keep the playbook runnable standalone; the WebUI passes
    # the same names as extra vars (which take precedence).
    managed_id: "openwrt_ddns-ipv6-host.yml"
    managed_playbook: "openwrt_ddns-ipv6-host.yml"
    managed_ref: "domainname={{ domainname }} localhostname={{ localhostname }}"
    managed_resource_type: "ddns_ipv6_host"
    openwrt_packages:
      - ddns-scripts
      - luci-app-ddns

    uci_delete_vars:
      - ddns.myddns_ipv4
      - ddns.myddns_ipv6 

    uci_vars:

      # {{ localhostname }} ipv6
      - { key: "ddns.dedyn_ipv6_{{ localhostname }}", value: "service" }
      - { key: "ddns.dedyn_ipv6_{{ localhostname }}.service_name", value: "desec.io" }
      - { key: "ddns.dedyn_ipv6_{{ localhostname }}.use_ipv6", value: "1" }
      - { key: "ddns.dedyn_ipv6_{{ localhostname }}.enabled", value: "1" }
      - { key: "ddns.dedyn_ipv6_{{ localhostname }}.lookup_host", value: "{{ domainname }}" }
      - { key: "ddns.dedyn_ipv6_{{ localhostname }}.domain", value: "{{ domainname }}" }
      - { key: "ddns.dedyn_ipv6_{{ localhostname }}.username", value: "{{ domainname }}" }
      - { key: "ddns.dedyn_ipv6_{{ localhostname }}.password", value: "{{ apikey }}" }
      - { key: "ddns.dedyn_ipv6_{{ localhostname }}.use_https", value: "1" }
      - { key: "ddns.dedyn_ipv6_{{ localhostname }}.cacert", value: "/etc/ssl/certs" }
      - { key: "ddns.dedyn_ipv6_{{ localhostname }}.ip_source", value: "script" }
      - { key: "ddns.dedyn_ipv6_{{ localhostname }}.interface", value: "wan" }
      - { key: "ddns.dedyn_ipv6_{{ localhostname }}.use_syslog", value: "1" }
      - { key: "ddns.dedyn_ipv6_{{ localhostname }}.ip_script", value: "/etc/scripts/ddns_get_ipv6_{{ localhostname }}.sh" }

  pre_tasks:
    - name: Check required parameters
      ansible.builtin.assert:
        that:
          - apikey is defined and (apikey | string | length) > 0
          - domainname is defined and (domainname | string | length) > 0
          - localhostname is defined and (localhostname | string | length) > 0
          - localhostname is match('^[A-Za-z0-9_-]+$')
        fail_msg: "Missing or invalid parameter(s). Pass them with -e <name>=<value>."
        quiet: true

  tasks:

    - name: install ddns packages
      ansible.builtin.include_tasks: packages.yml

    - name: Set UCI values (shell-safe)
      ansible.builtin.include_tasks: uci-set.yml
      vars:
        uci_secret: true
    - name: /etc/scripts/ddns_get_ipv6_{{ localhostname }}.sh
      raw: |
        cat << 'EOF' > /etc/scripts/ddns_get_ipv6_{{ localhostname }}.sh
        #!/bin/sh
        # odhcpd lease file columns: # <iface> <duid> <iaid> <name> <expiry> <hostid> <plen> <addr1> <addr2>
        awk '$5 == "{{ localhostname }}" {print $9; exit}' /tmp/hosts/odhcpd | cut -d/ -f1
        EOF
        chmod 500 /etc/scripts/ddns_get_ipv6_{{ localhostname }}.sh
      changed_when: false

    - name: apply changes
      block:
        - name: commit enable and restart
          raw: "{{ item }}"
          loop:
            - "uci commit"
            - "/etc/init.d/ddns restart"
          when: uci_changed | default(false) | bool

    # Record this playbook's resources in /etc/symbios/managed.json.
    - name: Record managed state
      ansible.builtin.include_tasks: ../../_managed-state.yml
