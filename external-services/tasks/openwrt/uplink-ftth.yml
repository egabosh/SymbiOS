# docs:
#   name: "OpenWrt - Telekom FTTH"
#   short_description: "OpenWrt - Telekom FTTH"
#   description: "PPPoE WAN configuration for a Telekom FTTH line (VLAN 7)."
#   category: "Network"
#   type: OpenWrt
#   icon: "bi-ethernet"
#   params:
#     - name: "pppoe_user"
#       label: "PPPoE user"
#       type: "text"
#       required: true
#     - name: "pppoe_pw"
#       label: "PPPoE password"
#       type: "password"
#       required: true
#   requires:
#     - playbook: "openwrt_master.yml"
#       reason: "Base system setup"
#   actions:
#     __playbook__: Install/Update
#
---
- name: Configure Telekom FTTH PPPoE with VLAN 7
  hosts: all
  gather_facts: no

  vars:
    # Keep the legacy id: it keys managed.json and saved playbook vars.
    managed_id: "openwrt_internet_telekom_ftth.yml"
    managed_playbook: "openwrt_internet_telekom_ftth.yml"
    managed_ref: "pppoe_user={{ pppoe_user }}"
    managed_resource_type: "internet_telekom_ftth"

    wan_uci_vars:
      # VLAN 7 over the physical FTTH WAN port.
      - { key: "network.wan_7", value: "device" }
      - { key: "network.wan_7.type", value: "8021q" }
      - { key: "network.wan_7.ifname", value: "wan" }
      - { key: "network.wan_7.vid", value: "7" }
      - { key: "network.wan_7.name", value: "wan.7" }

      # PPPoE on VLAN 7.
      - { key: "network.wan", value: "interface" }
      - { key: "network.wan.proto", value: "pppoe" }
      - { key: "network.wan.device", value: "wan.7" }
      - { key: "network.wan.username", value: "{{ pppoe_user }}" }
      - { key: "network.wan.password", value: "{{ pppoe_pw }}" }
      - { key: "network.wan.ipv6", value: "auto" }
      - { key: "network.wan.peerdns", value: "1" }

      # Management address of the FTTH modem.
      - { key: "network.wan_mgmt", value: "interface" }
      - { key: "network.wan_mgmt.proto", value: "static" }
      - { key: "network.wan_mgmt.device", value: "wan" }
      - { key: "network.wan_mgmt.ipaddr", value: "192.168.100.220" }
      - { key: "network.wan_mgmt.netmask", value: "255.255.255.0" }
      - { key: "network.wan_mgmt.defaultroute", value: "0" }
      - { key: "network.wan_mgmt.peerdns", value: "0" }

  pre_tasks:
    - name: Check required parameters
      ansible.builtin.assert:
        that:
          - pppoe_pw is defined and (pppoe_pw | string | length) > 0
          - pppoe_user is defined and (pppoe_user | string | length) > 0
        fail_msg: "Missing required parameter(s). Pass them with -e <name>=<value>."
        quiet: true

  tasks:
    - name: Configure Telekom FTTH WAN
      ansible.builtin.include_tasks: wan-pppoe.yml

    # Record this playbook's resources in /etc/symbios/managed.json.
    - name: Record managed state
      ansible.builtin.include_tasks: ../../_managed-state.yml
