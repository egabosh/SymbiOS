# docs:
#   name: "OpenWrt - DDNS IPv4"
#   short_description: "OpenWrt - DDNS IPv4"
#   description: "deSEC DynDNS updater for the IPv4 address."
#   category: "Network"
#   type: OpenWrt
#   icon: "bi-cloud-arrow-up"
#   params:
#     - name: "domainname"
#       label: "Domain"
#       type: "text"
#       required: true
#     - name: "localhostname"
#       label: "Local host name"
#       type: "text"
#       required: true
#     - name: "apikey"
#       label: "deSEC API key"
#       type: "password"
#       required: true
#   requires:
#     - playbook: "openwrt_basics.yml"
#       reason: "Base system setup"
#   actions:
#     __playbook__: Install/Update
#
---
- name: ddns ipv4 desec.io
  hosts: all
  gather_facts: no

  vars:
    # Defaults keep the playbook runnable standalone; the WebUI passes
    # the same names as extra vars (which take precedence).
    managed_id: "openwrt_ddns-ipv4.yml"
    managed_playbook: "openwrt_ddns-ipv4.yml"
    managed_ref: "domainname={{ domainname }} localhostname={{ localhostname }}"
    managed_resource_type: "ddns_ipv4"
    openwrt_packages:
      - ddns-scripts
      - luci-app-ddns

    uci_delete_vars:
      - ddns.myddns_ipv4
      - ddns.myddns_ipv6 

    uci_vars:
      - { key: "ddns.dedyn_ipv4_{{ localhostname }}", value: "service" }
      - { key: "ddns.dedyn_ipv4_{{ localhostname }}.service_name", value: "desec.io" }
      - { key: "ddns.dedyn_ipv4_{{ localhostname }}.use_ipv6", value: "0" }
      - { key: "ddns.dedyn_ipv4_{{ localhostname }}.enabled", value: "1" }
      - { key: "ddns.dedyn_ipv4_{{ localhostname }}.lookup_host", value: "{{ domainname }}" }
      - { key: "ddns.dedyn_ipv4_{{ localhostname }}.domain", value: "{{ domainname }}" }
      - { key: "ddns.dedyn_ipv4_{{ localhostname }}.username", value: "{{ domainname }}" }
      - { key: "ddns.dedyn_ipv4_{{ localhostname }}.password", value: "{{ apikey }}" }
      - { key: "ddns.dedyn_ipv4_{{ localhostname }}.use_https", value: "1" }
      - { key: "ddns.dedyn_ipv4_{{ localhostname }}.cacert", value: "/etc/ssl/certs" }
      - { key: "ddns.dedyn_ipv4_{{ localhostname }}.ip_source", value: "web" }
      - { key: "ddns.dedyn_ipv4_{{ localhostname }}.interface", value: "wan" }
      - { key: "ddns.dedyn_ipv4_{{ localhostname }}.use_syslog", value: "1" }
      - { key: "ddns.dedyn_ipv4_{{ localhostname }}.dns_server", value: "45.54.76.1" }
      - { key: "ddns.dedyn_ipv4_{{ localhostname }}.ip_url", value: "https://checkipv4.dedyn.io" }

  pre_tasks:
    - name: Check required parameters
      ansible.builtin.assert:
        that:
          - apikey is defined
          - domainname is defined
          - localhostname is defined
        fail_msg: "Missing required parameter(s). Pass them with -e <name>=<value>."
        quiet: true

  tasks:

    - name: update opkg db
      raw: opkg update
      changed_when: false
  
    - name: check installed packages
      raw: opkg list-installed
      register: installed_packages
      changed_when: false

    - name: install packages if needed
      raw: opkg install {{ item }}
      loop: "{{ openwrt_packages }}"
      when: item not in installed_packages.stdout

    - name: detele config defaults
      raw: |
        # detele default config indices
        while uci show | grep -q "^{{ item }}="
        do
          echo "{{ item }}" >/tmp/x
          echo "changed"
          uci delete {{ item }}[0]
          uci delete {{ item }}
        done
      loop: "{{ uci_delete_vars }}"
      register: uci_delete_result
      changed_when: "'changed' in uci_delete_result.stdout"

    - name: set uci values if needed
      raw: |
        current=$(uci get {{ item.key }} 2>/dev/null || echo "NOT_SET")
        desired="{{ item.value }}"
        if [ "$current" != "$desired" ]
        then
          uci set {{ item.key }}="{{ item.value }}"
          echo "changed"
        else
          echo "unchanged"
        fi
      loop: "{{ uci_vars }}"
      register: uci_set_result
      changed_when: "not 'unchanged' in uci_set_result.stdout"

    - name: apply changes
      block:
        - name: commit enable and restart
          raw: "{{ item }}"
          loop:
            - "uci commit"
            - "/etc/init.d/ddns restart"
          when: uci_set_result.changed

    # Record this playbook's resources in /etc/symbios/managed.json.
    - name: Record managed state
      ansible.builtin.include_tasks: _managed-state.yml
