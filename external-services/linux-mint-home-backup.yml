# docs:
#   name: "Linux Mint - Home Backup"
#   short_description: "Install the manual restic home backup client"
#   description: >
#     Installs a root-only script on Linux Mint systems that backs up the
#     interactive users' homes with restic over SFTP (port 28) into the private
#     directory of a dedicated LDAP backup user on the SymbiOS host. The script
#     is run by the user, never by a cron job; the central restic snapshot picks
#     the repository up with /symbios.
#   category: linux-mint
#   type: linux-mint
#   icon: "bi-house-door"
#   params:
#     - name: "symbios_host"
#       label: "SymbiOS host"
#       type: "text"
#       required: true
#       placeholder: "172.23.0.222"
#     - name: "restic_password"
#       label: "Restic repository password"
#       type: "password"
#       required: true
#   healthcheck:
#     command: exit 0
# ---
# The SymbiOS host must first create the matching LDAP user and authorize this
# machine's public key in <config>/services/sftp-share/backup-clients.yml by
# running services/sftp-share.yml. See playbooks.md ("Home backup of Linux Mint
# systems").
- name: Install Linux Mint home backup client
  hosts: all
  gather_facts: no

  vars:
    # Defaults keep the playbook runnable standalone; WebUI params win.
    symbios_port: "28"
    backup_id: "{{ inventory_hostname }}"
    backup_user: "backup-{{ backup_id }}"
    restic_repo: "sftp:symbios-backup-{{ backup_id }}:/home/{{ backup_user }}/restic"
    config_path: "/etc/symbios/home-backup.conf"
    script_path: "/usr/local/sbin/mint-home-backup.sh"
    ssh_key_path: "/etc/symbios/home-backup/id_ed25519"
    restic_password_file: "/etc/symbios/home-backup/restic-password"
    ssh_config_path: "/etc/ssh/ssh_config.d/99-symbios-backup-{{ backup_id }}.conf"
    retention: 7
    managed_id: "linux-mint-home-backup.yml"
    managed_playbook: "linux-mint-home-backup.yml"
    managed_resource_type: "mint_home_backup"
    managed_ref: "target={{ restic_repo }} users=interactive"
    managed_remove_ids: []

  pre_tasks:
    - name: Check required parameters
      ansible.builtin.assert:
        that:
          - symbios_host is defined and (symbios_host | string | trim | length > 0)
          - symbios_host is match('^[A-Za-z0-9][A-Za-z0-9._:-]*$')
          - restic_password is defined and (restic_password | string | length >= 10)
          - backup_id is match('^[A-Za-z0-9][A-Za-z0-9_-]*$')
        fail_msg: "symbios_host, a restic password of at least 10 characters and a valid target id are required."
        quiet: true

  tasks:
    - name: Install restic and the SSH client
      ansible.builtin.package:
        name:
          - restic
          - openssh-client
        state: present

    - name: Create backup config directory
      ansible.builtin.file:
        path: /etc/symbios/home-backup
        state: directory
        owner: root
        group: root
        mode: '0700'

    - name: Check for an existing backup SSH key
      ansible.builtin.stat:
        path: "{{ ssh_key_path }}"
      register: backup_key_stat

    # Never regenerate: the public half is authorized on the SymbiOS host.
    - name: Generate a dedicated backup SSH key
      ansible.builtin.command:
        cmd: >-
          ssh-keygen -q -t ed25519 -N '' -C "{{ backup_user }}"
          -f {{ ssh_key_path }}
      when: not backup_key_stat.stat.exists
      register: keygen_result
      changed_when: true
      failed_when: keygen_result.rc != 0

    - name: Write the restic repository password
      ansible.builtin.copy:
        dest: "{{ restic_password_file }}"
        owner: root
        group: root
        mode: '0600'
        backup: no
        content: "{{ restic_password }}\n"
      no_log: true

    - name: Configure the SFTP alias for this backup user
      ansible.builtin.copy:
        dest: "{{ ssh_config_path }}"
        owner: root
        group: root
        mode: '0644'
        content: |
          # Managed by SymbiOS - external-services/linux-mint-home-backup.yml
          Host symbios-backup-{{ backup_id }}
              HostName {{ symbios_host }}
              User {{ backup_user }}
              Port {{ symbios_port }}
              IdentityFile {{ ssh_key_path }}
              IdentitiesOnly yes
              BatchMode yes
              StrictHostKeyChecking accept-new
              ServerAliveInterval 60
              ServerAliveCountMax 240

    - name: Install the backup client script
      ansible.builtin.copy:
        src: "{{ playbook_dir }}/../scripts/mint-home-backup.sh"
        dest: "{{ script_path }}"
        owner: root
        group: root
        mode: '0755'

    - name: Write the backup client configuration
      ansible.builtin.copy:
        dest: "{{ config_path }}"
        owner: root
        group: root
        mode: '0600'
        backup: yes
        content: |
          # Managed by SymbiOS - external-services/linux-mint-home-backup.yml
          SYMBIOS_HOST="{{ symbios_host | string | trim }}"
          BACKUP_ID="{{ backup_id }}"
          BACKUP_USER="{{ backup_user }}"
          RESTIC_REPO="{{ restic_repo }}"
          RESTIC_PASSWORD_FILE="{{ restic_password_file }}"
          RETENTION="{{ retention }}"

    - name: Read the generated public key
      ansible.builtin.slurp:
        src: "{{ ssh_key_path }}.pub"
      register: backup_pubkey

    - name: Show the key to authorize on the SymbiOS host
      ansible.builtin.debug:
        msg: |
          Add this key to <config>/services/sftp-share/backup-clients.yml on the
          SymbiOS host under the id "{{ backup_id }}", then run
          services/sftp-share.yml before the first backup:
          {{ backup_pubkey.content | b64decode | trim }}

    - name: Record managed state
      ansible.builtin.include_tasks: _managed-state.yml
