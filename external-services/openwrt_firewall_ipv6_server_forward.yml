---
- name: Allow acces to server via ipv6
  hosts: all
  gather_facts: no

  vars:
    # Defaults keep the playbook runnable standalone; the WebUI passes
    # the same names as extra vars (which take precedence).
    state: "present"
    managed_id: "openwrt_firewall_ipv6_server_forward.yml/{{ redirect_name }}"
    managed_playbook: "openwrt_firewall_ipv6_server_forward.yml"
    managed_ref: "redirect_name={{ redirect_name }} proto={{ proto | default('tcp') }} ports={{ ports | default('') }} suffix={{ suffix | default('') }}"
    managed_resource_type: "firewall_ipv6_server_forward"
    managed_remove_ids: []
    proto: "tcp"
    uci_vars:

      # ipv6 access from the internet forward
      - { key: "firewall.rule_{{ redirect_name }}_ipv6_access",     value: "rule" }
      - { key: "firewall.rule_{{ redirect_name }}_ipv6_access.family",   value: "ipv6" }
      - { key: "firewall.rule_{{ redirect_name }}_ipv6_access.proto",    value: "{{ proto }}" }
      - { key: "firewall.rule_{{ redirect_name }}_ipv6_access.src",      value: "wan" }
      - { key: "firewall.rule_{{ redirect_name }}_ipv6_access.dest",     value: "lan" }
      - { key: "firewall.rule_{{ redirect_name }}_ipv6_access.target",   value: "ACCEPT" }
      - { key: "firewall.rule_{{ redirect_name }}_ipv6_access.dest_port",value: "{{ ports }}" }
      - { key: "firewall.rule_{{ redirect_name }}_ipv6_access.name",     value: "ansible_{{ redirect_name }}_ipv6_access" }
      - { key: "firewall.rule_{{ redirect_name }}_ipv6_access.dest_ip",  value: "{{ suffix }}" }

  pre_tasks:
    - name: Check required parameters
      ansible.builtin.assert:
        that:
          - state in ['present', 'absent']
          - redirect_name is defined and (redirect_name | string | length > 0)
          - state == 'absent' or (ports is defined and suffix is defined)
          # The name is embedded in shell commands on the target.
          - redirect_name is match('^[A-Za-z0-9._-]+$')
        fail_msg: "state must be present or absent; redirect_name is required, ports/suffix only for state=present."
        quiet: true

  tasks:
    # --- absent: remove the rule --------------------------------------------
    - name: Remove the IPv6 server forwarding
      when: state == 'absent'
      block:
        - name: Delete the rule section
          ansible.builtin.raw: |
            if uci -q show "firewall.rule_{{ redirect_name }}_ipv6_access" > /dev/null 2>&1
            then
              uci delete "firewall.rule_{{ redirect_name }}_ipv6_access"
              uci commit firewall
              echo changed
            else
              echo unchanged
            fi
          register: delete_result
          changed_when: "delete_result.stdout | trim == 'changed'"

        - name: Reload the firewall
          ansible.builtin.raw: /etc/init.d/firewall reload
          when: delete_result is changed

        # A removal must not leave a stale entry in managed.json.
        - name: Record managed state
          ansible.builtin.include_tasks: _managed-state.yml
          vars:
            managed_id: ""
            managed_remove_ids:
              - "openwrt_firewall_ipv6_server_forward.yml/{{ redirect_name }}"

    # --- present: create or update the rule ---------------------------------
    - name: Configure the IPv6 server forwarding
      when: state != 'absent'
      block:
        - name: Set the uci values if needed
          ansible.builtin.raw: |
            current=$(uci get {{ item.key }} 2>/dev/null || echo "NOT_SET")
            desired="{{ item.value }}"

            # Single-valued options: compare exactly, a substring match would
            # hide drift (e.g. a stored value with a doubled trailing dot).
            if [ "$current" != "$desired" ]
            then
              uci set {{ item.key }}="{{ item.value }}"
              echo "changed"
            else
              echo "unchanged"
            fi
          loop: "{{ uci_vars }}"
          register: uci_set_result
          # A changed_when sees no register of its own loop, so the loop is
          # neutral and the aggregate decides whether a reload is needed.
          changed_when: false

        - name: Remember whether any uci value changed
          ansible.builtin.set_fact:
            uci_changed: "{{ uci_set_result.results | map(attribute='stdout') | map('trim') | select('equalto', 'changed') | list | length > 0 }}"

        - name: Apply the changes
          ansible.builtin.raw: "{{ item }}"
          loop:
            - "uci commit"
            - "/etc/init.d/firewall reload"
          when: uci_changed | default(false) | bool

        # Record this playbook's resources in /etc/symbios/managed.json.
        - name: Record managed state
          ansible.builtin.include_tasks: _managed-state.yml
