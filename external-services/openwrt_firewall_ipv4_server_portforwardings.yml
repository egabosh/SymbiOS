# docs:
#   name: "OpenWrt - IPv4 port forwarding"
#   short_description: "OpenWrt - IPv4 port forwarding"
#   description: "DNAT a WAN port to an internal host."
#   category: "Security"
#   type: OpenWrt
#   icon: "bi-signpost-split"
#   params:
#     - name: "redirect_name"
#       label: "Redirect name"
#       type: "text"
#       required: true
#     - name: "proto"
#       label: "Protocol"
#       type: "text"
#       default: "tcp"
#     - name: "from_port"
#       label: "External port"
#       type: "text"
#       required: true
#     - name: "to_port"
#       label: "Internal port"
#       type: "text"
#       required: true
#     - name: "target"
#       label: "Internal host"
#       type: "text"
#       required: true
#   requires:
#     - playbook: "openwrt_basics.yml"
#       reason: "Firewall zones"
#   actions:
#     __playbook__: Install/Update
#
---
- name: 
  hosts: all
  gather_facts: no

  vars:
    # Defaults keep the playbook runnable standalone; the WebUI passes
    # the same names as extra vars (which take precedence).
    managed_id: "openwrt_firewall_ipv4_server_portforwardings.yml/{{ redirect_name }}"
    managed_playbook: "openwrt_firewall_ipv4_server_portforwardings.yml"
    managed_ref: "redirect_name={{ redirect_name }} proto={{ proto }} from_port={{ from_port }} to_port={{ to_port }} target={{ target }}"
    managed_resource_type: "firewall_ipv4_server_portforwardings"
    proto: "tcp"
    uci_vars:
      ## redirects / portforwarding
      # ssh
      - { key: "firewall.redirect_{{ redirect_name }}",        value: "redirect" }
      - { key: "firewall.redirect_{{ redirect_name }}.target",      value: "DNAT" }
      - { key: "firewall.redirect_{{ redirect_name }}.name",        value: "ansible_{{ redirect_name }}" }
      - { key: "firewall.redirect_{{ redirect_name }}.proto",       value: "{{ proto }}" }
      - { key: "firewall.redirect_{{ redirect_name }}.src",         value: "wan" }
      - { key: "firewall.redirect_{{ redirect_name }}.dest",        value: "lan" }
      - { key: "firewall.redirect_{{ redirect_name }}.src_dport",   value: "{{ from_port}}" }
      - { key: "firewall.redirect_{{ redirect_name }}.dest_ip",     value: "{{ target }}" }
      - { key: "firewall.redirect_{{ redirect_name }}.dest_port",   value: "{{ to_port }}" }

  pre_tasks:
    - name: Check required parameters
      ansible.builtin.assert:
        that:
          - from_port is defined
          - redirect_name is defined
          - target is defined
          - to_port is defined
        fail_msg: "Missing required parameter(s). Pass them with -e <name>=<value>."
        quiet: true

  tasks:

    - name: set uci values if needed
      raw: |
        current=$(uci get {{ item.key }} 2>/dev/null || echo "NOT_SET")
        desired="{{ item.value }}"
        
        if [ "$current" != "$desired" ]
        then
          uci set {{ item.key }}="{{ item.value }}"
          echo "changed"
        else
          echo "unchanged"
        fi
      loop: "{{ uci_vars }}"
      register: uci_set_result
      changed_when: "not 'unchanged' in uci_set_result.stdout"

    - name: apply changes
      block:
        - name: commit enable and restart
          raw: "{{ item }}"
          loop:
            - "uci commit"
            - "/etc/init.d/firewall reload"
          when: uci_set_result.changed

    # Record this playbook's resources in /etc/symbios/managed.json.
    - name: Record managed state
      ansible.builtin.include_tasks: _managed-state.yml
