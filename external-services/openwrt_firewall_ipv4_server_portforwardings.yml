---
- name: ipv4 port forwardings
  hosts: all
  gather_facts: no

  vars:
    # Defaults keep the playbook runnable standalone; the WebUI passes
    # the same names as extra vars (which take precedence).
    state: "present"
    managed_id: "openwrt_firewall_ipv4_server_portforwardings.yml/{{ redirect_name }}"
    managed_playbook: "openwrt_firewall_ipv4_server_portforwardings.yml"
    managed_ref: "redirect_name={{ redirect_name }} proto={{ proto | default('tcp') }} from_port={{ from_port | default('') }} to_port={{ to_port | default('') }} target={{ target | default('') }}"
    managed_resource_type: "firewall_ipv4_server_portforwardings"
    managed_remove_ids: []
    proto: "tcp"
    uci_vars:
      ## redirects / portforwarding
      # ssh
      - { key: "firewall.redirect_{{ redirect_name }}",        value: "redirect" }
      - { key: "firewall.redirect_{{ redirect_name }}.target",      value: "DNAT" }
      - { key: "firewall.redirect_{{ redirect_name }}.name",        value: "ansible_{{ redirect_name }}" }
      - { key: "firewall.redirect_{{ redirect_name }}.proto",       value: "{{ proto }}" }
      - { key: "firewall.redirect_{{ redirect_name }}.src",         value: "wan" }
      - { key: "firewall.redirect_{{ redirect_name }}.dest",        value: "lan" }
      - { key: "firewall.redirect_{{ redirect_name }}.src_dport",   value: "{{ from_port}}" }
      - { key: "firewall.redirect_{{ redirect_name }}.dest_ip",     value: "{{ target }}" }
      - { key: "firewall.redirect_{{ redirect_name }}.dest_port",   value: "{{ to_port }}" }

  pre_tasks:
    - name: Check required parameters
      ansible.builtin.assert:
        that:
          - state in ['present', 'absent']
          - redirect_name is defined and (redirect_name | string | length > 0)
          - state == 'absent' or (from_port is defined and to_port is defined and target is defined)
          # The name is embedded in shell commands on the target.
          - redirect_name is match('^[A-Za-z0-9._-]+$')
        fail_msg: "state must be present or absent; redirect_name is required, from_port/to_port/target only for state=present."
        quiet: true

  tasks:
    # --- absent: remove the redirect ----------------------------------------
    - name: Remove the IPv4 port forwarding
      when: state == 'absent'
      block:
        - name: Delete the redirect section
          ansible.builtin.raw: |
            if uci -q show "firewall.redirect_{{ redirect_name }}" > /dev/null 2>&1
            then
              uci delete "firewall.redirect_{{ redirect_name }}"
              uci commit firewall
              echo changed
            else
              echo unchanged
            fi
          register: delete_result
          changed_when: "delete_result.stdout | trim == 'changed'"

        - name: Reload the firewall
          ansible.builtin.raw: /etc/init.d/firewall reload
          when: delete_result is changed

        # A removal must not leave a stale entry in managed.json.
        - name: Record managed state
          ansible.builtin.include_tasks: _managed-state.yml
          vars:
            managed_id: ""
            managed_remove_ids:
              - "openwrt_firewall_ipv4_server_portforwardings.yml/{{ redirect_name }}"

    # --- present: create or update the redirect -----------------------------
    - name: Configure the IPv4 port forwarding
      when: state != 'absent'
      block:
        - name: Set the uci values if needed
          ansible.builtin.raw: |
            current=$(uci get {{ item.key }} 2>/dev/null || echo "NOT_SET")
            desired="{{ item.value }}"

            # Single-valued options: compare exactly, a substring match would
            # hide drift (e.g. a stored value with a doubled trailing dot).
            if [ "$current" != "$desired" ]
            then
              uci set {{ item.key }}="{{ item.value }}"
              echo "changed"
            else
              echo "unchanged"
            fi
          loop: "{{ uci_vars }}"
          register: uci_set_result
          # A changed_when sees no register of its own loop, so the loop is
          # neutral and the aggregate decides whether a reload is needed.
          changed_when: false

        - name: Remember whether any uci value changed
          ansible.builtin.set_fact:
            uci_changed: "{{ uci_set_result.results | map(attribute='stdout') | map('trim') | select('equalto', 'changed') | list | length > 0 }}"

        - name: Apply the changes
          ansible.builtin.raw: "{{ item }}"
          loop:
            - "uci commit"
            - "/etc/init.d/firewall reload"
          when: uci_changed | default(false) | bool

        # Record this playbook's resources in /etc/symbios/managed.json.
        - name: Record managed state
          ansible.builtin.include_tasks: _managed-state.yml
