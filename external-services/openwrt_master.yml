---
# The component plays stay under tasks/openwrt/ so the catalog stays flat.
# Importing whole plays keeps their guards, managed-state ids and service
# reload behavior identical to running the former standalone playbooks.
- ansible.builtin.import_playbook: tasks/openwrt/basics.yml
- ansible.builtin.import_playbook: tasks/openwrt/iot.yml
- ansible.builtin.import_playbook: tasks/openwrt/tor.yml
- ansible.builtin.import_playbook: tasks/openwrt/logserver.yml
- ansible.builtin.import_playbook: tasks/openwrt/autoupdate.yml

# Optional system services. Static imports keep the component's own guards,
# managed ids and saved-variable scope. Selection is a trimmed, comma separated
# list so a skipped service never evaluates its required-parameter asserts.
- ansible.builtin.import_playbook: tasks/openwrt/asterisk.yml
  when: "'asterisk' in (services | default('') | split(',') | map('trim') | list)"
- ansible.builtin.import_playbook: tasks/openwrt/smtp.yml
  when: "'smtp' in (services | default('') | split(',') | map('trim') | list)"
- ansible.builtin.import_playbook: tasks/openwrt/netboot.yml
  when: "'netboot' in (services | default('') | split(',') | map('trim') | list)"
- ansible.builtin.import_playbook: tasks/openwrt/dnscrypt-proxy.yml
  when: "'dnscrypt' in (services | default('') | split(',') | map('trim') | list)"
- ansible.builtin.import_playbook: tasks/openwrt/openvpn-lan.yml
  when: "'openvpn-lan' in (services | default('') | split(',') | map('trim') | list)"
- ansible.builtin.import_playbook: tasks/openwrt/openvpn-iot.yml
  when: "'openvpn-iot' in (services | default('') | split(',') | map('trim') | list)"
- ansible.builtin.import_playbook: tasks/openwrt/openvpn-iot-roam-watchdog.yml
  when: "'openvpn-iot' in (services | default('') | split(',') | map('trim') | list)"
- ansible.builtin.import_playbook: tasks/openwrt/openvpn-tor.yml
  when: "'openvpn-tor' in (services | default('') | split(',') | map('trim') | list)"
- ansible.builtin.import_playbook: tasks/openwrt/wireguard-lan.yml
  when: "'wireguard-lan' in (services | default('') | split(',') | map('trim') | list)"
- ansible.builtin.import_playbook: tasks/openwrt/wireguard-tor.yml
  when: "'wireguard-tor' in (services | default('') | split(',') | map('trim') | list)"
- ansible.builtin.import_playbook: tasks/openwrt/uplink-ftth.yml
  when: "'uplink-ftth' in (services | default('') | split(',') | map('trim') | list)"
- ansible.builtin.import_playbook: tasks/openwrt/uplink-vdsl.yml
  when: "'uplink-vdsl' in (services | default('') | split(',') | map('trim') | list)"
- ansible.builtin.import_playbook: tasks/openwrt/fritzbox-ipv6.yml
  when: "'fritzbox' in (services | default('') | split(',') | map('trim') | list)"
