---
- ansible.builtin.import_playbook: tasks/openwrt/firewall-allow-internet.yml
  when: profile | default('internet') == 'internet'
- ansible.builtin.import_playbook: tasks/openwrt/firewall-allow-to-lan.yml
  when: profile | default('internet') == 'lan'
- ansible.builtin.import_playbook: tasks/openwrt/firewall-allow-to-iot.yml
  when: profile | default('internet') == 'iot'
- ansible.builtin.import_playbook: tasks/openwrt/firewall-allow-to-tor.yml
  when: profile | default('internet') == 'tor'
