---
- name: wireguard client for br-tor
  hosts: all
  gather_facts: no

  vars:
    # Defaults keep the playbook runnable standalone; the WebUI passes
    # the same names as extra vars (which take precedence).
    state: "present"
    client_num: ""
    # client_num is an extra var (highest precedence), so the resolved number
    # needs its own variable - a set_fact can never override extra vars.
    client_num_resolved: ""
    managed_id: "openwrt_wireguard-tor-client.yml/{{ client_name }}"
    managed_playbook: "openwrt_wireguard-tor-client.yml"
    managed_ref: "client_name={{ client_name }} client_num={{ client_num_resolved }}"
    managed_resource_type: "wireguard_tor_client"
    managed_remove_ids: []

    uci_vars:
      - { key: "network.wg_tor_{{ client_name }}", value: "wireguard_wg_tor" }
      - { key: "network.wg_tor_{{ client_name }}.allowed_ips", value: "fdaa:a192:b168:cd45::{{ client_num_resolved }}/128" }
      - { key: "network.wg_tor_{{ client_name }}.allowed_ips", value: "192.168.45.{{ client_num_resolved }}/32" }
      - { key: "network.wg_tor_{{ client_name }}.persistent_keepalive", value: "15" }
      - { key: "network.wg_tor_{{ client_name }}.description", value: "wg_tor_{{ client_name | replace('_', '-') }}" }
      - { key: "network.wg_tor_{{ client_name }}.route_allowed_ips", value: "1" }
      - { key: "network.wg_tor_{{ client_name }}.endpoint_host", value: "{{ ddns_domain.stdout | trim }}" }
      - { key: "network.wg_tor_{{ client_name }}.endpoint_port", value: "59667" }
      # dns record
      - { key: "dhcp.host_{{ client_name }}", value: "domain" }
      - { key: "dhcp.host_{{ client_name }}.ip",   value: "192.168.45.{{ client_num_resolved }}" }
      - { key: "dhcp.host_{{ client_name }}.ip6",  value: "fdaa:a192:b168:cd45::{{ client_num_resolved }}" }
      - { key: "dhcp.host_{{ client_name }}.name", value: "wgtor-{{ client_name | replace('_', '-') }}.tor" }

  pre_tasks:
    - name: Check required parameters
      ansible.builtin.assert:
        that:
          - client_name is defined
          - client_name is match('^[A-Za-z0-9_]+$')
          - state in ['present', 'absent']
        fail_msg: "client_name is required and must match ^[A-Za-z0-9_]+$ (letters, digits, underscore)."
        quiet: true

    # The section name goes into shell commands unquoted, so a name with
    # other characters must never reach the target.
    - name: Read the segment addresses already in use
      ansible.builtin.raw: |
        name="{{ client_name }}"
        want="{{ client_num }}"
        used=$( {
          uci -q show network 2>/dev/null | grep -E '^network\.wg_tor_[^.=]+\.allowed_ips=' | grep -oE '192\.168\.45\.[0-9]+/32'
          uci -q show dhcp 2>/dev/null | grep -E '^dhcp\.host_[^.=]+\.ip=' | grep -oE '192\.168\.45\.[0-9]+'
        } | sed -E 's#^192\.168\.45\.##; s#/32$##' | sort -n -u )
        # A client that already exists keeps its address: a re-run with an
        # empty number must not move it to the next free one.
        own=$(uci -q get "network.wg_tor_$name.allowed_ips" 2>/dev/null \
          | tr ' ' '\n' | grep -oE '^192\.168\.45\.[0-9]+/32$' | head -1 \
          | sed -E 's#^192\.168\.45\.##; s#/32$##')
        last=$(printf '%s\n' "$used" | grep -E '^[0-9]+$' | tail -1)
        if [ -n "$want" ]
        then
          num=$want
        elif [ -n "$own" ]
        then
          num=$own
        else
          num=$(( ${last:-1} + 1 ))
        fi
        if [ "$num" -lt 2 ] || [ "$num" -gt 254 ]
        then
          echo "ERROR: client number $num is outside the range 2-254 (used: $(printf '%s ' $used))" >&2
          exit 3
        fi
        # An explicitly given number must not belong to another peer or host;
        # the same client may of course be re-run with its own number.
        if [ -n "$want" ] && printf '%s\n' "$used" | grep -qx "$want"
        then
          if ! uci -q get "network.wg_tor_$name.allowed_ips" 2>/dev/null | grep -q "192\.168\.45\.$want/32"
          then
            echo "ERROR: 192.168.45.$want/32 is already assigned (used: $(printf '%s ' $used))" >&2
            exit 3
          fi
        fi
        echo "$num"
      register: client_num_result
      changed_when: false
      when: state != 'absent'

    - name: Read the public WireGuard endpoint domain
      ansible.builtin.raw: uci -q get ddns.dedyn_ipv6_openwrt.domain
      register: ddns_domain
      changed_when: false
      failed_when: false
      when: state != 'absent'

    - name: Require a configured public endpoint domain
      ansible.builtin.assert:
        that:
          - ddns_domain.stdout | trim | length > 0
        fail_msg: "No DDNS domain configured (ddns.dedyn_ipv6_openwrt.domain) - the WireGuard client needs a reachable endpoint."
        quiet: true
      when: state != 'absent'

    - name: Use the given or the next free client number
      ansible.builtin.set_fact:
        client_num_resolved: "{{ client_num_result.stdout | trim }}"
      when: state != 'absent'

    - name: Validate the client number
      ansible.builtin.assert:
        that:
          - client_num_resolved is match('^[0-9]+$')
          - client_num_resolved | int >= 2
          - client_num_resolved | int <= 254
        fail_msg: "client_num must be a number between 2 and 254 (leave empty for the next free number)."
        quiet: true
      when: state != 'absent'

    - name: Read the access policy of the tunnel
      ansible.builtin.raw: cat /etc/wg_tor/access.conf 2>/dev/null || true
      register: access_conf
      changed_when: false
      when: state != 'absent'

    # Without a stored policy the clients reach the LAN the router serves.
    - name: Read the LAN network of the router
      ansible.builtin.raw: |
        eval "$(ipcalc.sh "$(uci -q get network.lan.ipaddr)" "$(uci -q get network.lan.netmask)")"
        echo "$NETWORK/$PREFIX"
      register: lan_network
      changed_when: false
      when: state != 'absent'

    - name: Resolve the access policy of the tunnel
      ansible.builtin.set_fact:
        client_access_networks: >-
          {{ (access_conf.stdout | regex_findall('(?m)^allowed_networks=(.*)$') | first | default('') | replace(' ', '') | trim)
             or (lan_network.stdout | trim) }}
        client_access_internet: >-
          {{ ((access_conf.stdout | regex_findall('(?m)^internet=(.*)$') | first | default('')) | lower | trim) == 'yes' }}
      when: state != 'absent'

    - name: Build the client configuration values
      ansible.builtin.set_fact:
        # A bare IP becomes a /32; the tunnel segment itself is always routed.
        # The pattern uses [.] and the replacement a single-backslash \1:
        # Ansible hands the quoted strings to the regex engine verbatim, so
        # any further escaping (\\.) would look for a literal backslash.
        client_allowed_ips: >-
          {{ '0.0.0.0/0' if (client_access_internet | bool)
             else (['192.168.45.0/24']
                   + (client_access_networks
                      | regex_findall('[0-9]{1,3}(?:[.][0-9]{1,3}){3}(?:/[0-9]{1,2})?')
                      | map('regex_replace', '^([0-9.]+)$', '\1/32') | list))
             | join(',') }}
        # The DNS of the tor segment is only reachable with internet mode on,
        # everything else would need its own route.
        client_dns: "{{ '192.168.142.1' if (client_access_internet | bool) else '' }}"
      when: state != 'absent'

    - name: Validate the resolved client routing
      ansible.builtin.assert:
        that:
          - client_allowed_ips | length > 0
          - "'' not in (client_allowed_ips | split(','))"
        fail_msg: "No usable AllowedIPs - set the allowed networks in openwrt_wireguard-tor.yml or give the router a static LAN address."
        quiet: true
      when: state != 'absent'

  tasks:
    # --- absent: remove peer and DNS/DHCP record ----------------------------
    - name: Remove the WireGuard Tor client
      when: state == 'absent'
      block:
        - name: Delete the client sections
          ansible.builtin.raw: |
            changed=0
            for s in network.wg_tor_{{ client_name }} dhcp.host_{{ client_name }}
            do
              if uci -q show "$s" > /dev/null 2>&1
              then
                uci -q delete "$s"
                changed=1
              fi
            done
            if [ "$changed" = 1 ]
            then
              uci commit network
              uci commit dhcp
              echo changed
            else
              echo unchanged
            fi
          register: delete_result
          changed_when: "delete_result.stdout | trim == 'changed'"

        - name: Reload network and DNS
          ansible.builtin.raw: "{{ item }}"
          loop:
            - "/etc/init.d/network reload"
            - "/etc/init.d/dnsmasq reload"
            - "ifdown wg_tor 2>/dev/null || true"
            - "ifup wg_tor"
          when: delete_result is changed

        - name: Keep key material of the removed client
          ansible.builtin.debug:
            msg: "Removed client {{ client_name }}. The key files in /etc/wg_tor/{{ client_name }}_* are kept - delete them manually if the peer must not come back with the same identity."

        - name: Record managed state
          ansible.builtin.include_tasks: _managed-state.yml
          vars:
            managed_id: ""
            managed_remove_ids:
              - "openwrt_wireguard-tor-client.yml/{{ client_name }}"

    # --- present: create or update the peer ---------------------------------
    - name: Configure the WireGuard Tor client
      when: state != 'absent'
      block:
        - name: Set the uci values if needed
          ansible.builtin.raw: |
            current=$(uci get {{ item.key }} 2>/dev/null || echo "NOT_SET")
            desired="{{ item.value }}"
            if ! echo "$current" | grep -q "$desired"
            then
              if echo "{{ item.key }}" | egrep -q "\.addresses|\.allowed_ips|firewall\..+\.network"
              then
                uci add_list {{ item.key }}="{{ item.value }}"
              else
                uci set {{ item.key }}="{{ item.value }}"
              fi
              echo "changed"
            else
              echo "unchanged"
            fi
          loop: "{{ uci_vars }}"
          register: uci_set_result
          # A changed_when sees no register of its own loop, so the loop is
          # neutral and the aggregate decides whether a reload is needed.
          changed_when: false

        - name: Remember whether any uci value changed
          ansible.builtin.set_fact:
            uci_changed: "{{ uci_set_result.results | map(attribute='stdout') | map('trim') | select('equalto', 'changed') | list | length > 0 }}"

        - name: Generate the client keys if missing
          ansible.builtin.raw: |
            if ! uci -q get network.wg_tor_{{ client_name }}.private_key > /dev/null
            then
              umask 077
              mkdir -p /etc/wg_tor
              cd /etc/wg_tor || exit 1
              wg genkey | tee {{ client_name }}_privatekey | wg pubkey > {{ client_name }}_publickey
              wg genpsk > {{ client_name }}_presharedkey
              uci set network.wg_tor_{{ client_name }}.private_key="$(cat {{ client_name }}_privatekey)"
              uci set network.wg_tor_{{ client_name }}.public_key="$(cat {{ client_name }}_publickey)"
              uci set network.wg_tor_{{ client_name }}.preshared_key="$(cat {{ client_name }}_presharedkey)"
              uci commit network
              echo changed
            else
              echo unchanged
            fi
          register: key_result
          changed_when: "key_result.stdout | trim == 'changed'"

        - name: Write the client configuration file
          ansible.builtin.raw: |
            umask 077
            mkdir -p /etc/wg_tor
            server_key=$(uci -q get network.wg_tor.private_key)
            client_key=$(uci -q get network.wg_tor_{{ client_name }}.private_key)
            if [ -z "$client_key" ]
            then
              echo "ERROR: no private key for {{ client_name }} - cannot write the .conf" >&2
              exit 1
            fi
            # A .conf with the server key would hand the server identity to the
            # client: refuse instead of writing (or keeping) a broken file.
            if [ "$client_key" = "$server_key" ]
            then
              echo "ERROR: the key of {{ client_name }} equals the server key - refusing to write /etc/wg_tor/{{ client_name }}.conf (regenerate /etc/wg_tor/{{ client_name }}_privatekey and re-run)" >&2
              exit 1
            fi
            conf=/etc/wg_tor/{{ client_name }}.conf
            dns="{{ client_dns }}"
            {
              printf '%s\n' '[Interface]'
              printf 'PrivateKey = %s\n' "$client_key"
              printf 'Address = fdaa:a192:b168:cd45::{{ client_num_resolved }}/128, 192.168.45.{{ client_num_resolved }}/32\n'
              if [ -n "$dns" ]
              then
                printf 'DNS = %s\n' "$dns"
              fi
              printf 'MTU = 1450\n'
              printf '\n'
              printf '%s\n' '[Peer]'
              printf 'PublicKey = %s\n' "$(printf '%s\n' "$server_key" | wg pubkey)"
              printf 'PresharedKey = %s\n' "$(uci -q get network.wg_tor_{{ client_name }}.preshared_key)"
              printf 'AllowedIPs = %s\n' "{{ client_allowed_ips }}"
              printf 'Endpoint = {{ ddns_domain.stdout | trim }}:59667\n'
              printf 'PersistentKeepAlive = 15\n'
              # The endpoint itself must stay outside the tunnel: a configured
              # network may contain the address the endpoint resolves to, and
              # then the tunnel would route into itself. wg-quick adds the
              # routes before the hook runs, so the host route wins.
              printf 'PostUp = %s\n' 'if command -v ip >/dev/null 2>&1; then gw=$(ip route show default | head -1 | cut -d" " -f2-); if [ -n "$gw" ]; then for a in $(wg show %i endpoints | grep -oE "[0-9.]+:[0-9]+$" | cut -d: -f1); do ip route replace $a/32 $gw; done; fi; fi'
              printf 'PreDown = %s\n' 'if command -v ip >/dev/null 2>&1; then for a in $(wg show %i endpoints | grep -oE "[0-9.]+:[0-9]+$" | cut -d: -f1); do ip route del $a/32 2>/dev/null || true; done; fi'
            } > "$conf.tmp"
            if [ -f "$conf" ] && cmp -s "$conf.tmp" "$conf"
            then
              rm -f "$conf.tmp"
              echo unchanged
            else
              mv "$conf.tmp" "$conf"
              echo changed
            fi
          register: conf_result
          changed_when: "conf_result.stdout | trim == 'changed'"

        - name: Apply the changes
          ansible.builtin.raw: "{{ item }}"
          loop:
            - "uci commit"
            - "/etc/init.d/network reload"
            - "/etc/init.d/dnsmasq reload"
            - "ifdown wg_tor 2>/dev/null || true"
            - "ifup wg_tor"
          when: key_result is changed or (uci_changed | default(false) | bool)

        - name: Record managed state
          ansible.builtin.include_tasks: _managed-state.yml
