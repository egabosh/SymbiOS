# SymbiOS - accepted deviations from the CIS Debian 13 Level 1 Server subset.
#
# Every ID in this file MUST have a row with the same ID in SECURITY.md under
# "CIS Benchmark Scope and Deviations". The audit reports undocumented waivers
# so a deviation can never be accepted silently.
#
# Format: waivers:
#           "<CIS ID>": "<short reason; the full rationale lives in SECURITY.md>"

waivers:
  "3.2.1": "Docker requires IP forwarding for bridge and NAT networking."
  "5.1.10": "Key-only root access is required for management; password auth is disabled."
  "6.1.1": "State changes are logged to symbios-audit.log instead of running auditd."
  "7.2.1": "Users live in LDAP; password policy is enforced by SymbiOS, not by local aging."
