all:
  vars:
    # SymbiOS defaults
    timezone: "America/New_York"
    keyboard: "us"
    locale: "en_US.UTF-8"
    base_domain: ""
    acme_server: ""
    acme_resolver: 'letsencrypt'
    instance: "default"
    ldap_basedn: "dc=openldap,dc=local"
    # setup state - set by the WebUI guided setup (inventory.yml is the central
    # restore source after a fresh installation)
    network_type: ""          # 'home' (behind router), 'root' (own public IP) or
                              # 'airgapped' (intranet without internet access)
    twofa_enabled: false      # Authelia 2FA enforcement for LDAP users
    localization_configured: false  # true after the user saved the localization settings in the WebUI
    dns_configured: false           # true after the user saved the DNS settings in the WebUI
    # Docker network IPs (static, defined in base-services/traefik.yml)
    traefik_ip: "192.168.41.200"
    traefik_network_gateway: "192.168.41.1"
    # filesystem layout (all data lives under the /symbios data root)
    data_root: "/symbios"
    git_root: "/symbios/git/SymbiOS"
    base_services_root: "/symbios/base-services"
    services_root: "/symbios/services"
    docker_root: "/symbios/docker"
    containerd_root: "/symbios/containerd"
    backup_root: "/symbios/backups"
    # dns/ddns - dns_mode: '' (unset), 'desec' or 'self-managed'
    dns_mode: ''
    # ddns (desec.io)
    ddns_apikey: ''
    ddns_host: ''
    ddns_ipv6: ''
    # smtp client
    smtp_user: ''
    smtp_password: ''
    smtp_server: ''
    smtp_from: ''
    smtp_tls: ''
    smtp_port: ''
    # port forwarding - extra inbound UFW rules for IPv6 forwards,
    # kept in sync by the WebUI (settings → port forwarding)
    ufw_extra_inbound: []
    port_forwarding_configured: false
    # true once the static-IPv4 step is settled: either the user chose manual
    # forwarding (they handle the fixed IP in the router themselves) or a
    # FRITZ!Box static IPv4 was secured from the WebUI. Analogous to dns_configured.
    port_forwarding_static_ip_configured: false
    # how the ports are opened: '' (not decided), 'auto' (router is set up by
    # SymbiOS) or 'manual' (forwards entered in the router by hand)
    port_forwarding_method: ''
    # OpenAI-compatible AI endpoint (optional, managed by the WebUI under
    # Settings → AI). When ai_server is set, the openwebui/opencode playbooks
    # configure their OpenAI provider with it; an optional ai_apikey is only
    # written when set. Both vars are removed again when cleared in the WebUI.
    ai_server: ''
    ai_apikey: ''
    # router UPnP/TR-064 credentials (FRITZ!Box WebUI user/password).
    # Stored only in the deployed inventory.yml (see symbios-router-upnp.sh);
    # these placeholders keep the template clean for new installs.
    router_upnp_user: ''
    router_upnp_password: ''
    # WLAN Access Point (base-services/wlan-accesspoint.yml, managed by the WebUI
    # under Settings -> WLAN Access Point). ap_configured is true once the
    # hostapd config has been applied. ap_enabled stops/starts hostapd (off when
    # the AP is disabled). ap_country is the two-letter ISO country code
    # (uppercase); empty derives it from the keyboard layout var.
    ap_interface: ''
    ap_name: ''
    ap_passphrase: ''
    ap_country: ''
    ap_enabled: true
    ap_configured: false
    # Network bridge assignments (managed by the WebUI under Settings ->
    # Network Bridges). Maps physical interfaces to Linux bridges,
    # e.g. {wlan0: br-lan, eth1: br-lan}. Persisted to /etc/rc.local by
    # scripts/symbios-bridge-assign.sh so assignments survive a reboot.
    bridge_assignments: {}
    # WordPress instances (services/wordpress.yml): each entry deploys one
    # WordPress container with its own database + user on a single shared
    # MariaDB, a Traefik route (domain + optional aliases) and a healthcheck.
    # Fields:
    #   name       - short unique id (lowercase a-z0-9-, used in container names)
    #   domain     - primary hostname (Traefik router + Let's Encrypt cert)
    #   aliases    - optional list of extra hostnames routed to the instance
    #   public     - true: reachable without login; false (default): Authelia
    #                forward-auth, only LDAP group "wordpress-<name>" allowed
    #   phpmyadmin - true: additionally expose wp-phpmyadmin.<domain> (always
    #                behind Authelia, scoped to the instance's database)
    wordpress_instances: []
    # ansible defaults
    ansible_user: "root"
    ansible_python_interpreter: "/usr/bin/python3"
    # ssh/sftp backup
    backup_server_host: ''
    backup_server_port: ''
    backup_server_path: ''
    backup_server_user: ''
    # main backup (scripts/symbios-backup.sh): encrypt archives on the
    # remote target and extra exclude patterns (rsync syntax, one per item).
    # The OpenWrt VM image is a large sparse ISO that would be materialized
    # by the hardlink snapshot - exclude the VM images from the backup.
    backup_encryption: false
    backup_exclude:
      - "/services/*-vm/iso/*.img"
    # Local snapshot retention (grandfather-father-son). The data root is a
    # small SD card, so keep the tree bounded; defaults in symbios-backup-lib.sh.
    #backup_keep_daily: 7
    #backup_keep_weekly: 4
    #backup_keep_monthly: 6
    # Free-space guard: abort before the disk fills up. Defaults 3GB/15%.
    #backup_min_free_gb: 3
    #backup_min_free_percent: 15
  hosts:
    # SymbiOS server
    localhost:
      ansible_connection: local
