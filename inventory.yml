all:
  vars:
    # SymbiOS defaults
    timezone: "America/New_York"
    keyboard: "us"
    locale: "en_US.UTF-8"
    base_domain: ""
    acme_server: ""
    acme_resolver: 'letsencrypt'
    instance: "default"
    ldap_basedn: "dc=openldap,dc=local"
    # setup state — set by the WebUI guided setup (inventory.yml is the central
    # restore source after a fresh installation)
    network_type: ""          # 'home' (behind router) or 'root' (own public IP)
    twofa_enabled: false      # Authelia 2FA enforcement for LDAP users
    # filesystem layout (all data lives under the /symbios data root)
    data_root: "/symbios"
    git_root: "/symbios/git/SymbiOS"
    base_services_root: "/symbios/base-services"
    services_root: "/symbios/services"
    docker_root: "/symbios/docker"
    containerd_root: "/symbios/containerd"
    backup_root: "/symbios/backups"
    # dns/ddns — dns_mode: '' (unset), 'desec' or 'self-managed'
    dns_mode: ''
    # ddns (desec.io)
    ddns_apikey: ''
    ddns_host: ''
    ddns_ipv6: ''
    # smtp client
    smtp_user: ''
    smtp_password: ''
    smtp_server: ''
    smtp_from: ''
    smtp_tls: ''
    smtp_port: ''
    # port forwarding — extra inbound UFW rules for IPv6 forwards,
    # kept in sync by the WebUI (settings → port forwarding)
    ufw_extra_inbound: []
    port_forwarding_configured: false
    # how the ports are opened: '' (not decided), 'auto' (router is set up by
    # SymbiOS) or 'manual' (forwards entered in the router by hand)
    port_forwarding_method: ''
    # router UPnP/TR-064 credentials (FRITZ!Box WebUI user/password).
    # Stored only in the deployed inventory.yml (see symbios-router-upnp.sh);
    # these placeholders keep the template clean for new installs.
    router_upnp_user: ''
    router_upnp_password: ''
    # ansible defaults
    ansible_user: "root"
    ansible_python_interpreter: "/usr/bin/python3"
    # ssh/sftp backup
    backup_server_host: ''
    backup_server_port: ''
    backup_server_path: ''
    backup_server_user: ''
  hosts:
    # SymbiOS server
    localhost:
      ansible_connection: local
