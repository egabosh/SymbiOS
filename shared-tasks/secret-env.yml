# Bind generated env files to the central secret store. Include after the
# tasks that create the files, so a first run bootstraps the store from the
# generated values and every later run regenerates the file from the store.
#
# Required vars:
#   secret_env_files - list of {path: <absolute env file>, prefix: <store prefix>}
# Optional vars:
#   secret_env_notify - handler name(s) to run after an env file changed, so a
#                       rotated secret reaches running containers. Empty by
#                       default for callers without a compose stack.
#
# The env file stays plaintext (Docker Compose env_file: needs it) but becomes
# a derived artifact. symbios-secret.sh export-env is idempotent: an unchanged
# file is not rewritten, so containers do not restart on every playbook run.

- name: Read generated env files before binding them to the store
  ansible.builtin.slurp:
    src: "{{ item.path }}"
  register: f_secret_env_state
  loop: "{{ secret_env_files }}"
  loop_control:
    label: "{{ item.path }}"
  changed_when: false
  failed_when: false
  no_log: true

- name: Bootstrap the store from an env file that is not bound yet
  ansible.builtin.command:
    argv:
      - "{{ git_root }}/scripts/symbios-secret.sh"
      - import-env
      - "{{ item.item.path }}"
      - --prefix
      - "{{ item.item.prefix }}"
  register: f_secret_env_import
  loop: "{{ f_secret_env_state.results }}"
  loop_control:
    label: "{{ item.item.path }}"
  changed_when: "'imported ' in f_secret_env_import.stdout"
  no_log: true
  when: >-
    not item.failed
    and '# secret-prefix:' not in (item.content | default('') | b64decode)

- name: Regenerate bound env files from the store
  ansible.builtin.command:
    argv:
      - "{{ git_root }}/scripts/symbios-secret.sh"
      - export-env
      - "{{ item.item.path }}"
  register: f_secret_env_export
  loop: "{{ f_secret_env_state.results }}"
  loop_control:
    label: "{{ item.item.path }}"
  changed_when: "'regenerated ' in f_secret_env_export.stdout"
  # A rotated store value only reaches a container when its env file change
  # recreates it. Callers with a compose stack pass their restart handler.
  notify: "{{ secret_env_notify | default([]) }}"
  no_log: true
  when: >-
    not item.failed
    and '# secret-prefix:' in (item.content | default('') | b64decode)
