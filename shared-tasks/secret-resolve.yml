# Resolve secrets from the central store and shadow the corresponding play
# variables with facts. Include as a pre_task from base-services/* and
# services/* that consume credentials.
#
# Two declarations are supported:
#   - an inventory value of `secret:<name>` is detected automatically;
#   - `secret_vars: [<var>, ...]` in the play's vars resolves the store entry
#     named after the variable (allows a staged inventory migration).
#
# Optional vars:
#   secret_vars - list of variable names that must come from the store.
#
# Values are never passed as argv: symbios-secret-resolve.sh writes one 0600
# JSON file, Ansible slurps it with no_log, and the file is shredded right
# after. Inventory placeholders never reach a task as a credential.

- name: Collect secret references from inventory and play vars
  ansible.builtin.set_fact:
    f_secret_ref_vars: "{{ hostvars[inventory_hostname] | dict2items
      | selectattr('value', 'string')
      | selectattr('value', 'match', '^secret:[A-Za-z0-9][A-Za-z0-9._/-]*$')
      | map(attribute='key') | list }}"
    f_secret_ref_names: "{{ hostvars[inventory_hostname] | dict2items
      | selectattr('value', 'string')
      | selectattr('value', 'match', '^secret:[A-Za-z0-9][A-Za-z0-9._/-]*$')
      | map(attribute='value')
      | map('regex_replace', '^secret:', '') | list }}"
    f_secret_declared: "{{ secret_vars | default([]) | unique }}"

- name: Merge declared and referenced secrets without duplicates
  ansible.builtin.set_fact:
    f_secret_all_vars: "{{ f_secret_ref_vars + (f_secret_declared | difference(f_secret_ref_vars)) }}"
    f_secret_all_names: "{{ f_secret_ref_names + (f_secret_declared | difference(f_secret_ref_vars)) }}"

- name: Resolve secrets from the central store
  ansible.builtin.command:
    argv: "{{ [git_root ~ '/scripts/symbios-secret-resolve.sh'] + f_secret_all_names }}"
  register: f_secret_resolved
  changed_when: false
  no_log: true
  when: f_secret_all_names | length > 0

- name: Read resolved secrets
  ansible.builtin.slurp:
    src: "{{ f_secret_resolved.stdout | trim }}"
  register: f_secret_bundle
  changed_when: false
  no_log: true
  when: f_secret_all_names | length > 0

- name: Shadow inventory placeholders with resolved values
  ansible.builtin.set_fact:
    "{{ f_secret_all_vars[item] }}": "{{ (f_secret_bundle.content | b64decode | from_json)[f_secret_all_names[item]] }}"
  loop: "{{ range(0, f_secret_all_names | length) | list }}"
  loop_control:
    label: "{{ f_secret_all_vars[item] }}"
  no_log: true
  when: f_secret_all_names | length > 0

- name: Remove transient secret bundle
  ansible.builtin.command:
    argv:
      - "{{ git_root }}/scripts/symbios-secret.sh"
      - cleanup
      - "{{ f_secret_resolved.stdout | trim }}"
  changed_when: false
  when: f_secret_all_names | length > 0
