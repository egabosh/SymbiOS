#   min_ansible_version: '2.11'
#   platforms:
#   - name: Debian
#     versions:
#     - '13'
#   category: Base services / Hardware
#   service_control:
#     services: []
#

---
- name: Raspberry Debian Linux Setup
  hosts: all

  vars:
    default_user: "{{ lookup('pipe', 'getent passwd 1000 | cut -d: -f1') }}"
    default_user_home: "{{ lookup('pipe', 'getent passwd 1000 | cut -d: -f6') }}"
    # Derive the Wi-Fi country (ISO 3166-1 alpha-2, uppercase) from the
    # keyboard layout in inventory.yml. Most layouts map 1:1 to the uppercased
    # code; exceptions need an explicit override. Variants like "us(intl)"
    # are reduced to their base layout first.
    wifi_country_overrides:
      uk: GB
    wifi_country_base: "{{ keyboard.split('(')[0] }}"
    wifi_country_code: "{{ wifi_country_overrides.get(wifi_country_base, wifi_country_base) | upper }}"

  tasks:

    - name: Install packages for cinnamon, desktop-stuff and tools
      apt:
        name:
          # desktop specific
          - cinnamon-desktop-environment
          - cinnamon-l10n
          - lightdm-gtk-greeter
          - gnome-terminal
          - dconf-cli
          - dphys-swapfile
          - tsdecrypt
          - x264
          - x265
          - flatpak
          - ttf-mscorefonts-installer
          - fonts-terminus
          - mint-y-icons
          # useful other stuff
          - pwgen
          - arj
          - p7zip
          - unace
          - unadf
          - bvi
          - fdupes
          - debootstrap
          - geoip-bin
          - sshfs
          - speedtest-cli
          - gnome-characters
          - blueman
          # dconf-gui
          - dconf-editor
          # Media
          - vlc
          - gthumb
          - mediainfo-gui
          - easytag
          - audacity
          - asunder
          - audacious
          - guvcview
          - easyeffects
          - calf-plugins
          # misc
          - gpodder
          - wireguard
          - wireguard-tools
          - tinyproxy
          - rpi-imager
          - hardinfo
          - redshift-gtk
          # tools for android-smartphones/LineageOS
          - heimdall-flash
          - adb
          - fastboot
          - mkbootimg
          # burning
          - brasero

    - name: Purge RealVNC server (not needed, x11vnc or headless instead)
      ansible.builtin.apt:
        name: realvnc-vnc-server
        state: absent
        purge: true
      failed_when: false

    - name: Validate derived Wi-Fi country code is a valid ISO 3166-1 alpha-2 code
      ansible.builtin.command: grep -q "^{{ wifi_country_code }}\s" /usr/share/zoneinfo/iso3166.tab
      changed_when: false
      failed_when: false
      register: wifi_country_valid

    - name: Warn if Wi-Fi country code could not be validated
      ansible.builtin.debug:
        msg: >-
          WARNING: Keyboard '{{ keyboard }}' maps to '{{ wifi_country_code }}',
          which is not a valid ISO 3166-1 alpha-2 code. Add an override in
          wifi_country_overrides in raspberry.yml, otherwise the Wi-Fi stays
          rfkill-blocked.
      when: wifi_country_valid.rc != 0

    - name: Set raspi-config options
      ansible.builtin.command: >
        raspi-config nonint do_{{ item.action }} {{ item.value }}
      loop:
        - { action: ssh, value: "0" }
        - { action: boot_splash, value: "1" }
        - { action: boot_behaviour, value: "B4" }
        - { action: blanking, value: "1" }
        - { action: serial_hw, value: "1" }
        - { action: onewire, value: "0" }
        - { action: wayland, value: "W1" }
        - { action: wifi_country, value: "{{ wifi_country_code }}" }
      changed_when: false
      failed_when: false

    - name: lightdm config dir
      file:
        path: /etc/lightdm
        state: directory
        owner: root
        group: root
        mode: '0755'

    - name: lightdm config
      community.general.ini_file:
        path: /etc/lightdm/lightdm.conf
        section: "Seat:*"
        option: "{{ item.option }}"
        value: "{{ item.value }}"
        mode: "0644"
        create: yes
      loop:
        - { option: autologin-user, value: symbios }
        - { option: autologin-user-timeout, value: "0" }
        - { option: autologin-session, value: cinnamon }
        - { option: user-session, value: cinnamon }
        - { option: greeter-session, value: lightdm-gtk-greeter }
        - { option: greeter-hide-users, value: "false" }
        - { option: greeter-show-manual-login, value: "true" }
        - { option: allow-guest, value: "false" }
      changed_when: false

    - name: Xorg vc4 OutputClass for X11 on Pi 5 (missing in Lite image)
      copy:
        dest: /etc/X11/xorg.conf.d/99-vc4.conf
        content: |
          Section "OutputClass"
            Identifier "vc4"
            MatchDriver "vc4"
            Driver "modesetting"
            Option "PrimaryGPU" "true"
          EndSection
        mode: "0644"

    - name: Disable first-run wizard (language/user dialog)
      ansible.builtin.file:
        path: "{{ item }}"
        state: absent
      loop:
        - /etc/xdg/autostart/cinnamon-first-run.desktop
        - /etc/xdg/autostart/raspi-config-autostart.desktop
        - /etc/xdg/autostart/piwiz.desktop
      failed_when: false

    - name: Disable first-run wizard service
      ansible.builtin.systemd:
        name: "{{ item }}"
        enabled: false
        masked: true
      loop:
        - raspi-config.service
        - piwiz.service
      failed_when: false

    - name: Add default user to docker group
      ansible.builtin.user:
        name: "{{ default_user }}"
        groups: docker
        append: true

    - name: Create .xsessionrc
      copy:
        dest: "{{ default_user_home }}/.xsessionrc"
        owner: "{{ default_user }}"
        group: "{{ default_user }}"
        mode: '0700'
        content: |
          #!/bin/bash

          # Clean GPU Cache of Element
          rm -rf ~/.var/app/im.riot.Riot/config/Element/GPUCache

          # Run backup if script exists
          if [ -f ~/Nextcloud/scripts/backup-this-device.sh ]
          then
            gnome-terminal --hide-menubar --title=BACKUP --geometry=120x35 -- bash ~/Nextcloud/scripts/backup-this-device.sh
          elif [ -f ~/scripts/backup-this-device.sh ]
          then
            gnome-terminal --hide-menubar --title=BACKUP --geometry=120x35 -- bash ~/scripts/backup-this-device.sh
          elif [ -f ~/.scripts/backup-this-device.sh ]
          then
            gnome-terminal --hide-menubar --title=BACKUP --geometry=120x35 -- bash ~/.scripts/backup-this-device.sh
          fi

          # Autoupdate flatpak and cinnamon
          dconf write /com/linuxmint/updates/auto-update-flatpaks true
          dconf write /com/linuxmint/updates/auto-update-cinnamon-spices true

          # First-run initial config
          if ! [ -s ~/.initial-mint-config-by-xsessionrc ]
          then
            dconf write /org/cinnamon/desktop/privacy/remember-recent-files false

            dconf write /org/cinnamon/desktop/peripherals/touchpad/edge-scrolling-enabled true
            dconf write /org/cinnamon/desktop/peripherals/touchpad/two-finger-scrolling-enabled false

            termprofile=$(dconf dump /org/gnome/terminal/legacy/profiles:/ | grep '^\\[:' | cut -d : -f2 | cut -d] -f1)
            dconf write "/org/gnome/terminal/legacy/profiles:/\${termprofile}/font" "'Terminus (TTF) Medium 12'"

            dconf write /org/cinnamon/desktop/keybindings/custom-keybindings/custom8/command '"cinnamon-screensaver-command --lock"'
            dconf write /org/cinnamon/desktop/keybindings/custom-keybindings/custom8/binding "['<Mod4>l']"
            dconf write /org/cinnamon/desktop/keybindings/custom-keybindings/custom8/name '"Lockscreen"'
            dconf write /org/cinnamon/desktop/keybindings/custom-list "['__dummy__']"

            dconf write /org/cinnamon/desktop/interface/gtk-theme "'Mint-Y-Dark'"
            dconf write /org/cinnamon/desktop/interface/icon-theme "'Mint-Y'"
            dconf write /org/cinnamon/theme/name "'Mint-Y-Dark'"
            dconf write /org/gnome/desktop/interface/icon-theme "'Mint-Y-Dark'"
            dconf write /org/gnome/desktop/interface/gtk-theme "'Mint-Y-Dark'"
            dconf write /org/gnome/desktop/interface/color-scheme "'prefer-dark'"

            dconf write /org/nemo/preferences/default-folder-viewer "'list-view'"
            dconf write /org/nemo/preferences/show-location-entry true
            dconf write /org/nemo/preferences/show-directory-item-counts "'never'"
            dconf write /org/nemo/preferences/show-image-thumbnails "'never'"

            dconf write /org/cinnamon/panels-enabled "['1:0:bottom']"
            dconf write /org/cinnamon/panels-height "['1:27']"
            dconf write /org/cinnamon/panel-zone-icon-sizes '[{"left":0,"center":0,"right":0,"panelId":1}]'
            dconf write /org/cinnamon/enabled-applets "['panel1:left:0:menu@cinnamon.org','panel1:left:1:show-desktop@cinnamon.org','panel1:left:2:panel-launchers@cinnamon.org','panel1:left:3:window-list@cinnamon.org','panel1:right:0:systray@cinnamon.org','panel1:right:1:xapp-status@cinnamon.org','panel1:right:2:keyboard@cinnamon.org','panel1:right:3:notifications@cinnamon.org','panel1:right:4:printers@cinnamon.org','panel1:right:5:removable-drives@cinnamon.org','panel1:right:6:user@cinnamon.org','panel1:right:7:network@cinnamon.org','panel1:right:8:sound@cinnamon.org','panel1:right:9:power@cinnamon.org','panel1:right:10:calendar@cinnamon.org']"

            date >> ~/.initial-mint-config-by-xsessionrc
          fi

          if [ -x ~/.xsessionrc.followup ]
          then
            ~/.xsessionrc.followup
          fi


    - name: Check source authorized_keys exists
      stat:
        path: "{{ default_user_home }}/.ssh/authorized_keys"
      register: source_keys

    - name: Copy authorized_keys to root (only if source exists and dest not exists)
      copy:
        src: "{{ default_user_home }}/.ssh/authorized_keys"
        dest: /root/.ssh/authorized_keys
        mode: '0600'
        owner: root
        group: root
        force: false
      when: source_keys.stat.exists

    - name: Split current kernel command line into individual arguments (Raspberry Pi)
      set_fact:
        cmdline_args: "{{ (lookup('file', '/boot/firmware/cmdline.txt') | trim).split() }}"

    # Reorder console= parameters so that console=tty1 (HDMI/screen) is always
    # the LAST one. /dev/console follows the last console= argument, so a
    # trailing console=serial0,115200 would send all rc.local/boot output to
    # the serial port instead of the screen. Serial console stays available.
    - name: Sort console= parameters with tty1 last (Raspberry Pi)
      set_fact:
        cmdline_consoles: "{{ cmdline_args | select('match', '^console=') | list }}"
        cmdline_rest: "{{ cmdline_args | reject('match', '^console=') | reject('in', cgroup_cmdline_args) | list }}"
      vars:
        cgroup_cmdline_args: ['cgroup_enable=memory','cgroup_memory=1','cgroup_enable=cpuset','swapaccount=1']

    - name: Build new cmdline with required parameters (Raspberry Pi)
      set_fact:
        new_cmdline: >-
          {{
            (
              cmdline_rest
              + (cmdline_consoles | reject('match', '^console=tty1') | list)
              + (cmdline_consoles | select('match', '^console=tty1') | list)
              + ['cgroup_enable=memory','cgroup_memory=1','cgroup_enable=cpuset','swapaccount=1']
            ) | join(' ')
          }}

    # Write back only if changed (Raspberry Pi)
    - name: Update /boot/firmware/cmdline.txt if necessary (Raspberry Pi)
      copy:
        dest: /boot/firmware/cmdline.txt
        content: "{{ new_cmdline }}\n"
        owner: root
        group: root
        mode: '0644'
      changed_when: false

    - name: Replace /boot/firmware/config.txt with optimized config
      copy:
        dest: /boot/firmware/config.txt
        content: |
          # /boot/firmware/config.txt - Optimal Kodi KMS Configuration

          # ARM Configuration
          arm_64bit=1
          arm_boost=1

          # Display Configuration
          disable_overscan=1

          # KMS with sufficient GPU memory for HEVC
          dtoverlay=vc4-kms-v3d,cma-256
          max_framebuffers=2
              
          # Fixed 720p@60Hz (comment out if display issues occur)
          hdmi_group=1
          hdmi_mode=16
          hdmi_force_hotplug=1
          
          # Audio
          dtparam=audio=on
              
          # Kodi Optimizations (reduces latency)
          gpu_mem=256
          disable_fw_kms_setup=1
          
          dtoverlay=w1-gpio


    - name: Register playbook as installed
      ansible.builtin.command: "{{ git_root }}/scripts/symbios-state.sh set base-services/raspberry.yml"
      changed_when: false
