# docs:
#   uses_vars:
#     - backup_enabled
#   name: Backup
#   short_description: Configure automated backups
#   description: Installs a nightly backup job (cron) that dumps databases/LDAP and snapshots the whole /symbios data root - locally, to an SSH/SFTP server or as encrypted archive. The job is only installed while backup_enabled is true (default off). Restores are possible per service or for the whole system via the WebUI (Settings -> Backup).
#   author: Oliver Bohlen
#   version: '2.0'
#   license: GPLv3
#   copyright: Copyright (c) 2026, Oliver Bohlen
#   min_ansible_version: '2.11'
#   platforms:
#   - name: Debian
#     versions:
#     - '13'
#   category: Backup
#   service_control:
#     services:
#     - name: backup
#       type: cron
#       file: /etc/cron.d/backup_local
#       status: test -f /etc/cron.d/backup_local || exit 2
#     logs:
#     - name: backup
#       command: tail -F /var/log/syslog | grep backup
#   actions:
#     enable: sed -i 's/^#//' /etc/cron.d/backup_local
#     disable: sed -i 's/^/#/' /etc/cron.d/backup_local
#     run now: backup.sh

---
- name: Backups
  hosts: all
  tasks:
    - name: Install Packages
      apt:
        name:
          - rsync
          - openssl
          - restic
        update_cache: no
        install_recommends: no

    - name: Deploy gaboshlib restic functions
      ansible.builtin.copy:
        src: "{{ git_root }}/../gaboshlib/gaboshlib/{{ item }}"
        dest: "/etc/bash/gaboshlib/{{ item }}"
        owner: root
        group: root
        mode: '0755'
      loop:
        - g_backup_restic.bashfunc
        - g_backup_restic_restore.bashfunc
      ignore_errors: yes

    - name: Ensure restic password file directory exists
      ansible.builtin.file:
        path: "{{ base_services_root | default('/symbios/base-services') }}/symbios-ui/config"
        owner: root
        group: root
        state: directory
        mode: '0750'

    - name: Create restic password file if missing
      ansible.builtin.shell: |
        PWFILE="{{ base_services_root | default('/symbios/base-services') }}/symbios-ui/config/.backup_restic_password"
        if [ ! -s "$PWFILE" ]; then
          umask 077
          tr -dc 'A-Za-z0-9' </dev/urandom | head -c 64 > "$PWFILE"
          chown root:root "$PWFILE"
          chmod 600 "$PWFILE"
        fi
      args:
        creates: "{{ base_services_root | default('/symbios/base-services') }}/symbios-ui/config/.backup_restic_password"

    - name: Remove legacy backups dir /usr/local/sbin/backup.d
      ansible.builtin.file:
        path: /usr/local/sbin/backup.d
        state: absent

    - name: Create backups dir {{ data_root }}/backup.d
      ansible.builtin.file:
        path: "{{ data_root }}/backup.d"
        owner: root
        group: root
        state: directory
        mode: '0700'

    # Local snapshot destination for the main backup engine
    # (scripts/symbios-backup.sh) when no backup server is configured.
    - name: Create local snapshot dir {{ data_root }}/backup
      ansible.builtin.file:
        path: "{{ data_root }}/backup"
        owner: root
        group: root
        state: directory
        mode: '0700'

    # The nightly job only runs while the backup is enabled (Settings ->
    # Backup). When it is switched off the cron file is removed, so the
    # host does not fill up with snapshots nobody asked for.
    - name: /etc/cron.d/backup_local
      blockinfile:
        path: /etc/cron.d/backup_local
        create: yes
        mode: 0644
        owner: root
        group: root
        marker: "# {mark} ANSIBLE MANAGED BLOCK"
        block: |
          SHELL=/bin/bash
          5 0 * * * root PATH={{ git_root }}/scripts:$PATH && [[ -s {{ git_root }}/scripts/backup.sh ]] && backup.sh
        backup: yes
      when: backup_enabled | default(false) | bool

    - name: Remove the cron file when the backup is disabled
      ansible.builtin.file:
        path: /etc/cron.d/backup_local
        state: absent
      when: not (backup_enabled | default(false) | bool)

    # The backup healthcheck lives in scripts/runchecks.d/ and is picked
    # up automatically (runchecks.sh scans the git tree).

    - name: Register playbook as installed
      include_tasks: ../shared-tasks/state-register.yml
      vars:
        service_name: "backup"
        state_playbook: "base-services/backup.yml"
