#   uses_vars: []
#   name: CIS Audit
#   short_description: Daily read-only CIS benchmark audit
#   description: Installs a daily cron job that runs the curated CIS Debian 13 Level 1 Server audit. The check is read-only; accepted deviations are documented in SECURITY.md and waived in scripts/runchecks.d/cis-audit.conf.
#   author: Oliver Bohlen
