#   min_ansible_version: '2.11'
#   platforms:
#   - name: Debian
#     versions:
#     - '13'
#   category: Security
#   service_control:
#     services:
#     - name: cis-audit
#       type: cron
#       file: /etc/cron.d/cis_audit_local
#       status: test -f /etc/cron.d/cis_audit_local || exit 2
#     actions:
#       run audit: symbios-cis-audit.sh run
#       show report: symbios-cis-audit.sh show

---
- name: CIS benchmark audit
  hosts: all
  tasks:

    - name: Check that the CIS audit script is present
      ansible.builtin.stat:
        path: "{{ git_root }}/scripts/symbios-cis-audit.sh"
      register: cis_audit_script
      failed_when: not cis_audit_script.stat.exists
      changed_when: false

    # The audit is read-only and independent of backup/update maintenance.
    # A separate cron entry keeps those two phases serialized by their own
    # lock while still giving the healthcheck a fresh daily report.
    - name: /etc/cron.d/cis_audit_local
      ansible.builtin.blockinfile:
        path: /etc/cron.d/cis_audit_local
        create: yes
        mode: "0400"
        owner: root
        group: root
        marker: "# {mark} ANSIBLE MANAGED BLOCK"
        block: |
          SHELL=/bin/bash
          ## SymbiOS CIS audit (read-only, curated Level 1 Server subset)
          17 3 * * * root PATH={{ git_root }}/scripts:$PATH && [[ -x {{ git_root }}/scripts/symbios-cis-audit.sh ]] && symbios-cis-audit.sh run > /dev/null 2>&1
        backup: yes

    - name: Register playbook as installed
      include_tasks: ../shared-tasks/state-register.yml
      vars:
        service_name: "cis-audit"
        state_playbook: "base-services/cis-audit.yml"
