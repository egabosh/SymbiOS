# Standard media locations (see mediapaths.md): creates the shared media
# directories with the fixed media GID (setgid + default ACLs) and ensures
# the matching LDAP group exists. Must run after ldap.yml (group creation
# needs the directory). Consumers (navidrome, jellyfin, sftp-share, ...)
# only mount these paths, they never create them.
#
# docs:
#   name: Media
#   short_description: Create the shared standard media directories
#   description: Creates the shared media directories with the fixed media group and ensures the matching LDAP group exists.
#   author: Oliver Bohlen
#   version: '1.0'
#   license: GPLv3
#   copyright: Copyright (c) 2026, Oliver Bohlen
#   min_ansible_version: '2.11'
#   platforms:
#   - name: Debian
#     versions:
#     - '13'
#   category: Directory / Storage
#
---
- name: media
  hosts: all
  vars:
    service_name: media
    media_gid_number: "{{ media_gid | default(31000) }}"
    media_dirs_ro:
      - "{{ media_audio | default('/symbios/media/audio') }}"
      - "{{ media_images | default('/symbios/media/images') }}"
      - "{{ media_videos | default('/symbios/media/videos') }}"
      - "{{ media_books | default('/symbios/media/books') }}"
      - "{{ media_documents | default('/symbios/media/documents') }}"
    media_dirs_rw:
      - "{{ media_inbox | default('/symbios/media/inbox') }}"
    # Base dir for named group shares (see symbios-media-share.sh). Each
    # share below it is owned by its own LDAP group (2770); the base stays
    # traversable so members find their shares.
    media_shared_base: "{{ media_shared | default('/symbios/media/shared') }}"
  tasks:

    - name: Ensure the media LDAP group with fixed GID exists
      ansible.builtin.command: "{{ git_root }}/scripts/symbios-ldap-groups.sh --create --gid {{ media_gid_number }} --name media"
      changed_when: false
      failed_when: false

    - name: Ensure the local media group exists (host name resolution for the fixed GID)
      ansible.builtin.group:
        name: media
        gid: "{{ media_gid_number }}"

    - name: Install ACL tools for default ACLs
      ansible.builtin.apt:
        name: acl
        update_cache: no
        install_recommends: no

    - name: Install quota tools for project quotas
      ansible.builtin.apt:
        name: quota
        update_cache: no
        install_recommends: no

    - name: Check project quota support on the media filesystem
      ansible.builtin.shell: findmnt -n -o OPTIONS --target "{{ media_root | default('/symbios/media') }}" | tr ',' '\n' | grep -qx prjquota
      register: media_quota_supported
      changed_when: false
      failed_when: false

    # Project IDs are stable without an allocation table: fixed 31010-31015
    # for the libraries, the owner uidNumber for homes, the owner gidNumber
    # for shares. Limits come from media_quota_* (GiB, 0 = unlimited).
    - name: Apply project quotas on the fixed library dirs
      ansible.builtin.shell: |
        if [[ "{{ item.limit }}" -gt 0 ]]
        then
          chattr -p {{ item.projid }} "{{ item.path }}"
          chattr +P "{{ item.path }}"
          setquota -P {{ item.projid }} $(( {{ item.limit }} * 1048576 )) $(( {{ item.limit }} * 1048576 )) 0 0 "{{ media_root | default('/symbios/media') }}"
        fi
      loop:
        - { projid: 31010, path: "{{ media_inbox | default('/symbios/media/inbox') }}", limit: "{{ media_quota_inbox | default(0) }}" }
        - { projid: 31011, path: "{{ media_videos | default('/symbios/media/videos') }}", limit: "{{ media_quota_videos | default(0) }}" }
        - { projid: 31012, path: "{{ media_audio | default('/symbios/media/audio') }}", limit: "{{ media_quota_audio | default(0) }}" }
        - { projid: 31013, path: "{{ media_images | default('/symbios/media/images') }}", limit: "{{ media_quota_images | default(0) }}" }
        - { projid: 31014, path: "{{ media_books | default('/symbios/media/books') }}", limit: "{{ media_quota_books | default(0) }}" }
        - { projid: 31015, path: "{{ media_documents | default('/symbios/media/documents') }}", limit: "{{ media_quota_documents | default(0) }}" }
      when: media_quota_supported.rc == 0
      changed_when: false
      failed_when: false

    - name: Apply project quotas on homes (projid = owner uid) and shares (projid = owner gid)
      ansible.builtin.shell: |
        f_root="{{ media_root | default('/symbios/media') }}"
        for f_dir in "${f_root}/home/"*/ "${f_root}/shared/"*/
        do
          [[ -d "${f_dir}" ]] || continue
          if [[ "${f_dir}" == */home/* ]]
          then
            f_id="$(stat -c '%u' "${f_dir}")"
            f_limit="{{ media_quota_home | default(0) }}"
          else
            f_id="$(stat -c '%g' "${f_dir}")"
            f_limit="{{ media_quota_share | default(0) }}"
          fi
          if [[ "${f_limit}" -gt 0 ]]
          then
            chattr -p "${f_id}" "${f_dir}"
            chattr +P "${f_dir}"
            setquota -P "${f_id}" $(( f_limit * 1048576 )) $(( f_limit * 1048576 )) 0 0 "${f_root}"
          fi
        done
      when: media_quota_supported.rc == 0
      changed_when: false
      failed_when: false

    - name: Create the media root directory
      ansible.builtin.file:
        path: "{{ media_root | default('/symbios/media') }}"
        owner: root
        group: "{{ media_gid_number }}"
        # Group lists, everyone traverses (needed for share-only SFTP users
        # reaching their home/share below; libraries stay hidden via 2750).
        mode: '2751'
        state: directory

    - name: Create the read-only media library directories
      ansible.builtin.file:
        path: "{{ item }}"
        owner: root
        group: "{{ media_gid_number }}"
        mode: '2750'
        state: directory
      loop: "{{ media_dirs_ro }}"

    - name: Create the writable media ingest directories
      ansible.builtin.file:
        path: "{{ item }}"
        owner: root
        group: "{{ media_gid_number }}"
        mode: '2770'
        state: directory
      loop: "{{ media_dirs_rw }}"

    - name: Create the group shares base directory
      ansible.builtin.file:
        path: "{{ media_shared_base }}"
        owner: root
        group: root
        mode: '0755'
        state: directory

    - name: Create the private homes base directory (traverse-only, no listing)
      ansible.builtin.file:
        path: "{{ media_root | default('/symbios/media') }}/home"
        owner: root
        group: root
        mode: '0711'
        state: directory

    - name: Set default ACLs on read-only libraries (group read, inherit group)
      ansible.builtin.shell: setfacl -d -m g::rx "{{ item }}"
      loop: "{{ media_dirs_ro }}"
      changed_when: false

    - name: Set default ACLs on ingest directories (group read/write, inherit group)
      ansible.builtin.shell: setfacl -d -m g::rwx "{{ item }}"
      loop: "{{ media_dirs_rw }}"
      changed_when: false

    - name: Remove renamed legacy library dirs when empty (music/photos)
      ansible.builtin.shell: rmdir "{{ media_root | default('/symbios/media') }}/music" "{{ media_root | default('/symbios/media') }}/photos" 2>/dev/null
      changed_when: false
      failed_when: false

    - name: Register playbook as installed
      ansible.builtin.command: "{{ git_root }}/scripts/symbios-state.sh set base-services/media.yml"
      changed_when: false
