# docs:
#   uses_vars:
#   applies_when: raspberry_pi
#   name: Firefox
#   short_description: Firefox / LibreWolf policies
#   description: Installs Firefox and deploys the managed browser policy files. Part of the Raspberry Pi desktop setup, so it runs on Pi hardware only (same gate as raspberry.yml).
#   author: Oliver Bohlen
#   version: '1.0'
#   license: GPLv3
#   copyright: Copyright (c) 2026, Oliver Bohlen
#   min_ansible_version: '2.11'
#   platforms:
#   - name: Debian
#     versions:
#     - '13'
#   category: Base services / Hardware
#   service_control:
#     services: []
#

- name: Firefox setup
  hosts: all
  tasks:

    # Guard - this playbook belongs to the Pi desktop stack and declares
    # applies_when: raspberry_pi. A manual run on non-Pi hardware would fail
    # late with confusing apt errors, so abort with a readable reason.
    - name: Guard - Detect Raspberry Pi hardware
      ansible.builtin.stat:
        path: /proc/device-tree/model
      register: pi_device_tree
      changed_when: false

    - name: Guard - Abort on non-Pi hardware
      ansible.builtin.assert:
        that:
          - pi_device_tree.stat.exists
        fail_msg: >-
          firefox.yml is Raspberry Pi specific (declares
          applies_when: raspberry_pi); this host has no
          /proc/device-tree/model and is therefore no Pi. Install order
          and settings apply skip it there.
      when: not pi_device_tree.stat.exists

    - name: Install Firefox
      ansible.builtin.apt:
        name:
          - firefox

    - name: Ensure Firefox policy directories exist
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
        owner: root
        group: root
        mode: '0755'
      loop:
        - "/etc/firefox/policies"
        - "/etc/librewolf/policies"

    - name: Firefox/LibreWolf policy (local)
      ansible.builtin.copy:
        src: "{{ playbook_dir }}/firefox-policies.json"
        dest: "{{ item }}"
        owner: root
        group: root
        mode: '0444'
        backup: yes
      loop:
        - "/etc/firefox/policies/policies.json"
        - "/etc/librewolf/policies/policies.json"

    - name: Get sha256
      ansible.builtin.shell: wget -q https://gitlab.com/api/v4/projects/24386000/packages/generic/librewolf/latest/LibreWolf.{{ ansible_architecture }}.AppImage.sha256 -O - | cut -d" " -f1
      register: command_output
      changed_when: false

    - name: Store LibreWolf checksum for the download
      ansible.builtin.set_fact:
        librewolf_sha256: "{{ command_output.stdout }}"

    - name: Download LibreWolf as Appimage (flatpak ignores policies.json)
      ansible.builtin.get_url:
        url: https://gitlab.com/api/v4/projects/24386000/packages/generic/librewolf/latest/LibreWolf.{{ ansible_architecture }}.AppImage
        dest: /usr/local/bin/librewolf
        checksum: sha256:{{ librewolf_sha256 }}
        mode: "0555"
      changed_when: false

    - name: Register playbook as installed
      ansible.builtin.include_tasks: ../shared-tasks/state-register.yml
      vars:
        service_name: firefox
        state_playbook: base-services/firefox.yml

