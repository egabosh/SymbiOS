# SymbiOS report-only fail2ban action.
#
# fail2ban keeps its detection and ban bookkeeping, but no firewall rule is
# ever created: all ban/unban actions are empty. The only effect of a ban is
# one call to the central auth reporter. bantime in jail.local is short and
# acts as a report cooldown, not as a lockout.

[Definition]
actionstart =
actionstop =
actioncheck =
actionban = /usr/local/sbin/symbios-auth-report.sh <name> <ip> <failures>
actionunban =
