# SymbiOS report-only fail2ban action with authentication context.
#
# No firewall rule is created. The report reporter receives the jail name,
# offending address, failure count, account and portal/path context. Values
# captured by the filter are restricted to safe characters, and the reporter
# sanitizes them again before writing the audit event or notification.

[Definition]
actionstart =
actionstop =
actioncheck =
actionban = /usr/local/sbin/symbios-auth-report.sh <name> <ip> <failures> "<F-USER>" "<domain>" "<F-PATH>"
actionunban =

[Init]
domain = -
