# SymbiOS report-only fail2ban filter for real Authelia credential attacks.
#
# This intentionally matches authentication API failures, not generic 401/403
# responses from the forward-auth redirect. Those are scanner noise and stay
# in scripts/runchecks.d/auth-patterns.check.
#
# Captured fields are deliberately restricted to safe characters: fail2ban
# interpolates them into the action command line before the shell runs it.
# The doubled percent in the path class is required by fail2ban's configparser
# and resolves to a single literal percent in the regex.

[Definition]
# Deliberately unanchored: fail2ban reads either the plain Authelia text log
# (time=... level=error msg=...) or a Docker JSON log, where the message is
# quoted and escaped inside a JSON envelope. Both contain the same fields.
failregex =
    Unsuccessful 1FA authentication attempt by user '<F-USER>[A-Za-z0-9._@-]+</F-USER>'.*path=<F-PATH>/api/[A-Za-z0-9._~/?&%%=@+-]+</F-PATH>.*remote_ip=<ADDR>
    Unsuccessful TOTP authentication attempt by user '<F-USER>[A-Za-z0-9._@-]+</F-USER>'.*path=<F-PATH>/api/[A-Za-z0-9._~/?&%%=@+-]+</F-PATH>.*remote_ip=<ADDR>
    Error occurred getting details for user with username input '<F-USER>[A-Za-z0-9._@-]+</F-USER>'.*path=<F-PATH>/api/[A-Za-z0-9._~/?&%%=@+-]+</F-PATH>.*remote_ip=<ADDR>

ignoreregex =
