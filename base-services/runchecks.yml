# docs:
#   short_description: Install system/service health checks
#   description: Deploys the runchecks health-check framework (script + systemd service) that periodically verifies critical services and reports their status.
#   author: Oliver Bohlen
#   version: '1.0'
#   license: GPLv3
#   copyright: Copyright (c) 2026, Oliver Bohlen
#   min_ansible_version: '2.11'
#   platforms:
#   - name: Debian
#     versions:
#     - '13'
#   category: Monitoring / Checks
#   service_control:
#     services:
#     - name: runchecks
#       type: systemd
#       unit: runchecks.service
#       status: systemctl is-active runchecks.service
#     - name: runchecks
#       type: systemd
#       unit: runchecks.timer
#       status: systemctl is-active runchecks.timer
#     logs:
#     - name: runchecks.service
#       command: journalctl -fu runchecks.service -n 1000
#   actions:
#     start: systemctl start runchecks.service
#     stop: systemctl stop runchecks.service
#     restart: systemctl restart runchecks.service

---
- name: Checks
  hosts: all
  tasks:
    - name: Install Packages
      apt:
        name:
          - smartmontools
          - mdadm
        update_cache: no
        install_recommends: no

    - name: Create checks dir /usr/local/sbin/runchecks.d
      ansible.builtin.file:
        path: /usr/local/sbin/runchecks.d
        owner: root
        group: root
        state: directory
        mode: '0700'

    - name: "{{ git_root }}/scripts/runchecks.d/services"
      lineinfile:
        path: "{{ git_root }}/scripts/runchecks.d/services"
        create: yes
        insertbefore: EOF
        line: "cron rsyslog sshd"

    - name: /etc/systemd/system/runchecks.service
      ansible.builtin.copy:
        dest: /etc/systemd/system/runchecks.service
        mode: "0444"
        owner: root
        group: root
        content: |
          [Unit]
          Description=checks
          After=syslog.target network.target rc-local.service
          # rc.local unlocks LUKS, mounts /symbios and starts docker, so the
          # first check loop (+5 min) already sees all services up. Without a
          # running rc.local (root-fs setup), the ExecStartPre below is the
          # fallback: it fails fast and Restart=on-failure retries forever
          # (StartLimitIntervalSec=0) until the script is available.
          StartLimitIntervalSec=0
          
          [Service]
          Type=simple
          User=root
          Environment=PATH={{ git_root }}/scripts:/usr/local/sbin:/usr/sbin:/usr/bin:/sbin:/bin
          ExecStartPre=/bin/bash -c '[[ -x /symbios/git/SymbiOS/scripts/runchecks.sh ]] || exit 1'
          ExecStart={{ git_root }}/scripts/runchecks.sh
          Restart=on-failure
          RestartSec=10
          
          [Install]
          WantedBy=multi-user.target
      notify:
      - Restart systemd

    - name: 'add runchecks to startup'
      command: systemctl enable runchecks
      args:
        creates: /etc/systemd/system/multi-user.target.wants/runchecks.service



    - name: Register playbook as installed
      ansible.builtin.command: "{{ git_root }}/scripts/symbios-state.sh set base-services/runchecks.yml"
      changed_when: false
  handlers:

    - name: Restart systemd
      ansible.builtin.shell: systemctl daemon-reload
      notify: Restart runchecks

    - name: Restart runchecks
      service:
        name: runchecks
        state: restarted
