# docs:
#   name: Traefik
#   short_description: Deploy and configure the Traefik reverse proxy
#   description: Installs Traefik as the central reverse proxy / ingress, sets up entrypoints, TLS (ACME) and forward-auth integration with Authelia.
#   url: "https://traefik.{{ base_domain }}"
#   author: Oliver Bohlen
#   version: '1.0'
#   license: GPLv3
#   copyright: Copyright (c) 2026, Oliver Bohlen
#   min_ansible_version: '2.11'
#   platforms:
#   - name: Debian
#     versions:
#     - '13'
#   category: Reverse proxy
#   service_control:
#     services:
#     - name: traefik
#       type: docker
#       compose_file: /symbios/base-services/traefik/docker-compose.yml
#       status: test -d /symbios/base-services/traefik || exit 2; docker compose -f /symbios/base-services/traefik/docker-compose.yml ps | grep -q "Up "
#     logs:
#     - name: traefik
#       command: docker compose -f /symbios/base-services/traefik/docker-compose.yml logs -f --tail=1000
#   actions:

---
- name: traefik
  hosts: all

  vars:
    docker_path: "{{ base_services_root }}/traefik"
    authelia_domain: "auth.{{ base_domain }}"
    traefik_domain: "traefik.{{ base_domain }}"
    acme_server: ""

  pre_tasks:
    - name: Fail if base_domain is not configured
      ansible.builtin.fail:
        msg: >-
          base_domain is not set. Configure a domain first via
          the WebUI at /settings/ddns/ or edit inventory.yml directly.
      when: base_domain is not defined or base_domain == '' or base_domain == 'none'

  tasks:

    - name: "{{ docker_path }}/default-basic-auth-genpw.sh (generate Random PW for default-basic-auth)"
      blockinfile:
        path: "{{ docker_path }}/default-basic-auth-genpw.sh"
        create: yes
        mode: 0550
        owner: root
        group: docker
        marker: "# {mark} ANSIBLE MANAGED BLOCK"
        block: |
          # Change to traefik configuration directory
          cd {{ docker_path }}
          # Set default admin username
          f_user=admin
          # Generate a random 32-character password
          f_password=$(pwgen -s 32 1)

          # Create env file with placeholders if it does not exist yet
          if ! [ -f default-basic-auth-env ]
          then
            echo "USER=!USER!
          PASSWORD=!PASSWORD!
          " >default-basic-auth-env
          fi

          # Restrict access to the env file
          chmod 440 default-basic-auth-env
          chown root:docker default-basic-auth-env
          # Substitute placeholders with actual credentials
          sed -i "s/\!USER\!/$f_user/g" default-basic-auth-env
          sed -i "s/\!PASSWORD\!/$f_password/g" default-basic-auth-env

          # Load credentials and generate htpasswd entry for basic auth
          . default-basic-auth-env
          mkdir -p providers
          htpasswd -nb "$USER" "$PASSWORD" >providers/default-basic-auth.usersfile

        backup: yes
        validate: /bin/bash -n %s

    - name: "{{ docker_path }}/default-basic-auth-genpw.sh shebang"
      lineinfile:
        path: "{{ docker_path }}/default-basic-auth-genpw.sh"
        insertbefore: BOF
        line: "#!/bin/bash -e"

    # Generate initial htpasswd if the users file does not exist yet
    - name: Gen initial password if not exists
      ansible.builtin.shell: ./default-basic-auth-genpw.sh
      args:
        chdir: "{{ docker_path }}"
        creates: "{{ docker_path }}/providers/default-basic-auth.usersfile"

    - name: "{{ docker_path }}/docker-compose.yml Traefik Container Configuration"
      ansible.builtin.copy:
        content: |
          # BEGIN ANSIBLE MANAGED BLOCK

          name: ""

          services:
            traefik:
              image: traefik:latest
              command:
                # Be careful in production as it exposes the traffic you might not want to expose.
                - --log.level=ERROR
                # http -> https redirect
                - --entrypoints.http.address=:80
                - --entrypoints.http.http.redirections.entryPoint.to=https
                - --entrypoints.http.http.redirections.entryPoint.scheme=https
                - --entrypoints.http.http.redirections.entrypoint.permanent=true
                # https
                - --entrypoints.https.address=:443
                - --entrypoints.https.http.encodedcharacters.allowencodedsemicolon=true
                - --entrypoints.https.http.encodedcharacters.allowencodedpercent=true
                - --entrypoints.https.http.encodedcharacters.allowencodedquestionmark=true
                - --entrypoints.https.http.encodedcharacters.allowencodedhash=true
                # ldaps
                - --entrypoints.ldaps.address=:636
                # Traefik
                - --api=true
                - --api.dashboard=true
                - --api.insecure=false
                # LetsEncrypt 
                - --certificatesResolvers.letsencrypt.acme.httpChallenge.entryPoint=http
                - --certificatesresolvers.letsencrypt.acme.email=ssl@{{ base_domain }}
                - --certificatesresolvers.letsencrypt.acme.storage=/letsencrypt/acme.json
                {% if acme_server %}- --certificatesresolvers.letsencrypt.acme.caServer={{ acme_server }}
                {% endif %}
                # non-docker services
                - --providers.file=true
                - --providers.file.directory=/etc/traefik/providers.local
                - --providers.file.watch=true
                # log
                - --accesslog.filepath=/log/access.log
                - --accesslog.format=json
              container_name: symbios-base-traefik
              restart: unless-stopped
              security_opt:
                - no-new-privileges:true
              networks:
                symbios_base_services:
                  ipv4_address: 192.168.41.200
                symbios_services: {}
              ports:
                - 80:80
                - 443:443
                - 636:636
              volumes:
                - /etc/localtime:/etc/localtime:ro
                - ./letsencrypt:/letsencrypt
                - ./providers:/etc/traefik/providers.local
                - ./log:/log
          networks:
            symbios_base_services:
              external: true
            symbios_services:
              external: true
          # END ANSIBLE MANAGED BLOCK
        dest: "{{ docker_path }}/docker-compose.yml"
        mode: '0440'
        owner: root
        group: docker
      notify: Restart traefik


    - name: Create traefik dir
      ansible.builtin.file:
        path: "{{ docker_path }}/providers"
        owner: root
        group: docker
        state: directory
        mode: '0755'

    - name: Defaults for TLS,...
      blockinfile:
        path: "{{ docker_path }}/providers/_default.yml"
        create: yes
        mode: 0444
        owner: root
        group: docker
        marker: "# {mark} ANSIBLE MANAGED BLOCK"
        block: |
          ---
          tls:
            options:
              default:
                minVersion: VersionTLS12
                cipherSuites:
                  - TLS_ECDHE_RSA_WITH_AES_256_GCM_SHA384   # TLS 1.2
                  - TLS_ECDHE_RSA_WITH_CHACHA20_POLY1305    # TLS 1.2
                  - TLS_AES_256_GCM_SHA384                  # TLS 1.3
                  - TLS_CHACHA20_POLY1305_SHA256            # TLS 1.3
                curvePreferences:
                  - CurveP521
                  - CurveP384
                sniStrict: true
          http:
            middlewares:
              secHeaders:
                compress: false
                headers:
                  browserXssFilter: true
                  contentTypeNosniff: true
                  frameDeny: true
                  # HSTS Configuration
                  forceSTSHeader: true
                  stsIncludeSubdomains: true
                  stsPreload: true
                  stsSeconds: 31536000
                  customFrameOptionsValue: "SAMEORIGIN"
                  sslProxyHeaders:
                    X-Forwarded-Proto: "https"
              authelia:
                forwardAuth:
                  address: "http://symbios-base-authelia:9091/api/authz/forward-auth?authelia_url=https://{{ authelia_domain }}"
                  trustForwardHeader: true
                  authResponseHeaders:
                    - "Remote-User"
                    - "Remote-Groups"
                    - "Remote-Name"
                    - "Remote-Email"
                    - "Remote-Method"
              default-basic-auth:
                basicAuth:
                  usersFile: "/etc/traefik/providers.local/default-basic-auth.usersfile"
              allowlocalipsonly:
                ipAllowList:
                  sourceRange:
                    - "127.0.0.1/32"
                    - "192.168.0.0/16"
                    - "172.16.0.0/12"
                    - "10.0.0.0/8"
                    - "fe80::/10"
                    - "fc00::/7"
                    - "::1/128"
                  ipStrategy:
                    ipv6Subnet: 64
      notify: Restart traefik

    - name: "{{ docker_path }}/providers/symbios-services.yml Routing Configuration"
      ansible.builtin.template:
        src: traefik-services.j2
        dest: "{{ docker_path }}/providers/symbios-services.yml"
        mode: "0444"
        owner: root
        group: docker
      notify: Restart traefik

    - name: /etc/cron.d/traefik-qualys-ssl-labs-check_local
      blockinfile:
        path: /etc/cron.d/traefik-qualys-ssl-labs-check_local
        create: yes
        mode: 0644
        owner: root
        group: root
        marker: "# {mark} ANSIBLE MANAGED BLOCK"
        block: |
          SHELL=/bin/bash
          @daily root PATH={{ git_root }}/scripts:$PATH && [[ -s {{ git_root }}/scripts/traefik-qualys-ssl-labs-check.sh ]] && traefik-qualys-ssl-labs-check.sh
        backup: yes

    - name: Allow http from all clients
      community.general.ufw:
        rule: allow
        port: '80'
        proto: tcp

    - name: Allow https from all clients
      community.general.ufw:
        rule: allow
        port: '443'
        proto: tcp

    - name: Allow access from base-services to Docker-Host for services running without docker
      community.general.ufw:
        rule: allow
        interface: base-services
        direction: in

    - name: Allow access from services to Docker-Host for services running without docker
      community.general.ufw:
        rule: allow
        interface: services
        direction: in

    - name: Install logrotate for Traefik access log
      ansible.builtin.copy:
        dest: /etc/logrotate.d/traefik
        mode: '0644' 
        content: |
          {{ docker_path }}/log/access.log {
              daily
              rotate 7
              compress
              delaycompress
              missingok
              notifempty
              copytruncate
          }

    - name: Ensure ACME account directories exist
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
        mode: '0700'
      loop:
        - "{{ docker_path }}/letsencrypt"

    - name: Ensure ACME account files are not group/world readable
      # Traefik refuses to load acme.json unless its mode is 0600
      # ("permissions ... are too open, please use 600"). The files are written
      # at runtime with the host umask (0027 -> 0640), so this breaks TLS after
      # every Traefik restart. Re-assert 0600 as a safety net.
      ansible.builtin.file:
        path: "{{ item }}"
        state: touch
        modification_time: preserve
        access_time: preserve
        mode: '0600'
      loop:
        - "{{ docker_path }}/letsencrypt/acme.json"


    - name: Ensure traefik is running
      ansible.builtin.shell: docker compose up -d
      args:
        chdir: "{{ docker_path }}"

    - name: Register playbook as installed
      ansible.builtin.command: "{{ git_root }}/scripts/symbios-state.sh set base-services/traefik.yml"
      changed_when: false
  handlers:

    - name: Restart traefik
      ansible.builtin.shell: docker compose down && docker compose up -d
      args:
        chdir: "{{ docker_path }}"
