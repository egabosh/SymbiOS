# docs:
#   name: OpenVPN Client
#   short_description: Manage OpenVPN client tunnels to remote networks
#   description: Installs openvpn and manages client tunnels from inventory (openvpn_clients). Each tunnel is either uploaded once (mode upload) or refreshed from a fetch helper on a schedule (mode fetch, e.g. pulled from the router). Managed through the WebUI under Settings -> OpenVPN Client.
#   author: Oliver Bohlen
#   version: '1.0'
#   license: GPLv3
#   copyright: Copyright (c) 2026, Oliver Bohlen
#   min_ansible_version: '2.11'
#   platforms:
#   - name: Debian
#     versions:
#     - '13'
#   category: Network
#   service_control:
#     services:
#     - name: openvpn-client tunnels
#       type: systemd
#       status: symbios-openvpn-client.sh list
#     logs:
#     - name: openvpn
#       command: journalctl -u openvpn@* -f --tail=100
#   actions:
#     start: for t in $(ls /etc/openvpn/*.conf 2>/dev/null); do systemctl start openvpn@$(basename $t .conf); done
#     stop: for t in $(ls /etc/openvpn/*.conf 2>/dev/null); do systemctl stop openvpn@$(basename $t .conf); done
#     restart: for t in $(ls /etc/openvpn/*.conf 2>/dev/null); do systemctl restart openvpn@$(basename $t .conf); done
---
- name: Configure OpenVPN client tunnels
  hosts: localhost
  become: true
  tasks:
    - name: Install openvpn
      ansible.builtin.apt:
        name:
          - openvpn
        state: present
        update_cache: true
      changed_when: true

    - name: Ensure /etc/openvpn exists
      ansible.builtin.file:
        path: /etc/openvpn
        state: directory
        owner: root
        group: root
        mode: '0755'

    - name: Normalize openvpn_clients to a list
      ansible.builtin.set_fact:
        _openvpn_tunnels: "{{ (openvpn_clients | default({})).items() | list }}"

    - name: Deploy fetch helpers for fetch-mode tunnels
      ansible.builtin.copy:
        content: |
          #!/bin/bash
          # SymbiOS OpenVPN fetch helper for tunnel {{ item.0 }} - managed by Ansible.
          # Refreshes /etc/openvpn/{{ item.0 }}.conf from the configured source.
          {{ item.1.fetch_cmd | default('# No fetch_cmd configured - upload the config instead.') }}
        dest: "/etc/openvpn/fetch-{{ item.0 }}.sh"
        owner: root
        group: root
        mode: '0755'
      loop: "{{ _openvpn_tunnels }}"
      when: (item.1.mode | default('upload')) == 'fetch'
      changed_when: true

    - name: Remove fetch helpers of upload-mode tunnels
      ansible.builtin.file:
        path: "/etc/openvpn/fetch-{{ item.0 }}.sh"
        state: absent
      loop: "{{ _openvpn_tunnels }}"
      when: (item.1.mode | default('upload')) != 'fetch'
      changed_when: false

    - name: Schedule config refresh for fetch-mode tunnels
      ansible.builtin.cron:
        name: "SymbiOS openvpn fetch {{ item.0 }}"
        minute: "{{ (item.1.cron | default('*/5 * * * *')).split(' ')[0] }}"
        hour: "{{ (item.1.cron | default('*/5 * * * *')).split(' ')[1] }}"
        day: "{{ (item.1.cron | default('*/5 * * * *')).split(' ')[2] }}"
        month: "{{ (item.1.cron | default('*/5 * * * *')).split(' ')[3] }}"
        weekday: "{{ (item.1.cron | default('*/5 * * * *')).split(' ')[4] }}"
        job: "/etc/openvpn/fetch-{{ item.0 }}.sh && systemctl restart openvpn@{{ item.0 }}"
        user: root
        state: present
      loop: "{{ _openvpn_tunnels }}"
      when: (item.1.mode | default('upload')) == 'fetch'
      changed_when: false

    - name: Remove refresh cron of upload-mode tunnels
      ansible.builtin.cron:
        name: "SymbiOS openvpn fetch {{ item.0 }}"
        state: absent
        user: root
      loop: "{{ _openvpn_tunnels }}"
      when: (item.1.mode | default('upload')) != 'fetch'
      changed_when: false

    - name: Find orphan refresh crons of deleted tunnels
      ansible.builtin.shell: |
        crontab -l 2>/dev/null | grep -oP 'SymbiOS openvpn fetch \K[\w-]+' | sort -u || true
      register: _openvpn_crons
      changed_when: false
      failed_when: false

    - name: Remove refresh crons of deleted tunnels
      ansible.builtin.cron:
        name: "SymbiOS openvpn fetch {{ orphan }}"
        state: absent
        user: root
      loop: "{{ _openvpn_crons.stdout_lines | default([]) | difference((openvpn_clients | default({})).keys() | list) }}"
      loop_control:
        loop_var: orphan
      changed_when: false

    - name: Allow tunnel ports on the tunnel interface
      community.general.ufw:
        rule: allow
        port: "{{ tunnel_rule.1.port | string }}"
        proto: "{{ tunnel_rule.1.proto | default('tcp') }}"
        interface: "{{ tunnel_rule.0.1.interface | default('tun0') }}"
        direction: in
      loop: "{{ _openvpn_tunnels | subelements('1.ufw_allow', skip_missing=True) }}"
      loop_control:
        loop_var: tunnel_rule
      changed_when: true

    - name: Enable and start active tunnels
      ansible.builtin.systemd:
        name: "openvpn@{{ item.0 }}"
        state: started
        enabled: true
        daemon_reload: true
      loop: "{{ _openvpn_tunnels }}"
      when: (item.1.enabled | default(false) | bool)
      failed_when: false

    - name: Stop and disable inactive tunnels
      ansible.builtin.systemd:
        name: "openvpn@{{ item.0 }}"
        state: stopped
        enabled: false
        daemon_reload: true
      loop: "{{ _openvpn_tunnels }}"
      when: not (item.1.enabled | default(false) | bool)
      failed_when: false

    - name: Register playbook as installed
      ansible.builtin.command: "{{ git_root }}/scripts/symbios-state.sh set base-services/openvpn-client.yml"
      changed_when: false
