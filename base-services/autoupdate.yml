# docs:
#   uses_vars: []
#   name: Auto Updates
#   short_description: Configure automated system updates
#   description: Installs the update dispatcher (OS packages, Docker apps, SymbiOS itself and health modules) used by the single daily maintenance window in base-services/maintenance.yml. Updates always run after the backup.
#   author: Oliver Bohlen
#   version: '1.0'
#   license: GPLv3
#   copyright: Copyright (c) 2026, Oliver Bohlen
#   min_ansible_version: '2.11'
#   platforms:
#   - name: Debian
#     versions:
#     - '13'
#   category: Maintenance
#   service_control:
#     logs:
#     - name: autoupdate
#       command: tail -F /var/log/syslog | grep autoupdate

---
- name: Autoupdate
  hosts: all
  tasks:

    - name: Create updates dir /usr/local/sbin/autoupdate.d
      ansible.builtin.file:
        path: /usr/local/sbin/autoupdate.d
        owner: root
        group: root
        state: directory
        mode: "0700"

    - name: Create updates dir /symbios/autoupdate.d
      ansible.builtin.file:
        path: "{{ data_root }}/autoupdate.d"
        owner: root
        group: root
        state: directory
        mode: "0700"

    # Scheduling lives in base-services/maintenance.yml: the single cron job
    # calls symbios-maintenance.sh, which runs backup.sh before this dispatcher.

    - name: Register playbook as installed
      include_tasks: ../shared-tasks/state-register.yml
      vars:
        service_name: "autoupdate"
        state_playbook: "base-services/autoupdate.yml"
