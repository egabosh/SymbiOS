# docs:
#   name: Hardening
#   short_description: Apply basic Debian Linux hardening
#   description: 'Hardens the OS: tightens SSH configuration, encrypts swap with a random key per boot, applies kernel/sysctl and permission hardening, and reduces the attack surface of the host.'
#   author: Oliver Bohlen
#   version: '1.0'
#   license: GPLv3
#   copyright: Copyright (c) 2026, Oliver Bohlen
#   min_ansible_version: '2.11'
#   platforms:
#   - name: Debian
#     versions:
#     - '13'
#   category: Hardening / Security
#   service_control:
#     services:
#     - name: ssh
#       type: systemd
#       unit: ssh.service
#       status: systemctl is-active ssh.service
#   actions:

---
- name: Basic Debian Linux Hardening
  hosts: all
  tasks:

    - name: check if we are in an container env by existing systemd
      stat:
        path: /lib/systemd/systemd
      register: nocontainer

    - name: SSHD hardening
      blockinfile:
        path: /etc/ssh/sshd_config.d/hardening.conf
        mode: "0444"
        owner: root
        group: root
        create: yes
        insertbefore: BOF # Beginning of the file
        marker: "# {mark} ANSIBLE MANAGED BLOCK"
        block: |
          Port 22
          Port 33
          PermitRootLogin prohibit-password
          PermitUserRC no
          PermitUserEnvironment no
          PubkeyAuthentication yes
          X11Forwarding no
          AllowAgentForwarding no
          AllowTcpForwarding yes
          Subsystem sftp internal-sftp -f AUTH -l INFO -u 0007
          ## Ciphers Check https://sshcheck.com/server/{{ base_domain }}/
          # nmap -p22 -n -sV --script ssh2-enum-algos localhost
          KexAlgorithms curve25519-sha256@libssh.org
          HostKeyAlgorithms ssh-ed25519
          Ciphers chacha20-poly1305@openssh.com,aes256-gcm@openssh.com,aes128-gcm@openssh.com
          MACs hmac-sha2-512-etm@openssh.com,hmac-sha2-256-etm@openssh.com,umac-128-etm@openssh.com
          IgnoreRhosts yes
          LogLevel VERBOSE
          AddressFamily any
        backup: yes
        validate: /usr/sbin/sshd -T -f %s
      notify:
      - Restart sshd
      when: nocontainer.stat.exists == true

    - name: Disable external sftp-Subsystem
      replace:
        path: /etc/ssh/sshd_config
        regexp: '(^Subsystem.*sftp.*)'
        replace: '#\1'
        validate: /usr/sbin/sshd -T -f %s
        backup: yes
      notify:
      - Restart sshd
      when: nocontainer.stat.exists == true

    - name: Install fail2ban for SSH brute-force protection (host sshd, ports 22/33)
      ansible.builtin.apt:
        name: fail2ban
        update_cache: no
        install_recommends: no
      when: nocontainer.stat.exists == true

    - name: Configure fail2ban sshd jail (5 failures in 10 minutes -> 30 minutes ban)
      ansible.builtin.blockinfile:
        path: /etc/fail2ban/jail.local
        mode: "0444"
        owner: root
        group: root
        create: yes
        marker: "# {mark} ANSIBLE MANAGED BLOCK"
        block: |
          [DEFAULT]
          bantime = 30m
          findtime = 10m
          maxretry = 5
          backend = systemd
          [sshd]
          enabled = true
          port = 22,33
          # Match the whole ssh unit: OpenSSH >= 9.8 logs as sshd-session,
          # a _COMM=sshd constraint would blind the jail.
          journalmatch = _SYSTEMD_UNIT=ssh.service
        backup: yes
      notify:
      - Restart fail2ban
      when: nocontainer.stat.exists == true

    - name: Enable and start fail2ban
      ansible.builtin.service:
        name: fail2ban
        state: started
        enabled: true
      when: nocontainer.stat.exists == true

    # Encrypted swap (random key per boot): unencrypted swap may leak
    # decrypted content (mails, database pages, key material) to disk.
    # Same recipe the Debian installer generates (plain dm-crypt swap with
    # a /dev/urandom key): nothing to enter, fresh key every boot, old
    # swap pages unreadable. Only block devices are handled (swap files
    # are reported, not converted); no swap at all (typical for cloud
    # images) is a valid end state.
    - name: Detect swap entries in fstab
      ansible.builtin.shell: awk '$3 == "swap" {print $1}' /etc/fstab 2>/dev/null || true
      register: hardening_swap_fstab
      changed_when: false
      when: nocontainer.stat.exists == true

    - name: Set swap source fact (first non-mapper fstab swap entry)
      ansible.builtin.set_fact:
        hardening_swap_src: "{{ (hardening_swap_fstab.stdout_lines | default([]) | reject('match', '^/dev/mapper/') | list | first) | default('') }}"
      when:
        - nocontainer.stat.exists == true
        - hardening_swap_fstab.stdout | default('') | length > 0

    - name: Resolve swap device UUID
      ansible.builtin.shell: test -b {{ hardening_swap_src }} && blkid -s UUID -o value {{ hardening_swap_src }} 2>/dev/null || true
      register: hardening_swap_uuid
      changed_when: false
      when:
        - nocontainer.stat.exists == true
        - hardening_swap_src | default('') | length > 0

    - name: Report unhandled swap (file or already encrypted)
      ansible.builtin.debug:
        msg: >-
          Swap {{ hardening_swap_src }} is not a plain block device or is
          already encrypted, leaving it untouched. Swap files cannot be
          encrypted this way; remove the file if swap is not wanted.
      when:
        - nocontainer.stat.exists == true
        - hardening_swap_src | default('') | length > 0
        - hardening_swap_uuid.stdout | default('') | length == 0

    - name: Install cryptsetup for encrypted swap
      ansible.builtin.apt:
        name: cryptsetup
        update_cache: no
        install_recommends: no
      when:
        - nocontainer.stat.exists == true
        - hardening_swap_uuid.stdout | default('') | length > 0

    - name: Encrypted swap via crypttab (random key, plain dm-crypt)
      ansible.builtin.blockinfile:
        path: /etc/crypttab
        create: yes
        mode: '0600'
        owner: root
        group: root
        marker: "# {mark} ANSIBLE MANAGED BLOCK CRYPTSWAP"
        block: |
          cryptswap UUID={{ hardening_swap_uuid.stdout }} /dev/urandom swap,offset=8,cipher=aes-xts-plain64
        backup: yes
      when:
        - nocontainer.stat.exists == true
        - hardening_swap_uuid.stdout | default('') | length > 0
      notify:
      - Reactivate swap

    - name: Point fstab swap at the encrypted mapper
      ansible.builtin.replace:
        path: /etc/fstab
        regexp: '^{{ hardening_swap_src | ansible.builtin.regex_escape }}\s+\S+\s+swap\s.*$'
        replace: '/dev/mapper/cryptswap none swap sw 0 0'
        backup: yes
      when:
        - nocontainer.stat.exists == true
        - hardening_swap_uuid.stdout | default('') | length > 0
      notify:
      - Reactivate swap

    - name: Verify swap runs on the encrypted mapper
      ansible.builtin.shell: swapon --show=NAME --noheadings 2>/dev/null | grep -q /dev/mapper/cryptswap && echo ENCRYPTED || echo PLAIN
      register: hardening_swap_verify
      changed_when: false
      failed_when: false
      when: nocontainer.stat.exists == true

    - name: Report swap state
      ansible.builtin.debug:
        msg: >-
          Swap state: {{ hardening_swap_verify.stdout | default('none present') }}.
          PLAIN means a reboot is still needed to activate the encrypted mapper.
      when:
        - nocontainer.stat.exists == true
        - hardening_swap_verify.stdout | default('') | length > 0



    - name: Register playbook as installed
      ansible.builtin.command: "{{ git_root }}/scripts/symbios-state.sh set base-services/hardening.yml"
      changed_when: false
  handlers:

    - name: Restart sshd
      service:
        name: ssh
        state: restarted

    - name: Restart fail2ban
      service:
        name: fail2ban
        state: restarted

    # Reactivate swap on the encrypted mapper without reboot. Skipped when
    # too much swap is in use (swapoff could OOM the box) - then the next
    # reboot activates it via crypttab/fstab.
    - name: Reactivate swap
      ansible.builtin.shell: |
        set -u
        f_used=$(free -m | awk '/^Swap:/ {print $3}')
        f_free=$(free -m | awk '/^Mem:/ {print $7}')
        if [ "${f_used}" -ge "${f_free}" ]
        then
          echo "too much swap in use (${f_used}M used, ${f_free}M free), reboot to activate encrypted swap"
          exit 0
        fi
        swapoff -a
        if systemctl restart systemd-cryptsetup@cryptswap 2>/dev/null
        then
          true
        else
          /lib/cryptsetup/cryptdisks_start cryptswap
        fi
        swapon -a
        swapon --show=NAME --noheadings
      changed_when: true
      failed_when: false


