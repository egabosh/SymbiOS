# docs:
#   short_description: Deploy the SymbiOS WebUI
#   description: Builds and runs the SymbiOS web interface (Django/gunicorn), wires it to Traefik/Authelia, and configures the loopback break-glass and the audit-logging SSH executor.
#   author: Oliver Bohlen
#   version: '1.0'
#   license: GPLv3
#   copyright: Copyright 2026, Oliver Bohlen
#   min_ansible_version: '2.11'
#   platforms:
#   - name: Debian
#     versions:
#     - '13'
#   category: WebUI
#   service_control:
#     services:
#     - name: symbios-ui
#       type: docker
#       compose_file: /home/docker/symbios-ui/docker-compose.yml
#       status: test -d /home/docker/symbios-ui || exit 2; docker compose -f /home/docker/symbios-ui/docker-compose.yml ps | grep -q "Up "
#     logs:
#     - name: symbios-ui
#       command: docker compose -f /home/docker/symbios-ui/docker-compose.yml logs -f --tail=1000
#   actions:

---
- name: symbios-ui
  hosts: all

  vars:
    service_name: "symbios-ui"
    authelia_domain: "auth.{{ base_domain }}"
    traefik_domain: "traefik.{{ base_domain }}"
    service_domain: "{{ base_domain }}"
    docker_path: "/home/docker/{{ service_name }}"

  tasks:

    - name: Create required directories
      ansible.builtin.file:
        path: "{{ docker_path }}/{{ item.path }}"
        owner: "{{ item.owner }}"
        group: "{{ item.group }}"
        mode: "{{ item.mode }}"
        state: directory
      loop:
        - { path: "", owner: root, group: docker, mode: "0550" }
        - { path: "log", owner: "10000", group: "10000", mode: "0770" }
        - { path: "config", owner: "10000", group: "10000", mode: "0770" }
        - { path: "config/.ssh", owner: "10000", group: "10000", mode: "0770" }
        - { path: "webui", owner: "10000", group: "10000", mode: "0770" }

    - name: Create required systemd directories
      ansible.builtin.file:
        path: "{{ item.path }}"
        owner: "{{ item.owner }}"
        group: "{{ item.group }}"
        mode: "{{ item.mode }}"
        state: directory
      loop:
        - { path: "/etc/systemd/system/docker.service.d", owner: root, group: root, mode: "0755" }
        - { path: "/etc/systemd/system/containerd.service.d", owner: root, group: root, mode: "0755" }

    - name: Dockerfile
      ansible.builtin.copy:
        src: /home/SymbiOS/webui/Dockerfile
        dest: "{{ docker_path }}/Dockerfile"
        owner: root
        group: docker
        mode: "0440"
      notify: Restart {{ service_name }}

    - name: docker-compose.yml
      ansible.builtin.blockinfile:
        path: "{{ docker_path }}/docker-compose.yml"
        create: yes
        mode: "0440"
        owner: root
        group: docker
        marker: "# {mark} ANSIBLE MANAGED BLOCK"
        block: |
          name: ""

          services:

            symbios-webui:
              build:
                context: .
                dockerfile: Dockerfile
              container_name: symbios-webui
              ports:
                # Published only on the loopback interface. The WebUI is reached
                # externally only through Traefik + Authelia on :443; 127.0.0.1:8080
                # is the host-local break-glass (e.g. via SSH tunnel).
                - "127.0.0.1:8080:8080"
              volumes:
                - ./webui:/app
                - ./config:/config
                - ./log:/log
                # Playbook sources, read-only, so the WebUI can parse the
                # machine-readable '# docs:' blocks locally (no host helper).
                - /home/SymbiOS:/repo:ro
                - type: tmpfs
                  target: /app/db
                  tmpfs:
                    mode: 511
              restart: unless-stopped
              environment:
                - PYTHONUNBUFFERED=1
                - CONFIG_PATH=/config/inventory.yml
                - LDAP_URI=ldap://openldap
                - HOME=/app
                - DJANGO_SECRET_KEY={{ lookup("password", "/home/docker/symbios-ui/.django_secret_key length=50 chars=ascii_letters,digits") }}
              networks:
                traefik:
                  aliases:
                    - symbios-ui

          networks:
            traefik:
              external: true
        backup: yes
      notify: Restart {{ service_name }}

    - name: Sync webui source
      ansible.builtin.copy:
        src: /home/SymbiOS/webui/
        dest: "{{ docker_path }}/webui/"
        mode: preserve
        owner: "10000"
        group: "10000"
        # Keep synced directories aligned with "Create required directories" so
        # the directory mode (0770) and ownership (10000:10000) stay stable across
        # runs; otherwise this task would reset the webui dir and flip it back.
        directory_mode: "0770"
      notify: Restart {{ service_name }}

    - name: Set permissions
      ansible.builtin.command:
        cmd: "find {{ docker_path }}/webui -type f -exec chmod o+r {} +"
      changed_when: false

    - name: Generate SSH key for webui remote execution
      ansible.builtin.command:
        cmd: ssh-keygen -t ed25519 -f /home/docker/symbios-ui/config/.ssh/id_symbios -N "" -C "symbios-webui"
        creates: /home/docker/symbios-ui/config/.ssh/id_symbios

    - name: Fix permissions on SSH key
      ansible.builtin.file:
        path: /home/docker/symbios-ui/config/.ssh/{{ item.path }}
        owner: root
        group: "10000"
        mode: "{{ item.mode }}"
      loop:
        - { path: id_symbios, mode: "640" }
        - { path: id_symbios.pub, mode: "644" }

    - name: Read SSH public key
      ansible.builtin.slurp:
        src: /home/docker/symbios-ui/config/.ssh/id_symbios.pub
      register: symbios_ssh_pubkey_raw

    - name: Set webserver SSH pubkey fact
      ansible.builtin.set_fact:
        symbios_ssh_pubkey: "{{ symbios_ssh_pubkey_raw.content | b64decode | trim }}"

    - name: Add webui SSH key to root authorized_keys
      ansible.builtin.lineinfile:
        path: /root/.ssh/authorized_keys
        regexp: ".*symbios-webui$"
        line: '{{ symbios_ssh_pubkey }}'
        mode: "0644"
        create: yes

    - name: Install container-index systemd service
      ansible.builtin.copy:
        dest: /etc/systemd/system/symbios-container-index.service
        content: |
          [Unit]
          Description=Write Docker container index to /var/run
          After=docker.service

          [Service]
          Type=oneshot
          Environment=PATH=/home/SymbiOS/scripts:/usr/local/sbin:/usr/sbin:/usr/bin:/sbin:/bin
          ExecStart=/home/SymbiOS/scripts/symbios-container-index.sh
          User=root
          Group=root

    - name: Install container-index systemd timer
      ansible.builtin.copy:
        dest: /etc/systemd/system/symbios-container-index.timer
        content: |
          [Unit]
          Description=Update Docker container index every 60s

          [Timer]
          OnBootSec=30
          OnUnitActiveSec=60
          Unit=symbios-container-index.service

          [Install]
          WantedBy=timers.target

    - name: Create /usr/local/sbin/symbios-boot-unlock
      ansible.builtin.file:
        path: /usr/local/sbin/symbios-boot-unlock
        owner: root
        group: root
        state: directory
        mode: '0755'

    - name: Install boot unlock Python server
      ansible.builtin.copy:
        src: /home/SymbiOS/scripts/symbios-boot-unlock/unlock.py
        dest: /usr/local/sbin/symbios-boot-unlock/unlock.py
        owner: root
        group: root
        mode: "0755"

    - name: Install boot unlock LUKS helper
      ansible.builtin.copy:
        src: /home/SymbiOS/scripts/symbios-boot-unlock/symbios-boot-unlock-luks.sh
        dest: /usr/local/sbin/symbios-boot-unlock/symbios-boot-unlock-luks.sh
        owner: root
        group: root
        mode: "0755"

    - name: Install symbios-boot-unlock systemd service
      ansible.builtin.copy:
        dest: /etc/systemd/system/symbios-boot-unlock.service
        content: |
          [Unit]
          Description=SymbiOS boot unlock for encrypted /home
          After=network.target local-fs.target ssh.service sshd.service
          DefaultDependencies=no

          [Service]
          Type=oneshot
          RemainAfterExit=yes
          ExecStart=/usr/bin/python3 /usr/local/sbin/symbios-boot-unlock/unlock.py
          # Allow binding to privileged ports 80/443
          AmbientCapabilities=CAP_NET_BIND_SERVICE
          # Provide TTY for console unlock prompt
          StandardInput=tty
          TTYPath=/dev/tty1

          [Install]
          WantedBy=multi-user.target

    - name: Start graphical.target after Docker is ready
      ansible.builtin.copy:
        dest: /etc/systemd/system/symbios-graphical.service
        content: |
          [Unit]
          Description=Start graphical target after Docker
          After=docker.service
          Requires=docker.service

          [Service]
          Type=oneshot
          ExecStart=/usr/bin/systemctl start graphical.target

          [Install]
          WantedBy=multi-user.target

    - name: Docker waits for boot unlock before starting
      ansible.builtin.copy:
        dest: /etc/systemd/system/docker.service.d/symbios-unlock.conf
        content: |
          [Unit]
          After=symbios-boot-unlock.service

    - name: Containerd waits for boot unlock before starting
      ansible.builtin.copy:
        dest: /etc/systemd/system/containerd.service.d/symbios-unlock.conf
        content: |
          [Unit]
          After=symbios-boot-unlock.service

    - name: Enable symbios-boot-unlock service
      ansible.builtin.systemd:
        name: symbios-boot-unlock.service
        enabled: yes
        state: started

    - name: Set default target to multi-user (text mode at boot)
      ansible.builtin.command:
        cmd: systemctl set-default multi-user.target

    - name: Copy LE cert extraction script
      ansible.builtin.copy:
        src: /home/SymbiOS/scripts/symbios-boot-unlock/extract-le-cert.sh
        dest: /usr/local/sbin/symbios-boot-unlock/extract-le-cert.sh
        owner: root
        group: root
        mode: "0755"

    - name: "Cron: extract LE cert for boot unlock (every 5min)"
      ansible.builtin.cron:
        name: "symbios-extract-le-cert"
        minute: "*/5"
        job: "/usr/local/sbin/symbios-boot-unlock/extract-le-cert.sh"
        user: root

    - name: Copy restart-docker-services script
      ansible.builtin.copy:
        src: /home/SymbiOS/scripts/symbios-restart-docker-services.sh
        dest: /usr/local/sbin/symbios-restart-docker-services.sh
        owner: root
        group: root
        mode: "0755"

    - name: Install symbios-restart-docker-services systemd service
      ansible.builtin.copy:
        dest: /etc/systemd/system/symbios-restart-docker-services.service
        content: |
          [Unit]
          Description=Restart all Docker Compose services after boot
          After=docker.service network-online.target
          Wants=network-online.target

          [Service]
          Type=oneshot
          ExecStart=/usr/local/sbin/symbios-restart-docker-services.sh

          [Install]
          WantedBy=multi-user.target

    - name: Enable restart-docker-services service
      ansible.builtin.systemd:
        name: symbios-restart-docker-services.service
        enabled: yes

    - name: Reload systemd
      ansible.builtin.systemd:
        daemon_reload: yes

    - name: Enable container-index timer
      ansible.builtin.systemd:
        name: symbios-container-index.timer
        enabled: yes
        state: started

    - name: Inventory must be owned by the WebUI user so the UI can read/write it
      ansible.builtin.file:
        path: "{{ docker_path }}/config/inventory.yml"
        owner: "10000"
        group: "10000"
        mode: "0640"

    - name: Ensure symbios-ui container is running
      ansible.builtin.shell: docker compose up -d
      args:
        chdir: "{{ docker_path }}"
      changed_when: false

    - name: Install SymbiOS desktop icon
      ansible.builtin.copy:
        src: /home/SymbiOS/webui/main/static/main/img/symbios.svg
        dest: /usr/share/icons/hicolor/scalable/apps/symbios.svg
        owner: root
        group: root
        mode: "0644"

    - name: Update icon cache
      ansible.builtin.command:
        cmd: gtk-update-icon-cache -f -t /usr/share/icons/hicolor
      changed_when: false
      failed_when: false

    - name: Install SymbiOS WebUI .desktop file (system-wide app menu)
      ansible.builtin.copy:
        dest: /usr/share/applications/symbios-webui.desktop
        owner: root
        group: root
        mode: "0644"
        content: |
          [Desktop Entry]
          Version=1.0
          Type=Link
          Name=SymbiOS WebUI
          Comment=Open SymbiOS Web Management Interface
          URL=http://localhost:8080
          Icon=symbios
          Terminal=false
          Categories=Network;WebBrowser;

    - name: Ensure /etc/skel/Desktop exists for new users
      ansible.builtin.file:
        path: /etc/skel/Desktop
        state: directory
        owner: root
        group: root
        mode: "0755"

    - name: SymbiOS WebUI .desktop file for new users (skel)
      ansible.builtin.copy:
        dest: /etc/skel/Desktop/symbios-webui.desktop
        owner: root
        group: root
        mode: "0755"
        content: |
          [Desktop Entry]
          Version=1.0
          Type=Link
          Name=SymbiOS WebUI
          Comment=Open SymbiOS Web Management Interface
          URL=http://localhost:8080
          Icon=symbios
          Terminal=false
          Categories=Network;WebBrowser;

    - name: Ensure symbios user Desktop directory exists
      ansible.builtin.file:
        path: /home/symbios/Desktop
        state: directory
        owner: "1000"
        group: "1000"
        mode: "0755"
      failed_when: false

    - name: SymbiOS WebUI .desktop file for symbios user
      ansible.builtin.copy:
        dest: /home/symbios/Desktop/symbios-webui.desktop
        owner: "1000"
        group: "1000"
        mode: "0755"
        content: |
          [Desktop Entry]
          Version=1.0
          Type=Link
          Name=SymbiOS WebUI
          Comment=Open SymbiOS Web Management Interface
          URL=http://localhost:8080
          Icon=symbios
          Terminal=false
          Categories=Network;WebBrowser;
      failed_when: false

    - name: Seed pinned SSH known_hosts for exec gateway
      # Pin the host key used by the WebUI's SSH exec path. The WebUI connects
      # to the traefik network gateway (192.168.41.1:33); we record the real
      # host key under that IP and localhost so the fingerprint policy can match.
      ansible.builtin.shell: |
        set -e
        KH="{{ docker_path }}/config/.ssh/known_hosts"
        tmp=$(mktemp)
        ssh-keyscan -t ed25519,ecdsa,rsa -p 22 127.0.0.1 > "$tmp" 2>/dev/null || true
        if [ ! -s "$tmp" ]; then
          echo "ssh-keyscan failed" >&2
          exit 1
        fi
        tokens="192.168.41.1,localhost,127.0.0.1"
        : > "$KH"
        while read -r line; do
          case "$line" in \#*) continue;; esac
          keytype=$(echo "$line" | awk '{print $2}')
          key=$(echo "$line" | awk '{print $3}')
          [ -z "$keytype" ] && continue
          echo "$tokens $keytype $key" >> "$KH"
        done < "$tmp"
        chmod 644 "$KH"
        chown root:10000 "$KH"
        rm -f "$tmp"
      args:
        executable: /bin/bash
      changed_when: false

    - name: Register playbook as installed
      ansible.builtin.command: symbios-state.sh set base-services/symbios-ui.yml
      changed_when: false
  handlers:

    - name: Restart {{ service_name }}
      ansible.builtin.shell: |
        if docker compose build --no-cache
        then
          if docker compose down
          then
            docker compose up -d
          fi
        fi
      args:
        chdir: "{{ docker_path }}"

