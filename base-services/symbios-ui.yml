# docs:
#   short_description: Deploy the SymbiOS WebUI
#   description: Builds and runs the SymbiOS web interface (Django/gunicorn), wires it to Traefik/Authelia, and configures the loopback break-glass and the audit-logging SSH executor.
#   url: "https://{{ base_domain }}"
#   author: Oliver Bohlen
#   version: '1.0'
#   license: GPLv3
#   copyright: Copyright (c) 2026, Oliver Bohlen
#   min_ansible_version: '2.11'
#   platforms:
#   - name: Debian
#     versions:
#     - '13'
#   category: WebUI
#   service_control:
#     services:
#     - name: symbios-ui
#       type: docker
#       compose_file: /symbios/base-services/symbios-ui/docker-compose.yml
#       status: test -d /symbios/base-services/symbios-ui || exit 2; docker compose -f /symbios/base-services/symbios-ui/docker-compose.yml ps | grep -q "Up "
#     logs:
#     - name: symbios-ui
#       command: docker compose -f /symbios/base-services/symbios-ui/docker-compose.yml logs -f --tail=1000
#   actions:

---
- name: symbios-ui
  hosts: all

  vars:
    service_name: "symbios-ui"
    authelia_domain: "auth.{{ base_domain }}"
    traefik_domain: "traefik.{{ base_domain }}"
    service_domain: "{{ base_domain }}"
    docker_path: "{{ base_services_root }}/{{ service_name }}"

  tasks:

    - name: Create required directories
      ansible.builtin.file:
        path: "{{ docker_path }}/{{ item.path }}"
        owner: "{{ item.owner }}"
        group: "{{ item.group }}"
        mode: "{{ item.mode }}"
        state: directory
      loop:
        - { path: "", owner: root, group: docker, mode: "0550" }
        - { path: "log", owner: "10000", group: "10000", mode: "0770" }
        - { path: "config", owner: "10000", group: "10000", mode: "0770" }
        - { path: "config/.ssh", owner: "10000", group: "10000", mode: "0770" }
        - { path: "webui", owner: "10000", group: "10000", mode: "0770" }

    - name: Create required systemd directories
      ansible.builtin.file:
        path: "{{ item.path }}"
        owner: "{{ item.owner }}"
        group: "{{ item.group }}"
        mode: "{{ item.mode }}"
        state: directory
      loop:
        - { path: "/etc/systemd/system/docker.service.d", owner: root, group: root, mode: "0755" }
        - { path: "/etc/systemd/system/containerd.service.d", owner: root, group: root, mode: "0755" }

    - name: Dockerfile
      ansible.builtin.copy:
        src: "{{ git_root }}/webui/Dockerfile"
        dest: "{{ docker_path }}/Dockerfile"
        owner: root
        group: docker
        mode: "0440"
      notify: Restart {{ service_name }}

    - name: docker-compose.yml
      ansible.builtin.blockinfile:
        path: "{{ docker_path }}/docker-compose.yml"
        create: yes
        mode: "0440"
        owner: root
        group: docker
        marker: "# {mark} ANSIBLE MANAGED BLOCK"
        block: |
          name: ""

          services:

            symbios-webui:
              build:
                context: .
                dockerfile: Dockerfile
              container_name: symbios-base-webui
              ports:
                # Published on all interfaces. Access is restricted to private
                # IPv4/IPv6 networks by UFW (firewall.yml) and DOCKER-USER
                # iptables rules (docker.yml); 0.0.0.0:8080 stays reachable
                # as host-local break-glass (e.g. via SSH tunnel).
                - "0.0.0.0:8080:8080"
              volumes:
                - ./webui:/app
                - ./config:/config
                - ./log:/log
                # Playbook sources, read-only, so the WebUI can parse the
                # machine-readable '# docs:' blocks locally (no host helper).
                - {{ git_root }}:/repo:ro
                - type: tmpfs
                  target: /app/db
                  tmpfs:
                    mode: 511
              restart: unless-stopped
              environment:
                - PYTHONUNBUFFERED=1
                - CONFIG_PATH=/config/inventory.yml
                - LDAP_URI=ldap://symbios-base-ldap
                - HOME=/app
                - DJANGO_SECRET_KEY={{ lookup("password", docker_path ~ "/.django_secret_key length=50 chars=ascii_letters,digits") }}
              networks:
                symbios_base_services:
                  aliases:
                    - symbios-ui

          networks:
            symbios_base_services:
              external: true
        backup: yes
      notify: Restart {{ service_name }}

    - name: Sync webui source
      ansible.builtin.copy:
        src: "{{ git_root }}/webui/"
        dest: "{{ docker_path }}/webui/"
        mode: preserve
        owner: "10000"
        group: "10000"
        # Keep synced directories aligned with "Create required directories" so
        # the directory mode (0770) and ownership (10000:10000) stay stable across
        # runs; otherwise this task would reset the webui dir and flip it back.
        directory_mode: "0770"
      notify: Restart {{ service_name }}

    - name: Set permissions
      ansible.builtin.command:
        cmd: "find {{ docker_path }}/webui -type f -exec chmod o+r {} +"
      changed_when: false

    - name: Generate SSH key for webui remote execution
      ansible.builtin.command:
        cmd: ssh-keygen -t ed25519 -f {{ base_services_root }}/symbios-ui/config/.ssh/id_symbios -N "" -C "symbios-base-webui"
        creates: "{{ base_services_root }}/symbios-ui/config/.ssh/id_symbios"

    - name: Fix permissions on SSH key
      ansible.builtin.file:
        path: "{{ base_services_root }}/symbios-ui/config/.ssh/{{ item.path }}"
        owner: root
        group: "10000"
        mode: "{{ item.mode }}"
      loop:
        - { path: id_symbios, mode: "640" }
        - { path: id_symbios.pub, mode: "644" }

    - name: Read SSH public key
      ansible.builtin.slurp:
        src: "{{ base_services_root }}/symbios-ui/config/.ssh/id_symbios.pub"
      register: symbios_ssh_pubkey_raw

    - name: Set webserver SSH pubkey fact
      ansible.builtin.set_fact:
        symbios_ssh_pubkey: "{{ symbios_ssh_pubkey_raw.content | b64decode | trim }}"

    - name: Add webui SSH key to root authorized_keys
      ansible.builtin.lineinfile:
        path: /root/.ssh/authorized_keys
        regexp: ".*symbios-base-webui$"
        line: '{{ symbios_ssh_pubkey }}'
        mode: "0644"
        create: yes

    - name: /etc/cron.d/container-index_local
      ansible.builtin.blockinfile:
        path: /etc/cron.d/container-index_local
        create: yes
        mode: 0644
        owner: root
        group: root
        marker: "# {mark} ANSIBLE MANAGED BLOCK"
        block: |
          SHELL=/bin/bash
          * * * * * root PATH={{ git_root }}/scripts:$PATH && [[ -s {{ git_root }}/scripts/symbios-container-index.sh ]] && symbios-container-index.sh >/dev/null 2>&1
        backup: yes

    - name: Create /usr/local/sbin/symbios-boot-unlock
      ansible.builtin.file:
        path: /usr/local/sbin/symbios-boot-unlock
        owner: root
        group: root
        state: directory
        mode: '0755'

    - name: Install boot unlock Python server
      ansible.builtin.copy:
        src: "{{ git_root }}/scripts/symbios-boot-unlock/unlock.py"
        dest: /usr/local/sbin/symbios-boot-unlock/unlock.py
        owner: root
        group: root
        mode: "0755"

    - name: Install boot unlock LUKS helper
      ansible.builtin.copy:
        src: "{{ git_root }}/scripts/symbios-boot-unlock/symbios-boot-unlock-luks.sh"
        dest: /usr/local/sbin/symbios-boot-unlock/symbios-boot-unlock-luks.sh
        owner: root
        group: root
        mode: "0755"

    - name: Install data partition manager
      ansible.builtin.copy:
        src: "{{ git_root }}/scripts/symbios-data-partition.sh"
        dest: /usr/local/sbin/symbios-data-partition.sh
        owner: root
        group: root
        mode: "0755"

    - name: Get current default target
      ansible.builtin.command:
        cmd: systemctl get-default
      register: current_default_target
      changed_when: false

    - name: Set default target to multi-user (text mode at boot)
      ansible.builtin.command:
        cmd: systemctl set-default multi-user.target
      when: current_default_target.stdout != 'multi-user.target'

    - name: Disable docker and containerd auto-start (handled by rc.local)
      ansible.builtin.systemd:
        name: "{{ item }}"
        enabled: no
      loop:
        - docker.service
        - containerd.service

    - name: Ensure rc.local has shebang
      ansible.builtin.lineinfile:
        path: /etc/rc.local
        regexp: '^#!/bin/bash'
        line: '#!/bin/bash'
        create: yes
        mode: '0755'
        insertbefore: BOF

    - name: Ensure rc.local ends with exit 0
      ansible.builtin.lineinfile:
        path: /etc/rc.local
        regexp: '^exit 0'
        line: 'exit 0'

    - name: Insert SymbiOS boot sequence before exit 0
      ansible.builtin.blockinfile:
        path: /etc/rc.local
        insertbefore: 'exit 0'
        marker: "# {mark} SymbiOS boot sequence"
        block: |
          # Start the boot unlock server only if a LUKS device exists
          if blkid | grep -q 'LABEL="CRYPT_LUKS_SYMBIOS_DATA"'
          then
            /usr/local/sbin/symbios-boot-unlock/unlock.py
            # Mount /symbios (no passphrase needed once LUKS is open, fstab entry is noauto)
            mount /symbios 2>/dev/null || true
          else
            echo "WARNING: No LUKS device (CRYPT_LUKS_SYMBIOS_DATA) found - /symbios not encrypted."
          fi
          systemctl start docker
          [[ -x /usr/sbin/lightdm ]] && systemctl start lightdm
          sleep 30 ; systemctl start runchecks

    - name: Deploy rc-local systemd unit with Install section
      ansible.builtin.copy:
        dest: /etc/systemd/system/rc-local.service
        owner: root
        group: root
        mode: "0644"
        content: |
          # SPDX-License-Identifier: LGPL-2.1-or-later
          [Unit]
          Description=/etc/rc.local Compatibility
          Documentation=man:systemd-rc-local-generator(8)
          ConditionFileIsExecutable=/etc/rc.local
          After=network.target

          [Service]
          Type=forking
          ExecStart=/etc/rc.local start
          TimeoutSec=infinity
          RemainAfterExit=yes
          GuessMainPID=no

          [Install]
          WantedBy=multi-user.target

    - name: Enable rc-local service
      ansible.builtin.systemd:
        name: rc-local
        enabled: yes
        daemon_reload: yes
        state: started

    - name: Copy LE cert extraction script
      ansible.builtin.copy:
        src: "{{ git_root }}/scripts/symbios-boot-unlock/extract-le-cert.sh"
        dest: /usr/local/sbin/symbios-boot-unlock/extract-le-cert.sh
        owner: root
        group: root
        mode: "0755"

    - name: "Cron: extract LE cert for boot unlock (every 5min)"
      ansible.builtin.cron:
        name: "symbios-extract-le-cert"
        minute: "*/5"
        job: "/usr/local/sbin/symbios-boot-unlock/extract-le-cert.sh"
        user: root

    - name: Inventory must be owned by the WebUI user so the UI can read/write it
      ansible.builtin.file:
        path: "{{ docker_path }}/config/inventory.yml"
        owner: "10000"
        group: "10000"
        mode: "0640"

    - name: Ensure symbios-ui container is running
      ansible.builtin.shell: docker compose up -d
      args:
        chdir: "{{ docker_path }}"
      changed_when: false

    - name: Install SymbiOS desktop icon
      ansible.builtin.copy:
        src: "{{ git_root }}/webui/main/static/main/img/symbios.svg"
        dest: /usr/share/icons/hicolor/scalable/apps/symbios.svg
        owner: root
        group: root
        mode: "0644"

    - name: Update icon cache
      ansible.builtin.command:
        cmd: gtk-update-icon-cache -f -t /usr/share/icons/hicolor
      changed_when: false
      failed_when: false

    - name: Install SymbiOS WebUI .desktop file (system-wide app menu)
      ansible.builtin.copy:
        dest: /usr/share/applications/symbios-webui.desktop
        owner: root
        group: root
        mode: "0644"
        content: |
          [Desktop Entry]
          Version=1.0
          Type=Link
          Name=SymbiOS WebUI
          Comment=Open SymbiOS Web Management Interface
          URL=http://localhost:8080
          Icon=symbios
          Terminal=false
          Categories=Network;WebBrowser;

    - name: Ensure /etc/skel/Desktop exists for new users
      ansible.builtin.file:
        path: /etc/skel/Desktop
        state: directory
        owner: root
        group: root
        mode: "0755"

    - name: SymbiOS WebUI .desktop file for new users (skel)
      ansible.builtin.copy:
        dest: /etc/skel/Desktop/symbios-webui.desktop
        owner: root
        group: root
        mode: "0755"
        content: |
          [Desktop Entry]
          Version=1.0
          Type=Link
          Name=SymbiOS WebUI
          Comment=Open SymbiOS Web Management Interface
          URL=http://localhost:8080
          Icon=symbios
          Terminal=false
          Categories=Network;WebBrowser;

    - name: Ensure symbios user Desktop directory exists
      ansible.builtin.file:
        path: /home/symbios/Desktop
        state: directory
        owner: "1000"
        group: "1000"
        mode: "0755"
      failed_when: false

    - name: SymbiOS WebUI .desktop file for symbios user
      ansible.builtin.copy:
        dest: /home/symbios/Desktop/symbios-webui.desktop
        owner: "1000"
        group: "1000"
        mode: "0755"
        content: |
          [Desktop Entry]
          Version=1.0
          Type=Link
          Name=SymbiOS WebUI
          Comment=Open SymbiOS Web Management Interface
          URL=http://localhost:8080
          Icon=symbios
          Terminal=false
          Categories=Network;WebBrowser;
      failed_when: false

    - name: Seed pinned SSH known_hosts for exec gateway
      # Pin the host key used by the WebUI's SSH exec path. The WebUI connects
      # to the symbios_base_services network gateway (192.168.41.1:33); we record the real
      # host key under that IP and localhost so the fingerprint policy can match.
      ansible.builtin.shell: |
        set -e
        KH="{{ docker_path }}/config/.ssh/known_hosts"
        tmp=$(mktemp)
        ssh-keyscan -t ed25519,ecdsa,rsa -p 22 127.0.0.1 > "$tmp" 2>/dev/null || true
        if [ ! -s "$tmp" ]; then
          echo "ssh-keyscan failed" >&2
          exit 1
        fi
        tokens="192.168.41.1,localhost,127.0.0.1"
        : > "$KH"
        while read -r line; do
          case "$line" in \#*) continue;; esac
          keytype=$(echo "$line" | awk '{print $2}')
          key=$(echo "$line" | awk '{print $3}')
          [ -z "$keytype" ] && continue
          echo "$tokens $keytype $key" >> "$KH"
        done < "$tmp"
        chmod 644 "$KH"
        chown root:10000 "$KH"
        rm -f "$tmp"
      args:
        executable: /bin/bash
      changed_when: false

    - name: Register playbook as installed
      ansible.builtin.command: "{{ git_root }}/scripts/symbios-state.sh set base-services/symbios-ui.yml"
      changed_when: false
  handlers:

    - name: Restart {{ service_name }}
      ansible.builtin.shell: |
        if docker compose build --no-cache
        then
          if docker compose down
          then
            docker compose up -d
          fi
        fi
      args:
        chdir: "{{ docker_path }}"

