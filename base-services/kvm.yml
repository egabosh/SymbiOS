# docs:
#   name: KVM
#   short_description: Install and configure KVM/libvirt for virtual machines
#   description: 'Installs QEMU/KVM and libvirt, configures storage pools and networking, and prepares the host for running VMs (e.g. OpenWrt, Nextcloud AIO, HomeAssistant). Only runs on bare-metal or KVM-capable hosts - skipped in containers and on non-x86_64/arm64 systems without hardware virtualization.'
#   author: Oliver Bohlen
#   version: '1.0'
#   license: GPLv3
#   copyright: Copyright (c) 2026, Oliver Bohlen
#   min_ansible_version: '2.11'
#   platforms:
#   - name: Debian
#     versions:
#     - '13'
#   category: Virtualization
#   service_control:
#     services:
#     - name: libvirtd
#       type: systemd
#       unit: libvirtd.service
#       status: systemctl is-active libvirtd.service
#     logs:
#     - name: libvirtd
#       command: journalctl -fu libvirtd.service -n 1000
#   actions:
#     restart: systemctl restart libvirtd.service

---

- name: KVM/libvirt Virtualization Setup
  hosts: all
  tasks:

    # Only run on hosts with systemd (not in containers)
    - name: Check if we are in a container env by existing systemd
      ansible.builtin.stat:
        path: /lib/systemd/systemd
      register: nocontainer

    # Check CPU virtualization support (hardware virt)
    - name: Check for hardware virtualization support
      ansible.builtin.command: grep -Ec '(vmx|svm)' /proc/cpuinfo
      register: cpu_virt_check
      changed_when: false
      failed_when: false
      when: nocontainer.stat.exists

    - name: Set hardware virtualization fact
      ansible.builtin.set_fact:
        has_hw_virt: "{{ (cpu_virt_check.rc | default(1)) == 0 and (cpu_virt_check.stdout | default('0') | int) > 0 }}"
      when: nocontainer.stat.exists

    # Only install on x86_64 or arm64 with hardware virt
    - name: Check system architecture
      ansible.builtin.command: uname -m
      register: host_arch
      changed_when: false
      when: nocontainer.stat.exists

    - name: Set KVM-capable fact
      ansible.builtin.set_fact:
        kvm_capable: "{{ nocontainer.stat.exists | default(false) | bool and (has_hw_virt | default(false) | bool or host_arch.stdout | default('') in ['x86_64', 'aarch64']) }}"
      when: nocontainer.stat.exists

    # Install KVM packages
    - name: Install KVM and libvirt packages
      ansible.builtin.apt:
        name:
          - qemu-kvm
          - libvirt-daemon-system
          - libvirt-clients
          - bridge-utils
          - virtinst
          - ovmf
        state: present
        update_cache: yes
        cache_valid_time: 3600
        install_recommends: no
      when: kvm_capable | default(false) | bool

    # Add symbios user (UID 1000) to libvirt and kvm groups
    - name: Add symbios user to libvirt group
      ansible.builtin.user:
        name: symbios
        groups: libvirt
        append: yes
      when: kvm_capable | default(false) | bool

    - name: Add symbios user to kvm group
      ansible.builtin.user:
        name: symbios
        groups: kvm
        append: yes
      when: kvm_capable | default(false) | bool

    # Create KVM storage directories under /symbios
    - name: Create KVM storage directories
      ansible.builtin.file:
        path: "{{ item.path }}"
        owner: root
        group: libvirt
        state: directory
        mode: "{{ item.mode }}"
      loop:
        - { path: "{{ data_root }}/kvm", mode: "0750" }
        - { path: "{{ data_root }}/kvm/images", mode: "0750" }
        - { path: "{{ data_root }}/kvm/iso", mode: "0755" }
        - { path: "{{ data_root }}/kvm/snapshots", mode: "0750" }
      when: kvm_capable | default(false) | bool

    # Enable and start libvirtd
    - name: Ensure libvirtd is started
      ansible.builtin.service:
        name: libvirtd
        state: started
      when: kvm_capable | default(false) | bool

    - name: Ensure libvirtd is enabled
      ansible.builtin.command: systemctl is-enabled libvirtd
      register: libvirtd_enabled
      changed_when: "'enabled' not in libvirtd_enabled.stdout"
      failed_when: false
      when: kvm_capable | default(false) | bool

    - name: Enable libvirtd if not already enabled
      ansible.builtin.command: systemctl enable libvirtd
      changed_when: true
      when:
        - kvm_capable | default(false) | bool
        - "'enabled' not in libvirtd_enabled.stdout | default('')"

    # Configure default storage pool pointing to /symbios/kvm/images
    - name: Define default storage pool
      community.libvirt.virt_pool:
        name: default
        state: active
        autostart: yes
        xml: |
          <pool type='dir'>
            <name>default</name>
            <target>
              <path>{{ data_root }}/kvm/images</path>
              <permissions>
                <owner>0</owner>
                <group>107</group>
                <mode>0750</mode>
              </permissions>
            </target>
          </pool>
      when: kvm_capable | default(false) | bool
      register: pool_result
      failed_when: false

    # Build default XML for storage pool when virt_pool module fails
    - name: Fallback - create default storage pool via virsh
      ansible.builtin.shell: |
        virsh pool-define-as default dir --target {{ data_root }}/kvm/images 2>/dev/null && \
        virsh pool-build default 2>/dev/null && \
        virsh pool-start default 2>/dev/null && \
        virsh pool-autostart default 2>/dev/null && \
        echo "pool-created" || echo "pool-already-exists"
      register: pool_fallback
      changed_when: "'pool-created' in pool_fallback.stdout"
      failed_when: false
      when: kvm_capable | default(false) | bool and pool_result is failed

    # Enable nested virtualization if on Intel/AMD (needed for nested KVM)
    - name: Enable nested virtualization for Intel
      ansible.builtin.shell: |
        modprobe -r kvm_intel 2>/dev/null || true
        echo "options kvm_intel nested=Y" > /etc/modprobe.d/kvm-intel.conf
        modprobe kvm_intel 2>/dev/null || true
        echo "done"
      register: kvm_intel_mod
      changed_when: false
      failed_when: false
      when: kvm_capable | default(false) | bool and host_arch.stdout | default('') == 'x86_64'

    - name: Enable nested virtualization for AMD
      ansible.builtin.shell: |
        modprobe -r kvm_amd 2>/dev/null || true
        echo "options kvm_amd nested=1" > /etc/modprobe.d/kvm-amd.conf
        modprobe kvm_amd 2>/dev/null || true
        echo "done"
      register: kvm_amd_mod
      changed_when: false
      failed_when: false
      when: kvm_capable | default(false) | bool and host_arch.stdout | default('') == 'x86_64'

    # ── Boot restore for VMs ────────────────────────────────────────────
    # VM images live on /symbios (LUKS), which is only mounted by rc.local
    # after the boot-unlock (fstab entry is noauto). libvirt/systemd must NOT
    # auto-start VMs at boot before the mount. Restore is handled as:
    #   - clean shutdown: libvirt-guests managedsave (running VMs only)
    #   - boot after mount: rc.local starts libvirt-guests (resumes VMs with
    #     a managed save; a stopped VM has no save and stays stopped)
    #   - power loss / crash: no managed save exists, but the qemu hook
    #     recorded the last known state in /var/lib/symbios-vm-state/ -
    #     rc.local cold-starts VMs whose flag says they were running
    - name: Disable libvirt autostart for all VMs (restore handled by rc.local + hook)
      ansible.builtin.shell: |
        for f_vm in $(virsh list --all --name)
        do
          [ -n "$f_vm" ] || continue
          virsh autostart --disable "$f_vm" 2>/dev/null
        done
        echo "autostart-disabled"
      register: vm_autostart_all
      changed_when: false
      failed_when: false
      when: kvm_capable | default(false) | bool

    # libvirt-guests: save running guests on host shutdown as managedsave,
    # restore them on host boot. Must NOT run at systemd boot time (the
    # /symbios data root may still be locked) - start it from rc.local
    # instead, so it is disabled here and only active after the mount.
    - name: Configure libvirt-guests to suspend running guests on shutdown
      ansible.builtin.lineinfile:
        path: /etc/default/libvirt-guests
        regexp: '^ON_SHUTDOWN='
        line: 'ON_SHUTDOWN=suspend'
        create: yes
      when: kvm_capable | default(false) | bool

    - name: Configure libvirt-guests to restore guests on boot
      ansible.builtin.lineinfile:
        path: /etc/default/libvirt-guests
        regexp: '^ON_BOOT='
        line: 'ON_BOOT=start'
        create: yes
      when: kvm_capable | default(false) | bool

    # libvirt-guests must not resume guests before /symbios is mounted - it
    # would try to open the qcow2 on an unmounted volume. Since it is disabled
    # here and only started from rc.local (after mount), that cannot happen.
    - name: Disable libvirt-guests boot autostart (started by rc.local)
      ansible.builtin.systemd:
        name: libvirt-guests
        enabled: false
        daemon_reload: true
      when: kvm_capable | default(false) | bool

    # qemu hook: record the last running state of every VM in
    # /var/lib/symbios-vm-state/<domain> (root fs, survives reboot). This
    # allows rc.local to cold-start VMs after a power loss, where no managed
    # save was written by libvirt-guests.
    - name: Ensure /var/lib/symbios-vm-state directory exists
      ansible.builtin.file:
        path: /var/lib/symbios-vm-state
        state: directory
        mode: '0755'
        owner: root
        group: root
      when: kvm_capable | default(false) | bool

    - name: Deploy libvirt qemu hook to record VM last states
      ansible.builtin.copy:
        dest: /etc/libvirt/hooks/qemu
        mode: '0755'
        owner: root
        group: root
        content: |
          #!/bin/bash
          # SymbiOS - record the last running state of every qemu VM.
          # Called by libvirt for each qemu domain lifecycle event.
          # On start -> "running", on stop -> "stopped", stored on the root
          # filesystem (survives reboots) in /var/lib/symbios-vm-state/.
          # rc.local reads these after boot to cold-start VMs that were
          # running when power was lost (no managed save exists then).
          f_dom="$1"
          f_op="$2"
          [ -n "$f_dom" ] || exit 0
          case "$f_op" in
            start|started|prepare|restore)
              mkdir -p /var/lib/symbios-vm-state
              echo running > "/var/lib/symbios-vm-state/$f_dom"
              ;;
            stopped|release)
              mkdir -p /var/lib/symbios-vm-state
              echo stopped > "/var/lib/symbios-vm-state/$f_dom"
              ;;
          esac
          exit 0
      notify: Restart libvirtd to activate qemu hook
      when: kvm_capable | default(false) | bool

    # Remove the legacy openwrt-specific rc.local block that the old
    # openwrt-vm playbook inserted (superseded by the generic block below).
    - name: Remove legacy OpenWrt rc.local restore block
      ansible.builtin.blockinfile:
        path: /etc/rc.local
        state: absent
        marker: "# {mark} SymbiOS OpenWrt VM start"
      when: kvm_capable | default(false) | bool

    # rc.local mounts /symbios after the LUKS boot-unlock, so the VM restore
    # must happen there (after the mount), not by systemd at boot.
    - name: Insert VM restore into rc.local boot sequence
      ansible.builtin.blockinfile:
        path: /etc/rc.local
        create: true
        mode: '0755'
        insertbefore: 'exit 0'
        marker: "# {mark} SymbiOS VM restore"
        block: |
          # Restore libvirt VMs once /symbios is mounted (LUKS boot-unlock).
          # 1) libvirt-guests resumes VMs with a managed save from a clean
          #    host shutdown (a stopped VM has no save and stays stopped).
          # 2) Power-loss / crash fallback: if no managed save was written but
          #    the qemu hook recorded "running", cold-start those VMs.
          systemctl start libvirt-guests 2>/dev/null || true
          for f_state in /var/lib/symbios-vm-state/*
          do
            [ -f "$f_state" ] || continue
            f_vm="$(basename "$f_state")"
            if [ "$(cat "$f_state")" = "running" ] && \
               ! virsh list --state-running --name | grep -qx "$f_vm"
            then
              if virsh dominfo "$f_vm" >/dev/null 2>&1
              then
                virsh start "$f_vm" 2>/dev/null || true
              fi
            fi
          done
      when: kvm_capable | default(false) | bool

    # Register playbook as installed
    - name: Register playbook as installed
      ansible.builtin.command: "{{ git_root }}/scripts/symbios-state.sh set base-services/kvm.yml"
      changed_when: false

  handlers:
    # libvirtd reads the qemu hook path on each event, but there is a catch:
    # if the hook file did not exist when libvirtd started, it is not picked
    # up until the daemon (re)starts. Restart after (re)deploying the hook.
    - name: Restart libvirtd to activate qemu hook
      ansible.builtin.service:
        name: libvirtd
        state: restarted
