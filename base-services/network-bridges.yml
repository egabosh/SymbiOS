# docs:
#   name: Network Bridges
#   short_description: Assign physical interfaces to Linux bridges
#   description: Manages the assignment of unused physical interfaces (e.g. wlan0) to existing Linux bridges. Assignments are applied via ip link and persisted in /etc/rc.local so they survive a reboot.
#   author: Oliver Bohlen
#   version: '1.0'
#   license: GPLv3
#   copyright: Copyright (c) 2026, Oliver Bohlen
#   min_ansible_version: '2.11'
#   platforms:
#   - name: Debian
#     versions:
#     - '13'
#   category: Network
#   service_control:
#     services: []
#     logs: []
#   actions: {}
---
- name: Network Bridge Assignments
  hosts: localhost
  become: true
  tasks:
    - name: Ensure iproute2 is installed (bridge support via ip link)
      ansible.builtin.apt:
        name:
          - iproute2
        state: present
        update_cache: true
      changed_when: false

    # The healthcheck lives in git (scripts/runchecks.d/...) and is picked up
    # automatically by runchecks.sh; no host copy is needed. The assignment
    # script itself applies and persists the interface-to-bridge mapping.
    - name: Apply configured bridge assignments (idempotent reapply)
      ansible.builtin.command:
        cmd: "{{ git_root }}/scripts/symbios-bridge-assign.sh"
      register: _bridge_apply
      changed_when: _bridge_apply.rc == 0
      failed_when: _bridge_apply.rc != 0

    # The rc.local block written by symbios-bridge-assign.sh runs once at boot
    # and fails silently (|| true) when the target bridge does not exist yet -
    # e.g. the openwrt-* bridges are created later by the openwrt-vm network
    # setup, or a USB interface appears late. This oneshot unit retries the
    # same script (no stdin: it re-reads inventory.yml) until it succeeds so
    # the assignments survive reboots regardless of boot ordering.
    - name: Deploy bridge-assignment retry service
      ansible.builtin.copy:
        dest: /etc/systemd/system/symbios-bridge-assign.service
        content: |
          [Unit]
          Description=Apply SymbiOS network bridge assignments (retry until bridges exist)
          After=network-online.target
          Wants=network-online.target

          [Service]
          Type=oneshot
          RemainAfterExit=yes
          ExecStart=/bin/bash -c 'for i in $(seq 1 24); do {{ git_root }}/scripts/symbios-bridge-assign.sh </dev/null && exit 0; sleep 5; done; exit 1'
        owner: root
        group: root
        mode: "0644"

    - name: Enable and start bridge-assignment retry service
      ansible.builtin.systemd:
        name: symbios-bridge-assign.service
        enabled: true
        state: started
        daemon_reload: true

    - name: Register playbook as installed
      include_tasks: ../shared-tasks/state-register.yml
      vars:
        service_name: "network-bridges"
        state_playbook: "base-services/network-bridges.yml"