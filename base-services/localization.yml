# docs:
#   uses_vars:
#     - keyboard
#     - locale
#     - timezone
#   name: Localization
#   short_description: Basic SymbiOS localization
#   description: 'Basic SymbiOS localization sets timezone, keyboard layout and locale'
#   author: Oliver Bohlen
#   version: '1.0'
#   license: GPLv3
#   copyright: Copyright (c) 2026, Oliver Bohlen
#   min_ansible_version: '2.11'
#   platforms:
#   - name: Debian
#     versions:
#     - '13'

- name: Basic Debian Linux localization
  hosts: all

  tasks:

    - name: check if we are in an container env by existing systemd
      stat:
        path: /lib/systemd/systemd
      register: nocontainer


    - name: Set timezone to {{ timezone }}
      community.general.timezone:
        name: "{{ timezone }}"
      when: nocontainer.stat.exists == true

    - name: Keyboard layout {{ keyboard }}
      ansible.builtin.lineinfile:
        path: /etc/default/keyboard
        regexp: '^XKBLAYOUT=".+$'
        line: 'XKBLAYOUT="{{ keyboard }}"'
        backup: yes
      notify: setupcon
      when: nocontainer.stat.exists == true

    - name: nodeadkeys
      ansible.builtin.lineinfile:
        path: /etc/default/keyboard
        regexp: '^XKBVARIANT=".+$'
        line: 'XKBVARIANT="nodeadkeys"'
        backup: yes
      notify: setupcon
      when: nocontainer.stat.exists == true

    - name: Ensure {{ locale }} locale exists
      community.general.locale_gen:
        name: "{{ locale }}"
        state: present
      notify: localectl
      when: nocontainer.stat.exists == true

    # /etc/default/keyboard above only feeds the console (setupcon) and future
    # display managers. It never reaches a running X server or desktop
    # sessions: with no input source configured, Cinnamon falls back to US
    # (seen live: system reported de, effective X map was US). The two tasks
    # below close that gap - X server default at every start plus a desktop
    # default for all users (explicit user settings still win).

    - name: X11 keyboard defaults
      ansible.builtin.file:
        path: /etc/X11/xorg.conf.d
        state: directory
        mode: "0755"
        owner: root
        group: root
      when: nocontainer.stat.exists == true

    - name: X11 keyboard defaults file
      ansible.builtin.copy:
        dest: /etc/X11/xorg.conf.d/00-keyboard.conf
        mode: "0644"
        owner: root
        group: root
        content: |
          # Managed by SymbiOS (base-services/localization.yml). System-wide X11
          # keyboard defaults, applied at every X server start.
          Section "InputClass"
                  Identifier "symbios keyboard defaults"
                  MatchIsKeyboard "on"
                  Option "XkbLayout" "{{ keyboard }}"
                  Option "XkbVariant" "nodeadkeys"
          EndSection
      when: nocontainer.stat.exists == true

    - name: Check for dconf
      ansible.builtin.shell: command -v dconf
      register: dconf_bin
      failed_when: false
      changed_when: false

    - name: dconf system db dir
      ansible.builtin.file:
        path: /etc/dconf/db/local.d
        state: directory
        mode: "0755"
        owner: root
        group: root
      when: nocontainer.stat.exists == true and dconf_bin.rc == 0

    - name: Desktop keyboard default for all users
      ansible.builtin.copy:
        dest: /etc/dconf/db/local.d/01-symbios-keyboard
        mode: "0644"
        owner: root
        group: root
        content: |
          # Managed by SymbiOS (base-services/localization.yml). Default input
          # source for all desktop users; explicit user settings still win.
          [org/cinnamon/desktop/input-sources]
          sources=[('xkb', '{{ keyboard }}+nodeadkeys')]
          [org/gnome/desktop/input-sources]
          sources=[('xkb', '{{ keyboard }}+nodeadkeys')]
      notify: dconf update
      when: nocontainer.stat.exists == true and dconf_bin.rc == 0

    - name: Register playbook as installed
      include_tasks: ../shared-tasks/state-register.yml
      vars:
        service_name: "localization"
        state_playbook: "base-services/localization.yml"

  handlers:

    - name: setupcon
      ansible.builtin.shell: setupcon

    - name: localectl
      ansible.builtin.shell: localectl set-locale LANG="{{ locale }}"

    - name: dconf update
      ansible.builtin.command: dconf update
