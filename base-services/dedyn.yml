# docs:
#   short_description: Configure desec.de dynamic DNS
#   description: Sets up dyndns updates against desec (dedyn.io) so the public DNS record follows the host's current IP address. Also restarts Traefik when the IP changes. Runs as a cron job.
#   author: Oliver Bohlen
#   version: '1.0'
#   license: GPLv3
#   copyright: Copyright (c) 2026, Oliver Bohlen
#   min_ansible_version: '2.11'
#   platforms:
#   - name: Debian
#     versions:
#     - '13'
#   category: DNS / Network
#   service_control:
#     services:
#     - name: dedyn
#       type: cron
#       file: /etc/cron.d/dedyn_local
#       status: test -f /etc/cron.d/dedyn_local || exit 2
#     logs:
#     - name: dedyn
#       command: tail -F /var/log/syslog | grep dedyn
#   actions:
#     enable: sed -i 's/^#//' /etc/cron.d/dedyn_local
#     disable: sed -i 's/^/#/' /etc/cron.d/dedyn_local
#     run now: dedyn.sh
#

---
- name: desec dyndns
  hosts: all
  tasks:
    - name: Needed software
      apt:
        name:
          - curl
        update_cache: no
        install_recommends: no

    - name: /etc/cron.d/dedyn_local
      blockinfile:
        path: /etc/cron.d/dedyn_local
        create: yes
        mode: 0644
        owner: root
        group: root
        marker: "# {mark} ANSIBLE MANAGED BLOCK"
        block: |
          SHELL=/bin/bash
          */5 * * * * root { PATH={{ git_root }}/scripts:$PATH && [[ -s {{ git_root }}/scripts/dedyn.sh ]] && dedyn.sh; } >/dev/null 2>&1
        backup: yes

    - name: /etc/cron.d/host-ip
      blockinfile:
        path: /etc/cron.d/host-ip
        create: yes
        mode: 0644
        owner: root
        group: root
        marker: "# {mark} ANSIBLE MANAGED BLOCK"
        block: |
          SHELL=/bin/bash
          */5 * * * * root PATH={{ git_root }}/scripts:$PATH && [[ -s {{ git_root }}/scripts/update_host_ip.sh ]] && update_host_ip.sh
        backup: yes

    - name: Remove obsolete /usr/local/etc/dedyn.conf
      # The DDNS config is read directly from inventory.yml by dedyn.sh
      # (only /symbios is on the encrypted data partition). Clean up the
      # old copy from the unencrypted root filesystem.
      ansible.builtin.file:
        path: /usr/local/etc/dedyn.conf
        state: absent

    - name: IPv6 EUI-64 addressing (stable interface id for FRITZ!Box port forwards)
      block:
        - name: Check for NetworkManager
          ansible.builtin.stat:
            path: /usr/bin/nmcli
          register: nmcli_binary

        - name: Find active ethernet connection profiles
          ansible.builtin.command: nmcli -t -f NAME,DEVICE,TYPE con show --active
          register: nm_active
          changed_when: false
          check_mode: false
          when: nmcli_binary.stat.exists

        - name: Force eui64 address generation and disable IPv6 privacy extensions
          community.general.nmcli:
            conn_name: "{{ item.split(':')[0] }}"
            type: ethernet
            addr_gen_mode6: eui64
            ip_privacy6: disabled
            state: present
          loop: "{{ nm_active.stdout_lines }}"
          when:
            - nmcli_binary.stat.exists
            - item.split(':')[2] == '802-3-ethernet'
      when: ansible_facts['os_family'] == 'Debian'

    - name: Register playbook as installed
      ansible.builtin.command: "{{ git_root }}/scripts/symbios-state.sh set base-services/dedyn.yml"
      changed_when: false
