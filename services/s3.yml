#
# Generic S3-compatible backup endpoint for restic.
#
# Auth model: this service is NOT protected by Authelia/OIDC. A restic client
# is a non-interactive HTTP client and cannot complete a browser login, so
# forward-auth would break every backup job. Access control is therefore done
# with the native rest-server htpasswd user list. Membership is managed in
# LDAP (group s3-users) and LDAP password changes are synced into htpasswd
# via ldap-groups.d hooks (see tasks below). Users are managed with
# /symbios/services/s3/s3-user.sh on the host.
#
# docs:
#   name: S3
#   short_description: Deploy a generic S3-compatible restic backup endpoint
#   description: Deploys restic/rest-server as a generic S3-style REST backend for restic backups. Access is controlled by an htpasswd user list (not OIDC), because non-interactive restic clients cannot complete a browser login. Membership comes from the LDAP group s3-users and LDAP password changes are synced into htpasswd automatically. Troubleshooting tip: if a user cannot log in, set their password again via Users and Groups - this re-runs the password hook and repairs the htpasswd entry.
#   url: "https://s3.{{ base_domain }}"
#   author: Oliver Bohlen
#   version: '1.0'
#   license: GPLv3
#   copyright: Copyright (c) 2026, Oliver Bohlen
#   min_ansible_version: '2.11'
#   platforms:
#   - name: Debian
#     versions:
#     - '13'
#   category: Service
#   service_control:
#     services:
#     - name: s3
#       type: docker
#       compose_file: /symbios/services/s3/docker-compose.yml
#       status: test -d /symbios/services/s3 || exit 2; docker compose -f /symbios/services/s3/docker-compose.yml ps | grep -q "Up "
#     logs:
#     - name: s3
#       command: docker compose -f /symbios/services/s3/docker-compose.yml logs -f --tail=100
#   uninstall:
#     stop: docker compose -f /symbios/services/s3/docker-compose.yml down
#     program_paths:
#       - /symbios/services/s3/
#       - /symbios/base-services/traefik/providers/s3.yml
#       - /symbios/runchecks.d/symbios-healthcheck-s3.check
#   actions:
#     start: docker compose -f /symbios/services/s3/docker-compose.yml up -d
#     stop: docker compose -f /symbios/services/s3/docker-compose.yml down
#     restart: docker compose -f /symbios/services/s3/docker-compose.yml restart
#     reload: docker compose -f /symbios/services/s3/docker-compose.yml up -d
#
---
- name: s3
  hosts: all
  vars:
    service_name: s3
    service_domain: "{{ service_name }}.{{ base_domain }}"
    # Repository root inside the container (fixed by the upstream image)
    s3_container_path: /data
    # User created on the very first run when no htpasswd file exists yet
    s3_initial_user: admin
    # Extra flags handed to rest-server. Private per-user repositories are
    # the default: every htpasswd user only sees data/<user>/ and needs
    # the username in the client URL (rest:https://user:pass@host/user).
    # Override via inventory (s3_options) for single-repo mode ("").
    # Do NOT use --append-only unless the endpoint must be un-deletable.
    s3_options: "--private-repos"
  tasks:

    - name: Create /symbios/services/s3 dir
      ansible.builtin.file:
        path: "/symbios/services/{{ service_name }}"
        owner: root
        group: docker
        state: directory
        mode: '0550'

    - name: Create /symbios/services/s3/data dir
      ansible.builtin.file:
        path: "/symbios/services/{{ service_name }}/data"
        owner: root
        group: docker
        state: directory
        mode: '0750'

    # /symbios/services/s3/docker-compose.yml Container Configuration
    - name: /symbios/services/s3/docker-compose.yml Container Configuration
      blockinfile:
        path: "/symbios/services/{{ service_name }}/docker-compose.yml"
        create: yes
        mode: 0440
        owner: root
        group: docker
        marker: "# {mark} ANSIBLE MANAGED BLOCK"
        block: |
          name: ""

          services:

            {{ service_name }}:
              image: restic/rest-server:latest
              container_name: {{ service_name }}
              restart: unless-stopped
              environment:
                # .htpasswd is read from the repository root by default
                PASSWORD_FILE: "{{ s3_container_path }}/.htpasswd"
                OPTIONS: "{{ s3_options }}"
              volumes:
                - ./data:{{ s3_container_path }}:rw
                - /etc/localtime:/etc/localtime:ro
              networks:
                - symbios_services

          networks:
            symbios_services:
              external: true
        backup: yes
      notify: Restart s3

    # /symbios/services/s3/genpw.sh (generate Random PW for the initial user)
    - name: /symbios/services/s3/genpw.sh (generate Random PW for the initial user)
      blockinfile:
        path: "/symbios/services/{{ service_name }}/genpw.sh"
        create: yes
        mode: 0550
        owner: root
        group: docker
        marker: "# {mark} ANSIBLE MANAGED BLOCK"
        block: |
          #!/bin/bash
          # Create the initial rest-server user and record its credentials.

          # Change to service directory
          cd /symbios/services/s3 || exit 1

          # Nothing to do once the htpasswd file exists
          if [ -s data/.htpasswd ]
          then
            exit 0
          fi

          # Generate a random password for the initial user
          g_s3password=$(pwgen -s 32 1)

          # Write the htpasswd entry (bcrypt) into the repository root
          htpasswd -B -b -c data/.htpasswd "{{ s3_initial_user }}" "$g_s3password"
          chmod 640 data/.htpasswd
          chown root:docker data/.htpasswd

          # Store the generated credentials for the administrator to read
          cat >credentials <<EOF
          # Generated by genpw.sh on the first run. Delete after you have
          # stored the password in your password manager.
          S3_USER={{ s3_initial_user }}
          S3_PASSWORD=$g_s3password
          S3_URL=https://{{ service_domain }}
          EOF
          chmod 400 credentials
          chown root:root credentials
        backup: yes
        validate: /bin/bash -n %s

    - name: /symbios/services/s3/genpw.sh shebang
      ansible.builtin.lineinfile:
        path: "/symbios/services/{{ service_name }}/genpw.sh"
        insertbefore: BOF
        line: "#!/bin/bash"

    # /symbios/services/s3/s3-user.sh (add and delete restic users)
    - name: /symbios/services/s3/s3-user.sh (add and delete restic users)
      blockinfile:
        path: "/symbios/services/{{ service_name }}/s3-user.sh"
        create: yes
        mode: 0550
        owner: root
        group: docker
        marker: "# {mark} ANSIBLE MANAGED BLOCK"
        block: |
          #!/bin/bash
          # Manage rest-server users in the htpasswd file.
          #
          # Usage: s3-user.sh add <user> [password]
          #        s3-user.sh del <user>
          #        s3-user.sh list
          #        s3-user.sh passwd <user> [password]

          # Change to service directory
          cd /symbios/services/s3 || exit 1

          f_action="${1:-}"
          f_user="${2:-}"
          f_pass="${3:-}"

          f_htpasswd="data/.htpasswd"
          f_credentials="credentials"

          # Print usage when called without a valid action
          if [ -z "$f_action" ] || [ -z "$f_user" ]
          then
            echo "Usage: s3-user.sh {add|del|list|passwd} <user> [password]" >&2
            exit 1
          fi

          # list only needs the user list, not a real user name
          if [ "$f_action" == "list" ]
          then
            cut -d ":" -f1 "$f_htpasswd" 2>/dev/null
            exit 0
          fi

          # Generate a password when none was given
          if [ -z "$f_pass" ]
          then
            f_pass=$(pwgen -s 32 1)
          fi

          case "$f_action" in
            add)
              # Refuse to overwrite an existing user silently
              if grep -q "^${f_user}:" "$f_htpasswd" 2>/dev/null
              then
                echo "User ${f_user} already exists, use 'passwd' to change it." >&2
                exit 1
              fi
              htpasswd -B -b "$f_htpasswd" "$f_user" "$f_pass"
              echo "S3_USER=${f_user}"
              echo "S3_PASSWORD=${f_pass}"
              echo "S3_URL=https://{{ service_domain }}"
              ;;
            passwd)
              # htpasswd needs an existing entry to update it
              if ! grep -q "^${f_user}:" "$f_htpasswd" 2>/dev/null
              then
                echo "User ${f_user} does not exist." >&2
                exit 1
              fi
              htpasswd -B -b "$f_htpasswd" "$f_user" "$f_pass"
              echo "S3_USER=${f_user}"
              echo "S3_PASSWORD=${f_pass}"
              echo "S3_URL=https://{{ service_domain }}"
              ;;
            del)
              # Rebuild the htpasswd file without the removed user
              sed -i "/^${f_user}:/d" "$f_htpasswd"
              echo "User ${f_user} removed."
              ;;
            *)
              echo "Unknown action: ${f_action}" >&2
              exit 1
              ;;
          esac

          # The repository directory is written by root only
          chmod 640 "$f_htpasswd"
          chown root:docker "$f_htpasswd"
        backup: yes
        validate: /bin/bash -n %s

    - name: /symbios/services/s3/s3-user.sh shebang
      ansible.builtin.lineinfile:
        path: "/symbios/services/{{ service_name }}/s3-user.sh"
        insertbefore: BOF
        line: "#!/bin/bash"

    # /symbios/base-services/traefik/providers/s3.yml Traefik File Provider
    # No authelia@file here: restic clients cannot log in via a browser.
    # Authentication is the htpasswd list of the rest-server itself.
    - name: Traefik provider snippet for s3
      include_tasks: ../shared-tasks/traefik-provider.yml
      vars:
        traefik_backend_url: "http://{{ service_name }}:8000"
        traefik_middlewares:
          - "secHeaders@file"

    # rest-server refuses to start without a readable .htpasswd file, so the
    # initial user has to exist before the compose stack is started.
    - name: Run genpw.sh to create the initial s3 user
      ansible.builtin.shell: /symbios/services/s3/genpw.sh
      args:
        creates: "/symbios/services/s3/data/.htpasswd"

    # The htpasswd list is the only credential store rest-server
    # understands, but membership is managed in LDAP: the group s3-users
    # decides who gets an entry (lifecycle hook below) and password
    # changes in LDAP are synced into htpasswd (password-set hook, fired
    # by symbios-ldap-user.sh after every successful password change).
    - name: Create LDAP group s3-users
      ansible.builtin.command: "{{ git_root }}/scripts/symbios-ldap-groups.sh --create --name s3-users"
      changed_when: false
      failed_when: false

    - name: Deploy LDAP group-change hook (s3 htpasswd lifecycle)
      ansible.builtin.copy:
        dest: "{{ data_root }}/ldap-groups.d/s3-user-sync.hook"
        content: |
          #!/bin/bash
          # SymbiOS hook - keep rest-server htpasswd entries in sync with
          # the LDAP group s3-users. Args: $1=event $2=group $3=uid
          # Only react to membership changes of s3-users.
          [[ "${1:-}" == "member-added" || "${1:-}" == "member-removed" ]] || exit 0
          [[ "${2:-}" == "s3-users" ]] || exit 0
          exec "{{ git_root }}/scripts/symbios-s3-user-sync.sh" "${1:-}" "${3:-}"
        mode: '0755'
        owner: root
        group: root

    - name: Deploy LDAP password hook (s3 htpasswd password sync)
      ansible.builtin.copy:
        dest: "{{ data_root }}/ldap-groups.d/s3-password-sync.hook"
        content: |
          #!/bin/bash
          # SymbiOS hook - sync LDAP password changes into the rest-server
          # htpasswd list. Fired by symbios-ldap-user.sh after every
          # successful password set. Args: $1=event $2=uid $3=pwfile
          # (0600 plaintext file, shredded by the caller - never log it).
          [[ "${1:-}" == "password-set" ]] || exit 0
          exec "{{ git_root }}/scripts/symbios-s3-user-sync.sh" "${1:-}" "${2:-}" "${3:-}"
        mode: '0755'
        owner: root
        group: root

    - name: Deploy healthcheck
      include_tasks: ../shared-tasks/runcheck-docker.yml
      vars:
        service_name: s3
        check_desc: "Verifies that the s3 (restic rest-server) container is running. A missing container marks the check as failed."

    - name: Ensure s3 is running
      include_tasks: ../shared-tasks/docker-start.yml

    - name: Register playbook as installed
      include_tasks: ../shared-tasks/state-register.yml

  handlers:

    - name: Restart s3
      ansible.builtin.shell: docker compose up -d --force-recreate
      args:
        chdir: "/symbios/services/{{ service_name }}"
