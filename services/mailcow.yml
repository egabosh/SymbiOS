#   name: Mailcow
#   short_description: Deploy the Mailcow mail server (mailcow-dockerized)
#   description: Deploys Mailcow with Traefik integration, LDAP groups, and Authelia access control. TLS certificates are provided by Traefik (ACME) and synced into the mailcow nginx.
#   url: "https://mail.{{ base_domain }}"
#   author: Oliver Bohlen
#   version: '1.0'
#   license: GPLv3
