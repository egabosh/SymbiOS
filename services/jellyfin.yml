#     - '13'
#   category: Service
#   service_control:
#     services:
#     - name: jellyfin
#       type: docker
#       compose_file: /symbios/services/jellyfin/docker-compose.yml
#       status: test -d /symbios/services/jellyfin || exit 2; docker compose -f /symbios/services/jellyfin/docker-compose.yml ps | grep -q "Up "
#     logs:
#     - name: jellyfin
#       command: docker compose -f /symbios/services/jellyfin/docker-compose.yml logs -f --tail=100
#   uninstall:
#     stop: docker compose -f /symbios/services/jellyfin/docker-compose.yml down
#     program_paths:
#       - /symbios/services/jellyfin/
#       - /symbios/base-services/traefik/providers/jellyfin.yml
#       - /symbios/runchecks.d/symbios-healthcheck-jellyfin.check
#   actions:
#     start: docker compose -f /symbios/services/jellyfin/docker-compose.yml up -d
#     stop: docker compose -f /symbios/services/jellyfin/docker-compose.yml down
#     restart: docker compose -f /symbios/services/jellyfin/docker-compose.yml restart
#     reload: docker compose -f /symbios/services/jellyfin/docker-compose.yml up -d
#
---
- name: jellyfin
  hosts: all
  vars:
    service_name: jellyfin
    service_domain: "jellyfin.{{ base_domain }}"
    # Local service user for the container (non-root, see mediapaths.md).
    jellyfin_uid: 992
    # Supplementary group for read-only media access (fixed media GID).
    jellyfin_gid: "{{ media_gid | default('') }}"
    # Standard media libraries, mounted read-only (see mediapaths.md).
    # The media_* vars are guaranteed by base-services/media.yml.
    jellyfin_videos_path: "{{ media_videos | default('/symbios/media/videos') }}"
    jellyfin_audio_path: "{{ media_audio | default('/symbios/media/audio') }}"
    jellyfin_images_path: "{{ media_images | default('/symbios/media/images') }}"
  tasks:

    - name: Ensure the media LDAP group exists (fixed GID for library access)
      ansible.builtin.command: "{{ git_root }}/scripts/symbios-ldap-groups.sh --create --gid {{ jellyfin_gid }} --name media"
      changed_when: false
      failed_when: false
      when: jellyfin_gid | default('') | string | length > 0

    - name: Ensure the local jellyfin service user exists
      ansible.builtin.user:
        name: jellyfin
        comment: Jellyfin media server
        uid: "{{ jellyfin_uid }}"
        group: docker
        shell: /bin/false
      failed_when: false

    - name: Create /symbios/services/jellyfin dir
      ansible.builtin.file:
        path: /symbios/services/jellyfin
        owner: root
        group: docker
        state: directory
        mode: '0550'

    - name: Create jellyfin config and cache dirs (owned by the service user)
      ansible.builtin.file:
        path: "/symbios/services/jellyfin/data/{{ item }}"
        owner: "{{ jellyfin_uid }}"
        group: docker
        state: directory
        mode: '0750'
      loop:
        - config
        - cache

    - name: /symbios/services/jellyfin/docker-compose.yml Container Configuration
      blockinfile:
        path: /symbios/services/jellyfin/docker-compose.yml
        create: yes
        mode: 0440
        owner: root
        group: docker
        marker: "# {mark} ANSIBLE MANAGED BLOCK"
        block: |

          name: ""

          services:

            jellyfin:
              image: jellyfin/jellyfin:latest
              container_name: jellyfin
              restart: unless-stopped
              #env_file: env
              user: "{{ jellyfin_uid }}{{ (':' + (jellyfin_gid | string)) if jellyfin_gid else '' }}"
              #environment:
              volumes:
                - ./data/config:/config
                - ./data/cache:/cache
                - /etc/localtime:/etc/localtime
                # Long syntax with create_host_path:false: fail closed when
                # the volume is missing instead of serving empty libraries.
                - type: bind
                  source: {{ jellyfin_videos_path }}
                  target: /media/videos
                  read_only: true
                  bind:
                    create_host_path: false
                - type: bind
                  source: {{ jellyfin_audio_path }}
                  target: /media/audio
                  read_only: true
                  bind:
                    create_host_path: false
                - type: bind
                  source: {{ jellyfin_images_path }}
                  target: /media/images
                  read_only: true
                  bind:
                    create_host_path: false
              networks:
                - symbios_services
          # optional hardware acceleration
          #    devices:
          #      - /dev/dri:/dev/dri
          #      - /dev/vcsm:/dev/vcsm
          #      - /dev/vchiq:/dev/vchiq
          #      - /dev/video10:/dev/video10
          #      - /dev/video11:/dev/video11
          #      - /dev/video12:/dev/video12


          networks:
            symbios_services:
              external: true

        backup: yes
      notify: Restart jellyfin

    - name: Ensure jellyfin is running
      include_tasks: ../shared-tasks/docker-start.yml

    - name: Traefik provider snippet for jellyfin
      include_tasks: ../shared-tasks/traefik-provider.yml
      vars:
        traefik_backend_url: "http://jellyfin:8096"
        traefik_middlewares:
          - "secHeaders@file"

    # Deploy the shared HTTP healthcheck (shared-tasks/runcheck.yml)
    - name: Deploy healthcheck
      include_tasks: ../shared-tasks/runcheck.yml

    - name: Register playbook as installed
      include_tasks: ../shared-tasks/state-register.yml

  handlers:
    - name: Restart jellyfin
      include_tasks: ../shared-tasks/compose-recreate.yml

