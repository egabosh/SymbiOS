    - name: /symbios/services/jellyfin/docker-compose.yml Container Configuration
      blockinfile:
        path: /symbios/services/jellyfin/docker-compose.yml
        create: yes
        mode: 0440
        owner: root
        group: docker
        marker: "# {mark} ANSIBLE MANAGED BLOCK"
        block: |

          name: ""

          services:

            jellyfin:
              image: jellyfin/jellyfin:latest
              container_name: jellyfin
              restart: unless-stopped
              #env_file: env
              user: "{{ jellyfin_uid }}{{ (':' + (jellyfin_gid | string)) if jellyfin_gid else '' }}"
              #environment:
              volumes:
                - ./data/config:/config
                - ./data/cache:/cache
                - /etc/localtime:/etc/localtime
                - {{ jellyfin_videos_path }}:/media/videos:ro
                - {{ jellyfin_audio_path }}:/media/audio:ro
                - {{ jellyfin_images_path }}:/media/images:ro
              networks:
                - symbios_services
          # optional hardware acceleration
          #    devices:
          #      - /dev/dri:/dev/dri
          #      - /dev/vcsm:/dev/vcsm
          #      - /dev/vchiq:/dev/vchiq
          #      - /dev/video10:/dev/video10
          #      - /dev/video11:/dev/video11
          #      - /dev/video12:/dev/video12


          networks:
            symbios_services:
              external: true

        backup: yes
      notify: Restart jellyfin

    - name: Ensure jellyfin is running
      include_tasks: ../shared-tasks/docker-start.yml

    - name: Traefik provider snippet for jellyfin
      include_tasks: ../shared-tasks/traefik-provider.yml
      vars:
        traefik_backend_url: "http://jellyfin:8096"
        traefik_middlewares:
          - "secHeaders@file"
          - "allowlocalipsonly@file"

    # Deploy the shared HTTP healthcheck (shared-tasks/runcheck.yml)
    - name: Deploy healthcheck
      include_tasks: ../shared-tasks/runcheck.yml

