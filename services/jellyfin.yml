# docs:
#   uses_vars:
#     - acme_resolver
#     - base_domain
#     - locale
#     - media_audio
#     - media_gid
#     - media_images
#     - media_movies
#     - media_series
#     - media_videos
#     - traefik_default_access
#     - traefik_service_access
#     - twofa_enabled
#   name: Jellyfin
#   short_description: Deploy the Jellyfin media server
#   description: >-
#     Deploys Jellyfin, a free and open-source media server, exposed via Traefik.
#     Besides the Authelia-protected web UI it exposes a second LAN-only TLS
#     route (jellyfin-api.<base_domain>) for clients that cannot complete a
#     browser SSO flow, such as the Kodi addon. A local technical user "kodi"
#     is provisioned on every run; its password is revealable and rotatable in
#     Settings -> Secrets, and its device token is refreshed by the same hook.
#     Movie and series libraries are mounted read-only; Mediathek recordings
#     are written below the downloads tree and exposed as two extra libraries.
#     The Zapp Live TV tuner and guide provider are provisioned automatically;
#     in the web UI they live under Dashboard -> Live TV (Tuner Devices and
#     TV Guide Data Providers), playback uses the Live TV sidebar entry.
#     All user policies allow direct play only: an unsupported client stops
#     instead of starting a server-side ffmpeg remux or transcode.
#   url: "https://jellyfin.{{ base_domain }}"
#   access:
#     user_group: jellyfin-users
#     admin_group: jellyfin-admins
#   author: Oliver Bohlen
#   version: '1.0'
#   license: GPLv3
#   copyright: Copyright (c) 2026, Oliver Bohlen
#   min_ansible_version: '2.11'
#   platforms:
#   - name: Debian
#     versions:
#     - '13'
#   category: Service
#   service_control:
#     services:
#     - name: jellyfin
#       type: docker
#       compose_file: /symbios/services/jellyfin/docker-compose.yml
#       status: test -d /symbios/services/jellyfin || exit 2; docker compose -f /symbios/services/jellyfin/docker-compose.yml ps | grep -q "Up "
#     logs:
#     - name: jellyfin
#       command: docker compose -f /symbios/services/jellyfin/docker-compose.yml logs -f --tail=100
#   uninstall:
#     stop: docker compose -f /symbios/services/jellyfin/docker-compose.yml down
#     program_paths:
#       - /symbios/services/jellyfin/
#       - /symbios/base-services/traefik/providers/jellyfin.yml
#       - /symbios/base-services/traefik/providers/jellyfin-sso.yml
#       - /symbios/base-services/traefik/providers/jellyfin-api.yml
#       - /symbios/runchecks.d/symbios-healthcheck-jellyfin.check
#     ldap_groups:
#       - jellyfin-users
#       - jellyfin-admins
#     authelia_blocks:
#       - "OIDC jellyfin"
#       - "jellyfin ACCESS CONTROL"
#   actions:
#     start: docker compose -f /symbios/services/jellyfin/docker-compose.yml up -d
#     stop: docker compose -f /symbios/services/jellyfin/docker-compose.yml down
#     restart: docker compose -f /symbios/services/jellyfin/docker-compose.yml restart
#     reload: docker compose -f /symbios/services/jellyfin/docker-compose.yml up -d
#
---
- name: jellyfin
  hosts: all
  vars:
    service_name: jellyfin
    service_domain: "jellyfin.{{ base_domain }}"
    jellyfin_service_dir: /symbios/services/jellyfin
    jellyfin_config_root: /symbios/services/jellyfin/data/config
    jellyfin_config_dir: "{{ config_dir | default('/symbios/base-services/symbios-ui/config') }}"
    jellyfin_api_domain: "jellyfin-api.{{ base_domain }}"
    jellyfin_kodi_user: kodi
    jellyfin_kodi_password_secret: jellyfin_kodi_password
    jellyfin_kodi_token_secret: jellyfin_kodi_token
    # Local service user for the container (non-root, see mediapaths.md).
    jellyfin_uid: 992
    # Supplementary group for read-only media access (fixed media GID).
    jellyfin_gid: "{{ media_gid | default('') }}"
    # Standard media libraries (see mediapaths.md). The global movie/series
    # keys may point to separate disks; media.yml creates them before this
    # service mounts them read-only. Downloads stay writable for Mediathek.
    jellyfin_movies_path: "{{ media_movies | default((media_videos | default('/symbios/media/videos')) + '/movies') }}"
    jellyfin_tvshows_path: "{{ media_series | default((media_videos | default('/symbios/media/videos')) + '/tvshows') }}"
    jellyfin_downloads_path: "{{ media_videos | default('/symbios/media/videos') }}/downloads"
    # Jellyfin only writes below the downloads tree. The main movie and series
    # libraries stay read-only; finished Mediathek recordings land in these
    # subdirectories and are exposed as separate libraries.
    jellyfin_container_downloads_path: /media/downloads
    jellyfin_audio_path: "{{ media_audio | default('/symbios/media/audio') }}"
    jellyfin_images_path: "{{ media_images | default('/symbios/media/images') }}"
    # Third-party OIDC client. Pinned and checksum-verified because it runs
    # inside the media server and handles the Authelia client secret.
    jellyfin_sso_plugin_version: '4.0.0.4'
    jellyfin_sso_plugin_zip: 'sso-authentication_4.0.0.4.zip'
    jellyfin_sso_plugin_checksum: 'sha256:c09f16ba31059a434ddd7f811e4f9608d4b4c4514cc80a5bf1ca33bee61e1107'
    jellyfin_sso_plugin_url: "https://github.com/9p4/jellyfin-plugin-sso/releases/download/v{{ jellyfin_sso_plugin_version }}/{{ jellyfin_sso_plugin_zip }}"
    jellyfin_sso_provider: authelia
    # Public-broadcaster Mediathek search and subscription downloads. Pinned
    # because it writes into the media tree and runs with Jellyfin privileges.
    jellyfin_mediathek_plugin_version: '0.8.4.0'
    jellyfin_mediathek_plugin_zip: 'mediathek-downloader_0.8.4.0.zip'
    jellyfin_mediathek_plugin_checksum: 'sha256:b51aab2531c9b634fba9473a40560561519e1dd51364694954f2daccc323a3be'
    jellyfin_mediathek_plugin_url: "https://github.com/CatNoir2006/jellyfin-plugin-MediathekViewDL/releases/download/v{{ jellyfin_mediathek_plugin_version }}/{{ jellyfin_mediathek_plugin_zip }}"
    # Official server-side companion for plugin.video.jellyfin. v16 declares
    # targetAbi 12.0.0.0 and matches the deployed Jellyfin 12.x server. It lets
    # Kodi replay changes made while it was offline instead of a full rescan.
    jellyfin_kodi_sync_plugin_release: 'v16'
    jellyfin_kodi_sync_plugin_version: '16.0.0.0'
    jellyfin_kodi_sync_plugin_zip: 'kodi-sync-queue_16.0.0.0.zip'
    jellyfin_kodi_sync_plugin_checksum: 'sha256:bed7170dcbb872c46c11cc131345c8f38b06d3f21778492b84a2a35575e445d0'
    jellyfin_kodi_sync_plugin_url: "https://github.com/jellyfin/jellyfin-plugin-kodisyncqueue/releases/download/{{ jellyfin_kodi_sync_plugin_release }}/{{ jellyfin_kodi_sync_plugin_zip }}"
    jellyfin_bootstrap_admin: symbios-admin
    # Jellyfin follows the SymbiOS locale instead of keeping its own language.
    # de_DE.UTF-8 becomes UI de-DE, metadata language de and country DE.
    jellyfin_locale_base: "{{ locale.split('.')[0].split('@')[0] }}"
    jellyfin_language: "{{ jellyfin_locale_base.split('_')[0] | lower }}"
    jellyfin_region: "{{ jellyfin_locale_base.split('_')[1] | default('') }}"
    jellyfin_ui_culture: "{{ jellyfin_language }}{{ '-' ~ jellyfin_region if jellyfin_region else '' }}"
    jellyfin_metadata_country: "{{ jellyfin_region | default(jellyfin_language | upper, true) }}"
  pre_tasks:
    # The Kodi addon cannot complete the Authelia browser flow. It gets a local
    # Jellyfin user whose password lives in the central store so the WebUI can
    # reveal and rotate it. Seed once, never overwrite a rotated value.
    - name: Check whether the Jellyfin kodi password is already stored
      ansible.builtin.stat:
        path: "{{ jellyfin_config_dir }}/secrets/{{ jellyfin_kodi_password_secret }}.age"
      register: jellyfin_kodi_password_stored

    - name: Seed the Jellyfin kodi password into the central secret store
      ansible.builtin.shell: |
        set -euo pipefail
        umask 077
        f_tmp="$(mktemp "{{ jellyfin_config_dir }}/.jellyfin-kodi-pw-XXXXXX")"
        trap 'shred -u "$f_tmp" 2>/dev/null || rm -f "$f_tmp"' EXIT
        openssl rand -hex 32 > "$f_tmp"
        "{{ git_root }}/scripts/symbios-secret.sh" init >/dev/null
        "{{ git_root }}/scripts/symbios-secret.sh" put "{{ jellyfin_kodi_password_secret }}" --file "$f_tmp"
      args:
        executable: /bin/bash
        creates: "{{ jellyfin_config_dir }}/secrets/{{ jellyfin_kodi_password_secret }}.age"
      changed_when: true
      no_log: true
      when: not jellyfin_kodi_password_stored.stat.exists

    - name: Create the central secret metadata directory
      ansible.builtin.file:
        path: "{{ jellyfin_config_dir }}/secrets/meta"
        state: directory
        owner: root
        group: root
        mode: '0700'

    # lineinfile preserves policy/last_rotated written by the rotation hook.
    - name: Declare the Jellyfin kodi secret rotation contracts
      ansible.builtin.lineinfile:
        path: "{{ jellyfin_config_dir }}/secrets/meta/{{ item.file }}"
        regexp: "{{ item.regexp }}"
        line: "{{ item.line }}"
        create: yes
        owner: root
        group: root
        mode: '0600'
      loop:
        - file: jellyfin_kodi_password.meta
          regexp: '^type='
          line: 'type=generated'
        - file: jellyfin_kodi_password.meta
          regexp: '^consumers='
          line: 'consumers=jellyfin/kodi-user'
        - file: jellyfin_kodi_token.meta
          regexp: '^type='
          line: 'type=app-owned'
        - file: jellyfin_kodi_token.meta
          regexp: '^consumers='
          line: 'consumers=jellyfin/kodi-user'
      loop_control:
        label: "{{ item.file }} {{ item.line }}"

  tasks:

    - name: Ensure the media LDAP group exists (fixed GID for library access)
      ansible.builtin.command: "{{ git_root }}/scripts/symbios-ldap-groups.sh --create --gid {{ jellyfin_gid }} --name media"
      changed_when: false
      failed_when: false
      when: jellyfin_gid | default('') | string | length > 0

    - name: Ensure the local jellyfin service user exists
      ansible.builtin.user:
        name: jellyfin
        comment: Jellyfin media server
        uid: "{{ jellyfin_uid }}"
        group: docker
        shell: /bin/false
      failed_when: false

    - name: Create /symbios/services/jellyfin dir
      ansible.builtin.file:
        path: /symbios/services/jellyfin
        owner: root
        group: docker
        state: directory
        mode: '0550'

    - name: Create jellyfin config and cache dirs (owned by the service user)
      ansible.builtin.file:
        path: "/symbios/services/jellyfin/data/{{ item }}"
        owner: "{{ jellyfin_uid }}"
        group: docker
        state: directory
        mode: '0750'
      loop:
        - config
        - cache
        - cache/mediathek

    # The OIDC client secret and the local bootstrap password are generated
    # once and reused on later runs. gen-oidc-client-secret.sh writes both the
    # plaintext (for the plugin) and the Authelia digest.
    - name: Generate Jellyfin OIDC client secret
      ansible.builtin.command: "{{ base_services_root | default('/symbios/base-services') }}/authelia/gen-oidc-client-secret.sh {{ jellyfin_service_dir }}"
      args:
        creates: "{{ jellyfin_service_dir }}/oidc_password"
      changed_when: false
      failed_when: false
      no_log: true

    - name: Generate Jellyfin bootstrap admin password
      ansible.builtin.shell: |
        umask 077
        printf '%s' "$(openssl rand -hex 32)" > "{{ jellyfin_service_dir }}/jellyfin_admin_password"
      args:
        creates: "{{ jellyfin_service_dir }}/jellyfin_admin_password"
      changed_when: false
      no_log: true

    - name: Restrict the Jellyfin bootstrap password file
      ansible.builtin.file:
        path: "{{ jellyfin_service_dir }}/jellyfin_admin_password"
        owner: root
        group: root
        mode: '0400'

    # Pin the plugin by version and verify the downloaded archive before it is
    # unpacked into Jellyfin's plugin directory.
    - name: Record the deployed SSO-Auth plugin version
      ansible.builtin.copy:
        content: "{{ jellyfin_sso_plugin_version }}\n"
        dest: "{{ jellyfin_config_root }}/plugins/.symbios-sso-version"
        owner: "{{ jellyfin_uid }}"
        group: docker
        mode: '0400'
      register: jellyfin_sso_version
      notify: Restart jellyfin

    - name: Remove the previous SSO-Auth plugin after a version change
      ansible.builtin.file:
        path: "{{ jellyfin_config_root }}/plugins/SSO-Auth"
        state: absent
      when: jellyfin_sso_version.changed

    - name: Create the SSO-Auth plugin cache directory
      ansible.builtin.file:
        path: "{{ jellyfin_config_root }}/plugins/.cache"
        state: directory
        owner: "{{ jellyfin_uid }}"
        group: docker
        mode: '0550'

    - name: Download the checksum-verified SSO-Auth plugin
      ansible.builtin.get_url:
        url: "{{ jellyfin_sso_plugin_url }}"
        dest: "{{ jellyfin_config_root }}/plugins/.cache/{{ jellyfin_sso_plugin_zip }}"
        checksum: "{{ jellyfin_sso_plugin_checksum }}"
        owner: "{{ jellyfin_uid }}"
        group: docker
        mode: '0400'

    - name: Create the SSO-Auth plugin directory
      ansible.builtin.file:
        path: "{{ jellyfin_config_root }}/plugins/SSO-Auth"
        state: directory
        owner: "{{ jellyfin_uid }}"
        group: docker
        mode: '0550'

    - name: Unpack the SSO-Auth plugin
      ansible.builtin.unarchive:
        src: "{{ jellyfin_config_root }}/plugins/.cache/{{ jellyfin_sso_plugin_zip }}"
        dest: "{{ jellyfin_config_root }}/plugins/SSO-Auth"
        remote_src: true
        owner: "{{ jellyfin_uid }}"
        group: docker
        mode: '0644'
        creates: "{{ jellyfin_config_root }}/plugins/SSO-Auth/SSO-Auth.dll"
      notify: Restart jellyfin

    - name: Record the deployed Mediathek Downloader plugin version
      ansible.builtin.copy:
        content: "{{ jellyfin_mediathek_plugin_version }}\n"
        dest: "{{ jellyfin_config_root }}/plugins/.symbios-mediathek-version"
        owner: "{{ jellyfin_uid }}"
        group: docker
        mode: '0400'
      register: jellyfin_mediathek_version
      notify: Restart jellyfin

    - name: Remove the previous Mediathek Downloader after a version change
      ansible.builtin.file:
        path: "{{ jellyfin_config_root }}/plugins/MediathekViewDL"
        state: absent
      when: jellyfin_mediathek_version.changed

    - name: Create the Mediathek Downloader plugin directory
      ansible.builtin.file:
        path: "{{ jellyfin_config_root }}/plugins/MediathekViewDL"
        state: directory
        owner: "{{ jellyfin_uid }}"
        group: docker
        mode: '0550'

    # Same checksum-verified cache as the SSO plugin: the archive is shared by
    # both, so the .cache directory already exists at this point.
    - name: Download the checksum-verified Mediathek Downloader plugin
      ansible.builtin.get_url:
        url: "{{ jellyfin_mediathek_plugin_url }}"
        dest: "{{ jellyfin_config_root }}/plugins/.cache/{{ jellyfin_mediathek_plugin_zip }}"
        checksum: "{{ jellyfin_mediathek_plugin_checksum }}"
        owner: "{{ jellyfin_uid }}"
        group: docker
        mode: '0400'

    - name: Unpack the Mediathek Downloader plugin
      ansible.builtin.unarchive:
        src: "{{ jellyfin_config_root }}/plugins/.cache/{{ jellyfin_mediathek_plugin_zip }}"
        dest: "{{ jellyfin_config_root }}/plugins/MediathekViewDL"
        remote_src: true
        owner: "{{ jellyfin_uid }}"
        group: docker
        mode: '0644'
        creates: "{{ jellyfin_config_root }}/plugins/MediathekViewDL/Jellyfin.Plugin.MediathekViewDL.dll"
      notify: Restart jellyfin

    # Official Kodi Sync Queue plugin: installed from a pinned, checksummed
    # release so plugin.video.jellyfin can replay offline library changes at
    # startup and stops prompting for a missing server plugin.
    - name: Record the deployed Kodi Sync Queue plugin version
      ansible.builtin.copy:
        content: "{{ jellyfin_kodi_sync_plugin_version }}\n"
        dest: "{{ jellyfin_config_root }}/plugins/.symbios-kodi-sync-version"
        owner: "{{ jellyfin_uid }}"
        group: docker
        mode: '0400'
      register: jellyfin_kodi_sync_version
      notify: Restart jellyfin

    - name: Remove the previous Kodi Sync Queue plugin after a version change
      ansible.builtin.file:
        path: "{{ jellyfin_config_root }}/plugins/KodiSyncQueue"
        state: absent
      when: jellyfin_kodi_sync_version.changed

    - name: Download the checksum-verified Kodi Sync Queue plugin
      ansible.builtin.get_url:
        url: "{{ jellyfin_kodi_sync_plugin_url }}"
        dest: "{{ jellyfin_config_root }}/plugins/.cache/{{ jellyfin_kodi_sync_plugin_zip }}"
        checksum: "{{ jellyfin_kodi_sync_plugin_checksum }}"
        owner: "{{ jellyfin_uid }}"
        group: docker
        mode: '0400'

    - name: Create the Kodi Sync Queue plugin directory
      ansible.builtin.file:
        path: "{{ jellyfin_config_root }}/plugins/KodiSyncQueue"
        state: directory
        owner: "{{ jellyfin_uid }}"
        group: docker
        mode: '0550'

    - name: Unpack the Kodi Sync Queue plugin
      ansible.builtin.unarchive:
        src: "{{ jellyfin_config_root }}/plugins/.cache/{{ jellyfin_kodi_sync_plugin_zip }}"
        dest: "{{ jellyfin_config_root }}/plugins/KodiSyncQueue"
        remote_src: true
        owner: "{{ jellyfin_uid }}"
        group: docker
        mode: '0644'
        creates: "{{ jellyfin_config_root }}/plugins/KodiSyncQueue/Jellyfin.Plugin.KodiSyncQueue.dll"
      notify: Restart jellyfin

    - name: /symbios/services/jellyfin/docker-compose.yml Container Configuration
      blockinfile:
        path: /symbios/services/jellyfin/docker-compose.yml
        create: yes
        mode: 0440
        owner: root
        group: docker
        marker: "# {mark} ANSIBLE MANAGED BLOCK"
        block: |

          name: ""

          services:

            jellyfin:
              image: jellyfin/jellyfin:latest
              container_name: jellyfin
              restart: unless-stopped
              # A full scan of a multi-TB library fans out ffprobe tasks that
              # can stall the whole host (Jellyfin issue 11588). Keep a hard
              # ceiling even if the in-app concurrency settings are reset.
              cpus: 1.0
              mem_limit: 2g
              # Relative priorities when the host is contended: the scan must
              # not outrank systemd or the backup. BFQ honours the I/O weight.
              cpu_shares: 128
              blkio_config:
                weight: 10
              # Local-only API access for the host-side provisioning helper.
              ports:
                - "127.0.0.1:8096:8096"
              #env_file: env
              user: "{{ jellyfin_uid }}{{ (':' + (jellyfin_gid | string)) if jellyfin_gid else '' }}"
              # Image extraction inspects many frames per item and is the main
              # RAM hog during scans; this tradeoff exists for low-end hosts
              # like this Pi (Jellyfin issue 13531).
              environment:
                JELLYFIN_FFmpeg_imgextract_perf_tradeoff: 'true'
                # Native clients cannot complete the Authelia browser SSO flow
                # and must use the API host. Without an explicit published URL
                # Jellyfin advertises its Docker bridge IP, which clients
                # cannot reach, so they stop after server discovery.
                JELLYFIN_PublishedServerUrl: "https://{{ jellyfin_api_domain }}"
              volumes:
                - ./data/config:/config
                - ./data/cache:/cache
                - /etc/localtime:/etc/localtime
                # Long syntax with create_host_path:false: fail closed when
                # the volume is missing instead of serving empty libraries.
                # The main libraries are read-only; only the Mediathek
                # directories below downloads are writable.
                - type: bind
                  source: {{ jellyfin_movies_path }}
                  target: /media/movies
                  read_only: true
                  bind:
                    create_host_path: false
                - type: bind
                  source: {{ jellyfin_tvshows_path }}
                  target: /media/tvshows
                  read_only: true
                  bind:
                    create_host_path: false
                - type: bind
                  source: {{ jellyfin_downloads_path }}
                  target: {{ jellyfin_container_downloads_path }}
                  read_only: false
                  bind:
                    create_host_path: false
                - type: bind
                  source: {{ jellyfin_downloads_path }}/Spielfilme
                  target: {{ jellyfin_container_downloads_path }}/Spielfilme
                  read_only: false
                  bind:
                    create_host_path: false
                - type: bind
                  source: {{ jellyfin_downloads_path }}/Serien
                  target: {{ jellyfin_container_downloads_path }}/Serien
                  read_only: false
                  bind:
                    create_host_path: false
                - type: bind
                  source: {{ jellyfin_audio_path }}
                  target: /media/audio
                  read_only: true
                  bind:
                    create_host_path: false
                - type: bind
                  source: {{ jellyfin_images_path }}
                  target: /media/images
                  read_only: true
                  bind:
                    create_host_path: false
              networks:
                - symbios_services
          # optional hardware acceleration
          #    devices:
          #      - /dev/dri:/dev/dri
          #      - /dev/vcsm:/dev/vcsm
          #      - /dev/vchiq:/dev/vchiq
          #      - /dev/video10:/dev/video10
          #      - /dev/video11:/dev/video11
          #      - /dev/video12:/dev/video12


          networks:
            symbios_services:
              external: true

        backup: yes
      notify: Restart jellyfin

    - name: Ensure jellyfin is running
      include_tasks: ../shared-tasks/docker-start.yml

    # Authelia forward-auth only proves who the user is; Jellyfin still renders
    # its own login page. Send the root URL straight into the plugin's OIDC
    # start endpoint so an existing Authelia session completes the Jellyfin
    # login without a second form. The callback path is untouched, otherwise
    # the login would loop.
    #
    # Jellyfin Web sends its API token in an `Authorization: MediaBrowser ...`
    # header. Authelia's default forward-auth tries that header first and
    # short-circuits with 401, so the web client never gets past the login
    # form. A Jellyfin-specific forward-auth filters the Authorization header
    # out of the auth request while leaving it intact for the backend.
    - name: Deploy Jellyfin Traefik SSO middlewares
      ansible.builtin.blockinfile:
        path: /symbios/base-services/traefik/providers/jellyfin-sso.yml
        create: yes
        mode: "0444"
        owner: root
        group: docker
        marker: "# {mark} ANSIBLE MANAGED BLOCK jellyfin SSO START"
        block: |
          http:
            middlewares:
              jellyfin-sso-start:
                redirectRegex:
                  permanent: false
                  regex: "^https://[^/]+/?$"
                  replacement: "https://{{ service_domain }}/sso/OID/start/authelia"
              jellyfin-authelia:
                forwardAuth:
                  address: "http://symbios-base-authelia:9091/api/authz/forward-auth?authelia_url=https://auth.{{ base_domain }}"
                  trustForwardHeader: true
                  authResponseHeaders:
                    - "Remote-User"
                    - "Remote-Groups"
                    - "Remote-Name"
                    - "Remote-Email"
                    - "Remote-Method"
                  authRequestHeaders:
                    - "Accept"
                    - "Accept-Language"
                    - "Cookie"
                    - "User-Agent"
                    - "X-Forwarded-For"
                    - "X-Forwarded-Host"
                    - "X-Forwarded-Method"
                    - "X-Forwarded-Port"
                    - "X-Forwarded-Proto"
                    - "X-Forwarded-Server"
                    - "X-Forwarded-Uri"
        backup: yes

    - name: Traefik provider snippet for jellyfin
      include_tasks: ../shared-tasks/traefik-provider.yml
      vars:
        traefik_backend_url: "http://jellyfin:8096"
        traefik_middlewares:
          - "jellyfin-sso-start@file"
          - "secHeaders@file"
          - "jellyfin-authelia@file"

    # The Kodi addon sends its own credentials/device token and cannot do the
    # Authelia browser redirect. This route stays LAN-only (no forward-auth)
    # and is meant for API clients, not for interactive logins.
    - name: Deploy the LAN-only Jellyfin API Traefik provider
      ansible.builtin.blockinfile:
        path: /symbios/base-services/traefik/providers/jellyfin-api.yml
        create: yes
        mode: "0444"
        owner: root
        group: docker
        marker: "# {mark} ANSIBLE MANAGED BLOCK jellyfin API"
        block: |
          http:
            routers:
              jellyfin-api:
                rule: "Host(`{{ jellyfin_api_domain }}`)"
                service: jellyfin-api
                entryPoints:
                  - "https"
                tls:
                  certResolver: {{ acme_resolver }}
                middlewares:
                  - "allowlocalipsonly@file"
                  - "secHeaders@file"
            services:
              jellyfin-api:
                loadBalancer:
                  servers:
                    - url: "http://jellyfin:8096"
        backup: yes

    - name: Ensure LDAP groups for Jellyfin OIDC login
      include_tasks: ../shared-tasks/oidc-groups.yml

    # The plugin reads roles from the ID token, so this client needs the
    # id_token claims policy instead of Authelia's reduced default set.
    - name: Write OIDC config in Authelia for Jellyfin
      include_tasks: ../shared-tasks/authelia-oidc.yml
      vars:
        oidc_client_name: "Jellyfin"
        oidc_claims_policy: id_token
        oidc_redirect_uris:
          - "https://jellyfin.{{ base_domain }}/sso/OID/redirect/authelia"

    - name: Restrict the Jellyfin route to the LDAP groups
      include_tasks: ../shared-tasks/authelia-acl.yml
      vars:
        authelia_subjects:
          - ["group:jellyfin-users"]
          - ["group:jellyfin-admins"]

    # Jellyfin 12 defaults the scan fanout to the CPU count. On a small host
    # that turns the first library scan into a host-wide stall. Value 1 forces
    # sequential operation and also avoids the parallel-queue stall in 12.x.
    # The file is managed here because the provision script rewrites the whole
    # server configuration through the API after the handler flush below.
    - name: Ensure Jellyfin system configuration exists
      ansible.builtin.copy:
        content: |
          <?xml version="1.0" encoding="utf-8"?>
          <ServerConfiguration xmlns:xsi="http://www.w3.org/2001/XMLSchema-instance" xmlns:xsd="http://www.w3.org/2001/XMLSchema">
          </ServerConfiguration>
        dest: "{{ jellyfin_config_root }}/config/system.xml"
        owner: "{{ jellyfin_uid }}"
        group: media
        mode: '0644'
        force: false

    - name: Limit Jellyfin library scan concurrency
      ansible.builtin.lineinfile:
        path: "{{ jellyfin_config_root }}/config/system.xml"
        regexp: '^\s*<{{ item }}>.*</{{ item }}>\s*$'
        line: "  <{{ item }}>1</{{ item }}>"
        insertbefore: '^</ServerConfiguration>$'
        backup: yes
      loop:
        - LibraryScanFanoutConcurrency
        - LibraryMetadataRefreshConcurrency
        - ParallelImageEncodingLimit
      notify: Restart jellyfin

    # Keep Jellyfin UI and metadata language in sync with the system locale.
    # The provision script posts the full configuration back through the API
    # after this restart, so these values are part of the persisted config.
    - name: Set Jellyfin language from the system locale
      ansible.builtin.lineinfile:
        path: "{{ jellyfin_config_root }}/config/system.xml"
        regexp: '^\s*<{{ item.key }}>.*</{{ item.key }}>\s*$'
        line: "  <{{ item.key }}>{{ item.value }}</{{ item.key }}>"
        insertbefore: '^</ServerConfiguration>$'
        backup: yes
      loop:
        - key: UICulture
          value: "{{ jellyfin_ui_culture }}"
        - key: PreferredMetadataLanguage
          value: "{{ jellyfin_language }}"
        - key: MetadataCountryCode
          value: "{{ jellyfin_metadata_country }}"
      notify: Restart jellyfin

    # Restart before provisioning so Jellyfin loads the plugin and Authelia
    # serves the new client configuration.
    - name: Flush handlers before Jellyfin provisioning
      ansible.builtin.meta: flush_handlers

    # WebUI rotation calls this hook by secret name. A missing hook would leave
    # the stored password out of sync with Jellyfin, so fail early.
    - name: Check the Jellyfin kodi password rotation hook
      ansible.builtin.stat:
        path: "{{ git_root }}/scripts/secret-rotation.d/jellyfin_kodi_password.sh"
      register: jellyfin_kodi_hook

    - name: Verify the Jellyfin kodi password rotation hook is installed
      ansible.builtin.assert:
        that: jellyfin_kodi_hook.stat.exists
        fail_msg: "Missing {{ git_root }}/scripts/secret-rotation.d/jellyfin_kodi_password.sh"
        quiet: true

    - name: Complete first-run setup and configure Authelia SSO and libraries
      ansible.builtin.command:
        argv:
          - "{{ git_root }}/scripts/symbios-jellyfin-provision.sh"
          - "--base-url"
          - "http://127.0.0.1:8096"
          - "--config-dir"
          - "{{ jellyfin_service_dir }}"
          - "--public-url"
          - "https://jellyfin.{{ base_domain }}"
          - "--server-name"
          - "jellyfin.{{ base_domain }}"
          - "--oidc-endpoint"
          - "https://auth.{{ base_domain }}"
          - "--client-id"
          - "jellyfin"
          - "--provider-name"
          - "{{ jellyfin_sso_provider }}"
          - "--admin-user"
          - "{{ jellyfin_bootstrap_admin }}"
          - "--kodi-user"
          - "{{ jellyfin_kodi_user }}"
          - "--media-movies"
          - "/media/movies"
          - "--media-tvshows"
          - "/media/tvshows"
          - "--media-downloads"
          - "/media/downloads"
          - "--media-audio"
          - "/media/audio"
          - "--media-images"
          - "/media/images"
      register: jellyfin_provision
      changed_when: "'jellyfin-provision-changed' in jellyfin_provision.stdout"
      failed_when: "'jellyfin-provision-changed' not in jellyfin_provision.stdout and 'jellyfin-provision-unchanged' not in jellyfin_provision.stdout"

    # Jellyfin does not reliably attach local cover files during the first
    # scan. Wait for that scan in the background and refresh artwork once so
    # album covers appear without manual metadata refreshes.
    - name: Refresh local artwork after the first library scan
      ansible.builtin.command:
        argv:
          - "{{ git_root }}/scripts/symbios-jellyfin-provision.sh"
          - "--base-url"
          - "http://127.0.0.1:8096"
          - "--config-dir"
          - "{{ jellyfin_service_dir }}"
          - "--refresh-artwork"
      register: jellyfin_artwork
      changed_when: false
      async: 86400
      poll: 0

    # Items keep the description language from their first scan. Refetch them
    # once per configured metadata language; artwork is handled separately.
    - name: Refresh movie and series metadata in the configured language
      ansible.builtin.command:
        argv:
          - "{{ git_root }}/scripts/symbios-jellyfin-provision.sh"
          - "--base-url"
          - "http://127.0.0.1:8096"
          - "--config-dir"
          - "{{ jellyfin_service_dir }}"
          - "--refresh-metadata"
      register: jellyfin_metadata
      changed_when: false
      async: 86400
      poll: 0

    # Deploy the shared HTTP healthcheck (shared-tasks/runcheck.yml)
    - name: Deploy healthcheck
      include_tasks: ../shared-tasks/runcheck.yml

    - name: Register playbook as installed
      include_tasks: ../shared-tasks/state-register.yml

  handlers:
    - name: Restart jellyfin
      include_tasks: ../shared-tasks/compose-recreate.yml

    - name: Restart authelia
      include_tasks: ../shared-tasks/authelia-restart.yml

