# SFTP file share with a chrooted, jailed view on the shared media root.
#
# Auth model: the container talks directly against LDAP (NSS/PAM via
# libnss-ldapd over the symbios_base_services network, same as Authelia).
# The LDAP group media is the single source of truth for who may use the
# share (sshd AllowGroups + on-disk group permissions); users authenticate
# with their LDAP password (PAM) or an SSH public key from their LDAP
# sshPublicKey attribute (AuthorizedKeysCommand). There are no local
# container accounts and no second user list. LDAP users resolve to their
# real uidNumber inside the container.
#
# The share directory defaults to the global media_root (see mediapaths.md)
# and is always the chroot root inside the container. It must stay
# root-owned without group/other write access (sshd requirement); the
# writable landing point is the inbox below it.
#
# docs:
#   name: SFTP Share
#   short_description: Deploy the SFTP file-share service
#   description: Deploys a scoped SFTP file-sharing container for secure external file exchange.
#   author: Oliver Bohlen
#   version: '1.0'
#   license: GPLv3
#   copyright: Copyright (c) 2026, Oliver Bohlen
#   min_ansible_version: '2.11'
#   platforms:
#   - name: Debian
#     versions:
#     - '13'
#   category: Service
#   service_control:
#     services:
#     - name: sftp-share
#       type: docker
#       compose_file: /symbios/services/sftp-share/docker-compose.yml
#       status: test -d /symbios/services/sftp-share || exit 2; docker compose -f /symbios/services/sftp-share/docker-compose.yml ps | grep -q "Up "
#     logs:
#     - name: sftp-share
#       command: docker compose -f /symbios/services/sftp-share/docker-compose.yml logs -f --tail=100
#   uninstall:
#     stop: docker compose -f /symbios/services/sftp-share/docker-compose.yml down
#     program_paths:
#       - /symbios/services/sftp-share/
#       - /symbios/runchecks.d/symbios-healthcheck-sftp-share.check
#   ldap_groups:
#     - media
#   actions:
#     start: docker compose -f /symbios/services/sftp-share/docker-compose.yml up -d
#     stop: docker compose -f /symbios/services/sftp-share/docker-compose.yml down
#     restart: docker compose -f /symbios/services/sftp-share/docker-compose.yml restart
#     reload: docker compose -f /symbios/services/sftp-share/docker-compose.yml up -d
#

---
- name: sftp-share
  hosts: all
  vars:
    service_name: sftp-share
    service_domain: "{{ service_name }}.{{ base_domain }}"
    # Shared media root exported read-write to every media group member.
    # Inside the container it is always /sftp-share (the chroot root);
    # the writable landing point is the inbox below it.
    sftp_share_datadir: "{{ media_root | default('/symbios/media') }}"
    # Previous default kept for the one-time migration below.
    sftp_share_legacy_datadir: "/symbios/services/{{ service_name }}/data"
    # Group and gid that owns the share directory inside the container
    sftp_share_group: media
    sftp_share_gid: "{{ media_gid | default(31000) }}"
    # LDAP group that defines which users may access the share
    sftp_share_ldap_group: media
  tasks:

  - name: Create LDAP group {{ sftp_share_ldap_group }} for SFTP access control
    include_tasks: tasks/ldap-single-group.yml
    vars:
      service_name: sftp-share
      ldap_group_name: "{{ sftp_share_ldap_group }}"
      ldap_group_gid: "{{ sftp_share_gid }}"

  - name: Remove the obsolete SFTPUSERS sync hook (direct LDAP needs no materialization)
    ansible.builtin.file:
      path: "{{ data_root }}/ldap-groups.d/sftp-share-users.hook"
      state: absent

  - name: Deploy LDAP group-change hook (ensure chroot home dirs for new members)
    ansible.builtin.copy:
      dest: "{{ data_root }}/ldap-groups.d/sftp-share-homes.hook"
      content: |
        #!/bin/bash
        # SymbiOS hook - ensure chroot home dirs for new SFTP users.
        # Executed by the shared LDAP group-change dispatcher
        # (see symbios-lib.sh, called by symbios-ldap-groups.sh for CLI and
        # WebUI changes) whenever a group or a membership changes.
        # Args: $1=event $2=group $3=uid
        # SFTP access comes from the media group and every shared-* group.
        # Only new members need a landing dir; removals keep their data for
        # the admin to clean up.
        [[ "${1:-}" == "member-added" ]] || exit 0
        [[ "${2:-}" == "media" || "${2:-}" == shared-* ]] || exit 0
        exec "{{ git_root }}/scripts/symbios-sftp-share-homes.sh" "${3:-}"
      mode: '0755'
      owner: root
      group: root

  - name: Allow all access to tcp port 28
    community.general.ufw:
      rule: allow
      port: '28'
      proto: tcp

  - name: Create /symbios/services/sftp-share dir
    ansible.builtin.file:
      path: /symbios/services/sftp-share
      owner: root
      group: docker
      state: directory
      mode: '0550'

  - name: Check the legacy share directory for content to migrate
    ansible.builtin.stat:
      path: "{{ sftp_share_legacy_datadir }}"
    register: sftp_legacy_dir

  - name: Move legacy share content into the media inbox (one-time migration)
    ansible.builtin.shell: |
      mkdir -p "{{ media_inbox | default('/symbios/media/inbox') }}"
      mv "{{ sftp_share_legacy_datadir }}"/* "{{ media_inbox | default('/symbios/media/inbox') }}/" 2>/dev/null || true
      rmdir "{{ sftp_share_legacy_datadir }}" 2>/dev/null || true
    when:
      - sftp_legacy_dir.stat.exists | default(false)
      - sftp_share_legacy_datadir != sftp_share_datadir
    changed_when: false
    failed_when: false

  - name: Ensure the share directory exists (owned by media.yml, never managed here)
    ansible.builtin.file:
      path: "{{ sftp_share_datadir }}"
      state: directory

  - name: Gen sshd ed25519 host-keys
    ansible.builtin.shell: ssh-keygen -q -N "" -t ed25519 -f ssh_host_ed25519_key
    args:
      chdir: /symbios/services/sftp-share
      creates: /symbios/services/sftp-share/ssh_host_ed25519_key

  - name: /symbios/services/sftp-share/docker-compose.yml
    blockinfile:
      path: /symbios/services/sftp-share/docker-compose.yml
      mode: "0440"
      owner: root
      group: root
      create: yes
      marker: "# {mark} ANSIBLE MANAGED BLOCK"
      block: |
        name: ""

        services:
          sftp-share:
            build:
              context: .
              dockerfile: Dockerfile
            container_name: sftp-share
            restart: unless-stopped
            ports:
              - "28:28"
            volumes:
              - /etc/localtime:/etc/localtime:ro
              - ./ssh_host_ed25519_key:/etc/ssh/ssh_host_ed25519_key
              - ./ssh_host_ed25519_key.pub:/etc/ssh/ssh_host_ed25519_key.pub
              - ./sftp-share.conf:/etc/sftp-share.conf:ro
              - ./sftp-share-user.conf:/etc/sftp-share-user.conf
              - ./nslcd.conf:/etc/nslcd.conf:ro
              - ./nsswitch.conf:/etc/nsswitch.conf:ro
              - ./sftp-ldap-keys:/usr/local/bin/sftp-ldap-keys:ro
              - {{ sftp_share_datadir }}:/sftp-share:rw
            networks:
              - sftp-share--network
              - symbios_base_services

        networks:
          sftp-share--network:
            driver: bridge
            driver_opts:
              com.docker.network.bridge.name: br-sftp-share
          symbios_base_services:
            external: true
      backup: yes
    notify:
    - Restart sftp-share

  - name: /symbios/services/sftp-share/Dockerfile
    blockinfile:
      path: /symbios/services/sftp-share/Dockerfile
      mode: "0440"
      owner: root
      group: root
      create: yes
      marker: "# {mark} ANSIBLE MANAGED BLOCK"
      block: |
        FROM debian:latest
        RUN apt-get update \
            && apt-get install -y openssh-server ldap-utils libnss-ldapd libpam-ldapd strace \
            && rm -rf /var/lib/apt/lists/* \
            && mkdir -p -m0755 /run/sshd
        ENV LANG en_US.utf8
        COPY ./docker-entrypoint.sh /
        ENTRYPOINT ["/docker-entrypoint.sh"]
      backup: yes
    notify:
    - Restart sftp-share

  - name: Read LDAP readuser password for the container nslcd.conf
    ansible.builtin.shell: grep ^LDAP_READUSER_PASSWORD= /symbios/base-services/ldap/env.openldap | cut -d= -f2-
    register: sftp_ldap_readpw
    changed_when: false
    no_log: true

  - name: /symbios/services/sftp-share/nslcd.conf (LDAP user/group resolution)
    blockinfile:
      path: /symbios/services/sftp-share/nslcd.conf
      mode: "0600"
      owner: root
      group: root
      create: yes
      marker: "# {mark} ANSIBLE MANAGED BLOCK"
      block: |
        uid nslcd
        gid nslcd
        uri ldap://symbios-base-ldap:389
        base {{ ldap_basedn }}
        base passwd ou=users,{{ ldap_basedn }}
        base group ou=groups,{{ ldap_basedn }}
        base shadow ou=users,{{ ldap_basedn }}
        ldap_version 3
        bind_timelimit 3
        timelimit 3
        reconnect_retrytime 1
        binddn cn=readuser,{{ ldap_basedn }}
        bindpw {{ sftp_ldap_readpw.stdout }}
      backup: yes
    no_log: true
    notify:
    - Restart sftp-share

  - name: /symbios/services/sftp-share/nsswitch.conf (files + LDAP)
    blockinfile:
      path: /symbios/services/sftp-share/nsswitch.conf
      mode: "0444"
      owner: root
      group: root
      create: yes
      marker: "# {mark} ANSIBLE MANAGED BLOCK"
      block: |
        passwd: files ldap
        group: files ldap
        shadow: files ldap
      backup: yes
    notify:
    - Restart sftp-share

  - name: /symbios/services/sftp-share/sftp-ldap-keys (pubkeys from LDAP for sshd)
    blockinfile:
      path: /symbios/services/sftp-share/sftp-ldap-keys
      mode: "0555"
      owner: root
      group: root
      create: yes
      marker: "# {mark} ANSIBLE MANAGED BLOCK"
      block: |
        # Print the sshPublicKey values of $1 for sshd AuthorizedKeysCommand.
        # Reads bind credentials from /etc/nslcd.conf (root-only, 0600).
        f_uid="$1"
        [[ "${f_uid}" =~ ^[a-z0-9._-]+$ ]] || exit 0
        f_base="$(sed -n 's/^base //p' /etc/nslcd.conf | head -1)"
        f_binddn="$(sed -n 's/^binddn //p' /etc/nslcd.conf | head -1)"
        f_bindpw="$(sed -n 's/^bindpw //p' /etc/nslcd.conf | head -1)"
        [[ -n "${f_base}" && -n "${f_binddn}" && -n "${f_bindpw}" ]] || exit 0
        ldapsearch -x -LLL -o ldif-wrap=no -H ldap://symbios-base-ldap \
          -D "${f_binddn}" -w "${f_bindpw}" \
          -b "ou=users,${f_base}" "(uid=${f_uid})" sshPublicKey 2>/dev/null \
          | sed -n 's/^sshPublicKey: //p'
      backup: yes
      validate: /bin/bash -n %s
    notify:
    - Restart sftp-share

  - name: /symbios/services/sftp-share/sftp-ldap-keys shebang
    lineinfile:
      path: /symbios/services/sftp-share/sftp-ldap-keys
      insertbefore: BOF
      line: "#!/bin/bash"

  - name: Remove the obsolete SFTPUSERS env file (direct LDAP needs no local accounts)
    ansible.builtin.file:
      path: /symbios/services/sftp-share/env
      state: absent

  - name: Create additional Config sftp-share-user.conf
    copy:
      content: ""
      dest: /symbios/services/sftp-share/sftp-share-user.conf
      force: no
      group: root
      owner: root
      mode: 0600

  - name: /symbios/services/sftp-share/docker-entrypoint.sh
    blockinfile:
      path: /symbios/services/sftp-share/docker-entrypoint.sh
      mode: "0555"
      owner: root
      group: root
      create: yes
      marker: "# {mark} ANSIBLE MANAGED BLOCK"
      block: |
        # Start nslcd so LDAP users/groups resolve (sshd uses NSS/PAM).
        # Then ensure the chroot landing dirs for media members: sshd
        # chdirs to the LDAP homeDirectory after the chroot, so
        # /sftp-share/home/<uid> must exist and belong to the user.
        # Membership changes between restarts are covered by the
        # ldap-groups.d hook calling symbios-sftp-share-homes.sh.
        # /var/run is a fresh tmpfs on every container start, so the
        # nslcd socket directory must be recreated at runtime.
        mkdir -p /var/run/nslcd
        chown nslcd:nslcd /var/run/nslcd
        /usr/sbin/nslcd

        for g_try in 1 2 3 4 5 6
        do
          if getent group media >/dev/null 2>&1
          then
            break
          fi
          sleep 5
        done

        # Landing dirs for every SFTP-eligible user (media + shared-* groups)
        for g_user in $(getent passwd 2>/dev/null | cut -d: -f1)
        do
          if ! id -nG "${g_user}" 2>/dev/null | tr ' ' '\n' | grep -qxE 'media|shared-.*'
          then
            continue
          fi
          g_uid="$(id -u "${g_user}" 2>/dev/null || true)"
          if [[ -n "${g_uid}" ]]
          then
            mkdir -p "/sftp-share/home/${g_user}"
            chown "${g_uid}:{{ sftp_share_gid }}" "/sftp-share/home/${g_user}"
            chmod 0700 "/sftp-share/home/${g_user}"
            chmod g-s "/sftp-share/home/${g_user}"
          fi
        done

        # Start SSH daemon in foreground with sftp-share configuration
        /usr/sbin/sshd -D -f /etc/sftp-share.conf -E /proc/1/fd/1
      backup: yes
      validate: /bin/bash -n %s
    notify:
    - Restart sftp-share

  - name: /symbios/services/sftp-share/docker-entrypoint.sh shebang
    lineinfile:
      path: /symbios/services/sftp-share/docker-entrypoint.sh
      insertbefore: BOF
      line: "#!/bin/bash"

  - name: /symbios/services/sftp-share/sftp-share.conf
    blockinfile:
      path: /symbios/services/sftp-share/sftp-share.conf
      mode: "0500"
      owner: root
      group: root
      create: yes
      marker: "# {mark} ANSIBLE MANAGED BLOCK"
      block: |
        Port 28
        Protocol 2
        # LDAP password via PAM + SSH pubkeys from LDAP sshPublicKey
        # (AuthorizedKeysCommand). Either method grants access.
        PasswordAuthentication yes
        PubkeyAuthentication yes
        AuthorizedKeysCommand /usr/local/bin/sftp-ldap-keys %u
        AuthorizedKeysCommandUser root
        UsePAM yes
        PrintMotd no
        PrintLastLog no
        AcceptEnv LANG LC_*
        AllowTcpForwarding no
        AllowAgentForwarding no
        AllowGroups {{ sftp_share_group }} shared-*
        IgnoreRhosts yes
        PermitRootLogin no
        PermitTunnel no
        X11Forwarding no
        Subsystem sftp internal-sftp -f AUTH -l INFO -u 0007
        # Default landing is the chroot root (traversable, not listable).
        # %u is NOT expanded in internal-sftp args, so per-user start dirs
        # are impossible here; media members get the shared inbox instead
        # (Match must stay last: nothing but comments below).
        ForceCommand internal-sftp -d / -f AUTH -l INFO -u 0007
        # No fail2ban coverage for port 28 (host fail2ban only watches the
        # host sshd), so rate-limit at the daemon level on top of the
        # built-in per-source penalties.
        MaxAuthTries 3
        LoginGraceTime 60
        MaxStartups 3:50:10
        LogLevel VERBOSE
        TCPKeepAlive no
        ClientAliveCountMax 30
        ClientAliveInterval 60
        ## Ciphers Check https://sshcheck.com/server/gabosh.net/28
        #KexAlgorithms curve25519-sha256@libssh.org
        #HostKeyAlgorithms ssh-ed25519
        #Ciphers chacha20-poly1305@openssh.com,aes256-gcm@openssh.com,aes128-gcm@openssh.com
        #MACs hmac-sha2-512-etm@openssh.com,hmac-sha2-256-etm@openssh.com,umac-128-etm@openssh.com
        #AuthenticationMethods publickey,keyboard-interactive
        ChrootDirectory /sftp-share

        Include /etc/sftp-share-user.conf

        # Media members land in the shared inbox. Match blocks must stay
        # last in sshd_config; never add global options below this line,
        # and never put a Match block into sftp-share-user.conf above.
        Match Group media
          ForceCommand internal-sftp -d /inbox -f AUTH -l INFO -u 0007
      backup: yes
      validate: /usr/sbin/sshd -T -f %s
    notify:
    - Restart sftp-share

  - name: Remove the obsolete manual user helper (LDAP group is the single source of truth)
    ansible.builtin.file:
      path: /symbios/services/sftp-share/sftp-share-user.sh
      state: absent

  - name: Deploy healthcheck
    include_tasks: tasks/runcheck-docker.yml
    vars:
      service_name: sftp-share

  
  - name: Ensure sftp-share is running
    ansible.builtin.shell: docker compose up -d
    args:
      chdir: /symbios/services/sftp-share
    changed_when: false

  - name: Ensure chroot home dirs for current media members
    ansible.builtin.shell: "{{ git_root }}/scripts/symbios-sftp-share-homes.sh"
    register: f_sftp_homes
    changed_when: "'ensured' in f_sftp_homes.stdout"
    failed_when: false

  - name: Register playbook as installed
    include_tasks: tasks/state-register.yml

  handlers:

  - name: Restart sftp-share
    ansible.builtin.shell: |
      if docker compose build --pull --no-cache --force-rm
      then
        docker compose up -d
      fi
    args:
      chdir: /symbios/services/sftp-share

