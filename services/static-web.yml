#
# Static web host serving any number of vhosts from plain directories.
#
# Sites are declared in the static_web_instances list, so the playbook
# stays generic: add an entry with a name and a domain to serve another
# subdomain. Every instance gets its own nginx container and its own
# Traefik router, so a broken site does not affect the others.
#
# "docroot" optionally points a site at an external directory (e.g. a
# media share like /symbios/media/shared/<site>); external docroots are
# mounted as-is and never created or modified. Without it the document
# root is a directory below the service directory.
#
# Auth model: sites with "public: false" are protected by Authelia
# forward-auth restricted to the "static-web" LDAP group. OIDC is not
# used because static content has no login form that could start an OIDC
# flow; the LDAP group check happens in the Authelia forward-auth request
# instead. Sites with "public: true" stay public and only get the
# security headers.
#
# docs:
#   uses_vars:
#     - acme_resolver
#     - authelia_cookie_domains
#     - base_domain
#   name: Static Web
#   short_description: Serve static web content from plain directories
#   description: >-
#     Deploys one nginx container per instance that serves static content
#     from a local directory. The instances are managed in the WebUI under
#     the Instances tab (the data lives in
#     <config>/services/static-web/instances.yml, not in inventory.yml).
#     The document root of an instance is either a directory below the
#     service directory or an external path (e.g. a media share) that is
#     mounted read-only. Sites with "public: false" are protected by
#     Authelia forward-auth against the static-web LDAP group.
#   author: Oliver Bohlen
#   version: '1.1'
#   license: GPLv3
#   copyright: Copyright (c) 2026, Oliver Bohlen
#   min_ansible_version: '2.11'
#   platforms:
#   - name: Debian
#     versions:
#     - '13'
#   category: Service
#   access:
#     user_group: static-web
#   config:
#     title: Instances
#     file: services/static-web/instances.yml
#     fields:
#       name:
#         label: Name
#         type: text
#         required: true
#         pattern: '^[a-z0-9][a-z0-9-]*$'
#         placeholder: my-site
#       domain:
#         label: Domain
#         type: text
#         required: true
#         pattern: '^[a-z0-9.-]+\.[a-z]{2,}$'
#         placeholder: www.example.com
#       aliases:
#         label: Aliases
#         type: list
#         placeholder: example.com
#       docroot:
#         label: Document-Root
#         type: text
#         placeholder: /symbios/media/shared/my-site
#       public:
#         label: Public
#         type: bool
#   service_control:
#     services:
#     - name: static-web
#       type: docker
#       compose_file: /symbios/services/static-web/docker-compose.yml
#       status: test -d /symbios/services/static-web || exit 2; docker compose -f /symbios/services/static-web/docker-compose.yml ps | grep -q "Up "
#     logs:
#     - name: static-web
#       command: docker compose -f /symbios/services/static-web/docker-compose.yml logs -f --tail=100
#   uninstall:
#     stop: docker compose -f /symbios/services/static-web/docker-compose.yml down
#     program_paths:
#     - /symbios/services/static-web/
#     - /symbios/base-services/traefik/providers/static-web.yml
#     - /symbios/runchecks.d/symbios-healthcheck-static-web-*.check
#     ldap_groups:
#     - static-web
#     authelia_blocks:
#     - "static-web ACCESS CONTROL"
#   actions:
#     start: docker compose -f /symbios/services/static-web/docker-compose.yml up -d
#     stop: docker compose -f /symbios/services/static-web/docker-compose.yml down
#     restart: docker compose -f /symbios/services/static-web/docker-compose.yml restart
#     reload: docker compose -f /symbios/services/static-web/docker-compose.yml up -d
#
---
- name: static-web
  hosts: all
  gather_facts: no
  vars:
    service_name: static-web
    # Instance list is managed by the WebUI (Instances tab) and stored in
    # the writable config dir, NOT in inventory.yml (which stays
    # base-system only).
    static_web_instances_file: "{{ config_dir | default('/symbios/base-services/symbios-ui/config') }}/services/static-web/instances.yml"
    # Authelia policy applied to the protected sites
    static_web_auth_policy: two_factor
  tasks:

    # Load the instance list from the WebUI-managed config file. When the
    # file does not exist yet (service not configured), static_web_instances
    # stays an empty list and the loops render no container.
    - name: Read instance config file
      ansible.builtin.slurp:
        src: "{{ static_web_instances_file }}"
      register: static_web_instances_slurp
      failed_when: false

    - name: Set static_web_instances from config file
      ansible.builtin.set_fact:
        static_web_instances: "{{ (static_web_instances_slurp.content | default('') | b64decode) | from_yaml | default([]) }}"
      when: static_web_instances_slurp.content | default('') | length > 0

    - name: Create /symbios/services/static-web dir
      ansible.builtin.file:
        path: "/symbios/services/{{ service_name }}"
        owner: root
        group: docker
        state: directory
        mode: '0550'

    # One nginx container per instance, each with its own vhost directory.
    - name: Create nginx config dir per instance
      ansible.builtin.file:
        path: "/symbios/services/{{ service_name }}/nginx/{{ item.name }}"
        owner: root
        group: docker
        state: directory
        mode: '0750'
      loop: "{{ static_web_instances | default([]) }}"

    # One document root per site, each with a placeholder index page.
    # Sites with an external docroot are skipped (owned by whoever
    # provides the directory, e.g. the shares machinery).
    - name: Create document root per site
      ansible.builtin.file:
        path: "/symbios/services/{{ service_name }}/htdocs/{{ item.name }}"
        owner: root
        group: docker
        state: directory
        mode: '0750'
      loop: "{{ static_web_instances | default([]) }}"
      when: item.docroot is not defined

    - name: Create placeholder index page per site
      ansible.builtin.copy:
        dest: "/symbios/services/{{ service_name }}/htdocs/{{ item.name }}/index.html"
        owner: root
        group: docker
        mode: '0640'
        force: false
        content: |
          <!DOCTYPE html>
          <html lang="en">
          <head><meta charset="utf-8"><title>{{ item.domain }}</title></head>
          <body><p>No content deployed for {{ item.domain }} yet.</p></body>
          </html>
      loop: "{{ static_web_instances | default([]) }}"
      when: item.docroot is not defined

    # Resolve external docroots (existence check for the fail-fast
    # assert below; the Grant task consumes the same register).
    - name: Resolve owning GIDs of external docroots
      ansible.builtin.stat:
        path: "{{ item.docroot }}"
      loop: "{{ static_web_instances | default([]) | selectattr('docroot', 'defined') | list }}"
      register: static_web_docroot_stats

    # Document roots keep their own permissions (typically 2770/660 from
    # SFTP uploads): nginx workers drop supplementary groups on startup,
    # so group membership cannot grant them access. A numeric-uid ACL for
    # the nginx worker (uid 101 in the official image) grants
    # read/traverse directly; the default ACL inherits it to new uploads,
    # so no normalization workflow is needed. SFTP isolation is unaffected
    # (no other identity carries uid 101), hence even non-public sites may
    # be share-backed.
    - name: Grant nginx worker read access on the external document roots
      ansible.builtin.shell: |
        setfacl -R -m u:101:rX "{{ item.item.docroot }}" && \
        setfacl -R -d -m u:101:rX "{{ item.item.docroot }}"
      loop: "{{ static_web_docroot_stats.results | default([]) | selectattr('stat.exists') | list }}"
      loop_control:
        label: "{{ item.item.name | default('?') }}"
      changed_when: false

    - name: Grant nginx worker read access on the internal document roots
      ansible.builtin.shell: |
        setfacl -R -m u:101:rX "{{ item }}" && \
        setfacl -R -d -m u:101:rX "{{ item }}"
      loop: >-
        {{ static_web_instances | default([])
           | selectattr('docroot', 'undefined') | map(attribute='name')
           | map('regex_replace', '^', '/symbios/services/' ~ service_name ~ '/htdocs/') | list }}
      changed_when: false

    - name: Fail on missing external docroots
      ansible.builtin.assert:
        that: item.stat.exists
        fail_msg: "External docroot {{ item.item.docroot }} does not exist (site {{ item.item.name }}). Create it first (e.g. the media share)."
      loop: "{{ static_web_docroot_stats.results | default([]) }}"
      when: static_web_docroot_stats.results | default([]) | length > 0

    # Authelia can only protect a host whose cookie domain is listed in
    # the session cookies - the portal URL has to share the cookie scope
    # with the domain. A protected site outside the scope cannot be
    # authenticated at all, so the playbook fails on it.
    - name: Fail on protected sites outside the Authelia session cookie scope
      ansible.builtin.assert:
        that: >-
          ((item.domain in _static_web_auth_scopes)
           or ((item.domain | regex_replace('^[^.]+\\.', '')) in _static_web_auth_scopes))
        fail_msg: >-
          The domain of the static site {{ item.name }} ({{ item.domain }}) is not covered by a
          session cookie domain of Authelia, so it cannot be protected. Add the domain to
          authelia_cookie_domains or make the site public.
      loop: "{{ static_web_instances | default([]) }}"
      when:
        - not (item.public | default(false) | bool)
      vars:
        _static_web_auth_scopes: "{{ [base_domain] + (authelia_cookie_domains | default([])) | map('trim') | select() | list }}"

    # One nginx server block per site, replacing the image default site
    - name: Create nginx vhost per site
      ansible.builtin.copy:
        dest: "/symbios/services/{{ service_name }}/nginx/{{ item.name }}/default.conf"
        owner: root
        group: docker
        mode: '0640'
        content: |
          # nginx server block for the {{ item.domain }} site
          server {
            listen 80;
            listen [::]:80;
            server_name {{ item.domain }}{% for alias in item.aliases | default([]) %} {{ alias }}{% endfor %};

            # Document root and index files
            root /usr/share/nginx/html;
            index index.html index.htm;

            # Do not expose dotfiles
            location ~ /\. {
              deny all;
            }

            # Never render a directory listing
            autoindex off;
          }
      loop: "{{ static_web_instances | default([]) }}"

    # /symbios/services/static-web/docker-compose.yml Container Configuration
    # (template: loops do not survive blockinfile, see the .j2 files)
    - name: /symbios/services/static-web/docker-compose.yml Container Configuration
      ansible.builtin.template:
        src: static-web/templates/docker-compose.yml.j2
        dest: "/symbios/services/{{ service_name }}/docker-compose.yml"
        mode: 0440
        owner: root
        group: docker
        backup: yes
      notify: Restart static-web

    # /symbios/base-services/traefik/providers/static-web.yml Traefik File Provider
    - name: /symbios/base-services/traefik/providers/static-web.yml Traefik File Provider
      ansible.builtin.template:
        src: static-web/templates/traefik-static-web.yml.j2
        dest: "/symbios/base-services/traefik/providers/{{ service_name }}.yml"
        mode: '0444'
        owner: root
        group: docker
        backup: yes

    ##################
    #### Authelia ####
    ##################

    # LDAP auth without OIDC: static content cannot start an OIDC flow, so
    # the "static-web" LDAP group is the access list and Authelia checks it while
    # handling the forward-auth request.
    - name: Create LDAP group for static-web access control
      include_tasks: ../shared-tasks/ldap-single-group.yml

    - name: Write Authelia access_control for static-web group restriction
      ansible.builtin.blockinfile:
        path: /symbios/base-services/authelia/authelia-data/configuration.yml
        marker: "# {mark} ANSIBLE MANAGED BLOCK {{ service_name }} ACCESS CONTROL"
        # Explicit string form with newline escapes: the block scalar would
        # strip the leading whitespace that access_control rules need.
        block: "{% for site in static_web_instances | default([]) %}{% if not (site.public | default(false) | bool) %}    - domain: \"{{ site.domain }}\"\n      policy: {{ static_web_auth_policy }}\n      subject:\n        - [\"group:static-web\"]\n    - domain: \"{{ site.domain }}\"\n      policy: deny\n{% for alias in site.aliases | default([]) %}    - domain: \"{{ alias }}\"\n      policy: {{ static_web_auth_policy }}\n      subject:\n        - [\"group:static-web\"]\n    - domain: \"{{ alias }}\"\n      policy: deny\n{% endfor %}{% endif %}{% endfor %}"
        insertafter: "^# END ANSIBLE MANAGED BLOCK ACCESS CONTROL"
        backup: yes
      notify: Restart authelia

    # One healthcheck per instance: probes the site URL every 5 min.
    - name: Deploy healthcheck for each instance
      ansible.builtin.include_tasks: ../shared-tasks/runcheck.yml
      vars:
        service_name: "static-web-{{ item.name }}"
        service_domain: "{{ item.domain }}"
      loop: "{{ static_web_instances | default([]) }}"

    # Remove healthchecks of instances that were removed from the config
    # file (the orphaned .check would otherwise keep failing every 5 min).
    - name: Detect deployed static-web healthchecks
      ansible.builtin.find:
        paths: "{{ data_root }}/runchecks.d"
        patterns: "symbios-healthcheck-static-web*.check"
      register: static_web_hc_existing

    - name: Remove healthchecks of removed static-web instances
      ansible.builtin.file:
        path: "{{ item }}"
        state: absent
      loop: "{{ _static_web_hc_stale }}"
      vars:
        _static_web_hc_current: >-
          {{ static_web_instances | default([]) | map(attribute='name')
             | map('regex_replace', '^', data_root ~ '/runchecks.d/symbios-healthcheck-static-web-')
             | map('regex_replace', '$', '.check')
             | list }}
        _static_web_hc_stale: "{{ static_web_hc_existing.files | map(attribute='path') | difference(_static_web_hc_current) | list }}"

    - name: Ensure static-web is running
      include_tasks: ../shared-tasks/docker-start.yml

    - name: Register playbook as installed
      include_tasks: ../shared-tasks/state-register.yml

  handlers:

    - name: Restart static-web
      include_tasks: ../shared-tasks/compose-recreate.yml
      vars:
        # --remove-orphans: the container of a removed instance would
        # otherwise keep running.
        compose_args: up -d --force-recreate --remove-orphans

    - name: Restart authelia
      include_tasks: ../shared-tasks/authelia-restart.yml
