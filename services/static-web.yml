#
# Static web host serving any number of vhosts from plain directories.
#
# Sites are declared in the static_web_sites list, so the playbook stays
# generic: add an entry with a name and a domain to serve another subdomain.
# The default deployment provides three sites (web, doc, share).
#
# Auth model: sites listed in static_web_auth_sites are protected by Authelia
# forward-auth restricted to the "static-web" LDAP group. OIDC is not used
# because static content has no login form that could start an OIDC flow; the
# LDAP group check happens in the Authelia forward-auth request instead. Sites
# that are not listed stay public and only get the security headers.
#
# docs:
#   name: Static Web
#   short_description: Serve static web content from plain directories
#   description: Deploys a single nginx container that serves any number of static subdomains from local directories. Selected sites are protected by Authelia forward-auth against the static-web LDAP group.
#   url: "https://web.{{ base_domain }}"
#   author: Oliver Bohlen
#   version: '1.0'
#   license: GPLv3
#   copyright: Copyright (c) 2026, Oliver Bohlen
#   min_ansible_version: '2.11'
#   platforms:
#   - name: Debian
#     versions:
#     - '13'
#   category: Service
#   access:
#     user_group: static-web
#   service_control:
#     services:
#     - name: static-web
#       type: docker
#       compose_file: /symbios/services/static-web/docker-compose.yml
#       status: test -d /symbios/services/static-web || exit 2; docker compose -f /symbios/services/static-web/docker-compose.yml ps | grep -q "Up "
#     logs:
#     - name: static-web
#       command: docker compose -f /symbios/services/static-web/docker-compose.yml logs -f --tail=100
#   uninstall:
#     stop: docker compose -f /symbios/services/static-web/docker-compose.yml down
#     program_paths:
#       - /symbios/services/static-web/
#       - /symbios/base-services/traefik/providers/static-web.yml
#       - /symbios/runchecks.d/symbios-healthcheck-static-web.check
#     ldap_groups:
#       - static-web
#     authelia_blocks:
#       - "static-web ACCESS CONTROL"
#   actions:
#     start: docker compose -f /symbios/services/static-web/docker-compose.yml up -d
#     stop: docker compose -f /symbios/services/static-web/docker-compose.yml down
#     restart: docker compose -f /symbios/services/static-web/docker-compose.yml restart
#     reload: docker compose -f /symbios/services/static-web/docker-compose.yml up -d
#
---
- name: static-web
  hosts: all
  vars:
    service_name: static-web
    # Sites served by this stack. "name" is used for the Traefik router
    # and (by default) the document root directory, "domain" for the
    # hostname. "docroot" optionally points a site at an external
    # directory (e.g. a media share like /symbios/media/shared/<site>);
    # external docroots are mounted as-is and never created or modified.
    static_web_sites:
      - name: web
        domain: "web.{{ base_domain }}"
      - name: doc
        domain: "doc.{{ base_domain }}"
      - name: share
        domain: "share.{{ base_domain }}"
    # Subset of static_web_sites that is protected by Authelia forward-auth
    static_web_auth_sites:
      - web
    # Authelia policy applied to the protected sites
    static_web_auth_policy: two_factor
    # Site used for the healthcheck URL
    static_web_probe_site: web
    # tasks/runcheck.yml derives the check name and default URL from
    # service_domain, so point it at the probed site
    service_domain: "{{ (static_web_sites | selectattr('name', 'equalto', static_web_probe_site) | map(attribute='domain') | first) | default(static_web_sites[0].domain) }}"
  tasks:

    - name: Create /symbios/services/static-web dir
      ansible.builtin.file:
        path: "/symbios/services/{{ service_name }}"
        owner: root
        group: docker
        state: directory
        mode: '0550'

    - name: Create /symbios/services/static-web/htdocs dir
      ansible.builtin.file:
        path: "/symbios/services/{{ service_name }}/htdocs"
        owner: root
        group: docker
        state: directory
        mode: '0750'

    - name: Create /symbios/services/static-web/nginx/conf.d dir
      ansible.builtin.file:
        path: "/symbios/services/{{ service_name }}/nginx/conf.d"
        owner: root
        group: docker
        state: directory
        mode: '0750'

    # One document root per site, each with a placeholder index page.
    # Sites with an external docroot are skipped (owned by whoever
    # provides the directory, e.g. the shares machinery).
    - name: Create document root per site
      ansible.builtin.file:
        path: "/symbios/services/{{ service_name }}/htdocs/{{ item.name }}"
        owner: root
        group: docker
        state: directory
        mode: '0750'
      loop: "{{ static_web_sites }}"
      when: item.docroot is not defined

    - name: Create placeholder index page per site
      ansible.builtin.copy:
        dest: "/symbios/services/{{ service_name }}/htdocs/{{ item.name }}/index.html"
        owner: root
        group: docker
        mode: '0640'
        force: false
        content: |
          <!DOCTYPE html>
          <html lang="en">
          <head><meta charset="utf-8"><title>{{ item.domain }}</title></head>
          <body><p>No content deployed for {{ item.domain }} yet.</p></body>
          </html>
      loop: "{{ static_web_sites }}"
      when: item.docroot is not defined

    # Resolve external docroots (existence check for the fail-fast
    # assert below; the Grant task consumes the same register).
    - name: Resolve owning GIDs of external docroots
      ansible.builtin.stat:
        path: "{{ item.docroot }}"
      loop: "{{ static_web_sites | selectattr('docroot', 'defined') | list }}"
      register: static_web_docroot_stats

    # External docroots (e.g. media shares) keep their own permissions
    # (typically 2770/660 from SFTP uploads): nginx workers drop
    # supplementary groups on startup, so group membership cannot grant
    # them access. A numeric-uid ACL for the nginx worker (uid 101 in the
    # official image) grants read/traverse directly; the default ACL
    # inherits it to new uploads, so no normalization workflow is needed.
    # SFTP isolation is unaffected (no other identity carries uid 101),
    # hence even non-public sites may be share-backed.
    - name: Grant nginx worker read access on external docroots
      ansible.builtin.shell: |
        setfacl -R -m u:101:rX "{{ item.item.docroot }}" && \
        setfacl -R -d -m u:101:rX "{{ item.item.docroot }}"
      loop: "{{ static_web_docroot_stats.results | selectattr('stat.exists') | list }}"

    - name: Fail on missing external docroots
      ansible.builtin.assert:
        that: item.stat.exists
        fail_msg: "External docroot {{ item.item.docroot }} does not exist (site {{ item.item.name }}). Create it first (e.g. the media share)."
      loop: "{{ static_web_docroot_stats.results }}"
      when: static_web_docroot_stats.results | default([]) | length > 0

    # One nginx server block per site, replacing the image default site
    - name: Create nginx vhost per site
      ansible.builtin.copy:
        dest: "/symbios/services/{{ service_name }}/nginx/conf.d/{{ item.name }}.conf"
        owner: root
        group: docker
        mode: '0640'
        content: |
          # nginx server block for the {{ item.domain }} site
          server {
            listen 80;
            listen [::]:80;
            server_name {{ item.domain }};

            # Document root and index files
            root /usr/share/nginx/html/{{ item.name }};
            index index.html index.htm;

            # Do not expose dotfiles
            location ~ /\. {
              deny all;
            }

            # Never render a directory listing
            autoindex off;
          }
      loop: "{{ static_web_sites }}"

    - name: Remove the nginx image default site
      ansible.builtin.file:
        path: "/symbios/services/{{ service_name }}/nginx/conf.d/default.conf"
        state: absent

    # /symbios/services/static-web/docker-compose.yml Container Configuration
    # (template: loops do not survive blockinfile, see the .j2 files)
    - name: /symbios/services/static-web/docker-compose.yml Container Configuration
      ansible.builtin.template:
        src: static-web/templates/docker-compose.yml.j2
        dest: "/symbios/services/{{ service_name }}/docker-compose.yml"
        mode: 0440
        owner: root
        group: docker
        backup: yes
      notify: Restart static-web

    # /symbios/base-services/traefik/providers/static-web.yml Traefik File Provider
    - name: /symbios/base-services/traefik/providers/static-web.yml Traefik File Provider
      ansible.builtin.template:
        src: static-web/templates/traefik-static-web.yml.j2
        dest: "/symbios/base-services/traefik/providers/{{ service_name }}.yml"
        mode: 0444
        owner: root
        group: docker
        backup: yes

    ##################
    #### Authelia ####
    ##################

    # LDAP auth without OIDC: static content cannot start an OIDC flow, so the
    # "static-web" LDAP group is the access list and Authelia checks it while
    # handling the forward-auth request.
    - name: Create LDAP group for static-web access control
      include_tasks: tasks/ldap-single-group.yml

    - name: Write Authelia access_control for static-web group restriction
      ansible.builtin.blockinfile:
        path: /symbios/base-services/authelia/authelia-data/configuration.yml
        marker: "# {mark} ANSIBLE MANAGED BLOCK {{ service_name }} ACCESS CONTROL"
        # Explicit string form with newline escapes: the block scalar would
        # strip the leading whitespace that access_control rules need.
        block: "{% for site in static_web_sites | selectattr('name', 'in', static_web_auth_sites) %}    - domain: \"{{ site.domain }}\"\n      policy: {{ static_web_auth_policy }}\n      subject:\n        - [\"group:static-web\"]\n    - domain: \"{{ site.domain }}\"\n      policy: deny\n{% endfor %}"
        insertafter: "^# END ANSIBLE MANAGED BLOCK ACCESS CONTROL"
        backup: yes
      notify: Restart authelia

    - name: Deploy healthcheck
      include_tasks: tasks/runcheck.yml
      vars:
        service_name: static-web
        healthcheck_url: "https://{{ service_domain }}"

    - name: Ensure static-web is running
      include_tasks: tasks/docker-start.yml

    - name: Register playbook as installed
      include_tasks: tasks/state-register.yml

  handlers:

    - name: Restart static-web
      ansible.builtin.shell: docker compose up -d --force-recreate
      args:
        chdir: "/symbios/services/{{ service_name }}"

    - name: Restart authelia
      ansible.builtin.shell: docker compose restart
      args:
        chdir: /symbios/base-services/authelia
