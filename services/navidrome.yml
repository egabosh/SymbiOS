# docs:
#   uses_vars:
#     - acme_resolver
#     - base_domain
#     - media_audio
#     - media_gid
#     - twofa_enabled
#   name: Navidrome
#   short_description: Deploy the Navidrome music streaming server
#   description: Deploys Navidrome, a self-hosted music server and streamer compatible with Subsonic/Airsonic, exposed via Traefik. Browser login runs via Authelia SSO (Remote-User header, auto-mapped to the same-named row); Subsonic clients (Supersonic, DSub, Feishin, ...) use /rest/* which bypasses Authelia, so they authenticate with Navidrome's local password. That password follows the LDAP password automatically via the ldap-groups.d password hook. Troubleshooting tip - if a client login fails, set the user's password again via Users and Groups - this re-runs the password hook and repairs the API password. Users who only ever logged in via SSO have no local password yet - the admin sets it once with /symbios/services/navidrome/navidrome-passwd.sh on the host.
#   url: "https://navidrome.{{ base_domain }}"
#   author: Oliver Bohlen
#   version: '1.0'
#   license: GPLv3
#   copyright: Copyright (c) 2026, Oliver Bohlen
#   min_ansible_version: '2.11'
#   platforms:
#   - name: Debian
#     versions:
#     - '13'
#   category: Service
#   service_control:
#     services:
#     - name: navidrome
#       type: docker
#       compose_file: /symbios/services/navidrome/docker-compose.yml
#       status: test -d /symbios/services/navidrome || exit 2; docker compose -f /symbios/services/navidrome/docker-compose.yml ps | grep -q "Up "
#     logs:
#     - name: navidrome
#       command: docker compose -f /symbios/services/navidrome/docker-compose.yml logs -f --tail=100
#   uninstall:
#     stop: docker compose -f /symbios/services/navidrome/docker-compose.yml down
#     program_paths:
#       - /symbios/services/navidrome/
#       - /symbios/base-services/traefik/providers/navidrome.yml
#       - /symbios/runchecks.d/symbios-healthcheck-navidrome.check
#   actions:
#     start: docker compose -f /symbios/services/navidrome/docker-compose.yml up -d
#     stop: docker compose -f /symbios/services/navidrome/docker-compose.yml down
#     restart: docker compose -f /symbios/services/navidrome/docker-compose.yml restart
#     reload: docker compose -f /symbios/services/navidrome/docker-compose.yml up -d
#
---
- name: navidrome
  hosts: all
  vars:
    service_name: navidrome
    service_domain: "{{ service_name }}.{{ base_domain }}"
    # Standard media library (see mediapaths.md). Mounted at /music
    # read-only; the container runs with media_gid as supplementary group
    # so it can read group-restricted files. The legacy per-service vars
    # below still override when set (inventory wins over these defaults).
    # (Kept as music_* for backward compat: /music is Navidrome terminology.)
    navidrome_music_path: "{{ media_audio | default('') }}"
    navidrome_music_gid: "{{ media_gid | default('') }}"
  tasks:

    - name: Create /symbios/services/navidrome dir
      ansible.builtin.file:
        path: /symbios/services/navidrome
        owner: root
        group: docker
        state: directory
        mode: '0550'

    - name: Create /symbios/services/navidrome/navidrome-data dir
      ansible.builtin.file:
        path: /symbios/services/navidrome/navidrome-data
        owner: 33
        group: docker
        state: directory
        mode: '0750'


    - name: /symbios/services/navidrome/docker-compose.yml Container Configuration
      blockinfile:
        path: /symbios/services/navidrome/docker-compose.yml
        create: yes
        mode: 0440
        owner: root
        group: docker
        marker: "# {mark} ANSIBLE MANAGED BLOCK"
        block: |

          name: ""

          services:
            navidrome:
              image: deluan/navidrome:latest
              container_name: navidrome
              restart: unless-stopped
              environment:
                ND_SCANSCHEDULE: 24h
                ND_LOGLEVEL: warn
                ND_SESSIONTIMEOUT: 24h
                ND_ENABLEINSIGHTSCOLLECTOR: false
                ND_LASTFM_ENABLED: false
                ND_LISTENBRAINZ_ENABLED: false
                ND_SCANNER_PURGEMISSING: always
                ND_EXTAUTH_TRUSTEDSOURCES: "0.0.0.0/0"
                ND_ENABLEUSEREDITING: "false"
              networks:
                - symbios_services
              user: "33{{ (':' + (navidrome_music_gid | string)) if navidrome_music_gid else '' }}"
              volumes:
                - ./navidrome-data:/data
                - /etc/localtime:/etc/localtime:ro
                {{ '- ' + navidrome_music_path + ':/music:ro' if navidrome_music_path else '' }}

          networks:
            symbios_services:
              external: true

        backup: yes
      notify: Restart navidrome

    # /symbios/services/navidrome/navidrome-passwd.sh (local/API password).
    # Browser SSO via Authelia is unaffected (Remote-User header wins), but
    # Subsonic clients (Supersonic, DSub, Feishin, ...) need Navidrome's own
    # password on /rest/*. Users coming only via SSO have none until the
    # admin sets one with this script (mirrors s3-user.sh).
    - name: /symbios/services/navidrome/navidrome-passwd.sh (local/API password)
      blockinfile:
        path: "/symbios/services/{{ service_name }}/navidrome-passwd.sh"
        create: yes
        mode: 0550
        owner: root
        group: docker
        marker: "# {mark} ANSIBLE MANAGED BLOCK"
        block: |
          # Set a Navidrome user's local (Subsonic API) password.
          # Usage: navidrome-passwd.sh <username> [password]
          # Without password: generates a random one, prints it for handover.
          set -u
          g_prog=$(basename "$0")
          g_user=${1:-}
          g_pw=${2:-}

          # A username is required, everything else has defaults
          if [[ -z "$g_user" ]]
          then
            echo "Usage: $g_prog <username> [password]" >&2
            exit 2
          fi

          # The user must exist (SSO users appear after first browser login)
          if ! docker exec navidrome /app/navidrome user list \
              --datafolder /data --nobanner 2>/dev/null \
              | awk -F, 'NR>1 {print $2}' | grep -qx "$g_user"
          then
            echo "$g_prog: user '$g_user' not found in Navidrome (first browser login creates it)" >&2
            exit 1
          fi

          # Generate a handover password when none was given
          if [[ -z "$g_pw" ]]
          then
            g_pw=$(pwgen -s 24 1)
          fi

          # --set-password needs a TTY (term.ReadPassword): fake one with
          # script(1). Live write is safe (SQLite WAL, server keeps running)
          printf '%s\n%s\n' "$g_pw" "$g_pw" | script -qec \
            "docker exec -i -t navidrome /app/navidrome user edit -u '$g_user' --set-password --datafolder /data --nobanner" \
            /dev/null >/dev/null 2>&1

          # Verify through the real path (Traefik + /rest bypass)
          if curl -sk --resolve {{ service_domain }}:443:127.0.0.1 \
              "https://{{ service_domain }}/rest/ping.view?v=1.16.1&c=navidrome-passwd&u=$g_user&p=$g_pw" \
              | grep -q 'status="ok"'
          then
            echo "$g_user: $g_pw"
          else
            echo "$g_prog: password set but API verification failed" >&2
            exit 1
          fi
        backup: yes
        validate: /bin/bash -n %s

    - name: /symbios/services/navidrome/navidrome-passwd.sh shebang
      ansible.builtin.lineinfile:
        path: "/symbios/services/{{ service_name }}/navidrome-passwd.sh"
        insertbefore: BOF
        regexp: "^#!/bin/bash"
        line: "#!/bin/bash"

    # The local API password follows the LDAP password (one password for
    # browser SSO and Subsonic clients). Fired by symbios-ldap-user.sh
    # after every successful password set (covers WebUI and CLI).
    - name: Deploy LDAP password hook (navidrome API password sync)
      ansible.builtin.copy:
        dest: "{{ data_root }}/ldap-groups.d/navidrome-password-sync.hook"
        content: |
          #!/bin/bash
          # SymbiOS hook - sync LDAP password changes into Navidrome's local
          # password (Subsonic API on /rest/*). Fired by symbios-ldap-user.sh
          # after every successful password set. Args: $1=event $2=uid
          # $3=pwfile (0600 plaintext file, shredded by the caller - never
          # log it).
          [[ "${1:-}" == "password-set" ]] || exit 0
          exec "{{ git_root }}/scripts/symbios-navidrome-password-sync.sh" "${1:-}" "${2:-}" "${3:-}"
        mode: '0755'
        owner: root
        group: root

    - name: /symbios/base-services/traefik/providers/navidrome.yml Navidrome<->Traefik provider
      blockinfile:
        path: /symbios/base-services/traefik/providers/navidrome.yml
        create: yes
        mode: 0444
        owner: root
        group: docker
        marker: "# {mark} ANSIBLE MANAGED BLOCK"
        block: |
          http:
            routers:
              navidrome:
                rule: "Host(`{{ service_domain }}`)"
                service: navidrome
                entryPoints:
                  - "https"
                tls:
                  certResolver: {{ acme_resolver }}
                middlewares:
                  - "secHeaders@file"
                  - "authelia@file"
              # Subsonic API (Supersonic, DSub, Feishin, ...) cannot do the
              # browser SSO flow, so /rest/* bypasses Authelia forward-auth
              # (longer rule = higher Traefik priority, wins automatically).
              # Auth there is Navidrome's own local password (migrated from
              # the old system, still valid as fallback per 7.8).
              navidrome-api:
                rule: "Host(`{{ service_domain }}`) && PathPrefix(`/rest`)"
                service: navidrome
                entryPoints:
                  - "https"
                tls:
                  certResolver: {{ acme_resolver }}
                middlewares:
                  - "secHeaders@file"

            services:
              navidrome:
                loadBalancer:
                  servers:
                    - url: "http://navidrome:4533"
        backup: yes

    - name: Ensure LDAP groups for OIDC login (navidrome-users / navidrome-admins)
      include_tasks: ../shared-tasks/oidc-groups.yml

    - name: Write Authelia access_control for navidrome group restriction
      include_tasks: ../shared-tasks/authelia-acl.yml
      vars:
        authelia_policy: one_factor
        authelia_subjects:
          - - "group:navidrome-users"
          - - "group:navidrome-admins"

    # Deploy the shared HTTP healthcheck (shared-tasks/runcheck.yml)
    - name: Deploy healthcheck
      include_tasks: ../shared-tasks/runcheck.yml

    - name: Ensure navidrome is running
      include_tasks: ../shared-tasks/docker-start.yml

    - name: Register playbook as installed
      include_tasks: ../shared-tasks/state-register.yml

  handlers:

    - name: Restart navidrome
      include_tasks: ../shared-tasks/compose-recreate.yml

    - name: Restart authelia
      include_tasks: ../shared-tasks/authelia-restart.yml

