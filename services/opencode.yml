#   access:
#     admin_group: opencode-admins
#     user_group: opencode-users
#   service_control:
#     services:
#     - name: opencode
#       type: docker
#       compose_file: /symbios/services/opencode/docker-compose.yml
#       status: test -d /symbios/services/opencode || exit 2; docker compose -f /symbios/services/opencode/docker-compose.yml ps | grep -q "Up "
#     logs:
#     - name: opencode
#       command: docker compose -f /symbios/services/opencode/docker-compose.yml logs -f --tail=100
#   uninstall:
#     stop: docker compose -f /symbios/services/opencode/docker-compose.yml down
#     program_paths:
#       - /symbios/services/opencode/
#       - /symbios/base-services/traefik/providers/opencode.yml
#       - /symbios/runchecks.d/symbios-healthcheck-opencode.check
#     ldap_groups:
#       - opencode-users
#       - opencode-admins
#     authelia_blocks:
#       - "opencode ACCESS CONTROL"
#   actions:
#     start: docker compose -f /symbios/services/opencode/docker-compose.yml up -d
#     stop: docker compose -f /symbios/services/opencode/docker-compose.yml down
#     restart: docker compose -f /symbios/services/opencode/docker-compose.yml restart
#     reload: docker compose -f /symbios/services/opencode/docker-compose.yml up -d
#
---
- name: opencode
  hosts: all
  vars:
    service_name: opencode
    service_domain: "{{ service_name }}.{{ base_domain }}"
  tasks:

    - name: Create /symbios/services/opencode dir
      ansible.builtin.file:
        path: /symbios/services/opencode
        owner: root
        group: docker
        state: directory
        mode: '0550'

    - name: /symbios/services/opencode/docker-compose.yml Container Configuration
      blockinfile:
        path: /symbios/services/opencode/docker-compose.yml
        create: yes
        mode: 0440
        owner: root
        group: docker
        marker: "# {mark} ANSIBLE MANAGED BLOCK"
        block: |
          name: ""

          services:

            opencode:
              build:
                context: .
                dockerfile: Dockerfile
              container_name: opencode
              restart: unless-stopped
              volumes:
                - /etc/localtime:/etc/localtime:ro
                - ./projects:/projects:rw
                - ./opencode-config:/root/.config/opencode:rw
                - ./opencode-data:/root/.local/share/opencode:rw
                - ./ssh/:/root/.ssh:ro
              networks:
                opencode: {}
                symbios_services: null
              entrypoint: ["tini", "-g", "--", "/root/.opencode/bin/opencode", "serve", "--hostname=0.0.0.0", "--port=80", "--print-logs", "--log-level", "WARN"]

          networks:
            opencode:
              driver: bridge
              driver_opts:
                com.docker.network.bridge.name: br-opencode
            symbios_services:
              external: true
        backup: yes
      notify: Restart opencode

    - name: /symbios/base-services/traefik/providers/opencode.yml Traefik Routing Configuration
      blockinfile:
        path: /symbios/base-services/traefik/providers/opencode.yml
        create: yes
        mode: 0444
        owner: root
        group: docker
        marker: "# {mark} ANSIBLE MANAGED BLOCK"
        block: |
          http:
            routers:
              opencode:
                rule: "Host(`opencode.{{ base_domain }}`)"
                service: opencode
                entryPoints:
                  - "https"
                tls:
                  certResolver: {{ acme_resolver }}
                middlewares:
                  - "secHeaders@file"
                  - "authelia@file"
            services:
              opencode:
                loadBalancer:
                  servers:
                    - url: "http://opencode:80"
        backup: yes

    - name: /symbios/services/opencode/Dockerfile
      blockinfile:
        path: /symbios/services/opencode/Dockerfile
        create: yes
        mode: 0440
        owner: root
        group: docker
        marker: "# {mark} ANSIBLE MANAGED BLOCK"
        block: |
          FROM ghcr.io/egabosh/debian:latest
          ENV DEBIAN_FRONTEND=noninteractive
          # opencode and tools
          RUN apt-get update \
           && apt-get install -y bash curl nodejs git vim htop tree tini \
           && rm -rf /var/lib/apt/lists/* \
           && unset VERSION \
           && curl -fsSL https://opencode.ai/install | bash
          ENTRYPOINT ["/root/.opencode/bin/opencode"]
        backup: yes
      notify: Restart opencode

    - name: Create /symbios/services/opencode/ssh dir
      ansible.builtin.file:
        path: /symbios/services/opencode/ssh
        owner: root
        group: root
        state: directory
        mode: '0700'

    - name: Generate ssh ed25519 keypair
      ansible.builtin.shell: ssh-keygen -q -N "" -t ed25519 -f id_ed25519 -C opencode
      args:
        chdir: /symbios/services/opencode/ssh
        creates: /symbios/services/opencode/ssh/id_ed25519
      notify: Restart opencode

    - name: Create /symbios/services/opencode/opencode-config dir
      ansible.builtin.file:
        path: /symbios/services/opencode/opencode-config
        owner: root
        group: root
        state: directory
        mode: '0550'

    - name: Create AGENTS.md if not exists
      copy:
        content: |
          # Coding Standards

          ## General
          - All comments and variable names are in English
          - Use gaboshlib (/etc/bash/gaboshlib) whenever sensible and available
          - Use Ansible playbooks for installations and configurations by default
        dest: "/symbios/services/opencode/opencode-config/AGENTS.md"
        mode: "0644"
        force: false

    - name: /symbios/services/opencode/opencode-config/opencode.json
      copy:
        content: |
          {
            "$schema": "https://opencode.ai/config.json",
            "provider": {
              "ai": {
                "npm": "@ai-sdk/openai-compatible",
                "name": "local-llm",
                "options": {
                {% if ai_server | default('', true) %}
                  "baseURL": "{{ ai_server }}",
                  {% if ai_apikey | default('', true) %}
                  "apiKey": "{{ ai_apikey }}",
                  {% endif %}
                {% endif %}
                  "timeout": 180000,
                  "chunkTimeout": 1800000
                },
                "models": {
                  "llamacpp-default": {
                    "name": "llamacpp-default",
                    "reasoning": true,
                    "limit": {
                      "context": 133120,
                      "output": 32768
                    },
                    "parameters": {
                      "maxTokens": 32768,
                      "temperature": 0.7,
                      "topP": 0.8
                    }
                  }
                }
              }
            },
            "model": "ai/llamacpp-default",
            "shell": "/bin/bash",
            "instructions": ["AGENTS.md"],
            "compaction": {
              "auto": true,
              "tail_turns": 10
            }
          }
        dest: /symbios/services/opencode/opencode-config/opencode.json
        mode: 0440
        owner: root
        group: root
        #backup: yes
      no_log: true
      #args:
      #  creates: /symbios/services/opencode/opencode-config/opencode.json
      notify: Restart opencode


##################
#### Authelia ####
##################

    - name: Ensure LDAP groups for OIDC login (opencode-users / opencode-admins)
      include_tasks: tasks/oidc-groups.yml

    - name: Remove legacy LDAP group (old naming convention)
      ansible.builtin.shell: "{{ git_root }}/scripts/symbios-ldap-groups.sh --delete --name opencode"
      changed_when: false
      failed_when: false

    - name: Write Authelia access_control for opencode group restriction
      include_tasks: tasks/authelia-acl.yml
      vars:
        authelia_subjects:
          - "group:opencode-users"
          - "group:opencode-admins"

    # Deploy the shared HTTP healthcheck (services/tasks/runcheck.yml)
    - name: Deploy healthcheck
      include_tasks: tasks/runcheck.yml

    - name: Ensure opencode is running
      include_tasks: tasks/docker-start.yml

    - name: Register playbook as installed
      include_tasks: tasks/state-register.yml

  handlers:

    - name: Restart opencode
      ansible.builtin.shell: docker compose build --pull --no-cache --force-rm && docker compose up -d --force-recreate
      args:
        chdir: /symbios/services/opencode

    - name: Restart authelia
      ansible.builtin.shell: docker compose restart
      args:
        chdir: /symbios/base-services/authelia
