#     versions:
#     - '13'
#   category: Service
#   access:
#     admin_group: paperless-admins
#     user_group: paperless-users
#   service_control:
#     services:
#     - name: paperless
#       type: docker
#       compose_file: /symbios/services/paperless/docker-compose.yml
#       status: test -d /symbios/services/paperless || exit 2; docker compose -f /symbios/services/paperless/docker-compose.yml ps | grep -q "Up "
#     logs:
#     - name: paperless
#       command: docker compose -f /symbios/services/paperless/docker-compose.yml logs -f --tail=100
#   uninstall:
#     stop: docker compose -f /symbios/services/paperless/docker-compose.yml down
#     program_paths:
#       - /symbios/services/paperless/
#       - /symbios/base-services/traefik/providers/paperless.yml
#     - /symbios/runchecks.d/symbios-healthcheck-paperless.check
#     ldap_groups:
#       - paperless-users
#       - paperless-admins
#     authelia_blocks:
#       - "paperless ACCESS CONTROL"
#   actions:
#     start: docker compose -f /symbios/services/paperless/docker-compose.yml up -d
#     stop: docker compose -f /symbios/services/paperless/docker-compose.yml down
#     restart: docker compose -f /symbios/services/paperless/docker-compose.yml restart
#     reload: docker compose -f /symbios/services/paperless/docker-compose.yml up -d
#
---
- name: paperless
  hosts: all
  vars:
    service_name: paperless
    service_domain: "{{ service_name }}.{{ base_domain }}"
    # Document archive (see mediapaths.md). Paperless owns and writes this
    # store; every other consumer only reads it via the media group.
    paperless_media_path: "{{ media_documents | default('/symbios/media/documents') }}"
    # Ingest directory: new scans land here via SFTP or member uploads.
    paperless_consume_path: "{{ media_inbox | default('/symbios/media/inbox') }}/paperless"
    # Previous service-local defaults kept for the one-time migration below.
    paperless_legacy_media: "/symbios/services/paperless/media"
    paperless_legacy_consume: "/symbios/services/paperless/consume"
    # UIDs paperless writes with (must match USERMAP_UID below).
    paperless_uid: 998
  tasks:

    - name: Create /symbios/services/paperless dir
      ansible.builtin.file:
        path: /symbios/services/paperless
        owner: root
        group: docker
        state: directory
        mode: '0550'

    - name: /symbios/services/paperless/genpw.sh (generate Random PW for Nextcloud and DB)
      blockinfile:
        path: /symbios/services/paperless/genpw.sh
        create: yes
        mode: 0550
        owner: root
        group: docker
        marker: "# {mark} ANSIBLE MANAGED BLOCK"
        block: |
          cd /symbios/services/paperless

          secretkey=$(pwgen -s 64 1)
          
          [ -f docker-compose.env ] || echo "PAPERLESS_SECRET_KEY=$secretkey
          " >docker-compose.env
          
          chmod 440 docker-compose.env
          chown root:docker docker-compose.env
        backup: yes
        validate: /bin/bash -n %s
      notify: run genpw.sh

    - name: /symbios/services/paperless/genpw.sh shebang
      lineinfile:
        path: /symbios/services/paperless/genpw.sh
        insertbefore: BOF
        line: "#!/bin/bash -e"

    - name: Gen initial passwords if not exists
      ansible.builtin.shell: ./genpw.sh
      args:
        chdir: /symbios/services/paperless
        creates: /symbios/services/paperless/docker-compose.env

    - name: Generate OIDC client secret for Paperless
      ansible.builtin.shell: /symbios/base-services/authelia/gen-oidc-client-secret.sh /symbios/services/paperless
      args:
        chdir: /symbios/services/paperless
      changed_when: false
      failed_when: false

    - name: /symbios/services/paperless/docker-compose.yml Container Configuration
      blockinfile:
        path: /symbios/services/paperless/docker-compose.yml
        create: yes
        mode: 0440
        owner: root
        group: docker
        marker: "# {mark} ANSIBLE MANAGED BLOCK"
        block: |
          name: ""
        
          services:
            paperless:
              image: ghcr.io/paperless-ngx/paperless-ngx:latest
              container_name: paperless
              restart: unless-stopped
              # Supplementary media group for archive reads (writes are
              # granted via a dedicated ACL, see the setfacl task below).
              group_add:
                - "{{ media_gid | default(31000) }}"
              volumes:
                - ./data:/usr/src/paperless/data
                - {{ paperless_media_path }}:/usr/src/paperless/media:rw
                - ./export:/usr/src/paperless/export
                - {{ paperless_consume_path }}:/usr/src/paperless/consume:rw
              depends_on:
                - paperless-broker
              env_file: docker-compose.env
              environment:
                - USERMAP_UID=998
                - USERMAP_GID={{ media_gid | default(31000) }}
                - PAPERLESS_REDIS=redis://paperless-broker:6379
                - PAPERLESS_FILENAME_FORMAT={correspondent}/{created}-{title}
                - PAPERLESS_TASK_WORKERS=1
                - PAPERLESS_THREADS_PER_WORKER=1
                - PAPERLESS_OCR_MODE=skip_noarchive
                - PAPERLESS_WEBSERVER_WORKERS=1
                - PAPERLESS_OCR_LANGUAGE=deu
                - PAPERLESS_TIME_ZONE=Europe/Berlin
                - PAPERLESS_URL=https://{{ service_domain }}
                - PAPERLESS_DEBUG=false
                # OIDC via Authelia (django-allauth, see the Authelia
                # paperless integration doc). NOTE: paperless-ngx has no
                # PAPERLESS_OIDC_* settings - the previous vars with that
                # prefix were silently ignored, so SSO never worked.
                - PAPERLESS_APPS=allauth.socialaccount.providers.openid_connect
                - 'PAPERLESS_SOCIALACCOUNT_PROVIDERS={"openid_connect": {"SCOPE": ["openid", "profile", "email", "groups"], "OAUTH_PKCE_ENABLED": true, "APPS": [{"provider_id": "authelia", "name": "Authelia", "client_id": "paperless", "secret": "{{ lookup('file', '/symbios/services/paperless/oidc_password') | trim }}", "settings": {"server_url": "https://auth.{{ base_domain }}", "token_auth_method": "client_secret_basic"}}]}}'
                - PAPERLESS_SOCIAL_AUTO_SIGNUP=true
                - PAPERLESS_SOCIALACCOUNT_ALLOW_SIGNUPS=true
                # Skip the local login form: /accounts/login/ forwards
                # straight to Authelia. Hiding the frontend password form
                # as well (Django /admin/ and API local login keep working
                # as fallback, per upstream docs).
                - PAPERLESS_REDIRECT_LOGIN_TO_SSO=true
                - PAPERLESS_DISABLE_REGULAR_LOGIN=true
              networks:
                paperless: {}
                symbios_services: null
              labels: []
            
            paperless-broker:
              image: redis:6.0
              container_name: paperless-broker
              restart: unless-stopped
              volumes:
                - ./redisdata:/data
              networks:
                - paperless

          networks:
            paperless:
              driver: bridge
              driver_opts:
                com.docker.network.bridge.name: br-paperless
            symbios_services:
              external: true

        backup: yes
      notify: Restart paperless

    - name: Start paperless
      ansible.builtin.shell: docker compose up -d
      args:
        chdir: /symbios/services/paperless
      changed_when: false

    - name: Ensure the media archive and consume directories exist
      ansible.builtin.file:
        path: "{{ item.path }}"
        owner: "{{ item.owner }}"
        group: "{{ media_gid | default(31000) }}"
        mode: "{{ item.mode }}"
        state: directory
      loop:
        - { path: "{{ paperless_media_path }}", owner: root, mode: '2750' }
        - { path: "{{ paperless_consume_path }}", owner: "{{ paperless_uid }}", mode: '2770' }

    - name: Grant the paperless user write access on the shared archive (group stays read-only)
      ansible.builtin.shell: setfacl -m u:{{ paperless_uid }}:rwx "{{ paperless_media_path }}" && setfacl -d -m u:{{ paperless_uid }}:rwx "{{ paperless_media_path }}"
      changed_when: false
      failed_when: false

    - name: Grant the paperless user read access on the consume dir (uploads land group-only)
      ansible.builtin.shell: setfacl -m u:{{ paperless_uid }}:rx "{{ paperless_consume_path }}" && setfacl -d -m u:{{ paperless_uid }}:rx "{{ paperless_consume_path }}"
      changed_when: false
      failed_when: false

    - name: Check legacy service-local media and consume dirs for content to migrate
      ansible.builtin.stat:
        path: "{{ item.src }}"
      register: paperless_legacy_dirs
      loop:
        - { src: "{{ paperless_legacy_media }}", dest: "{{ paperless_media_path }}" }
        - { src: "{{ paperless_legacy_consume }}", dest: "{{ paperless_consume_path }}" }
      when: item.src != item.dest

    - name: Move legacy archive and consume content into the media dirs (one-time migration)
      ansible.builtin.shell: |
        mkdir -p "{{ item.item.dest }}"
        mv "{{ item.item.src }}"/* "{{ item.item.dest }}/" 2>/dev/null || true
        rmdir "{{ item.item.src }}" 2>/dev/null || true
      loop: "{{ paperless_legacy_dirs.results }}"
      when:
        - item.stat is defined
        - item.stat.exists | default(false)
      changed_when: false
      failed_when: false

    - name: Remove the obsolete Samba share (uploads go via SFTP now)
      ansible.builtin.blockinfile:
        path: /etc/samba/smb-{{ ansible_facts['hostname'] }}.conf
        marker: "# {mark} paperles ANSIBLE MANAGED BLOCK"
        state: absent
      failed_when: false

    - name: Give paperless permissions for consume dir
      ansible.builtin.file:
        path: "{{ paperless_consume_path }}"
        owner: "{{ paperless_uid }}"
        group: "{{ media_gid | default(31000) }}"
        mode: '2770'

    - name: /symbios/base-services/traefik/providers/paperless.yml Routing Configuration
      blockinfile:
        path: /symbios/base-services/traefik/providers/paperless.yml
        create: yes
        mode: 0444
        owner: root
        group: docker
        marker: "# {mark} ANSIBLE MANAGED BLOCK"
        block: |
          http:
            routers:
              paperless:
                rule: "Host(`{{ service_domain }}`)"
                service: paperless
                entryPoints:
                  - "https"
                tls:
                  certResolver: {{ acme_resolver }}
                middlewares:
                  - "secHeaders@file"
                  - "authelia@file"
            services:
              paperless:
                loadBalancer:
                  servers:
                    - url: "http://paperless:8000"
        backup: yes

    - name: Ensure LDAP groups for OIDC login (paperless-users / paperless-admins)
      include_tasks: tasks/oidc-groups.yml

    # Redirect URI must match the django-allauth callback path; the old
    # /oidc/callback/ value was never used by paperless and would fail
    # with a redirect_uri mismatch. token_endpoint_auth_method must match
    # settings.token_auth_method above (see the Authelia paperless doc).
    - name: Write OIDC config in authelias configuration.yml for paperless
      include_tasks: tasks/authelia-oidc.yml
      vars:
        oidc_client_name: "Paperless"
        oidc_redirect_uris:
          - "https://paperless.{{ base_domain }}/accounts/oidc/authelia/login/callback/"
        oidc_token_endpoint_auth_method: "client_secret_basic"

    - name: Write Authelia access_control for paperless group restriction
      include_tasks: tasks/authelia-acl.yml
      vars:
        authelia_subjects:
          - "group:paperless-users"
          - "group:paperless-admins"

    - name: Deploy LDAP group-change hook (immediate admin sync on membership changes)
      ansible.builtin.copy:
        dest: "{{ data_root }}/ldap-groups.d/paperless-admin-sync.hook"
        content: |
          #!/bin/bash
          # SymbIOS hook - keep Paperless admins in sync with LDAP group paperless-admins.
          # Executed by the shared LDAP group-change dispatcher (see symbios-lib.sh,
          # called by symbios-ldap-groups.sh for CLI and WebUI changes) whenever a
          # group or a membership changes. Args: $1=event $2=group $3=uid
          # Only react to changes of the Paperless admin group (incl. group deletion).
          [[ "${2:-}" == "paperless-admins" ]] || exit 0
          exec "{{ git_root }}/scripts/symbios-paperless-admin-sync.sh"
        mode: '0755'
        owner: root
        group: root

    # Deploy the shared HTTP healthcheck (services/tasks/runcheck.yml)
    - name: Deploy healthcheck
      include_tasks: tasks/runcheck.yml

    - name: Register playbook as installed
      include_tasks: tasks/state-register.yml

  handlers:
    - name: run genpw.sh
      ansible.builtin.shell: ./genpw.sh
      args:
        chdir: /symbios/services/paperless
      notify: Restart paperless

    - name: Restart paperless
      ansible.builtin.shell: docker compose up -d --force-recreate
      args:
        chdir: /symbios/services/paperless

    - name: Restart authelia
      ansible.builtin.shell: docker compose restart
      args:
        chdir: /symbios/base-services/authelia


