---
- name: home-assistant
  hosts: all
  vars:
    service_name: home-assistant
    service_domain: "{{ service_name }}.{{ base_domain }}"
  tasks:

    - name: Set home_assistant_ip from traefik_network_gateway inventory variable
      ansible.builtin.set_fact:
        home_assistant_ip: "{{ traefik_network_gateway }}"

    - name: Create /symbios/services/home-assistant dir
      ansible.builtin.file:
        path: /symbios/services/home-assistant
        owner: root
        group: docker
        state: directory
        mode: '0550'

    - name: Create /symbios/services/home-assistant/config dir
      ansible.builtin.file:
        path: /symbios/services/home-assistant/config
        owner: 3000
        group: 3000
        state: directory
        mode: '0750'

    - name: Create /symbios/services/home-assistant/ha_pingcheck_data dir
      ansible.builtin.file:
        path: /symbios/services/home-assistant/ha_pingcheck_data
        state: directory
        owner: root
        group: docker
        mode: '0755'

    - name: Create oidc client secret
      ansible.builtin.shell: |
        /symbios/base-services/authelia/gen-oidc-client-secret.sh /symbios/services/home-assistant
      changed_when: false
      failed_when: false

    - name: Edit Home Assistant config
      blockinfile:
        path: /symbios/services/home-assistant/config/configuration.yaml
        create: yes
        mode: 0444
        owner: root
        group: docker
        marker: "# {mark} ANSIBLE MANAGED BLOCK"
        block: |
          # Loads default set of integrations. Do not remove.
          #default_config:
          homeassistant:
            name: Home
            latitude: 51.1657
            longitude: 10.4515
            elevation: 100
            unit_system: metric
            currency: EUR
            time_zone: Europe/Berlin
            external_url: "https://home-assistant.{{ base_domain }}"

          api:
          history:
          logbook:
          system_health:
          ssdp:
          zeroconf:
          sun:
          sensor:
          weather:
          person:
          mobile_app:
          light:
          mqtt:
          tts:
          stream:
          media_source:
                    
          # Load frontend themes from the themes folder
          frontend:
            themes: !include_dir_merge_named themes
          automation: !include automations.yaml
          script: !include scripts.yaml
          scene: !include scenes.yaml

          auth_oidc:
            client_id: 'home-assistant'
            client_secret: '{{ lookup('file', '/symbios/services/home-assistant/oidc_password') }}'
            discovery_url: 'https://auth.{{ base_domain }}/.well-known/openid-configuration'
            display_name: 'Authelia'
            claims:
              groups: 'groups'
            roles:
              admin: 'home-assistant-admins'
              user: 'home-assistant-users'
            features:
              default_redirect: true

        backup: yes
      notify: Restart home-assistant

    - name: Touch HA config files
      ansible.builtin.file:
        path: "/symbios/services/home-assistant/config/{{ item }}"
        state: touch
        access_time: preserve
        modification_time: preserve
      loop:
        - scenes.yaml
        - scripts.yaml
        - automations.yaml

    - name: /symbios/services/home-assistant/genpw.sh (generate Random PW for Home Assistant)
      blockinfile:
        path: /symbios/services/home-assistant/genpw.sh
        create: yes
        mode: 0550
        owner: root
        group: docker
        marker: "# {mark} ANSIBLE MANAGED BLOCK"
        block: |
          # Change to service directory
          cd /symbios/services/home-assistant

          # Generate random admin password
          g_homeassistantadminpassword=$(pwgen -s 32 1)

          # Create env file if it does not exist
          if [ ! -f env ]
          then
            echo "HA_ADMIN_PASSWORD=!HA_ADMIN_PASSWORD!" >env
          fi

          chmod 440 env
          chown root:docker env
          # Replace placeholder with actual password in env file
          sed -i "s/\!HA_ADMIN_PASSWORD\!/$g_homeassistantadminpassword/g" env
        backup: yes
        validate: /bin/bash -n %s
      notify: run genpw.sh

    - name: /symbios/services/home-assistant/genpw.sh shebang
      lineinfile:
        path: /symbios/services/home-assistant/genpw.sh
        insertbefore: BOF
        line: "#!/bin/bash -e"

    - name: Gen initial passwords if not exists
      ansible.builtin.shell: ./genpw.sh
      args:
        chdir: /symbios/services/home-assistant
        creates: /symbios/services/home-assistant/env

    - name: /symbios/services/home-assistant/docker-compose.yml Container Configuration
      blockinfile:
        path: /symbios/services/home-assistant/docker-compose.yml
        create: yes
        mode: 0440
        owner: root
        group: docker
        marker: "# {mark} ANSIBLE MANAGED BLOCK"
        block: |
          name: ""

          services:
            home-assistant:
              image: ghcr.io/home-assistant/home-assistant
              container_name: home-assistant
              restart: unless-stopped
              volumes:
                - ./config:/config
                - ./media:/media
                - /etc/localtime:/etc/localtime:ro
                - /run/dbus:/run/dbus:ro
              network_mode: host
              privileged: true

            matter:
              image: ghcr.io/home-assistant-libs/python-matter-server:stable
              container_name: matter
              restart: unless-stopped
              network_mode: host
              volumes:
                - ./matter-server:/data
                - /run/dbus:/run/dbus:ro
              command: >
                  --storage-path /data
                  --primary-interface iot0
                  --log-level info
                  --log-level-sdk none
                  --bluetooth-adapter 0
              #privileged: true
            
            ha_pingcheck:
              image: nginx:latest
              container_name: ha_pingcheck
              restart: unless-stopped
              ports:
                - "8889:80"
              volumes:
                - /symbios/services/home-assistant/ha_pingcheck_data:/usr/share/nginx/html/pingcheck:ro
                - /etc/localtime:/etc/localtime:ro
              networks:
                symbios_services: null

          networks:
            symbios_services:
              external: true
        backup: yes
      notify: Restart home-assistant

    - name: /symbios/base-services/traefik/providers/home-assistant.yml Home-Assistant<->Traefik provider
      blockinfile:
        path: /symbios/base-services/traefik/providers/home-assistant.yml
        create: yes
        mode: 0444
        owner: root
        group: docker
        marker: "# {mark} ANSIBLE MANAGED BLOCK"
        block: |
          http:
            middlewares:
              # HA OIDC serves static assets (CSS) with wrong MIME types;
              # contentTypeNosniff causes browsers to reject them.  Use a
              # dedicated middleware without that header for HA only.
              secHeadersHA:
                compress: false
                headers:
                  browserXssFilter: true
                  contentTypeNosniff: false
                  frameDeny: true
                  forceSTSHeader: true
                  stsIncludeSubdomains: true
                  stsPreload: true
                  stsSeconds: 31536000
                  customFrameOptionsValue: "SAMEORIGIN"
                  sslProxyHeaders:
                    X-Forwarded-Proto: "https"
                  customResponseHeaders:
                    X-Content-Type-Options: ""

            routers:
              home-assistant:
                rule: "Host(`home-assistant.{{ base_domain }}`)"
                service: home-assistant
                entryPoints:
                  - "https"
                tls:
                  certResolver: {{ acme_resolver }}
                middlewares:
                  - "secHeadersHA@file"
                  - "authelia@file"

              matter:
                rule: "Host(`matter.{{ base_domain }}`)"
                service: matter
                entryPoints:
                  - "https"
                tls:
                  certResolver: {{ acme_resolver }}
                middlewares:
                  - "secHeaders@file"
                  - "allowlocalipsonly"

            services:
              home-assistant:
                loadBalancer:
                  servers:
                    - url: "http://{{ home_assistant_ip }}:8123"
              matter:
                loadBalancer:
                  servers:
                    - url: "http://{{ home_assistant_ip }}:5580"
        backup: yes

    - name: Ensure LDAP groups for OIDC login (home-assistant-users / home-assistant-admins)
      include_tasks: tasks/oidc-groups.yml

    - name: Remove legacy LDAP groups (old naming convention)
      ansible.builtin.shell: |
        {{ git_root }}/scripts/symbios-ldap-groups.sh --delete --name home-assistant
        {{ git_root }}/scripts/symbios-ldap-groups.sh --delete --name home-assistant-admin
      changed_when: false
      failed_when: false

    - name: Deploy LDAP group-change hook for HA admin sync
      ansible.builtin.copy:
        dest: "{{ data_root }}/ldap-groups.d/home-assistant-admin-sync.hook"
        content: |
          #!/bin/bash
          # Sync HA admin/user role when either HA LDAP group changes
          case "${2:-}" in
            home-assistant-admins|home-assistant-users) ;;
            *) exit 0 ;;
          esac
          exec "{{ git_root }}/scripts/symbios-home-assistant-admin-sync.sh"
        mode: '0755'
        owner: root
        group: root

    - name: Write Authelia access_control for home-assistant group restriction
      include_tasks: tasks/authelia-acl.yml
      vars:
        authelia_policy: one_factor
        authelia_subjects:
          - - "group:home-assistant-users"
          - - "group:home-assistant-admins"

    - name: Clone hass-oidc-auth repo
      git:
        repo: "https://github.com/christiaangoossens/hass-oidc-auth.git"
        dest: "/tmp/hass-oidc-auth"
        version: "main"
        force: yes

    - name: Create custom_components dir
      file:
        path: "/symbios/services/home-assistant/config/custom_components"
        state: directory
        owner: root
        group: root
        mode: "0755"

    - name: Copy hass_oidc_auth component
      copy:
        src: "/tmp/hass-oidc-auth/custom_components/auth_oidc"
        dest: "/symbios/services/home-assistant/config/custom_components"
        owner: root
        group: root
        mode: "0644"
      notify: Restart home-assistant

    # hass-oidc-auth v1.2+ ships input.css (Tailwind source) but not the
    # compiled style.css.  Build it with npx so the login page has styles.
    # The input.css @source directive references ../views/templates so we
    # must run from the cloned repo directory where both exist.
    - name: Install nodejs and npm for CSS compilation
      ansible.builtin.apt:
        name:
          - nodejs
          - npm
        state: present

    - name: Compile hass-oidc-auth CSS
      ansible.builtin.shell: |
        set -euo pipefail
        cd /tmp/hass-oidc-auth
        if [ ! -d node_modules ]; then
          npm init -y >/dev/null 2>&1
          npm install --save tailwindcss@4 @tailwindcss/cli@4 2>&1
        fi
        npx tailwindcss \
          -i ./custom_components/auth_oidc/static/input.css \
          -o ./custom_components/auth_oidc/static/style.css \
          --minify
      register: css_build
      changed_when: "'Done' in css_build.stdout"

    - name: Install compiled style.css
      copy:
        src: "/tmp/hass-oidc-auth/custom_components/auth_oidc/static/style.css"
        dest: "/symbios/services/home-assistant/config/custom_components/auth_oidc/static/style.css"
        owner: root
        group: root
        mode: "0644"
      notify: Restart home-assistant

    - name: Write OIDC config in authelias configuration.yml for home-assistant
      include_tasks: tasks/authelia-oidc.yml
      vars:
        oidc_client_name: "Home Assistant"
        oidc_require_pkce: true
        oidc_pkce_challenge_method: "S256"
        oidc_consent_mode: "implicit"
        oidc_redirect_uris:
          - "https://home-assistant.{{ base_domain }}/auth/oidc/callback"

    - name: Start home-assistant
      ansible.builtin.shell: docker compose up -d
      args:
        chdir: /symbios/services/home-assistant
        creates: /symbios/services/home-assistant/config/home-assistant_v2.db
     
    - name: Wait until home-assistant install is finished
      wait_for:
        path: /symbios/services/home-assistant/config/home-assistant_v2.db
     
    - name: /symbios/services/home-assistant/home-assistant.init.sh
      blockinfile:
        path: /symbios/services/home-assistant/home-assistant.init.sh
        mode: "0500"
        owner: root
        group: root
        create: yes
        marker: "# {mark} ANSIBLE MANAGED BLOCK"
        block: |
          # Wait for home-assistant container startup
          sleep 30

          # Change to service directory
          if ! cd /symbios/services/home-assistant
          then
            exit 1
          fi

          # Load environment variables
          . ./env
          curl --location --request POST 'http://{{ home_assistant_ip }}:8123/api/onboarding/users' --header 'Content-Type: application/json' --data-raw "{
            \"client_id\": \"http://{{ home_assistant_ip }}:8123/\",
           \"name\": \"admin\",
            \"username\": \"haadmin\",
            \"password\": \"${HA_ADMIN_PASSWORD}\",
            \"language\": \"de\"
          }" >>/symbios/services/home-assistant/home-assistant.init.log 2>&1
          # install home assistant community store (hacs)
          docker compose exec -ti home-assistant wget -O - https://get.hacs.xyz | bash - >>/symbios/services/home-assistant/home-assistant.init.log 2>&1
        backup: yes
        validate: /bin/bash -n %s
      #notify: run home-assistant.init
    
    - name: Run home-assistant.init after install
      ansible.builtin.shell: bash /symbios/services/home-assistant/home-assistant.init.sh
      args:
        chdir: /symbios/services/home-assistant
        creates: /symbios/services/home-assistant/home-assistant.init.log

    # HA 2026.8+ migrated HTTP config from YAML to UI (.storage/http).
    # The YAML http: block is ignored; instead we write the trusted proxy
    # settings directly into the storage file and promote pending -> stable.
    - name: Configure HA reverse proxy settings in .storage/http
      ansible.builtin.shell: |
        docker exec home-assistant python3 -c "
        import json, os

        path = '/config/.storage/http'
        traefik_ip = '{{ traefik_ip }}'

        with open(path) as f:
            data = json.load(f)

        stable = data['data'].get('stable') or {}
        changed = False

        if not stable.get('use_x_forwarded_for'):
            stable['use_x_forwarded_for'] = True
            changed = True

        trusted = stable.get('trusted_proxies') or []
        if traefik_ip not in trusted and traefik_ip + '/32' not in trusted:
            trusted.append(traefik_ip)
            stable['trusted_proxies'] = trusted
            changed = True

        if changed:
            stable['error'] = None
            stable['error_message'] = None
            data['data']['stable'] = stable
            with open(path, 'w') as f:
                json.dump(data, f, indent=2)
            print('HTTP config updated')
        else:
            print('HTTP config already correct')
        "
      register: ha_http_config
      changed_when: "'updated' in ha_http_config.stdout"

    - name: Restart home-assistant if HTTP config changed
      ansible.builtin.shell: docker compose up -d --force-recreate
      args:
        chdir: /symbios/services/home-assistant
      when: ha_http_config.changed

    - name: Wait for home-assistant to be ready after HTTP config change
      ansible.builtin.uri:
        url: "http://{{ home_assistant_ip }}:8123/"
        status_code: [200, 302, 401]
      register: ha_ready
      until: ha_ready.status | default(0) in [200, 302, 401]
      retries: 30
      delay: 2
      when: ha_http_config.changed

    - name: Allow port 8123/tcp on iot0 interface for healthchecks for example for shelly switches
      community.general.ufw:
        rule: allow
        port: '8123'
        proto: tcp
        interface: iot0
        direction: in

    - name: Matter UDP ports
      ufw:
        rule: allow
        port: "{{ item }}"
        proto: udp
      loop:
        - 5353  # mDNS
    

    ### Pingcheck for IOT Hosts
    - name: Deploy ha_pingcheck ping loop script
      ansible.builtin.copy:
        content: |
          #!/bin/bash
          #set -o pipefail
          HOME=/tmp
          . /etc/bash/gaboshlib.include
          DIR="/symbios/services/home-assistant/ha_pingcheck_data"
          ROUTER="router"
          INTERVAL=2

          g_echo "ha_pingcheck started"

          while true
          do
            g_echo "Fetching host list"
            hosts=$(ssh -o StrictHostKeyChecking=no \
                        -o BatchMode=yes \
                        -o ConnectTimeout=5 \
                        root@"$ROUTER" \
                        "uci show dhcp | grep 'name=' | cut -d\"'\" -f2" 2>/dev/null) || true

            # Skip ping loop if no hosts returned
            if [ -z "$hosts" ]
            then
              g_echo "No hosts"
              sleep "$INTERVAL"
              continue
            fi

            mkdir -p "$DIR"

            # Iterate over each discovered host
            for host in $hosts
            do
              # Skip empty hostnames
              if [ -z "$host" ]
              then
                continue
              fi

              # Measure round-trip time
              g_start=$(date +%s%N)
              if ping -c3 -W3 $host >/dev/null 2>&1 || ping -c3 -W3 $host >/dev/null 2>&1
              then
                rtt=$(( ( $(date +%s%N) - start ) / 1000000 ))
                printf '{"hostname":"%s","status":"up","last_check":"%s","rtt":%d}\n' \
                  "$host" "$(date -u +%Y-%m-%dT%H:%M:%SZ)" "$rtt" \
                  > "$DIR/${host}.json"
                g_logger "host $host up"
              else
                printf '{"hostname":"%s","status":"down","last_check":"%s"}\n' \
                  "$host" "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
                  > "$DIR/${host}.json"
                g_logger "host $host down"
              fi
            done

            sleep "$INTERVAL"
          done
        dest: /usr/local/bin/ha_pingcheck
        owner: root
        group: root
        mode: '0755'
      notify: Restart ha_pingcheck

    - name: Deploy systemd service for ha_pingcheck
      ansible.builtin.copy:
        content: |
          [Unit]
          Description=HA Ping Check Host Loop
          After=network.target

          [Service]
          Type=simple
          ExecStart=/usr/local/bin/ha_pingcheck
          Restart=always
          RestartSec=10
          StandardOutput=journal
          StandardError=journal

          [Install]
          WantedBy=multi-user.target
        dest: /etc/systemd/system/ha_pingcheck.service
        owner: root
        group: root
        mode: '0644'
      notify: Restart ha_pingcheck

    - name: Enable and start ha_pingcheck service
      ansible.builtin.systemd:
        name: ha_pingcheck
        state: started
        enabled: true
        daemon_reload: true
      notify: Restart ha_pingcheck

    - name: Allow port 8889/tcp on iot0 interface for ping healthchecks for example for shelly scripts
      community.general.ufw:
        rule: allow
        port: '8889'
        proto: tcp
        interface: iot0
        direction: in

    # Deploy the shared HTTP healthcheck (services/tasks/runcheck.yml)
    - name: Deploy healthcheck
      include_tasks: tasks/runcheck.yml


    - name: Register playbook as installed
      include_tasks: tasks/state-register.yml

  handlers:
    - name: run genpw.sh
      ansible.builtin.shell: ./genpw.sh
      args:
        chdir: /symbios/services/home-assistant
      notify: Restart home-assistant

    #- name: run home-assistant.init
    #  ansible.builtin.shell: bash /symbios/services/home-assistant/home-assistant.init.sh

    - name: Restart home-assistant
      ansible.builtin.shell: docker compose up -d --force-recreate
      args:
        chdir: /symbios/services/home-assistant

    - name: Restart authelia
      ansible.builtin.shell: docker compose restart
      args:
        chdir: /symbios/base-services/authelia

    - name: Restart ha_pingcheck
      ansible.builtin.systemd:
        name: ha_pingcheck
        state: restarted
        daemon_reload: true


