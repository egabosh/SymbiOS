# docs:
#   name: WordPress
#   short_description: Deploy multiple WordPress instances
#   description: >-
#     Deploys every instance stored in the WebUI under the Instances tab (the
#     data lives in <config>/services/wordpress/instances.yml, not in
#     inventory.yml). Each instance gets its own WordPress container, its own
#     database and user on ONE shared MariaDB, a Traefik route (domain plus
#     optional aliases) and a healthcheck. Instances without the "public" flag
#     are protected by Authelia forward-auth (LDAP group wordpress-<name>);
#     optional phpMyAdmin (wp-phpmyadmin.<domain>) is always protected.
#   author: Oliver Bohlen
#   version: '1.1'
#   license: GPLv3
#   copyright: Copyright (c) 2026, Oliver Bohlen
#   min_ansible_version: '2.11'
#   platforms:
#   - name: Debian
#     versions:
#     - '13'
#   category: Service
#   config:
#     title: Instances
#     file: services/wordpress/instances.yml
#     fields:
#       name:
#         label: Name
#         type: text
#         required: true
#         pattern: '^[a-z0-9][a-z0-9-]*$'
#         placeholder: my-blog
#       domain:
#         label: Domain
#         type: text
#         required: true
#         pattern: '^[a-z0-9.-]+\.[a-z]{2,}$'
#         placeholder: blog.example.com
#       aliases:
#         label: Aliases
#         type: list
#         placeholder: alt1.example.com, alt2.example.com
#       public:
#         label: Public
#         type: bool
#       phpmyadmin:
#         label: phpMyAdmin
#         type: bool
#   service_control:
#     services:
#     - name: wordpress
#       type: docker
#       compose_file: /symbios/services/wordpress/docker-compose.yml
#       status: test -d /symbios/services/wordpress || exit 2; docker compose -f /symbios/services/wordpress/docker-compose.yml ps | grep -q "Up "
#     logs:
#     - name: wordpress
#       command: docker compose -f /symbios/services/wordpress/docker-compose.yml logs -f --tail=100
#   uninstall:
#     stop: docker compose -f /symbios/services/wordpress/docker-compose.yml down
#     program_paths:
#       - /symbios/services/wordpress/
#       - /symbios/base-services/traefik/providers/wordpress.yml
#       - /symbios/runchecks.d/symbios-healthcheck-wordpress-*.check
#   actions:
#     start: docker compose -f /symbios/services/wordpress/docker-compose.yml up -d
#     stop: docker compose -f /symbios/services/wordpress/docker-compose.yml down
#     restart: docker compose -f /symbios/services/wordpress/docker-compose.yml restart
#     reload: docker compose -f /symbios/services/wordpress/docker-compose.yml up -d --remove-orphans
#
---
- name: wordpress
  hosts: all
  gather_facts: no
  vars:
    service_name: wordpress
    service_domain: "{{ service_name }}.{{ base_domain }}"
    # A WordPress instance needs a LDAP group + Authelia rule when it is NOT
    # public (forward-auth on the site) or when phpMyAdmin is enabled (the
    # phpMyAdmin endpoint is always protected). The restriction is expressed
    # inline per task via:
    #   when: not (item.public | default(false) | bool) or (item.phpmyadmin | default(false) | bool)
    # Authelia policy follows the central twofa_enabled variable.
    wp_auth_policy: "{{ 'two_factor' if (twofa_enabled | default(false) | bool) else 'one_factor' }}"
    # Instance list is managed by the WebUI (Instances tab) and stored in the
    # writable config dir, NOT in inventory.yml (which stays base-system only).
    wp_instances_file: "{{ config_dir | default('/symbios/base-services/symbios-ui/config') }}/services/wordpress/instances.yml"
  tasks:

    # Load the instance list from the WebUI-managed config file. When the file
    # does not exist yet (service not configured), wordpress_instances stays an
    # empty list and the loops simply render no WordPress containers.
    - name: Read instance config file
      ansible.builtin.slurp:
        src: "{{ wp_instances_file }}"
      register: wp_instances_slurp
      failed_when: false

    - name: Set wordpress_instances from config file
      ansible.builtin.set_fact:
        wordpress_instances: "{{ (wp_instances_slurp.content | default('') | b64decode) | from_yaml | default([]) }}"
      when: wp_instances_slurp.content | default('') | length > 0

    # Create the service directory (compose projects must exist before .env)
    - name: Create /symbios/services/wordpress dir
      ansible.builtin.file:
        path: /symbios/services/wordpress
        owner: root
        group: docker
        state: directory
        mode: '0550'

    # Data directories: per-instance wp content + shared database volume.
    # Ownership is left to the WordPress entrypoint (chowns to www-data).
    - name: Create database data dir
      ansible.builtin.file:
        path: /symbios/services/wordpress/db-data
        owner: root
        group: docker
        state: directory
        mode: '0750'

    - name: Create per-instance wp-content dirs
      ansible.builtin.file:
        path: "/symbios/services/wordpress/{{ item.name }}-data"
        state: directory
        mode: '0755'
      loop: "{{ wordpress_instances | default([]) }}"

    # Generate/refresh the compose .env with root + per-instance credentials.
    - name: Generate WordPress .env secrets
      ansible.builtin.shell: >
        {{ git_root }}/scripts/symbios-wordpress-env.sh
        {{ wordpress_instances | default([]) | map(attribute='name') | join(' ') }}
      changed_when: false

    # Render the single compose stack (shared MariaDB + one container per instance)
    - name: /symbios/services/wordpress/docker-compose.yml
      ansible.builtin.template:
        src: wordpress/templates/docker-compose.yml.j2
        dest: /symbios/services/wordpress/docker-compose.yml
        mode: '0440'
        owner: root
        group: docker
      notify: Restart wordpress

    # Render the single Traefik file-provider snippet for all instances.
    # Traefik watches the providers directory, so no reload is required.
    - name: /symbios/base-services/traefik/providers/wordpress.yml
      ansible.builtin.template:
        src: wordpress/templates/traefik-wordpress.yml.j2
        dest: /symbios/base-services/traefik/providers/wordpress.yml
        mode: '0444'
        owner: root
        group: docker

    # LDAP groups + Authelia access_control for restricted instances
    - name: Create LDAP group wordpress-<name> for restricted instances
      ansible.builtin.command: "{{ git_root }}/scripts/symbios-ldap-groups.sh --create --name wordpress-{{ item.name }}"
      loop: "{{ wordpress_instances | default([]) }}"
      when:
        - not (item.public | default(false) | bool) or (item.phpmyadmin | default(false) | bool)
      changed_when: false
      failed_when: false

    - name: Add admin user to WordPress LDAP groups
      ansible.builtin.command: "{{ git_root }}/scripts/symbios-ldap-groups.sh --add-user --name wordpress-{{ item.name }} --uid {{ ldap_admin_uid | default('admin') }}"
      loop: "{{ wordpress_instances | default([]) }}"
      when:
        - not (item.public | default(false) | bool) or (item.phpmyadmin | default(false) | bool)
      changed_when: false
      failed_when: false

    - name: Write Authelia access_control for restricted WordPress domains
      ansible.builtin.include_tasks: tasks/authelia-acl.yml
      loop: "{{ wordpress_instances | default([]) }}"
      when:
        - not (item.public | default(false) | bool)
      vars:
        service_name: "wordpress-{{ item.name }}"
        service_domain: "{{ item.domain }}"
        authelia_subjects: ["group:wordpress-{{ item.name }}"]
        authelia_policy: "{{ wp_auth_policy | default('one_factor') }}"

    - name: Write Authelia access_control for WordPress phpMyAdmin domains
      ansible.builtin.include_tasks: tasks/authelia-acl.yml
      loop: "{{ wordpress_instances | default([]) }}"
      when:
        - item.phpmyadmin | default(false) | bool
      vars:
        service_name: "wordpress-{{ item.name }}-phpmyadmin"
        service_domain: "wp-phpmyadmin.{{ item.domain | regex_replace('^wp\\.', '') }}"
        authelia_subjects: ["group:wordpress-{{ item.name }}"]
        authelia_policy: "{{ wp_auth_policy | default('one_factor') }}"

    # Bring up the database first, provision instance DBs/users, then start
    # the WordPress containers (avoids an install race on very first boot).
    - name: Start shared MariaDB
      ansible.builtin.shell: docker compose up -d db
      args:
        chdir: /symbios/services/wordpress
      changed_when: false
      when: wordpress_instances | default([]) | length > 0

    - name: Provision databases and users
      ansible.builtin.shell: >
        {{ git_root }}/scripts/symbios-wordpress-db.sh
        {{ wordpress_instances | default([]) | map(attribute='name') | join(' ') }}
      changed_when: false
      when: wordpress_instances | default([]) | length > 0

    - name: Start WordPress instances
      ansible.builtin.shell: docker compose up -d --remove-orphans
      args:
        chdir: /symbios/services/wordpress
      changed_when: false

    # Deploy one HTTP healthcheck per instance (https://<domain> every 5 min)
    - name: Deploy healthcheck for each instance
      ansible.builtin.include_tasks: tasks/runcheck.yml
      vars:
        service_name: "wordpress-{{ item.name }}"
        service_domain: "{{ item.domain }}"
      loop: "{{ wordpress_instances | default([]) }}"

    # Remove healthcheck files of instances that were removed from the config
    # file (the orphaned .check would otherwise keep failing every 5 min).
    - name: Detect deployed WordPress instance healthchecks
      ansible.builtin.find:
        paths: "{{ data_root }}/runchecks.d"
        patterns: "symbios-healthcheck-wordpress-*.check"
      register: wp_hc_existing

    - name: Remove healthchecks of removed WordPress instances
      ansible.builtin.file:
        path: "{{ item }}"
        state: absent
      loop: "{{ _wp_hc_stale }}"
      vars:
        _wp_hc_current: >-
          {{ wordpress_instances | default([]) | map(attribute='name')
             | map('regex_replace', '^', data_root ~ '/runchecks.d/symbios-healthcheck-wordpress-')
             | map('regex_replace', '$', '.check')
             | list }}
        _wp_hc_stale: "{{ wp_hc_existing.files | map(attribute='path') | difference(_wp_hc_current) | list }}"

    # Register playbook as installed in the state file
    - name: Register playbook as installed
      include_tasks: tasks/state-register.yml

  handlers:

    # Apply the rendered compose file (up -d recreates changed containers;
    # --remove-orphans drops containers whose instances were removed from the
    # config file; their data dirs are NOT touched).
    - name: Restart wordpress
      ansible.builtin.shell: docker compose up -d --remove-orphans
      args:
        chdir: /symbios/services/wordpress

    # Restart Authelia when access_control changes
    - name: Restart authelia
      ansible.builtin.shell: docker compose restart
      args:
        chdir: /symbios/base-services/authelia