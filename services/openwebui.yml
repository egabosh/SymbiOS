#     versions:
#     - '13'
#   category: Service
#   access:
#     admin_group: openwebui-admins
#     user_group: openwebui-users
#   service_control:
#     services:
#     - name: openwebui
#       type: docker
#       compose_file: /symbios/services/openwebui/docker-compose.yml
#       status: test -d /symbios/services/openwebui || exit 2; docker compose -f /symbios/services/openwebui/docker-compose.yml ps | grep -q "Up "
#     logs:
#     - name: openwebui
#       command: docker compose -f /symbios/services/openwebui/docker-compose.yml logs -f --tail=100
#   uninstall:
#     stop: docker compose -f /symbios/services/openwebui/docker-compose.yml down
#     program_paths:
#       - /symbios/services/openwebui/
#       - /symbios/base-services/traefik/providers/openwebui.yml
#       - /symbios/runchecks.d/symbios-healthcheck-openwebui.check
#     ldap_groups:
#       - openwebui-users
#       - openwebui-admins
#     authelia_blocks:
#       - "OIDC openwebui"
#   actions:
#     start: docker compose -f /symbios/services/openwebui/docker-compose.yml up -d
#     stop: docker compose -f /symbios/services/openwebui/docker-compose.yml down
#     restart: docker compose -f /symbios/services/openwebui/docker-compose.yml restart
#     reload: docker compose -f /symbios/services/openwebui/docker-compose.yml up -d
#
---
- name: open-webui
  hosts: all
  vars:
    service_name: openwebui
    service_domain: "openwebui.{{ base_domain }}"
    ai_host: "ai.lan"
  tasks:

    - name: Create /symbios/services/openwebui dir
      ansible.builtin.file:
        path: /symbios/services/openwebui
        owner: root
        group: docker
        state: directory
        mode: '0550'

    - name: Ensure OIDC secret files exist (placeholder for template)
      ansible.builtin.copy:
        dest: "/symbios/services/openwebui/{{ item }}"
        content: "placeholder"
        force: false
        mode: '0440'
      loop:
        - oidc_password
        - oidc_digest
      changed_when: false

    - name: /symbios/base-services/traefik/providers/openwebui.yml OpenWebUI<->Traefik provider
      blockinfile:
        path: /symbios/base-services/traefik/providers/openwebui.yml
        create: yes
        mode: 0444
        owner: root
        group: docker
        marker: "# {mark} ANSIBLE MANAGED BLOCK"
        block: |
          http:
            routers:
              openwebui:
                rule: "Host(`ai.{{ base_domain }}`)"
                service: openwebui
                entryPoints:
                  - "https"
                tls:
                  certResolver: {{ acme_resolver }}
                middlewares:
                  - "secHeaders@file"
            services:
              openwebui:
                loadBalancer:
                  servers:
                    - url: "http://openwebui:8080"
        backup: yes

#######################
#### OIDC Authelia ####
#######################

    - name: Drop placeholder OIDC secrets so real ones get generated
      ansible.builtin.shell: |
        for f in /symbios/services/openwebui/oidc_password /symbios/services/openwebui/oidc_digest; do
          [ "$(cat "$f" 2>/dev/null)" = "placeholder" ] && rm -f "$f"
        done
        echo cleaned
      changed_when: false

    - name: Create oidc client secret
      ansible.builtin.shell: |
        /symbios/base-services/authelia/gen-oidc-client-secret.sh /symbios/services/openwebui
      changed_when: false
      failed_when: false

    # Rendered AFTER the secret exists, so OAUTH_CLIENT_SECRET always holds
    # the real password (rendering before generation baked "placeholder" in).
    - name: /symbios/services/openwebui/docker-compose.yml Container Configuration
      ansible.builtin.template:
        src: openwebui/files/docker-compose.yml.j2
        dest: /symbios/services/openwebui/docker-compose.yml
        mode: 0440
        owner: root
        group: docker
      notify: Restart openwebui

    - name: Ensure LDAP groups for OIDC login (openwebui-users / openwebui-admins)
      include_tasks: ../shared-tasks/oidc-groups.yml

    - name: Write OIDC config in authelias configuration.yml for openwebui
      include_tasks: ../shared-tasks/authelia-oidc.yml
      vars:
        oidc_client_name: "Open WebUI"
        # OpenWebUI authenticates at the token endpoint with HTTP Basic
        # (client_secret_basic); client_secret_post is rejected. Same pattern
        # as the paperless client, see tasks/authelia-oidc.yml.
        oidc_token_endpoint_auth_method: 'client_secret_basic'
        # PKCE stays enforced (shared-task default): OpenWebUI sends an S256
        # code_challenge via OAUTH_CODE_CHALLENGE_METHOD, see compose env.
        # Must match exactly what OpenWebUI sends: it derives the URI from
        # the request host (ai.<domain>, the only Traefik route) and appends
        # /callback. The OAUTH_REDIRECT_URI env below mirrors this.
        oidc_redirect_uris:
          - "https://ai.{{ base_domain }}/oauth/oidc/callback"

    - name: Deploy LDAP group-change hook (immediate admin sync on membership changes)
      ansible.builtin.copy:
        dest: "{{ data_root }}/ldap-groups.d/openwebui-admin-sync.hook"
        content: |
          #!/bin/bash
          # SymbIOS hook - keep OpenWebUI admins in sync with LDAP group openwebui-admins.
          # Executed by the shared LDAP group-change dispatcher (see symbios-lib.sh,
          # called by symbios-ldap-groups.sh for CLI and WebUI changes) whenever a
          # group or a membership changes. Args: $1=event $2=group $3=uid
          # Only react to changes of the OpenWebUI admin group (incl. group deletion).
          [[ "${2:-}" == "openwebui-admins" ]] || exit 0
          exec "{{ git_root }}/scripts/symbios-openwebui-admin-sync.sh"
        mode: '0755'
        owner: root
        group: root

###########################
#### OpenWebUI Automation #
###########################

    - name: Flush handlers - restart OpenWebUI with new config
      ansible.builtin.meta: flush_handlers

    - name: Install sqlite3 CLI
      ansible.builtin.apt:
        name: sqlite3
        state: present
      tags:
        - prereqs

    - name: Wait for OpenWebUI to initialize the database
      ansible.builtin.shell:
        cmd: >
          timeout 60 bash -c '
            DB="/symbios/services/openwebui/openwebui-data/webui.db"
            while [ ! -f "$DB" ]; do sleep 1; done
            until sqlite3 "$DB" ".tables" 2>/dev/null | grep -q api_key; do sleep 2; done
          '
      changed_when: false

    - name: Create / retrieve OpenWebUI API key (ensure admin user exists)
      ansible.builtin.shell: "{{ git_root }}/scripts/symbios-openwebui-db.sh api-key"
      register: openwebui_api_key
      changed_when: false
      no_log: true

    - name: Save API key to file
      ansible.builtin.copy:
        dest: "/symbios/services/openwebui/comfyui_api_key"
        content: "{{ openwebui_api_key.stdout | default('ERROR') }}"
        mode: '0400'

    # patch: https://github.com/open-webui/open-webui/blob/main/backend/open_webui/utils/images/comfyui.py#L482
    # upstream passes payload.negative_prompt (Optional[str] = None) directly to ComfyUI
    # causing 400 when None → replace with empty string fallback
    # Applied via docker exec to survive container rebuilds; idempotent (check first).
    - name: Patch comfyui.py inside container (negative_prompt None fix)
      ansible.builtin.shell: "{{ git_root }}/scripts/symbios-openwebui-db.sh patch-comfyui"
      args:
        chdir: /symbios/services/openwebui
      changed_when: false

    - name: Set ComfyUI workflows in DB (key-value schema)
      ansible.builtin.shell: "{{ git_root }}/scripts/symbios-openwebui-db.sh workflows"
      environment:
        OWUI_AI_SERVER: "{{ ai_server | default('') }}"
        OWUI_AI_APIKEY: "{{ ai_apikey | default('') }}"
      register: db_config_result
      changed_when: '"restart" in db_config_result.stdout'
      notify: Restart openwebui

    # Keep openai.base_url/api_key in sync after the inventory changed
    # (openai.enable is written once on first run by the task above).
    - name: Store OpenAI settings in OpenWebUI DB (base_url/api_key sync)
      ansible.builtin.shell: "{{ git_root }}/scripts/symbios-openwebui-db.sh sync-openai"
      environment:
        OWUI_AI_SERVER: "{{ ai_server }}"
        OWUI_AI_APIKEY: "{{ ai_apikey }}"
      register: openai_db_result
      changed_when: "'changed' in openai_db_result.stdout"
      notify: Restart openwebui
      no_log: true
      when: ai_server | default('', true) | length > 0

    - name: Store speech backends in OpenWebUI DB (STT/TTS sync)
      ansible.builtin.shell: "{{ git_root }}/scripts/symbios-openwebui-db.sh sync-speech"
      environment:
        OWUI_STT_URL: "{{ ai_stt_url | default('', true) }}"
        OWUI_STT_KEY: "{{ ai_stt_key | default('', true) or ai_apikey | default('', true) }}"
        OWUI_STT_MODEL: "{{ ai_stt_model | default('', true) }}"
        OWUI_TTS_URL: "{{ ai_tts_url | default('', true) }}"
        OWUI_TTS_KEY: "{{ ai_tts_key | default('', true) or ai_apikey | default('', true) }}"
        OWUI_TTS_MODEL: "{{ ai_tts_model | default('', true) }}"
      register: stt_tts_db_result
      changed_when: "'changed' in stt_tts_db_result.stdout"
      notify: Restart openwebui
      no_log: true
      when: (ai_stt_url | default('', true) | length > 0) or (ai_tts_url | default('', true) | length > 0)

    - name: Store image backend in OpenWebUI DB (ComfyUI sync)
      ansible.builtin.shell: "{{ git_root }}/scripts/symbios-openwebui-db.sh sync-image"
      environment:
        OWUI_IMG_URL: "{{ ai_image_url | default('', true) }}"
        OWUI_IMG_MODEL: "{{ ai_image_model | default('', true) }}"
        OWUI_IMG_EDIT_URL: "{{ ai_image_edit_url | default('', true) or ai_image_url | default('', true) }}"
        OWUI_IMG_EDIT_MODEL: "{{ ai_image_edit_model | default('', true) or ai_image_model | default('', true) }}"
      register: image_db_result
      changed_when: "'changed' in image_db_result.stdout"
      notify: Restart openwebui
      no_log: true
      when: ai_image_url | default('', true) | length > 0

    - name: Store retrieval backends in OpenWebUI DB (Tika/SearXNG sync)
      ansible.builtin.shell: "{{ git_root }}/scripts/symbios-openwebui-db.sh sync-retrieval"
      environment:
        OWUI_TIKA_URL: "{{ ai_tika_url | default('', true) }}"
        OWUI_SEARXNG_URL: "{{ ai_searxng_url | default('', true) }}"
      register: retrieval_db_result
      changed_when: "'changed' in retrieval_db_result.stdout"
      notify: Restart openwebui
      no_log: true
      when: (ai_tika_url | default('', true) | length > 0) or (ai_searxng_url | default('', true) | length > 0)

    - name: Flush handlers - restart OpenWebUI to pick up DB config
      ansible.builtin.meta: flush_handlers

    # Deploy the shared HTTP healthcheck (shared-tasks/runcheck.yml)
    - name: Deploy healthcheck
      include_tasks: ../shared-tasks/runcheck.yml
      vars:
        healthcheck_url: "https://ai.{{ base_domain }}"

    - name: Ensure openwebui is running
      include_tasks: ../shared-tasks/docker-start.yml

    - name: Register playbook as installed
      include_tasks: ../shared-tasks/state-register.yml

  handlers:

    - name: Restart openwebui
      include_tasks: ../shared-tasks/compose-recreate.yml

    - name: Restart authelia
      include_tasks: ../shared-tasks/authelia-restart.yml
