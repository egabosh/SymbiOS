---
- name: open-webui
  hosts: all
  vars:
    service_name: openwebui
    service_domain: "openwebui.{{ base_domain }}"
    ai_host: "ai.lan"
  tasks:

    - name: Create /symbios/services/openwebui dir
      ansible.builtin.file:
        path: /symbios/services/openwebui
        owner: root
        group: docker
        state: directory
        mode: '0550'

    - name: Ensure OIDC secret files exist (placeholder for template)
      ansible.builtin.copy:
        dest: "/symbios/services/openwebui/{{ item }}"
        content: "placeholder"
        force: false
        mode: '0440'
      loop:
        - oidc_password
        - oidc_digest
      changed_when: false

    - name: /symbios/services/openwebui/docker-compose.yml Container Configuration
      ansible.builtin.template:
        src: openwebui/files/docker-compose.yml.j2
        dest: /symbios/services/openwebui/docker-compose.yml
        mode: 0440
        owner: root
        group: docker
      notify: Restart openwebui

    - name: /symbios/base-services/traefik/providers/openwebui.yml OpenWebUI<->Traefik provider
      blockinfile:
        path: /symbios/base-services/traefik/providers/openwebui.yml
        create: yes
        mode: 0444
        owner: root
        group: docker
        marker: "# {mark} ANSIBLE MANAGED BLOCK"
        block: |
          http:
            routers:
              openwebui:
                rule: "Host(`ai.{{ base_domain }}`)"
                service: openwebui
                entryPoints:
                  - "https"
                tls:
                  certResolver: {{ acme_resolver }}
                middlewares:
                  - "secHeaders@file"
            services:
              openwebui:
                loadBalancer:
                  servers:
                    - url: "http://openwebui:8080"
        backup: yes

#######################
#### OIDC Authelia ####
#######################

    - name: Create oidc client secret
      ansible.builtin.shell: |
        /symbios/base-services/authelia/gen-oidc-client-secret.sh /symbios/services/openwebui
      changed_when: false
      failed_when: false

    - name: Ensure LDAP groups for OIDC login (openwebui-users / openwebui-admins)
      include_tasks: tasks/oidc-groups.yml

    - name: Remove legacy LDAP groups (old naming convention)
      ansible.builtin.shell: |
        {{ git_root }}/scripts/symbios-ldap-groups.sh --delete --name ai
        {{ git_root }}/scripts/symbios-ldap-groups.sh --delete --name ai-admin
      changed_when: false
      failed_when: false

    - name: Write OIDC config in authelias configuration.yml for openwebui
      include_tasks: tasks/authelia-oidc.yml
      vars:
        oidc_client_name: "Open WebUI"
        oidc_redirect_uris:
          - "https://openwebui.{{ base_domain }}/oauth/oidc"

###########################
#### OpenWebUI Automation #
###########################

    - name: Flush handlers - restart OpenWebUI with new config
      ansible.builtin.meta: flush_handlers

    - name: Install sqlite3 CLI
      ansible.builtin.apt:
        name: sqlite3
        state: present
      tags:
        - prereqs

    - name: Wait for OpenWebUI to initialize the database
      ansible.builtin.shell:
        cmd: >
          timeout 60 bash -c '
            DB="/symbios/services/openwebui/openwebui-data/webui.db"
            while [ ! -f "$DB" ]; do sleep 1; done
            until sqlite3 "$DB" ".tables" 2>/dev/null | grep -q api_key; do sleep 2; done
          '
      changed_when: false

    - name: Create / retrieve OpenWebUI API key (ensure admin user exists)
      ansible.builtin.shell: |
        DB=/symbios/services/openwebui/openwebui-data/webui.db

        # Create initial admin user if none exists
        USER_ID=$(sqlite3 "$DB" "SELECT id FROM \"user\" ORDER BY role='admin' DESC LIMIT 1")
        if [ -z "$USER_ID" ]; then
          UUID=$(python3 -c "import uuid; print(uuid.uuid4())")
          NOW=$(date +%s%3N)
          sqlite3 "$DB" \
            "INSERT INTO \"user\"(id,name,email,role,profile_image_url,created_at,updated_at,last_active_at) \
             VALUES('$UUID','admin','admin@localhost','admin','/user.png',$NOW,$NOW,$NOW)"
          USER_ID=$UUID
        fi

        # Look for an existing key named 'comfyui-automation'
        KEY=$(sqlite3 "$DB" \
          "SELECT key FROM api_key WHERE json_extract(data,'$.name')='comfyui-automation' LIMIT 1")
        if [ -n "$KEY" ]; then
          echo "$KEY"
          exit 0
        fi

        # Generate a fresh UUID, API key and timestamp
        UUID=$(python3 -c "import uuid; print(uuid.uuid4())")
        API_KEY="sk-$(openssl rand -base64 48 | tr '+/' '-_' | tr -d '=')"
        NOW=$(date +%s%3N)

        # Insert the key into the database
        sqlite3 "$DB" \
          "INSERT INTO api_key(id,user_id,key,data,created_at,updated_at) \
           VALUES('$UUID','$USER_ID','$API_KEY','{\"name\":\"comfyui-automation\"}',$NOW,$NOW)"

        echo "$API_KEY"
      register: openwebui_api_key
      changed_when: false
      no_log: true

    - name: Save API key to file
      ansible.builtin.copy:
        dest: "/symbios/services/openwebui/comfyui_api_key"
        content: "{{ openwebui_api_key.stdout | default('ERROR') }}"
        mode: '0400'

    # patch: https://github.com/open-webui/open-webui/blob/main/backend/open_webui/utils/images/comfyui.py#L482
    # upstream passes payload.negative_prompt (Optional[str] = None) directly to ComfyUI
    # causing 400 when None → replace with empty string fallback
    # Applied via docker exec to survive container rebuilds; idempotent (check first).
    - name: Patch comfyui.py inside container (negative_prompt None fix)
      ansible.builtin.shell: |
        set -e
        CID=$(docker compose ps -q 2>/dev/null | head -1)
        [ -z "$CID" ] && exit 0
        if docker exec "$CID" grep -q "payload.negative_prompt is not None" \
          /app/backend/open_webui/utils/images/comfyui.py 2>/dev/null; then
          exit 0
        fi
        docker exec "$CID" sed -i \
          's|\(workflow\[node_id\]\[.inputs.\]\[node.key if node.key else .text.\]\s*=\s*\)payload\.negative_prompt$|\1payload.negative_prompt if payload.negative_prompt is not None else ""|' \
          /app/backend/open_webui/utils/images/comfyui.py
      args:
        chdir: /symbios/services/openwebui
      changed_when: false

    - name: Set ComfyUI workflows in DB (key-value schema)
      ansible.builtin.shell: |
        python3 <<'PYEOF'
        import json, sqlite3, time

        DB = "/symbios/services/openwebui/openwebui-data/webui.db"

        WF = {
            "3": {"class_type": "KSampler", "inputs": {
                "cfg": 8, "denoise": 1, "latent_image": ["5", 0], "model": ["4", 0],
                "negative": ["6", 0], "positive": ["7", 0], "sampler_name": "euler",
                "scheduler": "normal", "seed": 42, "steps": 20}},
            "4": {"class_type": "CheckpointLoaderSimple", "inputs": {"ckpt_name": "sd15.safetensors"}},
            "5": {"class_type": "EmptyLatentImage", "inputs": {"batch_size": 1, "height": 512, "width": 512}},
            "6": {"class_type": "CLIPTextEncode", "inputs": {"clip": ["4", 1], "text": "NEGATIVE_PROMPT"}},
            "7": {"class_type": "CLIPTextEncode", "inputs": {"clip": ["4", 1], "text": "PROMPT"}},
            "8": {"class_type": "VAEDecode", "inputs": {"samples": ["3", 0], "vae": ["4", 2]}},
            "9": {"class_type": "SaveImage", "inputs": {"filename_prefix": "ComfyUI", "images": ["8", 0]}},
        }
        EDIT_WF = {
            "3": {"class_type": "KSampler", "inputs": {
                "cfg": 8, "denoise": 0.7, "latent_image": ["10", 0], "model": ["4", 0],
                "negative": ["6", 0], "positive": ["7", 0], "sampler_name": "euler",
                "scheduler": "normal", "seed": 42, "steps": 20}},
            "4": {"class_type": "CheckpointLoaderSimple", "inputs": {"ckpt_name": "sd15.safetensors"}},
            "5": {"class_type": "VAEDecode", "inputs": {"samples": ["3", 0], "vae": ["4", 2]}},
            "6": {"class_type": "CLIPTextEncode", "inputs": {"clip": ["4", 1], "text": "NEGATIVE_PROMPT"}},
            "7": {"class_type": "CLIPTextEncode", "inputs": {"clip": ["4", 1], "text": "PROMPT"}},
            "8": {"class_type": "SaveImage", "inputs": {"filename_prefix": "ComfyUI", "images": ["5", 0]}},
            "10": {"class_type": "VAEEncode", "inputs": {"samples": ["11", 0], "vae": ["4", 2]}},
            "11": {"class_type": "LoadImage", "inputs": {"image": ""}},
        }
        gen_nodes = [
            {"type": "model",           "node_ids": ["4"], "key": "ckpt_name"},
            {"type": "prompt",          "node_ids": ["7"], "key": "text"},
            {"type": "negative_prompt", "node_ids": ["6"], "key": "text"},
            {"type": "width",           "node_ids": ["5"], "key": "width"},
            {"type": "height",          "node_ids": ["5"], "key": "height"},
            {"type": "n",               "node_ids": ["5"], "key": "batch_size"},
            {"type": "steps",           "node_ids": ["3"], "key": "steps"},
            {"type": "seed",            "node_ids": ["3"], "key": "seed"},
        ]
        edit_nodes = [
            {"type": "model",           "node_ids": ["4"], "key": "ckpt_name"},
            {"type": "prompt",          "node_ids": ["7"], "key": "text"},
            {"type": "negative_prompt", "node_ids": ["6"], "key": "text"},
            {"type": "image",           "node_ids": ["11"], "key": "image"},
        ]

        db = sqlite3.connect(DB)
        c = db.cursor()
        now = int(time.time())

        c.execute("SELECT key FROM config")
        existing = {row[0] for row in c.fetchall()}

        def upsert(key, value):
            c.execute(
                "INSERT INTO config (key, value, updated_at) VALUES (?, ?, ?) "
                "ON CONFLICT(key) DO UPDATE SET value=excluded.value, updated_at=excluded.updated_at",
                (key, json.dumps(value) if not isinstance(value, str) else value, now),
            )

        upsert("COMFYUI_WORKFLOW_NODES", gen_nodes)
        upsert("image_generation.comfyui.workflow", json.dumps(WF))
        upsert("image_generation.comfyui.nodes", gen_nodes)

        upsert("IMAGES_EDIT_COMFYUI_WORKFLOW_NODES", edit_nodes)
        upsert("IMAGES_EDIT_COMFYUI_WORKFLOW", json.dumps(EDIT_WF))
        upsert("images.edit.comfyui.workflow", json.dumps(EDIT_WF))
        upsert("images.edit.comfyui.nodes", edit_nodes)

        upsert("ui.prompt_suggestions", [])

        needs_restart = False
        ai_server = "{{ ai_server | default('') }}"
        ai_apikey = "{{ ai_apikey | default('') }}"
        if ai_server and "openai.enable" not in existing:
            upsert("openai.enable", True)
            upsert("openai.api_base_urls", [ai_server])
            upsert("openai.api_keys", [ai_apikey])
            upsert("openai.api_configs", {})
            needs_restart = True

        db.commit()
        db.close()
        print("restart" if needs_restart else "done")
        PYEOF
      register: db_config_result
      changed_when: '"restart" in db_config_result.stdout'
      notify: Restart openwebui

    # Keep openai.base_url/api_key in sync after the inventory changed
    # (openai.enable is written once on first run by the task above).
    - name: Store OpenAI settings in OpenWebUI DB (base_url/api_key sync)
      ansible.builtin.shell: |
        DB=/symbios/services/openwebui/openwebui-data/webui.db
        NEW_BASE='["{{ ai_server }}"]'
        NEW_KEY='["{{ ai_apikey }}"]'
        CUR_BASE=$(sqlite3 "$DB" "SELECT value FROM config WHERE key='openai.api_base_urls'")
        CUR_KEY=$(sqlite3 "$DB" "SELECT value FROM config WHERE key='openai.api_keys'")
        if [ "$CUR_BASE" != "$NEW_BASE" ] || [ "$CUR_KEY" != "$NEW_KEY" ]; then
          sqlite3 "$DB" \
            "INSERT INTO config (key, value, updated_at) VALUES
               ('openai.enable', 'true', strftime('%s','now')*1000),
               ('openai.api_base_urls', '$NEW_BASE', strftime('%s','now')*1000),
               ('openai.api_keys', '$NEW_KEY', strftime('%s','now')*1000)
             ON CONFLICT(key) DO UPDATE SET value=excluded.value, updated_at=excluded.updated_at;"
          echo changed
        fi
      register: openai_db_result
      changed_when: "'changed' in openai_db_result.stdout"
      notify: Restart openwebui
      no_log: true
      when: ai_server | default('', true) | bool

    - name: Flush handlers - restart OpenWebUI to pick up DB config
      ansible.builtin.meta: flush_handlers

    # Deploy the shared HTTP healthcheck (services/tasks/runcheck.yml)
    - name: Deploy healthcheck
      include_tasks: tasks/runcheck.yml
      vars:
        healthcheck_url: "https://ai.{{ base_domain }}"

    - name: Ensure openwebui is running
      include_tasks: tasks/docker-start.yml

    - name: Register playbook as installed
      include_tasks: tasks/state-register.yml

  handlers:

    - name: Restart openwebui
      ansible.builtin.shell: docker compose up -d --force-recreate
      args:
        chdir: /symbios/services/openwebui

    - name: Restart authelia
      ansible.builtin.shell: docker compose restart
      args:
        chdir: /symbios/base-services/authelia
