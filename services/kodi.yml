# docs:
#   uses_vars:
#     - acme_resolver
#     - base_domain
#     - locale
#     - traefik_network_gateway
#     - traefik_default_access
#     - traefik_service_access
#     - twofa_enabled
#   boot_units: kodi-standalone.service switch-kodi-desk.service
#   name: Kodi
#   short_description: Deploy the Kodi media center on the host
#   description: >-
#     Installs Kodi 21 "Omega" (Debian Trixie) as a host service for direct TV
#     playback. It runs standalone on tty7 under the dedicated kodi user and is
#     switched against the SymbiOS desktop by switch-kodi-desk (Kodi starts
#     automatically after boot, media-center mode). While a configured remote
#     media database is unreachable the switcher starts Kodi with the local
#     library instead of leaving the TV black. The JSON-RPC web server
#     (Kodi Remote) listens on port 8081 with a generated Basic-auth password;
#     direct access is LAN-only, global access runs through Authelia/Traefik at
#     kodi.<base_domain> (group kodi). Optional: MariaDB media database backend
#     (see services/kodidb.yml), SFTP media sources and automatic addon
#     installation from mirrors.kodi.tv. Optional: a Jellyfin server can be
#     connected through the Jellyfin for Kodi addon (plugin.video.jellyfin);
#     the addon is installed and preconfigured with the configured server URL,
#     and the user signs in once in the Kodi UI. Jellyfin library sync and the
#     KodiDB/MySQL backend both write into the Kodi library and should not be
#     combined without testing. Optional: a game ROM source (Kodi
#     Options "path_roms", local or SFTP-relative like the other media paths)
#     that installs the libretro cores available as Debian packages on the
#     target release (trixie: gb/gbc, gba, nes/fds, snes, Sega MD/MS/GG/
#     SG-1000/SegaCD, NDS, WonderSwan, Virtual Boy) plus Mupen64Plus-Next for
#     N64 and FBNeo for arcade (Neo Geo MVS/AES, CPS, classic boards) built
#     from source (no Debian package exists); cores missing on a release are
#     skipped, systems without a core show up in no scan. FBNeo takes MAME
#     style zipped sets (one archive per game, BIOS in neogeo.zip) and opens
#     the archive itself, so a bare chip dump directory has to be repacked
#     first: scripts/symbios-fbneo-repack.py reads the CRC lists of the
#     driver source and writes one zip per complete set (--roms, --out). The
#     core must parse those archives with its own stdio: Kodi's game.libretro
#     wrapper answers the frontend-VFS request for every core, but a seek
#     through the handle it hands out fails, so unzOpen() aborts and each set
#     logs "No romset found at ...". A source patch keeps the VFS opt-in, so
#     the core falls back to plain file I/O. DOS games run with DOSBox Pure,
#     which is in the same situation (no Debian package, and the official
#     add-on repository builds the game client for windows/osx/android only),
#     so its core is built here too. It starts a game from a file - Kodi never
#     plays a directory - and writes the changes of a running game into the
#     loaded content, which a read-only ROM tree cannot take. Game folders are
#     therefore packed into one archive each: scripts/symbios-dosbox-repack.py
#     writes <game>.dosz next to every folder and moves the verified folder out
#     of the listed tree, so the core stores savegames as <game>.pure.zip in
#     its own save directory and offers the executables of the archive in a
#     start menu that remembers the chosen one. The archive is named .dosz - a
#     zip container the core mounts like a .zip - because Kodi picks the game
#     client by extension and asks the user whenever two claim the same one,
#     and the arcade core claims .zip for its sets. For the same reason the
#     wrapper of the DOS core leaves out every extension another installed
#     core already covers (zip/iso/chd/cue/m3u), so every file maps to exactly
#     one client. Only DOS is covered - DOSBox Pure emulates DOS, so a Windows
#     game does not start from here. A game that asks for its CD, or whose data
#     does not match its executable (a Doom wad whose built-in demos come from
#     another version stops with "Demo is from a different game version"),
#     quits to the DOS shell and the emulator closes the player again: the
#     archive is the problem, not the core. A start marker that names a packer
#     (pkunzip) or one of two entries that share a short name is dropped again,
#     because such a program quits at once instead of starting a game. N64
#     games render with the angrylion software RDP (set as an addon user
#     setting): Kodi 21 has no HW framebuffer game stream, so the default
#     GLideN64 OpenGL renderer cannot load. Angrylion in turn forces the
#     ParaLLEl-RSP JIT instead of the HLE RSP, and that JIT needs the
#     page-size patch applied before the build: upstream aligns its code
#     windows to 4 KB and aborts on 16 KB page kernels (Raspberry Pi 4/5).
#     The software rasterizer is CPU bound and cannot be tuned around: a
#     Raspberry Pi 5 needs ~40 ms per frame and therefore emulates at ~0.8 of
#     real time (measured over the audio clock and the frame rate), while
#     Kodi keeps the audio sink fed and pads the missing time with silence -
#     audible as a short dropout every few seconds. No VI filter, thread
#     count, RSP plugin or frame-rate option changes that; x86_64 hosts run
#     full speed. Kodi 21 has no hardware framebuffer stream at all
#     (StreamType::HW_BUFFER is unimplemented), so the OpenGL renderers
#     (GLideN64, ParaLLEl-RDP) are out of reach; Kodi 22 (Piers) implements
#     them for game clients with Game API 8.2.0 and is the actual fix.
#     ROMs that only a need_fullpath core can play (Sega via genplus, NDS via
#     desmume; addon.xml supports_vfs=false) need a plain local path, because
#     Kodi drops such a core for non-local sources. While the ROM source is an
#     SFTP share, the playbook mounts that share read-only with sshfs (the
#     kodi SSH key must be registered on the SFTP user, e.g. as LDAP
#     sshPublicKey) and points the games source at the mount, so every core
#     sees local files without copying the ROM library to the host. The games
#     home entry of the shipped skin (Estuary) lists standalone game add-ons,
#     so with libretro cores alone its widget stays empty and offers the
#     add-on browser instead; the playbook repoints that widget at the game
#     sources, so the home screen lists the consoles and opens the selected
#     one in the Games window. A large ROM tree can be split into groups
#     (option "roms_groups") below the ROM path: Kodi still gets one flat
#     source list, every group contributes its subfolders as sources, and a
#     group that holds files directly becomes a source itself. Names listed
#     in "roms_exclude" are left out of that list (systems whose archives
#     are slow to list and that no installed core can play). The labels of
#     the standard system folder names are spelled out ("Game Boy" instead of
#     "gb"); a file named like the folder and lying next to it becomes the
#     artwork of that source, so the list shows a console logo instead of the
#     generic disk icon. Without such a file the playbook downloads the icon of
#     that system from the RetroArch asset set (CC BY 4.0, attribution is
#     written next to the downloads). The Kodi
#     UI language follows the system locale (inventory "locale"), the same
#     language the desktop uses. Rewind stays off: it keeps a frame history of
#     the running game in RAM and commits savestates while it fills, which on
#     the Pi 5 drove a game into gigabytes of memory until Kodi died in the
#     renderer (crash logs 2026-11-17/18, all cores). A cgroup cap (50% of the
#     installed RAM plus 1 GB swap) keeps a future runaway from thrashing the
#     whole host.
#   url: "https://kodi.{{ base_domain }}"
