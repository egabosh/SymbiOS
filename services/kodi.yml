#     program_paths:
#       - /home/kodi/
#       - /usr/local/sbin/switch-kodi-desk.sh
#       - /symbios/base-services/traefik/providers/kodi.yml
#       - /symbios/runchecks.d/symbios-healthcheck-kodi.check
#     ldap_groups:
#       - kodi
#     authelia_blocks:
#       - "kodi ACCESS CONTROL"
#   actions:
#     start: systemctl start switch-kodi-desk
#     stop: systemctl stop switch-kodi-desk kodi-standalone
