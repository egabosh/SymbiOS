    - name: Deploy pipes_runner.py (single-process replacement for per-room pipe containers)
      ansible.builtin.copy:
        src: matrix/files/pipes_runner.py
        dest: /symbios/services/matrix/pipes_runner.py
        mode: "0644"
        owner: root
        group: root

    - name: Deploy matrix-recreate-room.sh (room state corruption repair)
      ansible.builtin.template:
        src: matrix/files/matrix-recreate-room.sh.j2
        dest: /usr/local/sbin/matrix-recreate-room.sh
        mode: "0755"
        owner: root
        group: root
        validate: /bin/bash -n %s
        backup: yes

    - name: /symbios/services/matrix/synapse-purge.sh (safe Synapse cleanup)
      ansible.builtin.template:
        src: matrix/files/synapse-purge.sh.j2
        dest: /usr/local/sbin/synapse-purge.sh
        mode: "0755"
        owner: root
        group: root
        validate: /bin/bash -n %s
        backup: yes

    - name: /usr/local/sbin/fix-matrix-ignored-devices.sh (ignored-device watchdog)
      ansible.builtin.template:
        src: matrix/files/fix-matrix-ignored-devices.sh.j2
        dest: /usr/local/sbin/fix-matrix-ignored-devices.sh
        mode: "0755"
        owner: root
        group: root
        validate: /bin/bash -n %s
        backup: yes

    - name: /usr/local/sbin/matrix-device-health.sh (E2EE deleted-device watchdog)
      ansible.builtin.template:
        src: matrix/files/matrix-device-health.sh.j2
        dest: /usr/local/sbin/matrix-device-health.sh
        mode: "0755"
        owner: root
        group: root
        validate: /bin/bash -n %s
        backup: yes

    - name: Cron fix ignored matrix-commander devices daily
      ansible.builtin.cron:
        name: "Fix ignored matrix-commander devices"
        minute: "30"
        hour: "4"
        job: /usr/local/sbin/fix-matrix-ignored-devices.sh >>/symbios/services/matrix/fix-ignored-devices.log 2>&1

    - name: Cron matrix-device-health daily (unmark stale deleted E2EE devices)
      ansible.builtin.cron:
        name: "Matrix device health"
        minute: "15"
        hour: "4"
        job: /usr/local/sbin/matrix-device-health.sh >>/symbios/services/matrix/device-health.log 2>&1

    - name: Cron synapse-purge daily (safe vacuum/analyze)
      ansible.builtin.cron:
        name: "synapse-purge daily"
        minute: "30"
        hour: "3"
        job: /usr/local/sbin/synapse-purge.sh daily >/symbios/services/matrix/purge.log 2>&1

    - name: Cron synapse-purge weekly (vacuum_full_tables, stops synapse briefly)
      ansible.builtin.cron:
        name: "synapse-purge weekly"
        weekday: "0"
        minute: "0"
        hour: "5"
        job: /usr/local/sbin/synapse-purge.sh weekly >/symbios/services/matrix/purge.log 2>&1

    - name: Cron synapse-purge monthly (vacuum_full_state, longest downtime)
      ansible.builtin.cron:
        name: "synapse-purge monthly"
        day: "1"
        minute: "0"
        hour: "6"
        job: /usr/local/sbin/synapse-purge.sh monthly >/symbios/services/matrix/purge.log 2>&1

    # Deploy the shared HTTP healthcheck (services/tasks/runcheck.yml)
    - name: Deploy healthcheck
      include_tasks: tasks/runcheck.yml

    - name: Register playbook as installed
      include_tasks: tasks/state-register.yml

