# SymbiOS feature manifest for OpenWrt VM.
# Defines available features, their parameters, and mapping to Ansible playbooks.
# Read by symbios-feature-apply.sh and the WebUI plugin_catalog.
name: openwrt
version: '1.0'
description: OpenWrt VM - Router, Netzwerk und Sicherheit konfigurieren

# Feature groups organize features in the WebUI by category.
groups:
  - id: dns
    name: DNS
    icon: globe

features:
  - id: ddns_ipv6
    name: DynDNS IPv6
    icon: globe
    description: Dynamischer DNS-Eintrag fuer die IPv6-Adresse.
    group: dns
    target: vm
    playbook: ddns-ipv6.yml
    param_mapping:
      domain: domainname
      apikey: apikey
    params:
      - name: domain
        type: text
        label: Domain (z.B. dedyn.io)
        required: true
      - name: apikey
        type: password
        label: deSEC API-Key
        required: true

  - id: dhcp_host
    name: DHCP-Host
    icon: hdd-network
    description: Statische DHCP-Reservation und DNS-Eintrag.
    group: dns
    target: vm
    playbook: dhcp-hosts.yml
    param_mapping:
      name: host
      ip: ip
      mac: mac
    params:
      - name: name
        type: text
        label: Hostname
        required: true
      - name: ip
        type: text
        label: IPv4-Adresse
        required: true
      - name: mac
        type: text
        label: MAC-Adresse
        required: true
        pattern: "^([0-9A-Fa-f]{2}:){5}[0-9A-Fa-f]{2}$"

  - id: dns_record
    name: DNS-Eintrag
    icon: globe
    description: A-, AAAA- oder CNAME-Eintrag hinzufuegen.
    group: dns
    target: vm
    playbook: dns_a.yml
    param_mapping:
      hostname: host
      ip: ip
    params:
      - name: hostname
        type: text
        label: Hostname
        required: true
      - name: ip
        type: text
        label: IPv4-Adresse
        required: true