# OpenWrt VM feature state - tracks enabled/disabled status and parameter values
# for each feature defined in plugin.yml.
# Managed by the WebUI and symbios-feature-apply.sh.
#
# Status values:
#   null     - feature not configured
#   draft    - parameters saved but not yet applied
#   applied  - playbook executed successfully
#   error    - last apply failed (check error field)
#
# Note: The former VM-side features (iot, wifi*, wireguard, dnscrypt, ssh,
# syslog, SMTP, host bridge/passthrough, DynDNS IPv4) are either baked into the
# VM at build time by the openwrt-vm playbook or no longer needed; only
# user-specific DNS entries remain as features.

ddns_ipv6:
  enabled: false
  status: null
  error: null
  last_applied: null
  params:
    domain: ''
    apikey: ''

dhcp_host:
  enabled: false
  status: null
  error: null
  last_applied: null
  params:
    name: ''
    ip: ''
    mac: ''

dns_record:
  enabled: false
  status: null
  error: null
  last_applied: null
  params:
    hostname: ''
    ip: ''