# OpenWrt VM feature state - tracks enabled/disabled status and parameter values
# for each feature defined in plugin.yml.
# Managed by the WebUI and symbios-feature-apply.sh.
#
# Status values:
#   null     - feature not configured
#   draft    - parameters saved but not yet applied
#   applied  - playbook executed successfully
#   error    - last apply failed (check error field)

interfaces:
  enabled: false
  status: null
  error: null
  last_applied: null
  params:
    bridge_interfaces: []

