# docs:
#   name: RustDesk
#   short_description: Deploy the RustDesk remote desktop server
#   description: |
#     Deploys RustDesk server (hbbs/hbbr) for self-hosted remote desktop connections. Uses raw TCP/UDP ports, no Traefik.
#     Key verification is enforced: only clients configured with the server public key can use it (no open access).
#
#     Router port forwarding (required, to the SymbiOS host):
#       - TCP 21115-21119 (hbbs: 21115 NAT test, 21116 ID registration, 21118 web client; hbbr: 21117 relay, 21119 web client)
#       - UDP 21116 (hbbs ID registration and heartbeat)
#     The playbook opens these ports in UFW on the host automatically. On the internet router the forwards are
#     created automatically when port_forwarding_method is set to auto (UPnP/FRITZ!Box, see Settings -> Port Forwarding);
#     otherwise create them manually.
#
#     Client setup (desktop client: click the three dots next to the ID, then Network; mobile client: Settings -> ID/Relay server).
#     Enter the values below on BOTH sides (controller and remote machine), then confirm with OK - the client status should change to Ready.
#     The WebUI renders the values below with your configured domain:
#       - ID server: rustdesk.{{ base_domain }} (hostname only, no port - port 21116 is the default).
#         This is "rustdesk." plus the base_domain from the SymbiOS settings (inventory.yml). It must resolve publicly
#         (check with "nslookup rustdesk.{{ base_domain }}"); DynDNS/deSEC keeps it updated.
#       - Relay server: same hostname as the ID server (port 21117 is the default). You may leave it empty - the client then falls back
#         to the ID server - but filling it explicitly is recommended. The container announces exactly this host
#         via "hbbs -r rustdesk.{{ base_domain }}:21117".
#       - API server: leave empty. This field belongs to RustDesk Server Pro (address book/device management); this playbook installs
#         only the open-source hbbs/hbbr, which has no API server.
#       - Key: required. Paste the server public key here (same value on every client).
#         Where to get it: click "Show key" in the Output / Actions section below and copy the single-line output
#         (or run "cat /symbios/services/rustdesk/data/id_ed25519.pub" via SSH on the host).
#         Clients without the correct key are rejected (key mismatch):
#         only key holders can use this server, and their connections are encrypted. Both server
#         containers share the same key file, so hbbs and hbbr always match.
#   author: Oliver Bohlen
#   version: '1.0'
#   license: GPLv3
#   copyright: Copyright (c) 2026, Oliver Bohlen
#   min_ansible_version: '2.11'
#   platforms:
#   - name: Debian
#     versions:
#     - '13'
#   category: Service
#   service_control:
#     services:
#     - name: rustdesk
#       type: docker
#       compose_file: /symbios/services/rustdesk/docker-compose.yml
#       status: test -d /symbios/services/rustdesk || exit 2; docker compose -f /symbios/services/rustdesk/docker-compose.yml ps | grep -q "Up "
#     logs:
#     - name: rustdesk
#       command: docker compose -f /symbios/services/rustdesk/docker-compose.yml logs -f --tail=100
#   uninstall:
#     stop: docker compose -f /symbios/services/rustdesk/docker-compose.yml down
#     program_paths:
#       - /symbios/services/rustdesk/
#       - /symbios/runchecks.d/symbios-healthcheck-rustdesk.check
#   actions:
#     start: docker compose -f /symbios/services/rustdesk/docker-compose.yml up -d
#     stop: docker compose -f /symbios/services/rustdesk/docker-compose.yml down
#     restart: docker compose -f /symbios/services/rustdesk/docker-compose.yml restart
#     reload: docker compose -f /symbios/services/rustdesk/docker-compose.yml up -d
#     show_key: cat /symbios/services/rustdesk/data/id_ed25519.pub
#
---
- name: rustdesk setup
  hosts: all

  vars:
    service_name: rustdesk
    service_domain: "{{ service_name }}.{{ base_domain }}"
    this_arch: "{{ '-arm64v8' if ansible_architecture == 'aarch64' }}"
    router_forwards:
      - ports: [21115, 21116, 21117, 21118, 21119]
        proto: TCP
      - ports: [21116]
        proto: UDP

  tasks:

    - name: Allow port 21115:21119/tcp
      community.general.ufw:
        rule: allow
        port: '21115:21119'
        proto: tcp

    - name: Allow port 21116/udp
      community.general.ufw:
        rule: allow
        port: '21116'
        proto: udp

    - name: Router port forwarding (UPnP/FRITZ!Box)
      include_tasks: tasks/router-forward.yml

    - name: /symbios/services/{{ service_name }}/docker-compose.yml Container Configuration
      blockinfile:
        path: /symbios/services/{{ service_name }}/docker-compose.yml
        create: yes
        mode: 0440
        owner: root
        group: docker
        marker: "# {mark} ANSIBLE MANAGED BLOCK"
        block: |
          
          name: ""

          services:
            {{ service_name }}-hbbs:
              container_name: {{ service_name }}-hbbs
              ports:
                - 21115:21115
                - 21116:21116
                - 21116:21116/udp
                - 21118:21118
              image: rustdesk/rustdesk-server:latest{{this_arch}}
              command: hbbs -r {{ service_domain }}:21117
              volumes:
                - ./data:/root
              networks:
                - {{ service_name }}
              depends_on:
                - {{ service_name }}-hbbr
              restart: unless-stopped
             
            {{ service_name }}-hbbr:
              container_name: {{ service_name }}-hbbr
              ports:
                - 21117:21117
                - 21119:21119
              image: rustdesk/rustdesk-server:latest{{this_arch}}
              command: hbbr
              volumes:
                - ./data:/root
              networks:
                - {{ service_name }}
              restart: unless-stopped
             
          networks:
            {{ service_name }}:
              external: false
        backup: yes
      notify: Restart rustdesk

    - name: Deploy healthcheck
      include_tasks: tasks/runcheck-docker.yml


    - name: Ensure rustdesk is running
      include_tasks: tasks/docker-start.yml

    - name: Register playbook as installed
      include_tasks: tasks/state-register.yml

  handlers:

    - name: Restart rustdesk
      ansible.builtin.shell: docker compose up -d --force-recreate
      args:
        chdir: /symbios/services/{{ service_name }}

