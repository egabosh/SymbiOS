# docs:
#   name: OpenWrt VM
#   short_description: OpenWrt QEMU/KVM router VM with preconfigured routing, DNS, Tor and VPNs
#   url: "https://openwrt.{{ base_domain }}"
#   description: |
#     Deploys an OpenWrt VM (latest stable release) as a QEMU/KVM router with
#     UEFI boot, serial console and five NICs. The VM owns the .1 / ::1
#     gateway on each internal segment; the host bridges are pure L2.
#
#     Requirements:
#       - KVM base playbook (base-services/kvm.yml)
#       - Traefik base playbook (base-services/traefik.yml)
#
#     Networks:
#       WAN: base-services bridge (192.168.41.201/24) - same L2 as Docker
#       Internal (4 host bridges, pure L2, the VM owns the gateways):
#         - openwrt-lan  (172.18.0.0/24):  VM eth1        = 172.18.0.1
#         - openwrt-iot  (172.18.1.0/24):  VM br-iot      = 172.18.1.1 (bridged; port eth2, OpenVPN tap1 attaches here)
#         - openwrt-tor  (172.18.2.0/24):  VM br-tor      = 172.18.2.1 (bridged; port eth3, OpenVPN tap2 attaches here)
#         - openwrt-misc (172.18.3.0/24):  VM eth4        = 172.18.3.1
#       Every internal segment runs its own dnsmasq/DHCP on the VM and gets a
#       ULA /64 (fd00:18:<n>::/64). Clients set their gateway to 172.18.x.1.
#
#     Preconfiguration (mirrors the linux-setups/openwrt playbooks, adapted
#     to the VM and to OpenWrt 25.x / apk). Three files are injected into the
#     image and run on first boot:
#       - /etc/uci-defaults/98-openwrt-network:  WAN + internal interfaces
#       - /etc/uci-defaults/99-openwrt-preconfig: firewall (wan/lan/iot/tor
#         zones), DHCP/DNS (lan/misc/iot/tor dnsmasq instances, DoH hijack
#         redirects), dnscrypt-proxy(+max) through Tor, Tor + privoxy,
#         bridged OpenVPN servers (1194/1195) incl. easy-rsa + dev2bridge,
#         WireGuard servers (59666/59667), SSH (dropbear 22 lan + 44 wan),
#         remote syslog to the host, avahi mDNS reflector, netboot TFTP,
#         and, when inventory SMTP is set, an msmtp relay.
#       - /etc/hotplug.d/iface/80-openwrt-postconfig + /etc/openwrt-postconfig.sh:
#         online part once the WAN is up (apk package install, WireGuard keys,
#         dh.pem + PKI, service enable/restart, blocklist + netboot first-run).
#
#     Access:
#       Web interface (LuCI): https://openwrt.{{ base_domain }}
#         - Protected by Authelia (2FA)
#         - Credentials: root / password stored in env file
#       Serial console: virsh console openwrt
#       SSH: root@192.168.41.201 (dropbear, lan 22 / internet 44, keys only)
#       OpenVPN: wan UDP 1194 (tor) / 1195 (iot) - bridged into br-tor/br-iot
#       WireGuard: wan UDP 59666 (wg_lan) / 59667 (wg_tor)
#       LAN clients: attach to openwrt-lan, gateway = 172.18.0.1 (VM)
#
#     First boot: 98 + 99 configure everything offline, the postconfig trigger
#     installs packages when the WAN is up (completion marker
#     /etc/openwrt-postconfig.done; on package errors it is retried on the
#     next wan ifup). Blocklists + netboot refresh daily via cron.
#     IPv6: WAN uses a host-detected GUA prefix (::201, gw ::1 via NDP proxy).
#     Disk: {{ vm_disk_gb }} GB (sparse qcow2, rootfs grown at build time).
#
#     Features: This service exposes configurable features via the feature plugin
#     system (services/openwrt-vm/plugin.yml). The remaining features cover only
#     what the build-time preconfig does not hardcode: host-side interfaces/WiFi
#     passthrough and user-specific DynDNS/DHCP/DNS entries. VM-side network
#     features (iot, wireguard, dnscrypt, ssh, logserver, smtp) were removed -
#     they are now baked into the VM at build time. Configure via the WebUI Features tab.
#   author: Oliver Bohlen
#   version: '3.0'
#   license: GPLv3
#   copyright: Copyright (c) 2026, Oliver Bohlen
#   min_ansible_version: '2.11'
#   platforms:
#   - name: Debian
#     versions:
#     - '13'
#   category: Virtualization
#   service_control:
#     services:
#     - name: openwrt
#       type: libvirt
#       status: virsh list --name | grep -q openwrt
#   uninstall:
#     stop: virsh destroy openwrt; virsh undefine openwrt --nvram
#     commands:
#       - rm -f /etc/network/interfaces.d/openwrt-lan /etc/network/interfaces.d/openwrt-iot /etc/network/interfaces.d/openwrt-tor /etc/network/interfaces.d/openwrt-misc
#       - for b in openwrt-lan openwrt-iot openwrt-tor openwrt-misc; do ip link del "$b" 2>/dev/null || true; done
#     program_paths:
#       - /symbios/services/openwrt-vm/
#       - /symbios/runchecks.d/symbios-healthcheck-openwrt-vm.check
#     ldap_groups:
#       - openwrt-vm
#     authelia_blocks:
#       - "openwrt-vm ACCESS CONTROL"
#   actions:
#     start: virsh start openwrt
#     stop: virsh destroy openwrt
#     restart: virsh destroy openwrt; virsh start openwrt
#

---

- name: Deploy OpenWrt KVM virtual machine
  hosts: all

  vars:
    service_name: openwrt-vm
    service_domain: "openwrt.{{ base_domain }}"
    openwrt_version: "latest"
    vm_ram_mb: 512
    vm_vcpus: 2
    service_root: "{{ services_root }}/{{ service_name }}"
    service_port: 80
    # WAN: VM sits on base-services bridge (same L2 as Docker containers)
    vm_ip: "192.168.41.201"
    vm_netmask: "255.255.255.0"
    vm_gateway: "192.168.41.1"
    # Internal networks: the VM owns the .1 / ::1 gateways (mirrors the
    # linux-setups router role). The host bridges are pure L2 (no IPs),
    # so there are no address conflicts between host and VM.
    lan_netmask: "255.255.255.0"
    # VM root filesystem size (sparse qcow2, grown at image build time).
    vm_disk_gb: 5
    # The four internal segments. device = interface inside the VM; the iot
    # and tor segments are bridged (br-iot/br-tor with eth2/eth3 as bridge
    # ports) so the OpenVPN tap devices can be attached later. ip/ip6 are the
    # VM-side gateways; the host bridge carries the same name with no address.
    # tor_ip/tor_ip6 must stay in sync with the tor entry above (used by the
    # nftables tor-routing script).
    tor_ip: "172.18.2.1"
    tor_ip6: "fd00:18:2::1"
    ow_networks:
      - { name: openwrt-lan, bridge: openwrt-lan, device: eth1, uci: lan, ip: "172.18.0.1", ip6: "fd00:18:0::1/64" }
      - { name: openwrt-iot, bridge: openwrt-iot, device: br-iot, bridge_ports: "eth2", uci: iot, ip: "172.18.1.1", ip6: "fd00:18:1::1/64" }
      - { name: openwrt-tor, bridge: openwrt-tor, device: br-tor, bridge_ports: "eth3", uci: tor, ip: "{{ tor_ip }}", ip6: "{{ tor_ip6 }}/64" }
      - { name: openwrt-misc, bridge: openwrt-misc, device: eth4, uci: misc, ip: "172.18.3.1", ip6: "fd00:18:3::1/64" }
    # ── OpenWrt preconfiguration variables (rendered into the first-boot
    #    scripts, see services/openwrt-vm.md + templates/). ────────────────
    openwrt_hostname: "openwrt"
    # zonename = TZ database name; timezone is the POSIX form expected by UCI.
    # The stock OpenWrt (musl) accepts the tzdb name in /etc/TZ too, so both
    # default to the inventory timezone; override openwrt_timezone with a
    # POSIX string (e.g. 'EST5EDT,M3.2.0,M11.1.0') for glibc images.
    openwrt_zonename: "{{ timezone | default('UTC') }}"
    openwrt_timezone: "{{ openwrt_zonename }}"
    openwrt_ntp_servers: "0.openwrt.pool.ntp.org"
    # Upstream resolver for the main lan/misc dnsmasq instance (mirror of the
    # OpenWrt router's dhcp.yml `upstream_dns`): dnscrypt-proxy on 127.0.0.55,
    # which resolves through Tor (socks5://127.0.0.1:9050). The WAN interface
    # resolver and the online postconfig bootstrap use vm_dns instead
    # (network.wan.dns + the temporary resolv.conf during the apk install).
    openwrt_upstream_lan_dns: "127.0.0.55"
    # remote syslog: the VM sends its logs to the host gateway (192.168.41.1)
    openwrt_logserver_ip: "{{ vm_gateway }}"
    # avahi mDNS reflector scope (lan + iot/tor bridges + misc)
    openwrt_internal_interfaces: "eth1 br-iot br-tor eth4"
    # OpenVPN client hostnames baked into the easy-rsa scripts (empty = none)
    openvpn_tor_clients: []
    openvpn_iot_clients: []
    # packages installed by the postconfig via apk/opkg once the WAN is up.
    # Adapted from linux-setups/openwrt (basics minus USB-stick packages,
    # plus the per-service packages); MSMTP is appended when inventory SMTP
    # is configured. kmod packages live in openwrt_kernel_packages because
    # they may not exist on every target/version (soft-fail, logged).
    openwrt_packages:
      - strace
      - rsync
      - tmux
      - htop
      - diffutils
      - bash
      - fdisk
      - bind-host
      - whois
      - coreutils-date
      - openssh-client
      - openssh-keygen
      - vim
      - procps-ng-watch
      - coreutils-nice
      - curl
      - coreutils-df
      - tcpdump
      - e2fsprogs
      - irqbalance
      - telnet-bsd
      - coreutils-base64
      - nano-full
      - less
      - blkid
      - luci-mod-rpc
      - dnscrypt-proxy2
      - tor
      - tor-geoip
      - privoxy
      - openvpn
      - openvpn-easy-rsa
      - avahi-daemon
      - avahi-dbus-daemon
      - avahi-utils
      - wireguard-tools
    openwrt_kernel_packages:
      - kmod-wireguard

  tasks:

    # ── Prerequisites ──────────────────────────────────────────────────
    - name: Check system architecture
      ansible.builtin.command: uname -m
      register: host_arch
      changed_when: false

    - name: Check for hardware virtualization support
      ansible.builtin.command: grep -Ec '(vmx|svm)' /proc/cpuinfo
      register: cpu_virt_check
      changed_when: false
      failed_when: false

    - name: Set architecture facts
      ansible.builtin.set_fact:
        is_arm64: "{{ host_arch.stdout == 'aarch64' }}"
        is_x86_64: "{{ host_arch.stdout == 'x86_64' }}"
        has_hw_virt: "{{ cpu_virt_check.rc == 0 and (cpu_virt_check.stdout | int) > 0 }}"
        kvm_capable: "{{ host_arch.stdout in ['x86_64', 'aarch64'] }}"

    - name: Skip if not KVM-capable
      ansible.builtin.debug:
        msg: "Skipping OpenWrt VM - not a KVM-capable host (arch={{ host_arch.stdout }})"
      when: not kvm_capable | bool

    # ── Resolve OpenWrt version ──────────────────────────────────────────
    - name: Resolve OpenWrt latest version
      ansible.builtin.shell: |
        # Fetch releases page, find latest stable version (no RC/snapshot)
        # Stable versions: 24.10.x, 25.12.x (3 numeric parts, no suffix)
        # Exclude: 24.10.0-rc1, 25.04-rc1, snapshot, etc.
        curl -sf "https://downloads.openwrt.org/releases/" 2>/dev/null \
          | grep -oP 'href="\K[0-9]+\.[0-9]+\.[0-9]+(?=/")' \
          | grep -v '\-rc\|-snapshot\|-dev' \
          | sort -V | tail -1
      register: openwrt_latest_version
      changed_when: false
      when:
        - kvm_capable | bool
        - openwrt_version == "latest"

    - name: Set resolved OpenWrt version
      ansible.builtin.set_fact:
        openwrt_version: "{{ openwrt_latest_version.stdout }}"
      when:
        - kvm_capable | bool
        - openwrt_version == "latest"
        - openwrt_latest_version.stdout | default('') | length > 0

    - name: Fail if OpenWrt version could not be resolved
      ansible.builtin.fail:
        msg: "Could not resolve OpenWrt latest version from downloads.openwrt.org"
      when:
        - kvm_capable | bool
        - openwrt_version == "latest"
        - openwrt_latest_version.stdout | default('') | length == 0

    - name: Show resolved OpenWrt version
      ansible.builtin.debug:
        msg: "Using OpenWrt version {{ openwrt_version }}"
      when: kvm_capable | bool

    # ── Architecture-specific variables ──────────────────────────────────
    - name: Set x86_64 facts
      ansible.builtin.set_fact:
        openwrt_image_url: "https://downloads.openwrt.org/releases/{{ openwrt_version }}/targets/x86/64/openwrt-{{ openwrt_version }}-x86-64-generic-ext4-combined-efi.img.gz"
        openwrt_image_filename: "openwrt-{{ openwrt_version }}-x86-64-generic-ext4-combined-efi.img.gz"
        openwrt_image_decompressed: "openwrt-{{ openwrt_version }}-x86-64.img"
        uefi_code: "/usr/share/OVMF/OVMF_CODE_4M.fd"
        uefi_vars_template: "/usr/share/OVMF/OVMF_VARS_4M.fd"
        vm_arch: "x86_64"
        vm_machine: "q35"
        vm_cpu_model: "host"
        serial_console_device: "ttyS0"
      when:
        - kvm_capable | bool
        - is_x86_64 | bool

    - name: Set ARM64 facts
      ansible.builtin.set_fact:
        openwrt_image_url: "https://downloads.openwrt.org/releases/{{ openwrt_version }}/targets/armsr/armv8/openwrt-{{ openwrt_version }}-armsr-armv8-generic-ext4-combined-efi.img.gz"
        openwrt_image_filename: "openwrt-{{ openwrt_version }}-armsr-armv8-generic-ext4-combined-efi.img.gz"
        openwrt_image_decompressed: "openwrt-{{ openwrt_version }}-armsr-armv8.img"
        uefi_code: "/usr/share/AAVMF/AAVMF_CODE.fd"
        uefi_vars_template: "/usr/share/AAVMF/AAVMF_VARS.fd"
        vm_arch: "aarch64"
        vm_machine: "virt"
        vm_cpu_model: "host-passthrough"
        serial_console_device: "ttyAMA0"
      when:
        - kvm_capable | bool
        - is_arm64 | bool

    # ── Directory structure ──────────────────────────────────────────────
    - name: Create service directory structure
      ansible.builtin.file:
        path: "{{ item.path }}"
        owner: root
        group: kvm
        state: directory
        mode: "{{ item.mode }}"
      loop:
        - { path: "{{ service_root }}", mode: "0750" }
        - { path: "{{ service_root }}/iso", mode: "0755" }
        - { path: "{{ service_root }}/images", mode: "0750" }
        - { path: "{{ service_root }}/ovmf", mode: "0750" }
      when: kvm_capable | bool

    # ── Install dependencies ─────────────────────────────────────────────
    - name: Ensure KVM packages are installed
      ansible.builtin.apt:
        name:
          - qemu-utils
          - parted
          - gdisk
          - e2fsprogs
          - ifupdown
          - bridge-utils
          - "{{ 'qemu-efi-aarch64' if is_arm64 else 'ovmf' }}"
        state: present
        update_cache: yes
        cache_valid_time: 3600
        install_recommends: no
      when: kvm_capable | bool

    # ── Download firmware ────────────────────────────────────────────────
    - name: Check if qcow2 image already exists
      ansible.builtin.stat:
        path: "{{ service_root }}/images/openwrt.qcow2"
      register: qcow2_image
      when: kvm_capable | bool

    - name: Download OpenWrt firmware image
      ansible.builtin.get_url:
        url: "{{ openwrt_image_url }}"
        dest: "{{ service_root }}/iso/{{ openwrt_image_filename }}"
        mode: "0640"
        owner: root
        group: kvm
      when:
        - kvm_capable | bool
        - not qcow2_image.stat.exists | default(false) | bool

    # ── Decompress, patch, convert to qcow2 ─────────────────────────────
    # Patch the raw image before conversion: no nbd module, no write locks.
    # losetup -fP creates partition devices (e.g. /dev/loop0p1, /dev/loop0p2).
    - name: Decompress OpenWrt firmware image
      ansible.builtin.shell: |
        zcat "{{ service_root }}/iso/{{ openwrt_image_filename }}" > "{{ service_root }}/iso/{{ openwrt_image_decompressed }}"
        test -s "{{ service_root }}/iso/{{ openwrt_image_decompressed }}"
      when:
        - kvm_capable | bool
        - not qcow2_image.stat.exists | default(false) | bool

    # ── Detect uplink interface ──────────────────────────────────────────
    # The interface with the default route (used for NAT and IPv6 prefix).
    - name: Detect uplink interface
      ansible.builtin.shell: |
        set -e
        uplink=$(ip route show default | awk '{print $5}' | head -1)
        if [ -z "$uplink" ]; then
          uplink=$(ip -o route get 5.9.164.112 | awk '{for(i=1;i<=NF;i++) if($i=="dev") print $(i+1)}' | head -1)
        fi
        echo "$uplink"
      register: uplink_result
      changed_when: false
      when: kvm_capable | bool

    - name: Set uplink interface fact
      ansible.builtin.set_fact:
        uplink_interface: "{{ uplink_result.stdout }}"
      when:
        - kvm_capable | bool
        - uplink_result.stdout | default('') | length > 0

    - name: Fail if uplink interface not found
      ansible.builtin.fail:
        msg: "Could not detect uplink interface (no default route)"
      when:
        - kvm_capable | bool
        - uplink_interface | default('') | length == 0

    # ── Detect IPv6 prefix from uplink ───────────────────────────────────
    # Extract first 4 groups from the host's global IPv6 address on the uplink.
    - name: Detect IPv6 prefix
      ansible.builtin.shell: |
        set -e
        ip -6 -o addr show dev {{ uplink_interface }} scope global \
          | awk '{print $4}' | cut -d/ -f1 \
          | awk -F: '{OFS=":"; print $1,$2,$3,$4}' \
          | head -1
      register: ipv6_prefix_result
      changed_when: false
      failed_when: false
      when: kvm_capable | bool

    - name: Set IPv6 prefix fact
      ansible.builtin.set_fact:
        host_ipv6_prefix: "{{ ipv6_prefix_result.stdout }}"
        host_ipv6_available: "{{ ipv6_prefix_result.stdout | default('') | length > 0 }}"
      when: kvm_capable | bool

    - name: Show IPv6 prefix
      ansible.builtin.debug:
        msg: "IPv6 prefix: {{ host_ipv6_prefix }}::/64 on {{ uplink_interface }}"
      when:
        - kvm_capable | bool
        - host_ipv6_available | bool

    # ── DNS for the VM ───────────────────────────────────────────────────
    # The VM sits on the base-services bridge (192.168.41.0/24) with NAT.
    # The host's DHCP DNS (FRITZ!Box 192.168.188.1) is reachable via NAT.
    # Digitalcourage DNS is DoT (port 853) and cannot be used as plain nameserver.
    - name: Detect host DNS server
      ansible.builtin.shell: |
        set -e
        # Get all DNS servers from resolvectl, prefer IPv4 on the host LAN
        CANDIDATES=$(resolvectl status 2>/dev/null \
          | grep "DNS Servers:" \
          | sed 's/.*DNS Servers: //' \
          | tr ' ' '\n' \
          | grep -v '^$' \
          | grep ':' --invert-match \
          | sort -u)
        for srv in $CANDIDATES; do
          echo "$srv"
          exit 0
        done
        # Fallback: first DNS from any interface
        resolvectl status 2>/dev/null \
          | grep "DNS Server" \
          | awk '{print $NF}' \
          | head -1
      register: dns_result
      changed_when: false
      failed_when: false
      when: kvm_capable | bool

    - name: Set DNS server fact
      ansible.builtin.set_fact:
        vm_dns: "{{ dns_result.stdout | default('192.168.188.1') }}"
      when: kvm_capable | bool

    - name: Show DNS server
      ansible.builtin.debug:
        msg: "VM DNS server: {{ vm_dns }} (host DHCP DNS via NAT)"
      when: kvm_capable | bool

    # ── Root password generation ────────────────────────────────────────
    - name: /symbios/services/openwrt-vm/genpw.sh (generate random root PW for OpenWrt VM)
      ansible.builtin.blockinfile:
        path: /symbios/services/openwrt-vm/genpw.sh
        create: yes
        mode: "0550"
        owner: root
        group: root
        marker: "# {mark} ANSIBLE MANAGED BLOCK"
        block: |
          cd /symbios/services/openwrt-vm

          g_openwrtrootpw=$(pwgen -s 32 1)

          [ -f env ] || echo "OPENWRT_ROOT_PASSWORD=!PLACEHOLDER!" > env
          chmod 440 env
          chown root:root env
          sed -i "s/\!PLACEHOLDER\!/$g_openwrtrootpw/g" env
        backup: yes
        validate: /bin/bash -n %s

    - name: genpw.sh shebang
      ansible.builtin.lineinfile:
        path: /symbios/services/openwrt-vm/genpw.sh
        insertbefore: BOF
        line: "#!/bin/bash -e"

    - name: Generate OpenWrt root password if not exists
      ansible.builtin.shell: ./genpw.sh
      args:
        chdir: /symbios/services/openwrt-vm
        creates: /symbios/services/openwrt-vm/env
      no_log: true

    - name: Read generated OpenWrt root password
      ansible.builtin.shell: grep OPENWRT_ROOT_PASSWORD /symbios/services/openwrt-vm/env | cut -d= -f2
      register: openwrt_root_password_raw
      changed_when: false
      no_log: true

    - name: Compute SHA-512 hash of OpenWrt root password
      ansible.builtin.shell: openssl passwd -6 -salt "$(openssl rand -hex 16)" "{{ openwrt_root_password_raw.stdout }}"
      register: openwrt_root_password_hash
      changed_when: false
      no_log: true

    # Render the first-boot scripts to /tmp (they are injected into the image
    # below). Jinja renders them from services/openwrt-vm/templates/.
    - name: Render uci-defaults 98-openwrt-network script
      ansible.builtin.template:
        src: openwrt-vm/templates/openwrt-uci-network.j2
        dest: /tmp/ow-uci-network
        mode: "0755"
      when: kvm_capable | bool

    - name: Render uci-defaults 99-openwrt-preconfig script
      ansible.builtin.template:
        src: openwrt-vm/templates/openwrt-uci-preconfig.j2
        dest: /tmp/ow-uci-preconfig
        mode: "0755"
      when: kvm_capable | bool

    - name: Render postconfig hotplug trigger
      ansible.builtin.template:
        src: openwrt-vm/templates/openwrt-postconfig-trigger.j2
        dest: /tmp/ow-postconfig-trigger
        mode: "0644"
      when: kvm_capable | bool

    - name: Render /etc/openwrt-postconfig.sh
      ansible.builtin.template:
        src: openwrt-vm/templates/openwrt-postconfig.j2
        dest: /tmp/ow-postconfig
        mode: "0755"
      when: kvm_capable | bool

    # Patch raw image: GRUB serial console + first-boot scripts + credentials
    - name: Patch raw image (serial console + uci-defaults + postconfig + credentials)
      ansible.builtin.shell: |
        set -e
        RAW="{{ service_root }}/iso/{{ openwrt_image_decompressed }}"

        # Grow the raw image file to the requested disk size. The filesystem
        # and rootfs partition (p2) are grown below to fill the whole disk,
        # so the resulting qcow2 presents vm_disk_gb GB to the VM.
        truncate -s {{ vm_disk_gb }}G "$RAW"

        # Attach raw image to loop device with partition scanning
        LOOP=$(losetup -fP --show "$RAW")
        echo "Loop device: $LOOP"

        # Wait for partition devices to appear
        sleep 2
        for i in $(seq 1 10); do
          [ -b "${LOOP}p1" ] && [ -b "${LOOP}p2" ] && break
          sleep 1
        done
        if [ ! -b "${LOOP}p1" ]; then
          losetup -d "$LOOP"
          echo "ERROR: Partition devices not found on $LOOP"
          exit 1
        fi

        # --- Grow rootfs partition (p2) + filesystem to full disk size ---
        # After truncate the backup GPT is no longer at the end of the disk.
        # sgdisk -e relocates it, then parted can resize non-interactively.
        sgdisk -e "$LOOP"
        parted -s "$LOOP" resizepart 2 100%
        partprobe "$LOOP" 2>/dev/null || partx -u "$LOOP"
        e2fsck -fy "${LOOP}p2" >/dev/null 2>&1 || true
        resize2fs "${LOOP}p2" >/dev/null
        echo "rootfs-grown"

        # --- Patch GRUB for serial console ---
        mkdir -p /tmp/ow-mount
        mount "${LOOP}p1" /tmp/ow-mount
        if grep -q "console={{ serial_console_device }}" /tmp/ow-mount/EFI/openwrt/grub.cfg
        then
          echo "GRUB already patched"
        else
          sed -i "s/console=tty1/console={{ serial_console_device }},115200n8/g" \
            /tmp/ow-mount/EFI/openwrt/grub.cfg
          echo "GRUB patched"
        fi
        cat /tmp/ow-mount/EFI/openwrt/grub.cfg
        umount /tmp/ow-mount

        # --- Patch root filesystem (p2): first-boot scripts + credentials ---
        mkdir -p /tmp/ow-mount
        mount "${LOOP}p2" /tmp/ow-mount

        # Inject the first-boot scripts (98 network, 99 preconfig, postconfig
        # hotplug trigger + main script). Always overwrite so a previously
        # baked raw image gets the current templates (no stale first-boot
        # config from an older build).
        for f in \
          98-openwrt-network:/tmp/ow-uci-network \
          99-openwrt-preconfig:/tmp/ow-uci-preconfig
        do
          NAME="${f%%:*}"; SRC="${f#*:}"
          mkdir -p /tmp/ow-mount/etc/uci-defaults
          cp "$SRC" "/tmp/ow-mount/etc/uci-defaults/$NAME"
          chmod 755 "/tmp/ow-mount/etc/uci-defaults/$NAME"
          echo "uci-defaults injected: $NAME"
        done
        mkdir -p /tmp/ow-mount/etc/hotplug.d/iface
        cp /tmp/ow-postconfig-trigger /tmp/ow-mount/etc/hotplug.d/iface/80-openwrt-postconfig
        chmod 644 /tmp/ow-mount/etc/hotplug.d/iface/80-openwrt-postconfig
        echo "postconfig trigger injected"
        cp /tmp/ow-postconfig /tmp/ow-mount/etc/openwrt-postconfig.sh
        chmod 755 /tmp/ow-mount/etc/openwrt-postconfig.sh
        echo "openwrt-postconfig.sh injected"

        # Set root password in /etc/shadow (pre-computed SHA-512 hash).
        # Applied unconditionally so a re-baked image always matches the env
        # file even if a previous bake already hashed a different password.
        # Full 9-field shadow line required by shadow-utils/login:
        # login:passwd:lastchg:min:max:warn:inactive:expire:flag
        # The default factory line is root::0:0:99999:7::: so we must keep
        # the extra min-age field (0) or LuCI/auth cannot parse the entry.
        sed -i '1s|^root:.*|root:{{ openwrt_root_password_hash.stdout }}:0:0:99999:7:::|' \
          /tmp/ow-mount/etc/shadow
        echo "root password set"

        # Deploy host SSH public key (idempotent overwrite)
        mkdir -p /tmp/ow-mount/etc/dropbear
        cat > /tmp/ow-mount/etc/dropbear/authorized_keys << 'SSHEOF'
        {{ lookup('file', '/root/.ssh/id_ed25519.pub') }}
        SSHEOF
        chmod 600 /tmp/ow-mount/etc/dropbear/authorized_keys
        echo "SSH key deployed"

        umount /tmp/ow-mount
        rmdir /tmp/ow-mount || true

        # Detach loop device
        losetup -d "$LOOP"
        echo "image-patched"
      register: image_patch_result
      changed_when: "'GRUB patched' in image_patch_result.stdout or 'uci-defaults injected' in image_patch_result.stdout or 'postconfig trigger injected' in image_patch_result.stdout or 'openwrt-postconfig.sh injected' in image_patch_result.stdout or 'root password set' in image_patch_result.stdout or 'SSH key deployed' in image_patch_result.stdout or 'rootfs-grown' in image_patch_result.stdout"
      when:
        - kvm_capable | bool
        - not qcow2_image.stat.exists | default(false) | bool

    # Convert patched raw image to qcow2
    - name: Convert raw image to qcow2
      ansible.builtin.shell: |
        qemu-img convert -f raw -O qcow2 \
          "{{ service_root }}/iso/{{ openwrt_image_decompressed }}" \
          "{{ service_root }}/images/openwrt.qcow2"
        test -s "{{ service_root }}/images/openwrt.qcow2"
      when:
        - kvm_capable | bool
        - not qcow2_image.stat.exists | default(false) | bool

    # ── Set file permissions ─────────────────────────────────────────────
    # libvirt-qemu (uid 64055, kvm group member) needs to traverse the path.
    - name: Ensure openwrt-vm path is traversable by libvirt
      ansible.builtin.shell: |
        set -e
        for dir in /symbios /symbios/services {{ service_root }} {{ service_root }}/images {{ service_root }}/ovmf
        do
          # Grant libvirt-qemu (kvm group member) execute permission to traverse
          setfacl -m u:libvirt-qemu:x "$dir" 2>/dev/null || true
          # Also ensure kvm group has execute
          chmod g+x "$dir" 2>/dev/null || true
        done
        echo "acl-ok"
      register: acl_result
      changed_when: "'acl-ok' in acl_result.stdout"
      when: kvm_capable | bool

    - name: Set ownership and permissions on qcow2 image
      ansible.builtin.file:
        path: "{{ service_root }}/images/openwrt.qcow2"
        owner: root
        group: kvm
        mode: "0660"
      when: kvm_capable | bool

    # ── OVMF/UEFI firmware variables ────────────────────────────────────
    - name: Copy UEFI VARS template for new VM
      ansible.builtin.copy:
        src: "{{ uefi_vars_template }}"
        dest: "{{ service_root }}/ovmf/OVMF_VARS.fd"
        remote_src: yes
        owner: root
        group: kvm
        mode: "0640"
      when: kvm_capable | bool

    # ── Host bridges (ifupdown, pure L2) ─────────────────────────────────
    # The four internal segments are Linux bridges managed via ifupdown so
    # they persist across reboots. They are pure L2: the VM owns the .1 / ::1
    # gateway on every segment (controller-role split, mirrors linux-setups).
    # libvirt networks would drop the <ipv6> element for isolated bridges, so
    # we configure the bridges directly here. VM NICs attach to them via
    # <interface type='bridge'>.

    # Remove legacy libvirt network definitions (migrated to ifupdown).
    - name: Remove legacy OpenWrt libvirt networks
      ansible.builtin.shell: |
        set -e
        N="{{ item.name }}"
        if virsh net-info "$N" >/dev/null 2>&1; then
          virsh net-destroy "$N" 2>/dev/null || true
          virsh net-undefine "$N" 2>/dev/null || true
          echo "legacy-network-removed: $N"
        else
          echo "no-legacy-network: $N"
        fi
      loop: "{{ ow_networks }}"
      register: ow_net_cleanup
      changed_when: "'legacy-network-removed' in ow_net_cleanup.stdout"
      when: kvm_capable | bool

    # Write ifupdown bridge config for each internal segment (no addresses -
    # the VM is the gateway on the segment, the Linux bridge is just a switch).
    - name: Write pure-L2 ifupdown bridge config for OpenWrt networks
      ansible.builtin.copy:
        dest: "/etc/network/interfaces.d/{{ item.name }}"
        content: |
          auto {{ item.bridge }}
          iface {{ item.bridge }} inet manual
              bridge_ports none
              bridge_stp off
              bridge_fd 0
              post-up /usr/sbin/sysctl -w "net.ipv6.conf.{{ item.bridge }}.disable_ipv6=0" >/dev/null 2>&1 || true
          iface {{ item.bridge }} inet6 manual
              accept_ra 0
              autoconf 0
        owner: root
        group: root
        mode: "0644"
      loop: "{{ ow_networks }}"
      when: kvm_capable | bool

    # Ensure ifupdown reads the per-bridge files in interfaces.d.
    - name: Ensure /etc/network/interfaces sources OpenWrt bridges
      ansible.builtin.blockinfile:
        path: /etc/network/interfaces
        marker: "# {mark} ANSIBLE MANAGED BLOCK openwrt-vm-bridges"
        insertafter: EOF
        block: |
          source /etc/network/interfaces.d/*
      when: kvm_capable | bool

    # Bring the bridges up. ifupdown (bridge-ports) creates each bridge; the
    # VM connects at boot and the IPv6 link-local is enough for NDP routing.
    - name: Bring up OpenWrt bridges (ifupdown)
      ansible.builtin.shell: |
        set -e
        for b in openwrt-lan openwrt-iot openwrt-tor openwrt-misc; do
          ifup "$b" 2>/dev/null || true
        done
        echo "bridges-up"
      register: ow_bridges_up
      changed_when: false
      when: kvm_capable | bool

    # ── UFW: NAT and route forwarding ────────────────────────────────────
    # MASQUERADE traffic from base-services to uplink (VM internet access).
    - name: UFW NAT masquerade for VM internet access
      ansible.builtin.shell: |
        set -e
        RULE="-A POSTROUTING -s 192.168.41.0/24 ! -d 192.168.41.0/24 -j MASQUERADE # openwrt-vm-masquerade"
        if grep -q "openwrt-vm-masquerade" /etc/ufw/before.rules; then
          echo "nat-rule-exists"
        elif grep -q '^\*nat' /etc/ufw/before.rules; then
          LAST_COMMIT=$(grep -n '^COMMIT' /etc/ufw/before.rules | tail -1 | cut -d: -f1)
          if [ -n "$LAST_COMMIT" ]; then
            sed -i "${LAST_COMMIT}i $RULE" /etc/ufw/before.rules
            echo "nat-rule-added"
          fi
        else
          printf '\n*nat\n:PREROUTING ACCEPT [0:0]\n:POSTROUTING ACCEPT [0:0]\n%s\nCOMMIT\n' "$RULE" \
            >> /etc/ufw/before.rules
          echo "nat-section-added"
        fi
      register: ufw_nat_result
      changed_when: "'nat-rule-added' in ufw_nat_result.stdout or 'nat-section-added' in ufw_nat_result.stdout"
      when: kvm_capable | bool

    # Allow routed traffic between base-services and uplink.
    - name: UFW route allow base-services to uplink
      ansible.builtin.shell: |
        ufw route allow in on base-services out on {{ uplink_interface }} 2>/dev/null
        ufw route allow in on {{ uplink_interface }} out on base-services 2>/dev/null
        echo "route-rules-ok"
      register: ufw_route_result
      changed_when: false
      when: kvm_capable | bool

    # ── nftables: IPv6 NAT and forwarding ────────────────────────────────
    # IPv6 masquerade for VM internet access (ip6table_nat backend).
    - name: IPv6 NAT masquerade for VM
      ansible.builtin.shell: |
        set -e
        PREFIX="{{ host_ipv6_prefix }}"
        [ -z "$PREFIX" ] && exit 0
        ip6tables -t nat -C POSTROUTING -s "$PREFIX::/64" ! -d "$PREFIX::/64" -j MASQUERADE 2>/dev/null \
          || ip6tables -t nat -A POSTROUTING -s "$PREFIX::/64" ! -d "$PREFIX::/64" -j MASQUERADE
        echo "ipv6-nat-ok"
      register: ipv6_nat_result
      changed_when: false
      when:
        - kvm_capable | bool
        - host_ipv6_available | bool

    # Allow IPv6 forwarding between base-services and uplink.
    - name: IPv6 forwarding rules for VM
      ansible.builtin.shell: |
        set -e
        UP="{{ uplink_interface }}"
        ip6tables -C FORWARD -i base-services -o "$UP" -j ACCEPT 2>/dev/null \
          || ip6tables -I FORWARD -i base-services -o "$UP" -j ACCEPT
        ip6tables -C FORWARD -i "$UP" -o base-services -m state --state RELATED,ESTABLISHED -j ACCEPT 2>/dev/null \
          || ip6tables -I FORWARD -i "$UP" -o base-services -m state --state RELATED,ESTABLISHED -j ACCEPT
        echo "ipv6-forward-ok"
      register: ipv6_fwd_result
      changed_when: false
      when:
        - kvm_capable | bool
        - host_ipv6_available | bool

    # ── IPv6 host route for VM ───────────────────────────────────────────
    # /128 host route on base-services overrides ISP's /64 on uplink
    # (metric 100 on uplink vs more-specific /128 wins).
    - name: Add IPv6 host route for VM on base-services
      ansible.builtin.shell: |
        set -e
        PREFIX="{{ host_ipv6_prefix }}"
        [ -z "$PREFIX" ] && exit 0
        ip -6 route replace "$PREFIX::201/128" dev base-services
        echo "ipv6-route-ok"
      register: ipv6_route_result
      changed_when: false
      when:
        - kvm_capable | bool
        - host_ipv6_available | bool

    # ── NDP proxy for VM gateway ─────────────────────────────────────────
    # The VM's default gateway is $PREFIX::1 (host's GUA on uplink), but
    # the VM sits on the base-services bridge where nobody owns that
    # address.  Without NDP proxying the VM cannot resolve the gateway's
    # MAC and all IPv6 traffic dies at layer-2.  The proxy entry makes the
    # host answer NDP for ::1 on the bridge.
    - name: Enable proxy_ndp sysctl for VM
      ansible.posix.sysctl:
        name: "{{ item }}"
        value: "1"
        sysctl_set: yes
        state: present
        reload: yes
      loop:
        - net.ipv6.conf.all.proxy_ndp
        - "net.ipv6.conf.{{ bridge_name | default('base-services') }}.proxy_ndp"
      when:
        - kvm_capable | bool
        - host_ipv6_available | bool

    - name: NDP proxy for VM gateway on base-services
      ansible.builtin.shell: |
        set -e
        PREFIX="{{ host_ipv6_prefix }}"
        [ -z "$PREFIX" ] && exit 0
        ip -6 neigh add proxy "$PREFIX::1" dev base-services 2>/dev/null || \
          ip -6 neigh replace "$PREFIX::1" dev base-services nud permanent
        echo "ndp-proxy-ok"
      register: ndp_proxy_result
      changed_when: false
      when:
        - kvm_capable | bool
        - host_ipv6_available | bool

    # Persist the route and NDP proxy across reboots.
    - name: Persist IPv6 host route, NDP proxy and ip6tables for VM
      ansible.builtin.copy:
        dest: /etc/network/if-up.d/openwrt-vm-ipv6-route
        mode: "0755"
        content: |
          #!/bin/bash
          # IPv6 setup for openwrt VM on base-services bridge:
          # - /128 host route (more-specific overrides ISP /64)
          # - NDP proxy for gateway (::1) on the bridge
          # - NAT66 masquerade + FORWARD rules
          PREFIX="{{ host_ipv6_prefix }}"
          UP="{{ uplink_interface }}"
          BR="{{ bridge_name | default('base-services') }}"
          [ -z "$PREFIX" ] && exit 0
          # Enable proxy_ndp on the bridge interface
          sysctl -w "net.ipv6.conf.${BR}.proxy_ndp=1" >/dev/null
          # Host route
          ip -6 route replace "$PREFIX::201/128" dev "$BR"
          # NDP proxy: host answers for $PREFIX::1 (gateway) on the bridge
          ip -6 neigh add proxy "$PREFIX::1" dev "$BR" 2>/dev/null || \
            ip -6 neigh replace "$PREFIX::1" dev "$BR" 2>/dev/null
          # NAT66 masquerade
          ip6tables -t nat -C POSTROUTING -s "$PREFIX::/64" ! -d "$PREFIX::/64" -j MASQUERADE 2>/dev/null || \
            ip6tables -t nat -A POSTROUTING -s "$PREFIX::/64" ! -d "$PREFIX::/64" -j MASQUERADE
          # FORWARD rules
          ip6tables -C FORWARD -i "$BR" -o "$UP" -j ACCEPT 2>/dev/null || \
            ip6tables -I FORWARD -i "$BR" -o "$UP" -j ACCEPT
          ip6tables -C FORWARD -i "$UP" -o "$BR" -m state --state RELATED,ESTABLISHED -j ACCEPT 2>/dev/null || \
            ip6tables -I FORWARD -i "$UP" -o "$BR" -m state --state RELATED,ESTABLISHED -j ACCEPT
      when:
        - kvm_capable | bool
        - host_ipv6_available | bool

    # ── Ensure libvirtd is running ───────────────────────────────────────
    - name: Ensure libvirtd is started and enabled
      ansible.builtin.service:
        name: libvirtd
        state: started
        enabled: yes
      when: kvm_capable | bool

    # ── Check if VM already exists ───────────────────────────────────────
    - name: Check if openwrt VM already exists
      ansible.builtin.command: virsh dominfo openwrt
      register: vm_dominfo
      changed_when: false
      failed_when: false
      when: kvm_capable | bool

    # ── Create VM ────────────────────────────────────────────────────────
    # Define VM via libvirt XML.
    # NIC1: base-services bridge (same L2 as Docker, Traefik, Authelia) = WAN
    # NIC2: openwrt-lan (VM owns 172.18.0.1, pure-L2 host bridge) = eth1
    # NIC3: openwrt-iot (VM br-iot: 172.18.1.1, OpenVPN tap1) = eth2
    # NIC4: openwrt-tor (VM br-tor: 172.18.2.1, OpenVPN tap2) = eth3
    # NIC5: openwrt-misc (VM owns 172.18.3.1, pure-L2 host bridge) = eth4
    - name: Define OpenWrt VM
      ansible.builtin.shell: |
        cat > /tmp/openwrt-vm.xml << 'XMLEOF'
        <domain type='kvm'>
          <name>openwrt</name>
          <memory unit='MiB'>{{ vm_ram_mb }}</memory>
          <vcpu>{{ vm_vcpus }}</vcpu>
          <os>
            <type arch='{{ vm_arch }}' machine='{{ vm_machine }}'>hvm</type>
            <loader readonly='yes' type='pflash'>{{ uefi_code }}</loader>
            <nvram>{{ service_root }}/ovmf/OVMF_VARS.fd</nvram>
          </os>
          <features>
            {% if vm_arch == 'aarch64' %}
            <acpi state='off'/>
            {% endif %}
          </features>
          <cpu mode='{{ vm_cpu_model }}'/>
          <clock offset='utc'/>
          <devices>
            <disk type='file' device='disk'>
              <driver name='qemu' type='qcow2' cache='none' io='native'/>
              <source file='{{ service_root }}/images/openwrt.qcow2'/>
              <target dev='vda' bus='virtio'/>
            </disk>
            <interface type='bridge'>
              <source bridge='base-services'/>
              <model type='virtio'/>
              <rom bar='off'/>
            </interface>
            <interface type='bridge'>
              <source bridge='openwrt-lan'/>
              <model type='virtio'/>
              <rom bar='off'/>
            </interface>
            <interface type='bridge'>
              <source bridge='openwrt-iot'/>
              <model type='virtio'/>
              <rom bar='off'/>
            </interface>
            <interface type='bridge'>
              <source bridge='openwrt-tor'/>
              <model type='virtio'/>
              <rom bar='off'/>
            </interface>
            <interface type='bridge'>
              <source bridge='openwrt-misc'/>
              <model type='virtio'/>
              <rom bar='off'/>
            </interface>
            <serial type='pty'>
              <target port='0'/>
            </serial>
          </devices>
        </domain>
        XMLEOF
        virsh define /tmp/openwrt-vm.xml
        rm -f /tmp/openwrt-vm.xml
        echo "vm-defined"
      register: vm_define
      changed_when: "'vm-defined' in vm_define.stdout"
      when:
        - kvm_capable | bool
        - vm_dominfo.rc | default(1) != 0

    - name: Ensure OpenWrt VM is running
      ansible.builtin.shell: |
        if virsh list --state-running --name | grep -qx openwrt; then
          echo "vm-already-running"
        else
          if virsh start openwrt; then
            echo "vm-started"
          else
            echo "vm-start-failed"
            exit 1
          fi
        fi
      register: vm_start
      changed_when: "'vm-started' in vm_start.stdout"
      when: kvm_capable | bool

    # ── Traefik integration ──────────────────────────────────────────────
    # Traefik file-provider route for LuCI (Authelia-protected)
    - name: Create LDAP group for openwrt-vm access control
      include_tasks: tasks/ldap-single-group.yml

    - name: Write Authelia access_control for openwrt-vm group restriction
      include_tasks: tasks/authelia-acl.yml
      vars:
        authelia_policy: "{{ 'two_factor' if (twofa_enabled | default(false) | bool) else 'one_factor' }}"
        authelia_subjects:
          - "group:openwrt-vm"

    - name: /symbios/base-services/traefik/providers/openwrt-vm.yml Traefik routing
      ansible.builtin.blockinfile:
        path: /symbios/base-services/traefik/providers/openwrt-vm.yml
        create: yes
        mode: "0444"
        owner: root
        group: docker
        marker: "# {mark} ANSIBLE MANAGED BLOCK"
        block: |
          http:
            routers:
              openwrt-vm:
                rule: "Host(`{{ service_domain }}`)"
                service: openwrt-vm
                entryPoints:
                  - "https"
                tls:
                  certResolver: {{ acme_resolver }}
                middlewares:
                  - "secHeaders@file"
                  - "authelia@file"
            services:
              openwrt-vm:
                loadBalancer:
                  servers:
                    - url: "http://{{ vm_ip }}:{{ service_port }}"
        backup: yes
      when: kvm_capable | bool

    # ── Healthcheck ──────────────────────────────────────────────────────
    - name: "{{ data_root }}/runchecks.d/symbios-healthcheck-openwrt-vm.check"
      ansible.builtin.blockinfile:
        path: "{{ data_root }}/runchecks.d/symbios-healthcheck-openwrt-vm.check"
        mode: "0400"
        owner: root
        group: root
        create: yes
        marker: "# {mark} ANSIBLE MANAGED BLOCK"
        block: |
          CHECK_CATEGORY="services"
          CHECK_TITLE="openwrt-vm"
          CHECK_DESC="Healthcheck for the openwrt-vm service."
          CHECK_DETAIL="Verifies that the openwrt VM is running via virsh.|VM not running marks the check as failed."
          g_check_file="${g_tmp}/symbios-healthcheck-openwrt-vm"
          if [ -f "$g_check_file" ] && find "$g_check_file" -mmin -5 | grep -q "$g_check_file"
          then
            return 2>/dev/null || true
          fi
          date > "$g_check_file"
          if ! virsh list --name | grep -q openwrt
          then
            g_echo_error "Healthcheck failed for openwrt-vm: VM not running"
          fi
        backup: yes
        validate: /bin/bash -n %s
      when: kvm_capable | bool

    # ── Register playbook ────────────────────────────────────────────────
    - name: Register playbook as installed
      include_tasks: tasks/state-register.yml
      when: kvm_capable | bool

  handlers:
    - name: Restart authelia
      ansible.builtin.shell: docker compose restart
      args:
        chdir: /symbios/base-services/authelia