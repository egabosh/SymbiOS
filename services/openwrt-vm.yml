# docs:
#   name: OpenWrt VM
#   short_description: OpenWrt QEMU/KVM virtual machine with Traefik access
#   description: |
#     Deploys an OpenWrt VM (latest stable release) as a QEMU/KVM virtual
#     machine with UEFI boot, serial console, and two NICs.
#
#     Requirements:
#       - KVM base playbook (base-services/kvm.yml)
#       - Traefik base playbook (base-services/traefik.yml)
#
#     Networks:
#       WAN: base-services bridge (192.168.41.201/24) - same L2 as Docker containers
#       LAN: isolated bridge (172.18.0.0/24) - OpenWrt acts as gateway
#
#     Access:
#       Web interface (LuCI): https://openwrt.{{ base_domain }}
#         - Protected by Authelia (2FA)
#         - Default credentials: root / no password (set one via LuCI)
#       Serial console: virsh console openwrt
#       LAN clients: attach to openwrt-lan network for DHCP + internet
#
#     First boot: The VM auto-configures WAN (192.168.41.201) and LAN (172.18.0.1)
#     via uci-defaults. IPv6 is configured by an init script that detects the
#     host's prefix and assigns a static address. Access LuCI through Traefik
#     to finish setup.
#   author: Oliver Bohlen
#   version: '2.0'
#   license: GPLv3
#   copyright: Copyright (c) 2026, Oliver Bohlen
#   min_ansible_version: '2.11'
#   platforms:
#   - name: Debian
#     versions:
#     - '13'
#   category: Virtualization
#   service_control:
#     services:
#     - name: openwrt
#       type: libvirt
#       status: virsh list --name | grep -q openwrt
#   uninstall:
#     stop: virsh destroy openwrt; virsh undefine openwrt --nvram
#     restart: virsh destroy openwrt; virsh start openwrt
#     program_paths:
#       - /symbios/services/openwrt-vm/
#   actions:
#     start: virsh start openwrt
#     stop: virsh destroy openwrt
#     restart: virsh destroy openwrt; virsh start openwrt
#

---

- name: Deploy OpenWrt KVM virtual machine
  hosts: all

  vars:
    service_name: openwrt-vm
    service_domain: "openwrt.{{ base_domain }}"
    openwrt_version: "latest"
    vm_ram_mb: 512
    vm_vcpus: 2
    service_root: "{{ services_root }}/{{ service_name }}"
    service_port: 80
    # WAN: VM sits on base-services bridge (same L2 as Docker containers)
    vm_ip: "192.168.41.201"
    vm_netmask: "255.255.255.0"
    vm_gateway: "192.168.41.1"
    vm_dns: "192.168.41.2"
    # LAN: isolated, OpenWrt is the gateway
    lan_subnet: "172.18.0"
    lan_netmask: "255.255.255.0"
    lan_host_ip: "172.18.0.1"

  tasks:

    # ── Prerequisites ──────────────────────────────────────────────────
    - name: Check system architecture
      ansible.builtin.command: uname -m
      register: host_arch
      changed_when: false

    - name: Check for hardware virtualization support
      ansible.builtin.command: grep -Ec '(vmx|svm)' /proc/cpuinfo
      register: cpu_virt_check
      changed_when: false
      failed_when: false

    - name: Set architecture facts
      ansible.builtin.set_fact:
        is_arm64: "{{ host_arch.stdout == 'aarch64' }}"
        is_x86_64: "{{ host_arch.stdout == 'x86_64' }}"
        has_hw_virt: "{{ cpu_virt_check.rc == 0 and (cpu_virt_check.stdout | int) > 0 }}"
        kvm_capable: "{{ host_arch.stdout in ['x86_64', 'aarch64'] }}"

    - name: Skip if not KVM-capable
      ansible.builtin.debug:
        msg: "Skipping OpenWrt VM - not a KVM-capable host (arch={{ host_arch.stdout }})"
      when: not kvm_capable | bool

    # ── Resolve OpenWrt version ──────────────────────────────────────────
    - name: Resolve OpenWrt latest version
      ansible.builtin.shell: |
        # Fetch releases page, find latest stable version (no RC/snapshot)
        # Stable versions: 24.10.x, 25.12.x (3 numeric parts, no suffix)
        # Exclude: 24.10.0-rc1, 25.04-rc1, snapshot, etc.
        curl -sf "https://downloads.openwrt.org/releases/" 2>/dev/null \
          | grep -oP 'href="\K[0-9]+\.[0-9]+\.[0-9]+(?=/")' \
          | grep -v '\-rc\|-snapshot\|-dev' \
          | sort -V | tail -1
      register: openwrt_latest_version
      changed_when: false
      when:
        - kvm_capable | bool
        - openwrt_version == "latest"

    - name: Set resolved OpenWrt version
      ansible.builtin.set_fact:
        openwrt_version: "{{ openwrt_latest_version.stdout }}"
      when:
        - kvm_capable | bool
        - openwrt_version == "latest"
        - openwrt_latest_version.stdout | default('') | length > 0

    - name: Fail if OpenWrt version could not be resolved
      ansible.builtin.fail:
        msg: "Could not resolve OpenWrt latest version from downloads.openwrt.org"
      when:
        - kvm_capable | bool
        - openwrt_version == "latest"
        - openwrt_latest_version.stdout | default('') | length == 0

    - name: Show resolved OpenWrt version
      ansible.builtin.debug:
        msg: "Using OpenWrt version {{ openwrt_version }}"
      when: kvm_capable | bool

    # ── Architecture-specific variables ──────────────────────────────────
    - name: Set x86_64 facts
      ansible.builtin.set_fact:
        openwrt_image_url: "https://downloads.openwrt.org/releases/{{ openwrt_version }}/targets/x86/64/openwrt-{{ openwrt_version }}-x86-64-generic-ext4-combined-efi.img.gz"
        openwrt_image_filename: "openwrt-{{ openwrt_version }}-x86-64-generic-ext4-combined-efi.img.gz"
        openwrt_image_decompressed: "openwrt-{{ openwrt_version }}-x86-64.img"
        uefi_code: "/usr/share/OVMF/OVMF_CODE_4M.fd"
        uefi_vars_template: "/usr/share/OVMF/OVMF_VARS_4M.fd"
        vm_arch: "x86_64"
        vm_machine: "q35"
        vm_cpu_model: "host"
        serial_console_device: "ttyS0"
      when:
        - kvm_capable | bool
        - is_x86_64 | bool

    - name: Set ARM64 facts
      ansible.builtin.set_fact:
        openwrt_image_url: "https://downloads.openwrt.org/releases/{{ openwrt_version }}/targets/armsr/armv8/openwrt-{{ openwrt_version }}-armsr-armv8-generic-ext4-combined-efi.img.gz"
        openwrt_image_filename: "openwrt-{{ openwrt_version }}-armsr-armv8-generic-ext4-combined-efi.img.gz"
        openwrt_image_decompressed: "openwrt-{{ openwrt_version }}-armsr-armv8.img"
        uefi_code: "/usr/share/AAVMF/AAVMF_CODE.fd"
        uefi_vars_template: "/usr/share/AAVMF/AAVMF_VARS.fd"
        vm_arch: "aarch64"
        vm_machine: "virt"
        vm_cpu_model: "host-passthrough"
        serial_console_device: "ttyAMA0"
      when:
        - kvm_capable | bool
        - is_arm64 | bool

    # ── Directory structure ──────────────────────────────────────────────
    - name: Create service directory structure
      ansible.builtin.file:
        path: "{{ item.path }}"
        owner: root
        group: kvm
        state: directory
        mode: "{{ item.mode }}"
      loop:
        - { path: "{{ service_root }}", mode: "0750" }
        - { path: "{{ service_root }}/iso", mode: "0755" }
        - { path: "{{ service_root }}/images", mode: "0750" }
        - { path: "{{ service_root }}/ovmf", mode: "0750" }
      when: kvm_capable | bool

    # ── Install dependencies ─────────────────────────────────────────────
    - name: Ensure KVM packages are installed
      ansible.builtin.apt:
        name:
          - qemu-utils
          - "{{ 'qemu-efi-aarch64' if is_arm64 else 'ovmf' }}"
        state: present
        update_cache: yes
        cache_valid_time: 3600
        install_recommends: no
      when: kvm_capable | bool

    # ── Download firmware ────────────────────────────────────────────────
    - name: Check if qcow2 image already exists
      ansible.builtin.stat:
        path: "{{ service_root }}/images/openwrt.qcow2"
      register: qcow2_image
      when: kvm_capable | bool

    - name: Download OpenWrt firmware image
      ansible.builtin.get_url:
        url: "{{ openwrt_image_url }}"
        dest: "{{ service_root }}/iso/{{ openwrt_image_filename }}"
        mode: "0640"
        owner: root
        group: kvm
      when:
        - kvm_capable | bool
        - not qcow2_image.stat.exists | default(false) | bool

    # ── Decompress, patch, convert to qcow2 ─────────────────────────────
    # Patch the raw image before conversion: no nbd module, no write locks.
    # losetup -fP creates partition devices (e.g. /dev/loop0p1, /dev/loop0p2).
    - name: Decompress OpenWrt firmware image
      ansible.builtin.shell: |
        zcat "{{ service_root }}/iso/{{ openwrt_image_filename }}" > "{{ service_root }}/iso/{{ openwrt_image_decompressed }}" || true
        test -s "{{ service_root }}/iso/{{ openwrt_image_decompressed }}"
      args:
        creates: "{{ service_root }}/iso/{{ openwrt_image_decompressed }}"
      when:
        - kvm_capable | bool
        - not qcow2_image.stat.exists | default(false) | bool

    # ── Detect uplink interface ──────────────────────────────────────────
    # The interface with the default route (used for NAT and IPv6 prefix).
    - name: Detect uplink interface
      ansible.builtin.shell: |
        set -e
        uplink=$(ip route show default | awk '{print $5}' | head -1)
        if [ -z "$uplink" ]; then
          uplink=$(ip -o route get 1.1.1.1 | awk '{for(i=1;i<=NF;i++) if($i=="dev") print $(i+1)}' | head -1)
        fi
        echo "$uplink"
      register: uplink_result
      changed_when: false
      when: kvm_capable | bool

    - name: Set uplink interface fact
      ansible.builtin.set_fact:
        uplink_interface: "{{ uplink_result.stdout }}"
      when:
        - kvm_capable | bool
        - uplink_result.stdout | default('') | length > 0

    - name: Fail if uplink interface not found
      ansible.builtin.fail:
        msg: "Could not detect uplink interface (no default route)"
      when:
        - kvm_capable | bool
        - uplink_interface | default('') | length == 0

    # ── Detect IPv6 prefix from uplink ───────────────────────────────────
    # Extract first 4 groups from the host's global IPv6 address on the uplink.
    - name: Detect IPv6 prefix
      ansible.builtin.shell: |
        set -e
        ip -6 -o addr show dev {{ uplink_interface }} scope global \
          | awk '{print $4}' | cut -d/ -f1 \
          | awk -F: '{OFS=":"; print $1,$2,$3,$4}' \
          | head -1
      register: ipv6_prefix_result
      changed_when: false
      failed_when: false
      when: kvm_capable | bool

    - name: Set IPv6 prefix fact
      ansible.builtin.set_fact:
        host_ipv6_prefix: "{{ ipv6_prefix_result.stdout }}"
        host_ipv6_available: "{{ ipv6_prefix_result.stdout | default('') | length > 0 }}"
      when: kvm_capable | bool

    - name: Show IPv6 prefix
      ansible.builtin.debug:
        msg: "IPv6 prefix: {{ host_ipv6_prefix }}::/64 on {{ uplink_interface }}"
      when:
        - kvm_capable | bool
        - host_ipv6_available | bool

    # Write uci-defaults to temp (avoids heredoc-in-shell escaping issues)
    - name: Write uci-defaults network config script
      ansible.builtin.copy:
        dest: /tmp/openwrt-uci-defaults
        mode: "0755"
        content: |
          #!/bin/sh
          # OpenWrt QEMU VM - WAN + LAN network config (first boot only)
          # eth0 = WAN (static 192.168.41.201/24 on base-services bridge)
          # eth1 = LAN (static 172.18.0.1/24, internal network)
          # IPv6 handled by S99zzz-ipv6-setup init script

          # Remove default bridge device and LAN interface
          while uci delete network.@device[0] 2>/dev/null; do :; done
          uci delete network.lan 2>/dev/null
          uci delete network.wan6 2>/dev/null

          # WAN interface on eth0 (static IP on base-services)
          uci set network.wan=interface
          uci set network.wan.proto=static
          uci set network.wan.device=eth0
          uci set network.wan.ipaddr={{ vm_ip }}
          uci set network.wan.netmask={{ vm_netmask }}
          uci set network.wan.gateway={{ vm_gateway }}
          uci set network.wan.dns={{ vm_dns }}

          # LAN interface on eth1 (static)
          uci set network.lan=interface
          uci set network.lan.proto=static
          uci set network.lan.device=eth1
          uci set network.lan.ipaddr=172.18.0.1
          uci set network.lan.netmask=255.255.255.0
          uci set network.lan.ip6assign=64

          # LAN6: static ULA prefix for LAN clients
          uci set network.lan.ip6addr=fd00:18::1/64

          # Clean firewall and rebuild zones
          while uci delete firewall.@zone[0] 2>/dev/null; do :; done
          while uci delete firewall.@forwarding[0] 2>/dev/null; do :; done
          while uci delete firewall.@rule[0] 2>/dev/null; do :; done

          uci set firewall.defaults=syn_flood
          uci set firewall.defaults.syn_flood=1
          uci set firewall.defaults.input=REJECT
          uci set firewall.defaults.output=ACCEPT
          uci set firewall.defaults.forward=REJECT

          # WAN zone - input ACCEPT (VM behind Traefik+SSO)
          uci set firewall.wan=zone
          uci set firewall.wan.name=wan
          uci set firewall.wan.network="wan"
          uci set firewall.wan.input=ACCEPT
          uci set firewall.wan.output=ACCEPT
          uci set firewall.wan.forward=REJECT
          uci set firewall.wan.masq=1
          uci set firewall.wan.mtu_fix=1

          # LAN zone (IPv4 + IPv6)
          uci set firewall.lan=zone
          uci set firewall.lan.name=lan
          uci set firewall.lan.network="lan lan6"
          uci set firewall.lan.input=ACCEPT
          uci set firewall.lan.output=ACCEPT
          uci set firewall.lan.forward=ACCEPT

          # Forwarding: LAN -> WAN
          uci set firewall.wan_forward=forwarding
          uci set firewall.wan_forward.src=lan
          uci set firewall.wan_forward.dest=wan

          # Allow ping on WAN (IPv4)
          uci set firewall.allow_ping=rule
          uci set firewall.allow_ping.name=Allow-Ping
          uci set firewall.allow_ping.src=wan
          uci set firewall.allow_ping.proto=icmp
          uci set firewall.allow_ping.icmp_type=echo-request
          uci set firewall.allow_ping.family=ipv4
          uci set firewall.allow_ping.target=ACCEPT

          # Allow ICMPv6 on WAN (NDP, PMTUD, echo-request)
          uci set firewall.allow_icmpv6=rule
          uci set firewall.allow_icmpv6.name=Allow-ICMPv6
          uci set firewall.allow_icmpv6.src=wan
          uci set firewall.allow_icmpv6.proto=icmpv6
          uci set firewall.allow_icmpv6.icmp_type="echo-request neighbor-solicitation neighbor-advertisement router-solicitation router-advertisement destination-unreachable packet-too-big time-exceeded"
          uci set firewall.allow_icmpv6.family=ipv6
          uci set firewall.allow_icmpv6.target=ACCEPT

          # Allow HTTP/HTTPS on WAN for Traefik access
          uci set firewall.allow_http=rule
          uci set firewall.allow_http.name=Allow-HTTP
          uci set firewall.allow_http.src=wan
          uci set firewall.allow_http.proto=tcp
          uci set firewall.allow_http.dest_port=80
          uci set firewall.allow_http.target=ACCEPT

          uci set firewall.allow_https=rule
          uci set firewall.allow_https.name=Allow-HTTPS
          uci set firewall.allow_https.src=wan
          uci set firewall.allow_https.proto=tcp
          uci set firewall.allow_https.dest_port=443
          uci set firewall.allow_https.target=ACCEPT

          # Allow SSH on WAN for management
          uci set firewall.allow_ssh=rule
          uci set firewall.allow_ssh.name=Allow-SSH
          uci set firewall.allow_ssh.src=wan
          uci set firewall.allow_ssh.proto=tcp
          uci set firewall.allow_ssh.dest_port=22
          uci set firewall.allow_ssh.target=ACCEPT

          uci commit network
          uci commit firewall

          # ── Disable DAD for IPv6 stability ──
          cat > /etc/sysctl.d/99-no-dad.conf << SYSCTLEOF
          net.ipv6.conf.eth0.accept_dad=0
          net.ipv6.conf.all.accept_dad=0
          SYSCTLEOF
          sysctl -p /etc/sysctl.d/99-no-dad.conf 2>/dev/null || true

          # ── IPv6 init script (static address + default route) ──
          # Prefix is detected by Ansible at playbook time and embedded here.
          # Docker's base-services bridge has forwarding=1, so no RAs are sent;
          # the VM cannot discover the prefix via SLAAC.
          cat > /etc/init.d/zzz-ipv6-setup << 'INITEOF'
          #!/bin/sh /etc/rc.common
          START=99
          PREFIX="{{ host_ipv6_prefix | default('') }}"
          stop() { :; }
          start() {
            [ -z "$PREFIX" ] && return 0
            # Wait for eth0 to be ready (link-local address present)
            local try
            for try in 1 2 3 4 5; do
              ip link show dev eth0 up 2>/dev/null | grep -q "state UP" && break
              sleep 2
            done
            ip -6 addr add "$PREFIX::201/64" dev eth0 2>/dev/null || true
            ip -6 route add default via "$PREFIX::1" dev eth0 metric 1024 2>/dev/null || true
          }
          INITEOF
          chmod 755 /etc/init.d/zzz-ipv6-setup
          ln -sf /etc/init.d/zzz-ipv6-setup /etc/rc.d/S99zzz-ipv6-setup

          exit 0
      when: kvm_capable | bool

    # Patch raw image: GRUB serial console + uci-defaults injection
    - name: Patch raw image (serial console + uci-defaults)
      ansible.builtin.shell: |
        set -e
        RAW="{{ service_root }}/iso/{{ openwrt_image_decompressed }}"

        # Attach raw image to loop device with partition scanning
        LOOP=$(losetup -fP --show "$RAW")
        echo "Loop device: $LOOP"

        # Wait for partition devices to appear
        sleep 2
        for i in $(seq 1 10); do
          [ -b "${LOOP}p1" ] && [ -b "${LOOP}p2" ] && break
          sleep 1
        done
        if [ ! -b "${LOOP}p1" ]; then
          losetup -d "$LOOP"
          echo "ERROR: Partition devices not found on $LOOP"
          exit 1
        fi

        # --- Patch GRUB for serial console ---
        mkdir -p /tmp/ow-mount
        mount "${LOOP}p1" /tmp/ow-mount
        if grep -q "console={{ serial_console_device }}" /tmp/ow-mount/EFI/openwrt/grub.cfg
        then
          echo "GRUB already patched"
        else
          sed -i "s/console=tty1/console={{ serial_console_device }},115200n8/g" \
            /tmp/ow-mount/EFI/openwrt/grub.cfg
          echo "GRUB patched"
        fi
        cat /tmp/ow-mount/EFI/openwrt/grub.cfg
        umount /tmp/ow-mount

        # --- Inject uci-defaults network config ---
        mkdir -p /tmp/ow-mount
        mount "${LOOP}p2" /tmp/ow-mount
        if [ -f /tmp/ow-mount/etc/uci-defaults/99-openwrt-network ]
        then
          echo "uci-defaults already injected"
        else
          mkdir -p /tmp/ow-mount/etc/uci-defaults
          cp /tmp/openwrt-uci-defaults /tmp/ow-mount/etc/uci-defaults/99-openwrt-network
          chmod 755 /tmp/ow-mount/etc/uci-defaults/99-openwrt-network
          echo "uci-defaults injected"
        fi
        umount /tmp/ow-mount
        rmdir /tmp/ow-mount || true

        # Detach loop device
        losetup -d "$LOOP"
        echo "image-patched"
      register: image_patch_result
      changed_when: "'GRUB patched' in image_patch_result.stdout or 'uci-defaults injected' in image_patch_result.stdout"
      when:
        - kvm_capable | bool
        - not qcow2_image.stat.exists | default(false) | bool

    # Convert patched raw image to qcow2
    - name: Convert raw image to qcow2
      ansible.builtin.shell: |
        qemu-img convert -f raw -O qcow2 \
          "{{ service_root }}/iso/{{ openwrt_image_decompressed }}" \
          "{{ service_root }}/images/openwrt.qcow2"
        test -s "{{ service_root }}/images/openwrt.qcow2"
      when:
        - kvm_capable | bool
        - not qcow2_image.stat.exists | default(false) | bool

    # ── Set file permissions ─────────────────────────────────────────────
    # libvirt-qemu (uid 64055, kvm group member) needs to traverse the path.
    - name: Ensure openwrt-vm path is traversable by libvirt
      ansible.builtin.shell: |
        set -e
        for dir in /symbios /symbios/services {{ service_root }} {{ service_root }}/images {{ service_root }}/ovmf
        do
          # Grant libvirt-qemu (kvm group member) execute permission to traverse
          setfacl -m u:libvirt-qemu:x "$dir" 2>/dev/null || true
          # Also ensure kvm group has execute
          chmod g+x "$dir" 2>/dev/null || true
        done
        echo "acl-ok"
      register: acl_result
      changed_when: "'acl-ok' in acl_result.stdout"
      when: kvm_capable | bool

    - name: Set ownership and permissions on qcow2 image
      ansible.builtin.file:
        path: "{{ service_root }}/images/openwrt.qcow2"
        owner: root
        group: kvm
        mode: "0660"
      when: kvm_capable | bool

    # ── OVMF/UEFI firmware variables ────────────────────────────────────
    - name: Copy UEFI VARS template for new VM
      ansible.builtin.copy:
        src: "{{ uefi_vars_template }}"
        dest: "{{ service_root }}/ovmf/OVMF_VARS.fd"
        remote_src: yes
        owner: root
        group: kvm
        mode: "0640"
      when: kvm_capable | bool

    # ── Libvirt networks ─────────────────────────────────────────────────
    # LAN network: isolated (no forward), OpenWrt acts as gateway
    - name: Check if openwrt-lan network exists
      ansible.builtin.command: virsh net-info openwrt-lan
      register: ow_lan_net
      changed_when: false
      failed_when: false
      when: kvm_capable | bool

    - name: Define openwrt-lan libvirt network
      ansible.builtin.shell: |
        cat > /tmp/ow-lan-net.xml << LANEOF
        <network>
          <name>openwrt-lan</name>
          <bridge name="br-ow-lan"/>
          <ip address="{{ lan_host_ip }}" netmask="{{ lan_netmask }}"/>
        </network>
        LANEOF
        virsh net-define /tmp/ow-lan-net.xml
        virsh net-start openwrt-lan
        virsh net-autostart openwrt-lan
        rm -f /tmp/ow-lan-net.xml
        echo "lan-network-created"
      register: lan_net_create
      changed_when: "'lan-network-created' in lan_net_create.stdout"
      when:
        - kvm_capable | bool
        - ow_lan_net.rc | default(1) != 0

    # ── UFW: NAT and route forwarding ────────────────────────────────────
    # MASQUERADE traffic from base-services to uplink (VM internet access).
    - name: UFW NAT masquerade for VM internet access
      ansible.builtin.shell: |
        set -e
        RULE="-A POSTROUTING -s 192.168.41.0/24 ! -d 192.168.41.0/24 -j MASQUERADE # openwrt-vm-masquerade"
        if grep -q "openwrt-vm-masquerade" /etc/ufw/before.rules; then
          echo "nat-rule-exists"
        elif grep -q '^\*nat' /etc/ufw/before.rules; then
          LAST_COMMIT=$(grep -n '^COMMIT' /etc/ufw/before.rules | tail -1 | cut -d: -f1)
          if [ -n "$LAST_COMMIT" ]; then
            sed -i "${LAST_COMMIT}i $RULE" /etc/ufw/before.rules
            echo "nat-rule-added"
          fi
        else
          printf '\n*nat\n:PREROUTING ACCEPT [0:0]\n:POSTROUTING ACCEPT [0:0]\n%s\nCOMMIT\n' "$RULE" \
            >> /etc/ufw/before.rules
          echo "nat-section-added"
        fi
      register: ufw_nat_result
      changed_when: "'nat-rule-added' in ufw_nat_result.stdout or 'nat-section-added' in ufw_nat_result.stdout"
      when: kvm_capable | bool

    # Allow routed traffic between base-services and uplink.
    - name: UFW route allow base-services to uplink
      ansible.builtin.shell: |
        ufw route allow in on base-services out on {{ uplink_interface }} 2>/dev/null
        ufw route allow in on {{ uplink_interface }} out on base-services 2>/dev/null
        echo "route-rules-ok"
      register: ufw_route_result
      changed_when: false
      when: kvm_capable | bool

    # ── nftables: IPv6 NAT and forwarding ────────────────────────────────
    # IPv6 masquerade for VM internet access (ip6table_nat backend).
    - name: IPv6 NAT masquerade for VM
      ansible.builtin.shell: |
        set -e
        PREFIX="{{ host_ipv6_prefix }}"
        [ -z "$PREFIX" ] && exit 0
        ip6tables -t nat -C POSTROUTING -s "$PREFIX::/64" ! -d "$PREFIX::/64" -j MASQUERADE 2>/dev/null \
          || ip6tables -t nat -A POSTROUTING -s "$PREFIX::/64" ! -d "$PREFIX::/64" -j MASQUERADE
        echo "ipv6-nat-ok"
      register: ipv6_nat_result
      changed_when: false
      when:
        - kvm_capable | bool
        - host_ipv6_available | bool

    # Allow IPv6 forwarding between base-services and uplink.
    - name: IPv6 forwarding rules for VM
      ansible.builtin.shell: |
        set -e
        UP="{{ uplink_interface }}"
        ip6tables -C FORWARD -i base-services -o "$UP" -j ACCEPT 2>/dev/null \
          || ip6tables -I FORWARD -i base-services -o "$UP" -j ACCEPT
        ip6tables -C FORWARD -i "$UP" -o base-services -m state --state RELATED,ESTABLISHED -j ACCEPT 2>/dev/null \
          || ip6tables -I FORWARD -i "$UP" -o base-services -m state --state RELATED,ESTABLISHED -j ACCEPT
        echo "ipv6-forward-ok"
      register: ipv6_fwd_result
      changed_when: false
      when:
        - kvm_capable | bool
        - host_ipv6_available | bool

    # ── IPv6 host route for VM ───────────────────────────────────────────
    # /128 host route on base-services overrides ISP's /64 on uplink
    # (metric 100 on uplink vs more-specific /128 wins).
    - name: Add IPv6 host route for VM on base-services
      ansible.builtin.shell: |
        set -e
        PREFIX="{{ host_ipv6_prefix }}"
        [ -z "$PREFIX" ] && exit 0
        ip -6 route replace "$PREFIX::201/128" dev base-services
        echo "ipv6-route-ok"
      register: ipv6_route_result
      changed_when: false
      when:
        - kvm_capable | bool
        - host_ipv6_available | bool

    # Persist the route across reboots.
    - name: Persist IPv6 host route for VM
      ansible.builtin.copy:
        dest: /etc/network/if-up.d/openwrt-vm-ipv6-route
        mode: "0755"
        content: |
          #!/bin/bash
          # IPv6 host route for openwrt VM on base-services bridge
          PREFIX="{{ host_ipv6_prefix }}"
          [ -z "$PREFIX" ] && exit 0
          ip -6 route replace "$PREFIX::201/128" dev base-services
      when:
        - kvm_capable | bool
        - host_ipv6_available | bool

    # ── Ensure libvirtd is running ───────────────────────────────────────
    - name: Ensure libvirtd is started and enabled
      ansible.builtin.service:
        name: libvirtd
        state: started
        enabled: yes
      when: kvm_capable | bool

    # ── Check if VM already exists ───────────────────────────────────────
    - name: Check if openwrt VM already exists
      ansible.builtin.command: virsh dominfo openwrt
      register: vm_dominfo
      changed_when: false
      failed_when: false
      when: kvm_capable | bool

    # ── Create VM ────────────────────────────────────────────────────────
    # Define VM via libvirt XML.
    # NIC1: base-services bridge (same L2 as Docker, Traefik, Authelia)
    # NIC2: openwrt-lan (isolated, OpenWrt is gateway for LAN clients)
    - name: Define OpenWrt VM
      ansible.builtin.shell: |
        cat > /tmp/openwrt-vm.xml << 'XMLEOF'
        <domain type='kvm'>
          <name>openwrt</name>
          <memory unit='MiB'>{{ vm_ram_mb }}</memory>
          <vcpu>{{ vm_vcpus }}</vcpu>
          <os>
            <type arch='{{ vm_arch }}' machine='{{ vm_machine }}'>hvm</type>
            <loader readonly='yes' type='pflash'>{{ uefi_code }}</loader>
            <nvram>{{ service_root }}/ovmf/OVMF_VARS.fd</nvram>
          </os>
          <features>
            {% if vm_arch == 'aarch64' %}
            <acpi state='off'/>
            {% endif %}
          </features>
          <cpu mode='{{ vm_cpu_model }}'/>
          <clock offset='utc'/>
          <devices>
            <disk type='file' device='disk'>
              <driver name='qemu' type='qcow2' cache='none' io='native'/>
              <source file='{{ service_root }}/images/openwrt.qcow2'/>
              <target dev='vda' bus='virtio'/>
            </disk>
            <interface type='bridge'>
              <source bridge='base-services'/>
              <model type='virtio'/>
              <rom bar='off'/>
            </interface>
            <interface type='network'>
              <source network='openwrt-lan'/>
              <model type='virtio'/>
              <rom bar='off'/>
            </interface>
            <serial type='pty'>
              <target port='0'/>
            </serial>
          </devices>
        </domain>
        XMLEOF
        virsh define /tmp/openwrt-vm.xml
        rm -f /tmp/openwrt-vm.xml
        echo "vm-defined"
      register: vm_define
      changed_when: "'vm-defined' in vm_define.stdout"
      when:
        - kvm_capable | bool
        - vm_dominfo.rc | default(1) != 0

    - name: Start OpenWrt VM if stopped
      ansible.builtin.command: virsh start openwrt
      register: vm_start
      changed_when: "'started' in vm_start.stdout"
      failed_when: false
      when:
        - kvm_capable | bool
        - vm_dominfo.rc | default(1) == 0
        - vm_define is skipped | default(true)

    - name: Ensure OpenWrt VM is set to autostart
      ansible.builtin.command: virsh autostart openwrt
      changed_when: false
      failed_when: false
      when: kvm_capable | bool

    # ── Traefik integration ──────────────────────────────────────────────
    # Traefik file-provider route for LuCI (Authelia-protected)
    - name: /symbios/base-services/traefik/providers/openwrt-vm.yml Traefik routing
      ansible.builtin.blockinfile:
        path: /symbios/base-services/traefik/providers/openwrt-vm.yml
        create: yes
        mode: "0444"
        owner: root
        group: docker
        marker: "# {mark} ANSIBLE MANAGED BLOCK"
        block: |
          http:
            routers:
              openwrt-vm:
                rule: "Host(`{{ service_domain }}`)"
                service: openwrt-vm
                entryPoints:
                  - "https"
                tls:
                  certResolver: {{ acme_resolver }}
                middlewares:
                  - "secHeaders@file"
                  - "authelia@file"
            services:
              openwrt-vm:
                loadBalancer:
                  servers:
                    - url: "http://{{ vm_ip }}:{{ service_port }}"
        backup: yes
      notify: Restart traefik
      when: kvm_capable | bool

    # ── Healthcheck ──────────────────────────────────────────────────────
    - name: /usr/local/sbin/runchecks.d/symbios-healthcheck-openwrt-vm.check
      ansible.builtin.blockinfile:
        path: /usr/local/sbin/runchecks.d/symbios-healthcheck-openwrt-vm.check
        mode: "0400"
        owner: root
        group: root
        create: yes
        marker: "# {mark} ANSIBLE MANAGED BLOCK"
        block: |
          # Healthcheck for openwrt-vm (KVM virtual machine)
          if ! virsh list --name | grep -q openwrt
          then
            g_echo_error "Healthcheck failed for openwrt-vm: VM not running"
          fi
        backup: yes
        validate: /bin/bash -n %s
      when: kvm_capable | bool

    # ── Register playbook ────────────────────────────────────────────────
    - name: Register playbook as installed
      ansible.builtin.command: "{{ git_root }}/scripts/symbios-state.sh set services/openwrt-vm.yml"
      changed_when: false
      when: kvm_capable | bool

  handlers:
    - name: Restart traefik
      ansible.builtin.shell: docker compose up -d --force-recreate
      args:
        chdir: /symbios/base-services/traefik
