# Shared task: write an OIDC client configuration block in Authelia's
# configuration.yml. The block is idempotent (blockinfile marker).
#
# NOTE: Jinja2 conditionals ({% if %}, {% for %}) do NOT work inside
# block: | in blockinfile. The content is treated as a literal string.
# All variable substitution happens at the block: parameter level.
#
# Required vars:  service_name, service_domain, oidc_redirect_uris (list)
# Optional vars:  oidc_client_name        (default: service_name)
# Optional vars:  oidc_consent_mode       (default: "intersect")
# Optional vars:  oidc_require_pkce       (default true)
# Optional vars:  oidc_pkce_challenge_method (default "S256")
# Optional vars:  oidc_scopes             (list; default: openid,profile,email,groups)

- name: "write OIDC config in authelias configuration.yml for {{ service_name }}"
  ansible.builtin.blockinfile:
    path: /symbios/base-services/authelia/authelia-data/configuration.yml
    marker: "# {mark} ANSIBLE MANAGED BLOCK OIDC {{ service_name }}"
    block: |
            # {{ oidc_client_name | default(service_name) }}
            - client_id: '{{ service_name }}'
              client_name: '{{ oidc_client_name | default(service_name) }}'
              client_secret: '{{ lookup('file', data_root ~ '/services/' ~ service_name ~ '/oidc_digest') }}'
              public: false
              require_pkce: {{ oidc_require_pkce | default(true) | lower }}
              pkce_challenge_method: '{{ oidc_pkce_challenge_method | default('S256') }}'
              authorization_policy: '{{ lookup('file', data_root ~ '/base-services/authelia/authorization_policy') }}'
              consent_mode: '{{ oidc_consent_mode | default('intersect') }}'
              redirect_uris:
                - '{{ oidc_redirect_uris | first }}'
              scopes:
                - '{{ (oidc_scopes | default(['openid', 'profile', 'email', 'groups']))[0] }}'
                - '{{ (oidc_scopes | default(['openid', 'profile', 'email', 'groups']))[1] }}'
                - '{{ (oidc_scopes | default(['openid', 'profile', 'email', 'groups']))[2] }}'
                - '{{ (oidc_scopes | default(['openid', 'profile', 'email', 'groups']))[3] }}'
              response_types:
                - 'code'
              grant_types:
                - 'authorization_code'
              access_token_signed_response_alg: 'none'
              userinfo_signed_response_alg: 'none'
              token_endpoint_auth_method: 'client_secret_post'
    insertafter: "^# END ANSIBLE MANAGED BLOCK OIDC"
    backup: yes
  notify: Restart authelia
