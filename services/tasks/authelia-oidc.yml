# Shared task: write an OIDC client configuration block in Authelia's
# configuration.yml. The block is idempotent (blockinfile marker).
#
# NOTE: blockinfile's block: | strips leading whitespace. To preserve
# indentation (6 spaces for items under 'clients:'), use a quoted string
# with \n newlines instead of the block scalar indicator.
#
# Required vars:  service_name, service_domain, oidc_redirect_uris (list)
# Optional vars:  oidc_client_name        (default: service_name)
# Optional vars:  oidc_consent_mode       (default: "intersect")
# Optional vars:  oidc_require_pkce       (default true)
# Optional vars:  oidc_pkce_challenge_method (default "S256")
#
# NOTE: All services use the standard 4 OIDC scopes (openid, profile,
# email, groups). The extra 'email' scope is harmless - Authelia serves
# it only if the user has a mail attribute. This avoids a broken dynamic
# rendering via set_fact + Jinja2 for-loop in blockinfile's block: param.

- name: "write OIDC config in authelias configuration.yml for {{ service_name }}"
  ansible.builtin.blockinfile:
    path: /symbios/base-services/authelia/authelia-data/configuration.yml
    marker: "# {mark} ANSIBLE MANAGED BLOCK OIDC {{ service_name }}"
    block: "      # {{ oidc_client_name | default(service_name) }}\n      - client_id: '{{ service_name }}'\n        client_name: '{{ oidc_client_name | default(service_name) }}'\n        client_secret: '{{ lookup('file', data_root ~ '/services/' ~ service_name ~ '/oidc_digest') }}'\n        public: false\n        require_pkce: {{ oidc_require_pkce | default(true) | lower }}\n        pkce_challenge_method: '{{ oidc_pkce_challenge_method | default('S256') }}'\n        authorization_policy: '{{ lookup('file', data_root ~ '/base-services/authelia/authorization_policy') }}'\n        consent_mode: '{{ oidc_consent_mode | default('intersect') }}'\n        redirect_uris:\n          - '{{ oidc_redirect_uris | first }}'\n        scopes:\n          - 'openid'\n          - 'profile'\n          - 'email'\n          - 'groups'\n        response_types:\n          - 'code'\n        grant_types:\n          - 'authorization_code'\n        access_token_signed_response_alg: 'none'\n        userinfo_signed_response_alg: 'none'\n        token_endpoint_auth_method: 'client_secret_post'"
    insertafter: "^# END ANSIBLE MANAGED BLOCK OIDC"
    backup: yes
  notify: Restart authelia
