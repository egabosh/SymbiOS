# Shared task: create a single LDAP group for services that use Authelia
# forward-auth (no OIDC admin/user distinction). Creates the group and adds
# the admin user to it.
#
# Required var:  service_name
# Optional vars: git_root         (default from playbook vars)
#                ldap_admin_uid   (defaults to admin)
#                ldap_group_name  (defaults to service_name; use this when the
#                                  group needs a different name than the
#                                  service, e.g. <service>-users for a
#                                  non-OIDC service)

- name: "Create LDAP group {{ ldap_group_name | default(service_name) }}"
  ansible.builtin.command: "{{ git_root }}/scripts/symbios-ldap-groups.sh --create --name {{ ldap_group_name | default(service_name) }}"
  changed_when: false
  failed_when: false

- name: "Add user {{ ldap_admin_uid | default('admin') }} to LDAP group {{ ldap_group_name | default(service_name) }}"
  ansible.builtin.command: "{{ git_root }}/scripts/symbios-ldap-groups.sh --add-user --name {{ ldap_group_name | default(service_name) }} --uid {{ ldap_admin_uid | default('admin') }}"
  changed_when: false
  failed_when: false
