---
- name: hermes-agent
  hosts: all
  vars:
    service_name: hermes-agent
    service_domain: "{{ service_name }}.{{ base_domain }}"
    authelia_domain: "auth.{{ base_domain }}"
    hermes_agent_image: "nousresearch/hermes-agent:latest"
    # Custom OpenAI-compatible provider written into the hermes config from
    # Settings -> AI (ai_server/ai_apikey); overridable per host in inventory.
    hermes_llm_provider: "local-llm"
    hermes_llm_model: "llamacpp-default"
  tasks:

    - name: Create /symbios/services/hermes-agent dir
      ansible.builtin.file:
        path: /symbios/services/hermes-agent
        owner: root
        group: docker
        state: directory
        mode: '0550'

    # hermes home (/opt/data): the image runs as UID 10000 (HERMES_UID/HERMES_GID
    # below pin it), and its stage2 hook chowns the volume to that user on boot.
    - name: Create /symbios/services/hermes-agent/data dir (hermes home, UID 10000)
      ansible.builtin.file:
        path: /symbios/services/hermes-agent/data
        owner: "10000"
        group: docker
        state: directory
        mode: '0770'

    # Gateway API key (port 8642, not exposed via Traefik): generated once and
    # reused. Hex only, so Compose needs no escaping. The gateway api_server
    # refuses to start without a strong key (>=16 chars).
    - name: Generate hermes gateway API key
      ansible.builtin.set_fact:
        hermes_api_key: "{{ lookup('password', '/symbios/services/hermes-agent/.api-key length=64 chars=hexdigits') }}"
      no_log: true

    - name: Secure the generated hermes API key file
      ansible.builtin.file:
        path: /symbios/services/hermes-agent/.api-key
        owner: root
        group: root
        mode: '0600'

    - name: /symbios/services/hermes-agent/docker-compose.yml Container Configuration
      ansible.builtin.blockinfile:
        path: /symbios/services/hermes-agent/docker-compose.yml
        create: yes
        mode: 0440
        owner: root
        group: docker
        marker: "# {mark} ANSIBLE MANAGED BLOCK"
        block: |
          name: ""

          services:

            hermes-agent:
              image: {{ hermes_agent_image }}
              container_name: symbios-hermes-agent
              restart: unless-stopped
              # The gateway is the container's main program (long-running);
              # without a command the image falls back to a bare `hermes`
              # bootstrap that exits after ~1 min and takes the container down.
              # The web dashboard runs as a supervised s6 service alongside it.
              command: gateway run
              deploy:
                resources:
                  limits:
                    memory: 1536m
                    cpus: "1.5"
                    pids: 200
              volumes:
                - ./data:/opt/data
                - /etc/localtime:/etc/localtime:ro
              environment:
                # Web dashboard (SPA + JSON-RPC/WS gateway) on port 9119. The
                # non-loopback bind engages the auth gate, which fails closed
                # without a provider - the OIDC env below provides it.
                - HERMES_DASHBOARD=true
                # Public URL behind Traefik: drives the OIDC callback
                # construction and the Host/WebSocket-Origin guard.
                - HERMES_DASHBOARD_PUBLIC_URL=https://{{ service_domain }}
                # Dashboard login via self-hosted OIDC against Authelia as a
                # public PKCE client (no secret; see the "OIDC hermes-agent"
                # block in authelia). The callback is <public URL>/auth/callback.
                - HERMES_DASHBOARD_OIDC_ISSUER=https://{{ authelia_domain }}
                - HERMES_DASHBOARD_OIDC_CLIENT_ID={{ service_name }}
                - HERMES_DASHBOARD_OIDC_SCOPES=openid profile email groups
                # Gateway API key: stage2 skips its own generation when the env
                # carries one, so this value is the effective key.
                - API_SERVER_ENABLED=true
                - API_SERVER_HOST=0.0.0.0
                - API_SERVER_KEY={{ hermes_api_key }}
                # Pin the runtime user to the data dir ownership (stage2 remap).
                - HERMES_UID=10000
                - HERMES_GID=10000
              networks:
                symbios_services: null

          networks:
            symbios_services:
              external: true
        backup: yes
      no_log: true
      notify: Restart hermes-agent

    # Authelia guards the public route (group restriction via forward-auth);
    # the dashboard additionally logs in via its own self-hosted OIDC provider
    # against the same Authelia, so an SSO user passes both gates without a
    # second password entry.
    - name: Traefik provider snippet for hermes-agent
      include_tasks: ../shared-tasks/traefik-provider.yml
      vars:
        traefik_backend_url: "http://symbios-hermes-agent:9119"

    - name: Ensure LDAP groups for OIDC login (hermes-agent-users / hermes-agent-admins)
      include_tasks: ../shared-tasks/oidc-groups.yml

    # Public PKCE client: the hermes dashboard is a browser SPA and holds no
    # secret. The redirect URI must match HERMES_DASHBOARD_PUBLIC_URL above.
    # Since Authelia v4.39 the ID token only carries spec-required claims; the
    # 'id_token' claims policy copies name/preferred_username/groups into it,
    # which is what hermes reads for its session display name and org.
    - name: Write OIDC config in authelias configuration.yml for hermes-agent
      include_tasks: ../shared-tasks/authelia-oidc.yml
      vars:
        oidc_client_name: "Hermes Agent"
        oidc_public_client: true
        oidc_claims_policy: id_token
        oidc_redirect_uris:
          - "https://{{ service_domain }}/auth/callback"

    - name: Write Authelia access_control for hermes-agent group restriction
      include_tasks: ../shared-tasks/authelia-acl.yml
      vars:
        authelia_subjects:
          - "group:hermes-agent-users"
          - "group:hermes-agent-admins"

    # Deploy the shared HTTP healthcheck (shared-tasks/runcheck.yml)
    - name: Deploy healthcheck
      include_tasks: ../shared-tasks/runcheck.yml

    - name: Ensure hermes-agent is running
      include_tasks: ../shared-tasks/docker-start.yml

    # Local LLM provider from Settings -> AI. The script compares the resolved
    # values and only rewrites on drift, so a second run is a no-op; a real
    # change recreates the container via the handler below.
    - name: Configure local LLM provider in hermes (Settings -> AI)
      ansible.builtin.shell: "{{ git_root }}/scripts/symbios-hermes-agent-config.sh llm"
      environment:
        HERMES_LLM_BASE_URL: "{{ ai_server }}"
        HERMES_LLM_API_KEY: "{{ ai_apikey | default('', true) }}"
        HERMES_LLM_PROVIDER: "{{ hermes_llm_provider }}"
        HERMES_LLM_MODEL: "{{ hermes_llm_model }}"
      register: hermes_llm_result
      changed_when: "'hermes-agent-llm-changed' in hermes_llm_result.stdout"
      no_log: true
      when: ai_server | default('', true) | length > 0

    - name: Register playbook as installed
      include_tasks: ../shared-tasks/state-register.yml

  handlers:

    - name: Restart hermes-agent
      include_tasks: ../shared-tasks/compose-recreate.yml

    - name: Restart authelia
      include_tasks: ../shared-tasks/authelia-restart.yml
