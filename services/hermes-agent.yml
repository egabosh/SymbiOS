#       type: docker
#       compose_file: /symbios/services/hermes-agent/docker-compose.yml
#       status: test -d /symbios/services/hermes-agent || exit 2; docker compose -f /symbios/services/hermes-agent/docker-compose.yml ps | grep -q "Up "
#     logs:
#     - name: hermes-agent
#       command: docker compose -f /symbios/services/hermes-agent/docker-compose.yml logs -f --tail=100
#   uninstall:
#     stop: docker compose -f /symbios/services/hermes-agent/docker-compose.yml down
#     program_paths:
#       - /symbios/services/hermes-agent/
#       - /symbios/base-services/traefik/providers/hermes-agent.yml
#       - /symbios/runchecks.d/symbios-healthcheck-hermes-agent.check
#     ldap_groups:
#       - hermes-agent-users
#       - hermes-agent-admins
#     authelia_blocks:
#       - "OIDC hermes-agent"
#       - "hermes-agent ACCESS CONTROL"
#   actions:
#     start: docker compose -f /symbios/services/hermes-agent/docker-compose.yml up -d
#     stop: docker compose -f /symbios/services/hermes-agent/docker-compose.yml down
#     restart: docker compose -f /symbios/services/hermes-agent/docker-compose.yml restart
#     reload: docker compose -f /symbios/services/hermes-agent/docker-compose.yml up -d
